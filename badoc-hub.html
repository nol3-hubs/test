    `;

    const unifiedInventoryInput = document.getElementById("unifiedInventoryFile");
    const unifiedInventoryClearBtn = document.getElementById("clearUnifiedInventoryBtn");
    const lmInput = document.getElementById("lmFiles");
    const incomingInput = document.getElementById("incomingFile");
    const lineHaulInput = document.getElementById("lineHaulFile");
    const clearLMBtn = document.getElementById("clearLMBtn");
    const clearIncomingBtn = document.getElementById("clearIncomingBtn");
    const clearLineHaulBtn = document.getElementById("clearLineHaulBtn");

    if (!lmInput || !incomingInput || !lineHaulInput) {
      console.error("NOL3: Inventory upload controls are missing.");
      return;
    }

    const showSingleFile = (input, summaryId) => {
      const summary = document.getElementById(summaryId);
      if (!summary) return;

      const file = input.files && input.files[0];
      summary.textContent = file ? file.name : "No file selected";
    };

    const showLMFiles = () => {
      const files = Array.from(lmInput.files || []);
      const summary = document.getElementById("lmSummary");
      const list = document.getElementById("lmList");

      if (!summary || !list) return;

      if (!files.length) {
        summary.textContent = "No files selected";
        list.innerHTML = "";
        return;
      }

      summary.textContent = files.length === 1
        ? files[0].name
        : `${files.length} files selected`;

      list.innerHTML = files
        .map(file => `<li title="${file.name}">${file.name}</li>`)
        .join("");
    };

    lmInput.addEventListener("click", () => {
      lmInput.value = "";
    });

    const isForwardOrderFile = (file) =>
      /(^|[_\-\s])forward([_\-\s]|order)|export_forward_order/i.test(String(file?.name || ""));

    // Files such as TRANS exports use the same LM column layout, but they are
    // not LM snapshots. Never let one of these files replace the active LM
    // snapshot and make the Badoc volume disappear.
    const isNonLMSupportFile = (file) =>
      /(^|[_\-\s])trans([._\-\s]|$)|export_trans/i.test(String(file?.name || ""));

    lmInput.addEventListener("change", async () => {
      showLMFiles();

      const files = Array.from(lmInput.files || []);
      if (!files.length) return;
      if (clearLMBtn) clearLMBtn.disabled = false;

      // Read every selected file first. This is important when a full LM
      // snapshot and a Forward Order update are selected together: the full
      // snapshot must be the base, and the Forward Order file must be merged
      // on top of it. The previous implementation could treat the batch as
      // an incremental upload with an empty base and leave only the update.
      const parsedFiles = [];
      const ignoredFiles = [];
      for (const file of files) {
        if (isNonLMSupportFile(file)) {
          ignoredFiles.push(file.name);
          continue;
        }
        try {
          const result = await new Promise((resolve) => {
            NOL3.readCSVFile(file, resolve);
          });
          const parsed = parseCSVRows(result.rawText);
          if (!parsed.length) continue;
          const headers = parsed[0].map(value => value.trim());
          const rows = parsed.slice(1).filter(row => row.some(value => String(value || "").trim() !== ""));
          // IMPORTANT: Never filter a file before it is merged. Forward Order
          // exports often have a blank Current Station and identify the hub
          // through Destination Station. Premature filtering can therefore
          // turn a valid upload into zero Planning rows. Keep all parsed rows
          // here; the central hub filter is applied after the complete snapshot
          // is rebuilt.
          const isForward = isForwardOrderFile(file);
          parsedFiles.push({ file, headers, rows, isForward });
        } catch (error) {
          console.warn("NOL3: Could not parse LM file", file?.name, error);
        }
      }
      if (ignoredFiles.length) {
        console.info("NOL3: Ignored non-LM support file(s):", ignoredFiles);
        const summary = document.getElementById("lmSummary");
        if (summary) summary.textContent = ignoredFiles.length === 1
          ? `${ignoredFiles[0]} ignored (not an LM snapshot)`
          : `${ignoredFiles.length} non-LM files ignored`;
      }
      if (!parsedFiles.length) return;

      // Capture the complete pre-upload state before changing LM data.
      try {
        const uploadDateForUndo = (typeof getNOL3TodayDate === "function") ? getNOL3TodayDate() : new Date().toISOString().slice(0, 10);
        const previousLMRecord = await NOL3._storageGet('lm');
        const previousUnifiedRecord = await NOL3._storageGet('unifiedInventory');
        const previousLMHistory = typeof NOL3.getLMHistorySnapshot === 'function' ? await NOL3.getLMHistorySnapshot(uploadDateForUndo) : null;
        NOL3._inventoryUndoMemory = { snapshot: previousUnifiedRecord || null, lmRecord: previousLMRecord || null, lmHistory: previousLMHistory || null, uploadDate: uploadDateForUndo, savedAt: new Date().toISOString() };
        await NOL3._storagePut({ type: 'unifiedInventoryUndo', snapshot: previousUnifiedRecord || null, lmRecord: previousLMRecord || null, lmHistory: previousLMHistory || null, uploadDate: uploadDateForUndo, savedAt: new Date().toISOString() });
      } catch (e) {
        console.warn('NOL3: Could not save LM undo point to storage; live-memory undo remains available.', e);
      }

      const fullSnapshots = parsedFiles.filter(item => !item.isForward);
      const forwardUpdates = parsedFiles.filter(item => item.isForward);

      /*
       * STACKING RULE:
       * Every new LM upload is merged into the currently active LM snapshot.
       * A normal LM snapshot does NOT replace the previous upload.
       *
       * File 1 -> File 1
       * File 2 -> File 1 + File 2
       * File 3 -> File 1 + File 2 + File 3
       * Same Order ID -> newest uploaded record replaces the older record
       *
       * Forward Order files are also incremental and are layered after the
       * normal uploads in the same batch.
       */
      /*
       * IMPORTANT: The source of truth for stacking is TODAY'S SAVED LM
       * SNAPSHOT, not whatever Business Date happens to be displayed.
       *
       * The previous fix only used the saved snapshot when the in-memory
       * dataset was empty. If the user was viewing an older Business Date,
       * that older/empty dataset became the base and the new upload appeared
       * to replace the previous upload.
       *
       * Every upload therefore starts from today's persisted snapshot.
       * If today's snapshot does not exist yet, use the active in-memory
       * dataset as the first-upload fallback.
       */
      let baseInventory = { headers: [], rows: [], files: [] };

      if (typeof getNOL3TodayDate === "function" &&
          typeof NOL3.getLMHistorySnapshot === "function") {
        try {
          const uploadDate = getNOL3TodayDate();
          const savedLM = await NOL3.getLMHistorySnapshot(uploadDate);

          if (savedLM?.dataset && Array.isArray(savedLM.dataset.rows)) {
            baseInventory = {
              headers: Array.isArray(savedLM.dataset.headers) ? savedLM.dataset.headers : [],
              rows: savedLM.dataset.rows,
              files: Array.isArray(savedLM.files) ? savedLM.files : []
            };
          } else if (NOL3.lmInventory && Array.isArray(NOL3.lmInventory.rows) &&
                     NOL3.lmInventory.rows.length) {
            baseInventory = {
              headers: Array.isArray(NOL3.lmInventory.headers) ? NOL3.lmInventory.headers : [],
              rows: NOL3.lmInventory.rows,
              files: Array.isArray(NOL3.lmInventory.files) ? NOL3.lmInventory.files : []
            };
          }
        } catch (error) {
          console.warn("NOL3: Could not load today's saved LM snapshot before stacking.", error);
          if (NOL3.lmInventory && Array.isArray(NOL3.lmInventory.rows)) {
            baseInventory = NOL3.lmInventory;
          }
        }
      } else if (NOL3.lmInventory && Array.isArray(NOL3.lmInventory.rows)) {
        baseInventory = NOL3.lmInventory;
      }

      // Merge every selected full snapshot on top of today's persisted dataset.
      // Do NOT reset baseInventory to an empty object here.
      for (const item of fullSnapshots) {
        baseInventory = mergeLMInventoryRows(
          baseInventory,
          item.headers,
          item.rows
        );
      }

      // Forward Order rows are always applied last.
      for (const item of forwardUpdates) {
        baseInventory = mergeLMInventoryRows(
          baseInventory,
          item.headers,
          item.rows
        );
      }

      const selectedFiles = parsedFiles.map(item => item.file);
      const baseFiles = fullSnapshots.length
        ? fullSnapshots.map(item => item.file)
        : (Array.isArray(baseInventory.files) ? baseInventory.files : []);
      const allFiles = [...baseFiles, ...selectedFiles].filter((item, index, arr) =>
        arr.findIndex(x => x.name === item.name && (x.lastModified || 0) === (item.lastModified || 0)) === index
      );

      NOL3.lmInventory = {
        files: allFiles,
        fileName: allFiles.map(f => f.name).join(', '),
        headers: baseInventory.headers,
        rows: baseInventory.rows,
        filteredRows: [],
        loadedAt: new Date().toISOString()
      };

      // IMPORTANT: this main LM upload path must also write to the
      // date-specific LM history (the same store the Unified Inventory path
      // already writes to). Without this, the stacking logic above has
      // nothing reliable to load as "today's persisted snapshot" the next
      // time a file is uploaded — it would only work by accident, as long as
      // NOL3.lmInventory happened to still be sitting in memory unchanged
      // since the last upload. Any reload, tab suspension, or hub/date
      // switch in between two uploads would silently lose the first
      // upload's data, making the second upload look like a replace instead
      // of a stack.
      try {
        const uploadDateForHistory = (typeof getNOL3TodayDate === "function")
          ? getNOL3TodayDate()
          : new Date().toISOString().slice(0, 10);
        await NOL3.saveLMHistorySnapshot(uploadDateForHistory, {
          fileName: NOL3.lmInventory.fileName,
          headers: baseInventory.headers,
          rows: baseInventory.rows,
          loadedAt: NOL3.lmInventory.loadedAt
        }, allFiles);
      } catch (historyError) {
        console.warn("NOL3: Could not save LM history snapshot after upload.", historyError);
      }

      // Any upload changes the active snapshot, so discard the cached volume
      // for the selected hub — always for TODAY's real date, matching where
      // the upload itself is saved (getNOL3TodayDate), never whatever date
      // happens to be showing in the Business Date picker. Using the
      // picker's date here was a real bug: uploading while viewing a past
      // date would silently wipe that past date's already-frozen volume
      // instead of today's.
      try {
        const hubForFreeze = getSelectedHub() || "__default__";
        const dateForFreezeClear = (typeof getNOL3TodayDate === "function")
          ? getNOL3TodayDate()
          : new Date().toISOString().slice(0, 10);
        const frozenStore = JSON.parse(NOL3Storage.get(FROZEN_TODAY_VOLUME_KEY) || "{}");
        delete frozenStore[`${hubForFreeze}::${dateForFreezeClear}`];
        NOL3Storage.set(FROZEN_TODAY_VOLUME_KEY, JSON.stringify(frozenStore));
      } catch (_) {}

      // Rebuild the hub-filtered rows immediately from the merged snapshot.
      // Do this before any UI/event dispatch so Planning never sees a stale
      // empty filteredRows array after a Forward Order upload.
      try {
        const selectedHubNow = (NOL3.getState && NOL3.getState().selectedHub) || "";
        NOL3.lmInventory.filteredRows = selectedHubNow
          ? NOL3.filterRowsToHub(NOL3.lmInventory.headers, NOL3.lmInventory.rows, 'auto').rows
          : NOL3.lmInventory.rows.slice();
      } catch (_) {
        NOL3.lmInventory.filteredRows = NOL3.lmInventory.rows.slice();
      }

      await saveCurrentLMData(allFiles);
      if (typeof NOL3._refreshUnifiedUndoButton === "function") await NOL3._refreshUnifiedUndoButton();
      const undoButtonAfterLMUpload = document.getElementById("clearUnifiedInventoryBtn");
      if (undoButtonAfterLMUpload) undoButtonAfterLMUpload.disabled = false;
      // The file is stored under today's upload date. If the user is currently
      // viewing another Business Date, immediately switch the active dataset
      // back to that date so a today's upload cannot leak into yesterday.
      try {
        const selectedDate = getBusinessDateValue();
        const uploadDate = (typeof getNOL3TodayDate === "function") ? getNOL3TodayDate() : new Date().toISOString().slice(0, 10);
        if (selectedDate !== uploadDate && typeof NOL3.loadLMHistoryForDate === "function") {
          await NOL3.loadLMHistoryForDate(selectedDate);
        }
      } catch (error) {
        console.warn("NOL3: Could not restore selected Business Date after upload.", error);
      }
      updateLMFilterStatus();

      window.dispatchEvent(new CustomEvent("inventoryloaded", {
        detail: {
          type: "lm",
          fileName: NOL3.lmInventory.fileName,
          totalRows: NOL3.lmInventory.rows.length,
          headers: NOL3.lmInventory.headers,
          mode: forwardUpdates.length ? (fullSnapshots.length ? "snapshot-plus-forward" : "incremental") : "snapshot"
        }
      }));

      console.log(
        "LM Inventory batch loaded:",
        files.map(f => f.name),
        `full snapshots: ${fullSnapshots.length}`,
        `forward updates: ${forwardUpdates.length}`,
        `total unique rows: ${NOL3.lmInventory.rows.length}`
      );
    });

    NOL3.lmInventory = NOL3.lmInventory || {
      files: [],
      rows: [],
      filteredRows: []
    };

    const updateLMFilterStatus = () => {
      const status = document.getElementById("lmFilterStatus");
      if (!status) return;

      const hub = (NOL3.getState && NOL3.getState().selectedHub) || "";
      if (!hub) {
        status.innerHTML = `Selected Hub filter: <strong>Not selected</strong>`;
        return;
      }

      const rows = NOL3.lmInventory.rows || [];
      const filteredRows = filterLMRows(rows, hub);
      NOL3.lmInventory.filteredRows = filteredRows;

      status.innerHTML =
        `Selected Hub filter: <strong>${escapeHTML(hub)}</strong> · ` +
        `Current Station must be ${escapeHTML(hub)} · ` +
        `${filteredRows.length.toLocaleString()} matching order(s)`;

      window.dispatchEvent(new CustomEvent("lminventoryfiltered", {
        detail: {
          hub,
          totalRows: rows.length,
          filteredRows
        }
      }));
    };

    const filterLMRows = (rows, hub) => {
      if (!hub) return Array.isArray(rows) ? rows : [];
      const headers = Array.isArray(NOL3.lmInventory?.headers) ? NOL3.lmInventory.headers : [];
      try {
        return NOL3.filterRowsToHub(headers, rows, 'auto').rows;
      } catch (_) {
        return Array.isArray(rows) ? rows.slice() : [];
      }
    };

    const getLMRowLatestTimestamp = (row, headers) => {
      const candidates = [
        "status updated time", "status update time", "updated time", "updated at",
        "last updated time", "last update time", "current station received time",
        "delivering time", "delivered time", "onhold time", "reschedule time",
        "pick up time", "collected time", "transported to sp time"
      ];
      let latest = 0;
      const normalized = headers.map(h => String(h || '').trim().toLowerCase());
      candidates.forEach(name => {
        const idx = normalized.indexOf(name);
        if (idx < 0) return;
        const raw = String(row[idx] ?? '').trim();
        if (!raw) return;
        const t = Date.parse(raw);
        if (Number.isFinite(t) && t > latest) latest = t;
      });
      return latest;
    };

    const mergeLMInventoryRows = (existingResult, incomingHeaders, incomingRows) => {
      const existingHeaders = Array.isArray(existingResult?.headers) ? existingResult.headers : [];
      const existingRows = Array.isArray(existingResult?.rows) ? existingResult.rows : [];
      const headers = existingHeaders.length ? [...existingHeaders] : [...incomingHeaders];

      // Add any new columns from the incoming file without disturbing existing column positions.
      incomingHeaders.forEach(header => {
        if (!headers.some(h => String(h).trim().toLowerCase() === String(header).trim().toLowerCase())) {
          headers.push(header);
        }
      });

      const orderIndexExisting = headers.findIndex(h => String(h).trim().toLowerCase() === 'order id');
      const incomingOrderIndex = incomingHeaders.findIndex(h => String(h).trim().toLowerCase() === 'order id');
      const output = existingRows.map(row => {
        const copy = Array(headers.length).fill('');
        existingHeaders.forEach((h, i) => {
          const target = headers.findIndex(x => String(x).trim().toLowerCase() === String(h).trim().toLowerCase());
          if (target >= 0) copy[target] = row[i] ?? '';
        });
        return copy;
      });

      const indexByOrder = new Map();
      if (orderIndexExisting >= 0) {
        output.forEach((row, i) => {
          const id = String(row[orderIndexExisting] || '').trim();
          if (id) indexByOrder.set(id, i);
        });
      }

      incomingRows.forEach(incomingRow => {
        const incomingId = incomingOrderIndex >= 0 ? String(incomingRow[incomingOrderIndex] || '').trim() : '';
        const mapped = Array(headers.length).fill('');
        incomingHeaders.forEach((h, i) => {
          const target = headers.findIndex(x => String(x).trim().toLowerCase() === String(h).trim().toLowerCase());
          if (target >= 0) mapped[target] = incomingRow[i] ?? '';
        });

        if (incomingId && indexByOrder.has(incomingId)) {
          const targetIndex = indexByOrder.get(incomingId);
          const targetRow = output[targetIndex];
          const existingTime = getLMRowLatestTimestamp(targetRow, headers);
          const incomingTime = getLMRowLatestTimestamp(mapped, headers);
          // Keep one row per Order ID, but let the record with the newest operational/status timestamp win.
          // If timestamps are unavailable or equal, the incoming upload is treated as the newest snapshot.
          if (incomingTime >= existingTime) {
            incomingHeaders.forEach((h, i) => {
              const target = headers.findIndex(x => String(x).trim().toLowerCase() === String(h).trim().toLowerCase());
              if (target >= 0) targetRow[target] = incomingRow[i] ?? '';
            });
          }
        } else {
          const newIndex = output.push(mapped) - 1;
          if (incomingId && orderIndexExisting >= 0) indexByOrder.set(incomingId, newIndex);
        }
      });

      return { headers, rows: output };
    };

    const saveCurrentLMData = (files) => {
      return NOL3.saveUploadedData('lm', files, NOL3.lmInventory);
    };

    NOL3.readLMInventoryFile = async function (file) {
      if (!file) return;
      // Keep single-file uploads on exactly the same code path as stacked
      // uploads so a Forward Order file can never accidentally replace the
      // full LM snapshot with only its own rows.
      const isForward = isForwardOrderFile(file);
      try {
        const result = await new Promise((resolve) => NOL3.readCSVFile(file, resolve));
        const parsed = parseCSVRows(result.rawText);
        if (!parsed.length) return;
        const headers = parsed[0].map(value => value.trim());
        const rows = parsed.slice(1).filter(row => row.some(value => String(value || "").trim() !== ""));

        /*
         * Use today's persisted snapshot as the base for BOTH normal LM and
         * Forward Order uploads. This keeps the single-file API consistent
         * with the main upload handler and prevents a normal file from
         * replacing the accumulated snapshot.
         */
        let baseInventory = { headers: [], rows: [], files: [] };
        const uploadDate = (typeof getNOL3TodayDate === "function")
          ? getNOL3TodayDate()
          : new Date().toISOString().slice(0, 10);

        try {
          const savedLM = await NOL3.getLMHistorySnapshot(uploadDate);
          if (savedLM?.dataset && Array.isArray(savedLM.dataset.rows)) {
            baseInventory = {
              headers: Array.isArray(savedLM.dataset.headers) ? savedLM.dataset.headers : [],
              rows: savedLM.dataset.rows,
              files: Array.isArray(savedLM.files) ? savedLM.files : []
            };
          } else if (NOL3.lmInventory && Array.isArray(NOL3.lmInventory.rows)) {
            baseInventory = NOL3.lmInventory;
          }
        } catch (_) {
          if (NOL3.lmInventory && Array.isArray(NOL3.lmInventory.rows)) {
            baseInventory = NOL3.lmInventory;
          }
        }

        const merged = mergeLMInventoryRows(baseInventory, headers, NOL3.filterRowsToHub(headers, rows, 'auto').rows);
        const baseFiles = Array.isArray(baseInventory.files) ? baseInventory.files : [];
        const allFiles = [...baseFiles, file].filter((item, index, arr) =>
          arr.findIndex(x => x.name === item.name && (x.lastModified || 0) === (item.lastModified || 0)) === index
        );

        NOL3.lmInventory = {
          files: allFiles,
          fileName: allFiles.map(f => f.name).join(', '),
          headers: merged.headers,
          rows: merged.rows,
          filteredRows: [],
          loadedAt: new Date().toISOString()
        };

        try {
          const hubForFreeze = getSelectedHub() || "__default__";
          const dateForFreezeClear = (typeof getNOL3TodayDate === "function")
            ? getNOL3TodayDate()
            : new Date().toISOString().slice(0, 10);
          const frozenStore = JSON.parse(NOL3Storage.get(FROZEN_TODAY_VOLUME_KEY) || "{}");
          delete frozenStore[`${hubForFreeze}::${dateForFreezeClear}`];
          NOL3Storage.set(FROZEN_TODAY_VOLUME_KEY, JSON.stringify(frozenStore));
        } catch (_) {}

        await saveCurrentLMData(allFiles);
        // Keep the visible dataset aligned with the selected Business Date.
        // Today's upload is stored in today's history even when another date
        // is currently selected in the picker.
        try {
          const selectedDate = getBusinessDateValue();
          const uploadDate = (typeof getNOL3TodayDate === "function") ? getNOL3TodayDate() : new Date().toISOString().slice(0, 10);
          if (selectedDate !== uploadDate && typeof NOL3.loadLMHistoryForDate === "function") {
            await NOL3.loadLMHistoryForDate(selectedDate);
          }
        } catch (error) {
          console.warn("NOL3: Could not restore selected Business Date after upload.", error);
        }
        updateLMFilterStatus();
        window.dispatchEvent(new CustomEvent("inventoryloaded", {
          detail: {
            type: "lm",
            fileName: NOL3.lmInventory.fileName,
            totalRows: NOL3.lmInventory.rows.length,
            addedRows: rows.length,
            mode: isForward ? "incremental" : "snapshot",
            headers: merged.headers
          }
        }));
      } catch (error) {
        console.error("NOL3: Could not load LM inventory file.", error);
      }
    };

    const parseCSVRows = (text) => {
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && inQuotes && next === '"') {
          value += '"';
          i++;
          continue;
        }

        if (char === '"') {
          inQuotes = !inQuotes;
          continue;
        }

        if (char === "," && !inQuotes) {
          row.push(value);
          value = "";
          continue;
        }

        if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i++;
          row.push(value);
          value = "";
          rows.push(row);
          row = [];
          continue;
        }

        value += char;
      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows;
    };

    const escapeHTML = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

    const showInventoryUploadSuccess = (label, fileName, rowCount) => {
      const notification = document.getElementById("inventoryUploadNotification");
      const text = document.getElementById("inventoryUploadNotificationText");
      if (!notification || !text) return;
      text.textContent = `${label} uploaded successfully — ${fileName || "file"} (${Number(rowCount || 0).toLocaleString()} rows)`;
      notification.classList.add("show");
      clearTimeout(showInventoryUploadSuccess.timer);
      showInventoryUploadSuccess.timer = setTimeout(() => notification.classList.remove("show"), 4000);
    };

    window.addEventListener("inventoryloaded", (event) => {
      const detail = event.detail || {};
      const type = detail.type;
      if (!type) return;
      const data = detail.data || detail;
      if (type === "lm") {
        showInventoryUploadSuccess("LM Inventory", data.fileName || "file", data.rowCount ?? data.totalRows);
      } else if (type === "incoming") {
        showInventoryUploadSuccess("Incoming Inventory", data.fileName || "file", data.rowCount);
      } else if (type === "linehaul") {
        showInventoryUploadSuccess("Incoming Inventory From-To List", data.fileName || "file", data.rowCount);
      }
    });

    // Unified Inventory upload: one CSV feeds the existing LM/Incoming structures.
    // IMPORTANT: save only one unified IndexedDB record. The compatibility LM/Incoming
    // datasets are rebuilt in memory from that record, preventing large duplicate writes
    // and preserving the existing calculation paths.
    const parseUnifiedCSV = (text) => {
      const rows = []; let row = []; let value = ''; let inQuotes = false;
      const str = String(text || '').replace(/^\uFEFF/, '');
      for (let i = 0; i < str.length; i++) {
        const ch = str[i], next = str[i + 1];
        if (ch === '"' && inQuotes && next === '"') { value += '"'; i++; continue; }
        if (ch === '"') { inQuotes = !inQuotes; continue; }
        if (ch === ',' && !inQuotes) { row.push(value); value = ''; continue; }
        if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(value); value = '';
          if (row.some(v => String(v || '').trim() !== '')) rows.push(row);
          row = []; continue;
        }
        value += ch;
      }
      if (value.length || row.length) { row.push(value); if (row.some(v => String(v || '').trim() !== '')) rows.push(row); }
      return rows;
    };

    const mergeUnifiedRowsByOrderId = (previous, incoming, headers) => {
      const orderIdx = headers.findIndex(h => String(h).trim().toLowerCase() === 'order id');
      if (orderIdx < 0) throw new Error('Order ID column not found');
      const map = new Map();
      (Array.isArray(previous) ? previous : []).forEach(row => {
        const id = String(row?.[orderIdx] ?? '').trim();
        if (id) map.set(id, row);
      });
      (Array.isArray(incoming) ? incoming : []).forEach(row => {
        const id = String(row?.[orderIdx] ?? '').trim();
        if (id) map.set(id, row);
        else map.set(`__blank_${map.size}`, row);
      });
      return { rows: [...map.values()], orderIdx };
    };

    if (unifiedInventoryInput) {
      unifiedInventoryInput.addEventListener('click', () => { unifiedInventoryInput.value = ''; });
      const processUnifiedFile = async (file, batchInfo) => {
        const statusEl = document.getElementById('unifiedInventoryStatus');
        if (statusEl) statusEl.textContent = `Processing ${file.name}…`;

        try {
          // Read the selected CSV directly. Do not depend on the separate CSV-file
          // event/parser pipeline; this prevents the upload from being reported as
          // failed when another module is not initialized yet.
          let text = await file.text();
          const parsed = parseUnifiedCSV(text);
          if (parsed.length < 2) throw new Error('CSV contains no inventory rows');

          const headers = parsed[0].map(v => String(v ?? '').replace(/^\uFEFF/, '').trim());
          let newRows = parsed.slice(1).filter(row => row.some(v => String(v ?? '').trim() !== ''));
          const orderIdx = headers.findIndex(h => String(h).trim().toLowerCase() === 'order id');
          const statusIdx = headers.findIndex(h => String(h).trim().toLowerCase() === 'status');
          const isForwardUpdate = isForwardOrderFile(file);
          if (orderIdx < 0) throw new Error('Order ID column not found');
          // Forward Order exports are allowed to omit Status; they are still
          // valid Planning input and are routed through the hub-aware LM path.
          if (statusIdx < 0 && !isForwardUpdate) throw new Error('Status column not found');

          // Do not discard Forward Order rows before they are merged. Their hub
          // may be represented by Destination Station, a station code, or no
          // station column at all. Normal inventory files still get the normal
          // hub filter here.
          const hubFiltered = isForwardUpdate
            ? { rows: newRows, dropped: 0 }
            : NOL3.filterRowsToHub(headers, newRows, 'auto');
          const hubDropped = hubFiltered.dropped;
          const hubLabel = String((NOL3.getState && NOL3.getState().selectedHub) || 'this hub');
          if (hubDropped > 0) {
            if (!hubFiltered.rows.length) throw new Error(`No rows for ${hubLabel} found (Current Station / Destination Station must be ${hubLabel})`);
            newRows = hubFiltered.rows;
            text = NOL3.rowsToCSV(headers, newRows);
          }

          // EVERY Inventory upload is incremental/stacked.
          //
          // Normal inventory file:
          //   previous inventory + new file
          //
          // Forward Order file:
          //   previous inventory + forward update
          //
          // Duplicate Order IDs are updated by the newest uploaded record.
          // New Order IDs are added. Nothing is replaced wholesale.
          let previousRecord = null;
          let previousLMRecord = null;
          let previousLMHistory = null;
          let uploadDateForUndo = (typeof getNOL3TodayDate === 'function')
            ? getNOL3TodayDate()
            : new Date().toISOString().slice(0, 10);

          try {
            previousRecord = await NOL3._storageGet('unifiedInventory');
            previousLMRecord = await NOL3._storageGet('lm');
            if (typeof NOL3.getLMHistorySnapshot === 'function') {
              previousLMHistory = await NOL3.getLMHistorySnapshot(uploadDateForUndo);
            }
          } catch (e) {
            console.warn('NOL3: Could not read previous inventory state for undo.', e);
          }

          // Keep an in-memory undo point too. This is important for local HTML
          // files opened from Android Downloads/content:// where IndexedDB can be
          // unavailable or unreliable.
          NOL3._inventoryUndoMemory = {
            snapshot: previousRecord || null,
            lmRecord: previousLMRecord || null,
            lmHistory: previousLMHistory || null,
            uploadDate: uploadDateForUndo,
            savedAt: new Date().toISOString()
          };

          // Save the COMPLETE pre-upload state. Undo must restore Unified
          // Inventory, the LM compatibility record, and today's date-specific
          // LM snapshot together. Otherwise restoreSavedUploads can immediately
          // bring the just-undone upload back from the LM/history record.
          try {
            const emptyDataset = {
              fileName: '',
              headers: [],
              rows: [],
              lmRows: [],
              incomingRows: [],
              rawText: '',
              loadedAt: new Date().toISOString()
            };
            await NOL3._storagePut({
              type: 'unifiedInventoryUndo',
              snapshot: previousRecord || {
                type: 'unifiedInventory',
                files: [],
                dataset: emptyDataset,
                savedAt: new Date().toISOString()
              },
              lmRecord: previousLMRecord || null,
              lmHistory: previousLMHistory || null,
              uploadDate: uploadDateForUndo,
              savedAt: new Date().toISOString()
            });
          } catch (e) {
            console.warn('NOL3: Could not save undo point; upload will continue.', e);
          }

          // A unified upload can be either an LM inventory export, an Incoming
          // inventory/transfer export, or a mixed export.
          //
          // IMPORTANT:
          // - An LM-only upload replaces LM data but PRESERVES the current Incoming data.
          // - An Incoming-only upload replaces Incoming data but PRESERVES the current LM data.
          // - A mixed upload replaces both partitions with the contents of that upload.
          //
          // This prevents an Incoming transfer file (for example, trans.csv) from
          // wiping the LM snapshot that drives Town counts, On-Floor Orders and
          // Total Volume. Planning settings, zones, town arrangements, exceptions,
          // and riders are stored separately and are never touched here.

          const canonicalHeaders = Array.isArray(headers) ? [...headers] : [];
          const canonIndex = new Map(canonicalHeaders.map((h,i) => [String(h).trim().toLowerCase(), i]));

          const toCanonical = (row, rowHeaders) => {
            if (rowHeaders === canonicalHeaders) return [...row];
            const out = Array(canonicalHeaders.length).fill('');
            (Array.isArray(rowHeaders) ? rowHeaders : []).forEach((h,i) => {
              const j = canonIndex.get(String(h).trim().toLowerCase());
              if (j !== undefined) out[j] = row[i] ?? '';
            });
            return out;
          };

          const orderIndex = canonIndex.get('order id');
          if (orderIndex === undefined) throw new Error('Order ID column not found');

          const lmStatuses = new Set(['LMHub_Received', 'Delivered', 'Delivering', 'OnHold']);
          const incomingStatuses = new Set(['SOC_LHTransported', 'SOC_LHTransporting', 'SOC_Packed', 'SOC_Packing']);
          const statusIndex = canonIndex.get('status');

          const classifyRows = (rows, rowHeaders) => {
            const lm = [], incoming = [], other = [];
            (Array.isArray(rows) ? rows : []).forEach(row => {
              const mapped = toCanonical(row, rowHeaders);
              const id = String(mapped[orderIndex] ?? '').trim();
              if (!id) return;
              const status = statusIndex >= 0 ? String(mapped[statusIndex] ?? '').trim() : '';
              // Keep operational status partitions authoritative even for
              // Forward Order files. Transporting / Transported are Incoming,
              // not LM, so they must never contribute to Planning Total Volume.
              if (lmStatuses.has(status)) lm.push(mapped);
              else if (incomingStatuses.has(status)) incoming.push(mapped);
              else if (isForwardUpdate) lm.push(mapped);
              else other.push(mapped);
            });
            return { lm, incoming, other };
          };

          // De-duplicate by Order ID inside each partition.
          const uniqueByOrderId = (rows) => {
            const map = new Map();
            (Array.isArray(rows) ? rows : []).forEach(row => {
              const id = String(row?.[orderIndex] ?? '').trim();
              if (id) map.set(id, row);
            });
            return [...map.values()];
          };

          const uploaded = classifyRows(newRows, headers);
          const hasLMUpload = uploaded.lm.length > 0;
          const hasIncomingUpload = uploaded.incoming.length > 0;

          // Previous unified state is used only to preserve the partition that
          // the current upload does not contain.
          const previousDataset = previousRecord?.dataset || {};
          const previousHeaders = Array.isArray(previousDataset.headers)
            ? previousDataset.headers
            : canonicalHeaders;

          const previousLM = Array.isArray(previousDataset.lmRows)
            ? previousDataset.lmRows
            : (Array.isArray(NOL3.lmInventory?.rows) ? NOL3.lmInventory.rows : []);

          const previousIncoming = Array.isArray(previousDataset.incomingRows)
            ? previousDataset.incomingRows
            : (Array.isArray(NOL3.incomingInventory?.rows) ? NOL3.incomingInventory.rows : []);

          const previousLMCanonical = uniqueByOrderId(previousLM.map(row => toCanonical(row, previousHeaders)))
            .filter(row => {
              const st = String(statusIndex >= 0 ? (row[statusIndex] ?? '') : '').trim()
                .toLowerCase().replace(/\s+/g,'_');
              return !incomingStatuses.has(st);
            });
          const previousIncomingCanonical = uniqueByOrderId(previousIncoming.map(row => toCanonical(row, previousHeaders)));

          // Incoming-only file: keep LM so Town count and Total Volume do not reset.
          // LM-only file: keep Incoming so Incoming Orders do not disappear.
          // Mixed file: use the uploaded partitions as the complete replacement.
          const previousOther = (Array.isArray(previousDataset.rows) ? previousDataset.rows : [])
            .map(row => toCanonical(row, previousHeaders))
            .filter(row => { const st = statusIndex >= 0 ? String(row[statusIndex] ?? '').trim() : ''; return !lmStatuses.has(st) && !incomingStatuses.has(st); });

          // STACK: previous inventory + this upload. One record per Order ID;
          // the record with the newest status timestamp wins (ties -> this upload).
          const combined = new Map();
          const putRow = (row, part) => {
            const id = String(row?.[orderIndex] ?? '').trim();
            if (!id) return;
            const cur = combined.get(id);
            if (!cur || getLMRowLatestTimestamp(row, canonicalHeaders) >= getLMRowLatestTimestamp(cur.row, canonicalHeaders)) combined.set(id, { row, part });
          };
          previousLMCanonical.forEach(r => putRow(r, 'lm'));
          previousIncomingCanonical.forEach(r => putRow(r, 'incoming'));
          previousOther.forEach(r => putRow(r, 'other'));
          const prevIds = new Set(combined.keys());
          uploaded.lm.forEach(r => putRow(r, 'lm'));
          uploaded.incoming.forEach(r => putRow(r, 'incoming'));
          uploaded.other.forEach(r => putRow(r, 'other'));

          const lmRows = [], incomingRows = [], otherRows = [];
          combined.forEach(({ row, part }) => { (part === 'lm' ? lmRows : part === 'incoming' ? incomingRows : otherRows).push(row); });
          const otherCount = otherRows.length;
          const mergedRows = [...lmRows, ...incomingRows, ...otherRows];

          const uploadIds = new Set(newRows.map(r => String(r?.[orderIndex] ?? '').trim()).filter(Boolean));
          const existingCount = [...uploadIds].filter(id => prevIds.has(id)).length;
          const addedCount = uploadIds.size - existingCount;
          const updatedCount = existingCount + (newRows.length - uploadIds.size); // duplicates merged, not double-counted
          if (batchInfo) { batchInfo.added += addedCount; batchInfo.dups += updatedCount; batchInfo.ignored += hubDropped; }

          // Keep file metadata for the active unified snapshot. The metadata is
          // separate from the actual LM/Incoming partitions so preserving one
          // partition does not accidentally discard its file history.
          const previousFiles = Array.isArray(previousRecord?.files) ? previousRecord.files : [];
          const currentFileMeta = {
            name: file.name,
            lastModified: file.lastModified || 0,
            text
          };
          const fileMeta = [
            ...previousFiles,
            currentFileMeta
          ].filter((item, index, arr) => {
            return arr.findIndex(x =>
              x?.name === item?.name &&
              (x?.lastModified || 0) === (item?.lastModified || 0)
            ) === index;
          });

          const savedAt = new Date().toISOString();
          const dataset = {
            fileName: fileMeta.map(item => item.name).join(', '),
            headers: canonicalHeaders,
            rows: mergedRows,
            lmRows,
            incomingRows,
            rawText: text,
            loadedAt: savedAt
          };

          // Update the existing calculation objects with the exact same status
          // partition; no calculation formulas are changed here.
          NOL3.lmInventory = {
            files: fileMeta,
            fileName: fileMeta.map(item => item.name).join(', '),
            headers: canonicalHeaders,
            rows: lmRows,
            filteredRows: [],
            loadedAt: savedAt,
            rowCount: lmRows.length
          };
          NOL3.incomingInventory = {
            files: fileMeta,
            fileName: fileMeta.map(item => item.name).join(', '),
            headers: canonicalHeaders,
            rows: incomingRows,
            filteredRows: [],
            rowCount: incomingRows.length,
            rawText: text,
            loadedAt: savedAt
          };
          if (typeof filterLMForHub === 'function') filterLMForHub(NOL3.lmInventory);

          // The unified snapshot is the persistent source of truth. Keep the LM
          // compatibility record synchronized as well so a later restore cannot
          // resurrect an older dedicated LM snapshot over this upload.
          await NOL3._storagePut({
            type: 'unifiedInventory',
            files: fileMeta,
            dataset,
            savedAt
          });
          if (typeof NOL3._refreshUnifiedUndoButton === "function") {
            await NOL3._refreshUnifiedUndoButton();
          }
          // A successful upload always creates an undo point.
          const undoButtonAfterUpload = document.getElementById("clearUnifiedInventoryBtn");
          if (undoButtonAfterUpload) undoButtonAfterUpload.disabled = false;
          await NOL3._storagePut({
            type: 'lm',
            files: fileMeta,
            dataset: {
              fileName: file.name,
              headers: canonicalHeaders,
              rows: lmRows,
              rawText: text,
              loadedAt: savedAt
            },
            savedAt
          });

          // IMPORTANT: Unified Inventory uploads must also be written to the
          // date-specific LM history. Otherwise changing Business Date clears
          // the active dataset and returning to today has nothing to restore.
          // The upload belongs to the actual Philippines calendar date of the
          // upload, never to whichever Business Date happens to be selected.
          try {
            const uploadDate = (typeof getNOL3TodayDate === 'function')
              ? getNOL3TodayDate()
              : new Date().toISOString().slice(0, 10);
            await NOL3.saveLMHistorySnapshot(uploadDate, {
              fileName: file.name,
              headers: canonicalHeaders,
              rows: lmRows,
              rawText: text,
              loadedAt: savedAt
            }, fileMeta);

            // If the user was viewing another Business Date while uploading,
            // immediately restore that date rather than showing today's upload.
            const selectedDate = typeof getBusinessDateValue === 'function'
              ? getBusinessDateValue()
              : uploadDate;
            if (selectedDate !== uploadDate && typeof NOL3.loadLMHistoryForDate === 'function') {
              await NOL3.loadLMHistoryForDate(selectedDate);
            }
          } catch (historyError) {
            console.warn('NOL3: Could not save date-specific LM history after unified upload.', historyError);
          }

          // Any inventory update invalidates the current cached business-day metric.
          try {
            const hubForFreeze = getSelectedHub() || '__default__';
            const dateForFreezeClear = (typeof getNOL3TodayDate === 'function')
              ? getNOL3TodayDate()
              : new Date().toISOString().slice(0, 10);
            const frozenStore = JSON.parse(NOL3Storage.get(FROZEN_TODAY_VOLUME_KEY) || '{}');
            delete frozenStore[`${hubForFreeze}::${dateForFreezeClear}`];
            NOL3Storage.set(FROZEN_TODAY_VOLUME_KEY, JSON.stringify(frozenStore));
          } catch (_) {}

          if (statusEl) {
            statusEl.textContent = `${mergedRows.length.toLocaleString()} total orders · ${lmRows.length.toLocaleString()} LM · ${incomingRows.length.toLocaleString()} Incoming · ${addedCount.toLocaleString()} new · ${updatedCount.toLocaleString()} duplicates merged${otherCount ? ` · ${otherCount.toLocaleString()} other status` : ''}${hubDropped ? ` · ${hubDropped.toLocaleString()} rows ignored (not ${hubLabel})` : ''}`;
          }
          if (typeof updateLMFilterStatus === 'function') updateLMFilterStatus();
          try { if (typeof NOL3.updateInventoryUploadSummaries === 'function') await NOL3.updateInventoryUploadSummaries(); } catch (e) { console.warn('NOL3: summary refresh failed after upload', e); }
          try { if (typeof NOL3._refreshUnifiedUndoButton === 'function') await NOL3._refreshUnifiedUndoButton(); } catch (e) {}

          // Notify every planning/calculation view that the LM dataset itself changed.
          // Planning listens to lminventoryfiltered for town/zone rebuilding; the
          // old upload path only emitted inventoryloaded, so an upload made while
          // Planning was already open could leave the screen showing the old
          // empty state until a manual page change/refresh.
          try {
            window.dispatchEvent(new CustomEvent('lminventoryfiltered', {
              detail: { data: NOL3.lmInventory, rows: NOL3.lmInventory?.filteredRows || [] }
            }));
          } catch (_) {}
          try {
            window.dispatchEvent(new CustomEvent('inventoryloaded', { detail: { type: 'lm', data: NOL3.lmInventory } }));
            window.dispatchEvent(new CustomEvent('inventoryloaded', { detail: { type: 'incoming', data: NOL3.incomingInventory } }));
            window.dispatchEvent(new CustomEvent('unifiedinventoryloaded', { detail: { fileName: file.name, rowCount: mergedRows.length } }));
          } catch (_) {}
          // Also refresh the visible Planning renderers immediately. These calls
          // are guarded so one renderer cannot prevent the others from updating.
          try { if (typeof renderOnFloorTowns === 'function') renderOnFloorTowns(); } catch (_) {}
          try { if (typeof renderDeliveryAreas === 'function') renderDeliveryAreas(); } catch (_) {}
          try { if (typeof renderParcelRecords === 'function') renderParcelRecords(); } catch (_) {}
          try { if (typeof renderIncomingOrders === 'function') renderIncomingOrders(); } catch (_) {}
          try { if (typeof renderUnassignedOrders === 'function') renderUnassignedOrders(); } catch (_) {}
          showInventoryUploadSuccess('Inventory', file.name, mergedRows.length);
          console.log('Unified Inventory snapshot loaded:', file.name, 'rows in upload:', newRows.length, 'unique orders:', mergedRows.length);
        } catch (error) {
          console.error('NOL3: Could not process unified inventory.', error);
          if (statusEl) statusEl.textContent = `Could not process file: ${error?.message || 'unknown error'}`;
          if (batchInfo) batchInfo.errors.push(`${file.name}: ${error?.message || 'unknown error'}`);
        }
      };

      // Expose the processor so a global fallback can handle uploads even if a
      // page re-render or another initializer interrupted this module.
      NOL3._processUnifiedInventoryFile = processUnifiedFile;
      unifiedInventoryInput.dataset.nol3InventoryBound = '1';

      unifiedInventoryInput.addEventListener('change', async () => {
        // Oldest file first so the newest file's records win on duplicates.
        const files = Array.from(unifiedInventoryInput.files || []).sort((a, b) => (a.lastModified || 0) - (b.lastModified || 0));
        if (!files.length) return;
        const summary = document.getElementById('unifiedInventorySummary');
        const statusEl = document.getElementById('unifiedInventoryStatus');
        if (summary) summary.textContent = files.length === 1 ? files[0].name : `${files.length} files selected`;
        const batchInfo = { errors: [], added: 0, dups: 0, ignored: 0 };
        const undoBefore = NOL3._inventoryUndoMemory;
        let firstUndo = null;
        for (const file of files) {
          await processUnifiedFile(file, batchInfo);
          // Undo must revert the WHOLE batch: keep the state from before the first successful file.
          if (!firstUndo && NOL3._inventoryUndoMemory && NOL3._inventoryUndoMemory !== undoBefore) firstUndo = { ...NOL3._inventoryUndoMemory };
        }
        if (files.length > 1) {
          if (firstUndo) {
            NOL3._inventoryUndoMemory = firstUndo;
            try { await NOL3._storagePut({ type: 'unifiedInventoryUndo', ...firstUndo }); } catch (_) {}
            const undoBtn = document.getElementById('clearUnifiedInventoryBtn');
            if (undoBtn) undoBtn.disabled = false;
          }
          if (statusEl) {
            const lmN = NOL3.lmInventory?.rows?.length || 0, inN = NOL3.incomingInventory?.rows?.length || 0;
            const ok = files.length - batchInfo.errors.length;
            statusEl.textContent = `${ok}/${files.length} files added · ${(lmN + inN).toLocaleString()} total orders · ${lmN.toLocaleString()} LM · ${inN.toLocaleString()} Incoming · ${batchInfo.added.toLocaleString()} new · ${batchInfo.dups.toLocaleString()} duplicates merged`
              + (batchInfo.ignored ? ` · ${batchInfo.ignored.toLocaleString()} rows ignored (other hubs)` : '')
              + (batchInfo.errors.length ? ` · Errors: ${batchInfo.errors.join('; ')}` : '');
          }
        }
      });
    }

    // Reset the native file input when opened so selecting the same filename again
    // still fires a change event and reloads the Incoming Inventory dataset.
    incomingInput.addEventListener("click", () => {
      incomingInput.value = "";
    });

    lineHaulInput.addEventListener("click", () => {
      lineHaulInput.value = "";
    });

    incomingInput.addEventListener("change", () => {
      showSingleFile(incomingInput, "incomingSummary");
      if (clearIncomingBtn) clearIncomingBtn.disabled = !(incomingInput.files && incomingInput.files[0]);
      // The file is automatically read as soon as it is uploaded.
      if (incomingInput.files && incomingInput.files[0]) {
        NOL3.readIncomingInventory(incomingInput.files[0]);
      }
    });

    const showLineHaulFiles = () => {
      const files = Array.from(lineHaulInput.files || []);
      const summary = document.getElementById("lineHaulSummary");
      const list = document.getElementById("lineHaulList");
      if (!summary) return;
      if (!files.length) {
        summary.textContent = "No files selected";
        if (list) list.innerHTML = "";
        return;
      }
      summary.textContent = files.length === 1 ? files[0].name : `${files.length} files selected`;
      if (list) list.innerHTML = files.map(file => `<li title="${escapeHTML(file.name)}">${escapeHTML(file.name)}</li>`).join("");
    };

    lineHaulInput.addEventListener("change", () => {
      showLineHaulFiles();
      const files = Array.from(lineHaulInput.files || []).sort((a, b) => (a.lastModified || 0) - (b.lastModified || 0));
      if (!files.length) return;
      if (clearLineHaulBtn) clearLineHaulBtn.disabled = false;
      NOL3.readLineHaulInventory(files);
    });

    if (unifiedInventoryClearBtn) {
      // The button performs the undo directly. This avoids stale event handlers
      // when the inventory page is re-rendered after an upload.
      unifiedInventoryClearBtn.disabled = true;
      NOL3._refreshUnifiedUndoButton = async function () {
        try {
          const undo = NOL3._inventoryUndoMemory || await NOL3._storageGet('unifiedInventoryUndo');
          unifiedInventoryClearBtn.disabled = !(undo && (undo.snapshot || undo.lmRecord || undo.lmHistory));
        } catch (e) {
          console.warn("NOL3: Could not check inventory undo state.", e);
          unifiedInventoryClearBtn.disabled = true;
        }
      };
      NOL3._refreshUnifiedUndoButton();
    }
    document.getElementById("cancelClearUnifiedInventory")?.addEventListener("click", () => {
      document.getElementById("clearUnifiedInventoryModal")?.classList.remove("show");
    });
    NOL3.undoLastUnifiedInventoryUpload = async function () {
      let undo = NOL3._inventoryUndoMemory || null;
      if (!undo) undo = await NOL3._storageGet('unifiedInventoryUndo');
      if (!undo || (!undo.snapshot && !undo.lmRecord && !undo.lmHistory)) {
        throw new Error('No previous upload is available to undo.');
      }

      // Restore persistent records when storage is available. The live dashboard
      // is restored independently below so local HTML/content:// origins still
      // get a working immediate Undo even if IndexedDB rejects the operation.
      let storageRestored = true;
      try {
        if (undo.snapshot) await NOL3._storagePut(undo.snapshot); else await remove('unifiedInventory');
        if (undo.lmRecord && undo.lmRecord.dataset) await NOL3._storagePut(undo.lmRecord); else await remove('lm');
        const undoDate = String(undo.uploadDate || '').trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(undoDate)) {
          if (undo.lmHistory && undo.lmHistory.dataset) await NOL3.saveLMHistorySnapshot(undoDate, undo.lmHistory.dataset, undo.lmHistory.files || []);
          else await removeLMHistory(undoDate);
        }
        await remove('unifiedInventoryUndo');
      } catch (e) {
        storageRestored = false;
        console.warn('NOL3: Persistent Undo restore failed; continuing with live-memory restore.', e);
      }

      const unified = undo.snapshot?.dataset;
      if (unified && Array.isArray(unified.rows)) {
        const base = {
          fileName: unified.fileName || undo.snapshot.files?.[0]?.name || 'inventory.csv',
          headers: Array.isArray(unified.headers) ? unified.headers : [],
          loadedAt: unified.loadedAt || new Date().toISOString(),
          rawText: typeof unified.rawText === 'string' ? unified.rawText : ''
        };
        const lmRows = Array.isArray(unified.lmRows) ? unified.lmRows : [];
        const incomingRows = Array.isArray(unified.incomingRows) ? unified.incomingRows : [];
        const lmDataset = undo.lmRecord?.dataset;
        NOL3.lmInventory = { ...base, rows: Array.isArray(lmDataset?.rows) ? lmDataset.rows : lmRows, filteredRows: [], rowCount: Array.isArray(lmDataset?.rows) ? lmDataset.rows.length : lmRows.length, files: undo.lmRecord?.files || undo.snapshot.files || [] };
        NOL3.incomingInventory = { ...base, rows: incomingRows, filteredRows: [], rowCount: incomingRows.length, files: undo.snapshot.files || [] };
      } else if (undo.lmRecord?.dataset && Array.isArray(undo.lmRecord.dataset.rows)) {
        const d = undo.lmRecord.dataset;
        NOL3.lmInventory = { fileName: d.fileName || '', headers: Array.isArray(d.headers) ? d.headers : [], rows: d.rows, filteredRows: [], rowCount: d.rows.length, files: undo.lmRecord.files || [] };
        NOL3.incomingInventory = null;
      } else {
        NOL3.lmInventory = { files: [], rows: [], filteredRows: [], fileName: '', headers: [], loadedAt: new Date().toISOString(), rowCount: 0 };
        NOL3.incomingInventory = null;
      }

      if (typeof filterLMForHub === 'function') filterLMForHub(NOL3.lmInventory);
      if (typeof updateLMFilterStatus === 'function') updateLMFilterStatus();
      if (typeof NOL3.updateInventoryUploadSummaries === 'function') await NOL3.updateInventoryUploadSummaries();
      window.dispatchEvent(new CustomEvent('inventoryloaded', { detail: { type: 'lm', totalRows: NOL3.lmInventory?.rows?.length || 0, undone: true, storageRestored } }));
      window.dispatchEvent(new CustomEvent('inventoryloaded', { detail: { type: 'incoming', totalRows: NOL3.incomingInventory?.rows?.length || 0, undone: true } }));
      window.dispatchEvent(new CustomEvent('unifiedinventoryundone', { detail: { storageRestored } }));
      NOL3._inventoryUndoMemory = null;
    };
    // Global handler used by the Inventory button itself. Because the inventory
    // page can be rebuilt, inline dispatch is more reliable than a listener tied
    // to one particular rendered button node.
    window.NOL3_undoUnifiedInventory = async function(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const button = document.getElementById("clearUnifiedInventoryBtn");
      const statusEl = document.getElementById("unifiedInventoryStatus");
      if (button) button.disabled = true;
      try {
        await NOL3.undoLastUnifiedInventoryUpload();
        if (statusEl) statusEl.textContent = "Last upload undone.";
      } catch (e) {
        console.error("NOL3: Could not undo last inventory upload.", e);
        if (statusEl) statusEl.textContent = `Could not undo upload: ${e?.message || 'unknown error'}`;
      } finally {
        if (typeof NOL3._refreshUnifiedUndoButton === "function") {
          await NOL3._refreshUnifiedUndoButton();
        }
      }
    };

    document.getElementById("confirmClearUnifiedInventory")?.addEventListener("click", async () => {
      try {
        await NOL3.undoLastUnifiedInventoryUpload();
      } catch (e) {
        console.error("NOL3: Could not undo last inventory upload.", e);
        const statusEl = document.getElementById("unifiedInventoryStatus");
        if (statusEl) statusEl.textContent = `Could not undo upload: ${e?.message || 'unknown error'}`;
      }
      document.getElementById("clearUnifiedInventoryModal")?.classList.remove("show");
      if (typeof NOL3._refreshUnifiedUndoButton === "function") await NOL3._refreshUnifiedUndoButton();
    });

    // The confirmation modals are rendered later with the main dashboard markup,
    // so use event delegation instead of binding directly before those elements exist.
    const closeClearModal = (modal) => modal?.classList.remove("show");

    const clearInventoryUpload = async (type, input, summaryId, button, modal) => {
      try {
        await NOL3.clearUploadedData(type);
        if (input) input.value = "";
        const summary = document.getElementById(summaryId);
        if (summary) summary.textContent = "No file selected";
        if (button) button.disabled = true;
        closeClearModal(modal);
      } catch (error) {
        console.error("NOL3: Could not clear uploaded data.", error);
      }
    };

    // Direct LM clear handler: avoids relying on delegated click handling for the modal button.
    window.NOL3_forceClearLM = async function(event) {
      if (event) { event.preventDefault(); event.stopPropagation(); }
      const modal = document.getElementById("clearLMModal");
      const button = document.getElementById("clearLMBtn");
      try {
        await NOL3.clearUploadedData("lm");
        if (lmInput) lmInput.value = "";
        const summary = document.getElementById("lmSummary");
        const list = document.getElementById("lmList");
        if (summary) summary.textContent = "No files selected";
        if (list) list.innerHTML = "";
        if (button) button.disabled = true;
        closeClearModal(modal);
      } catch (error) {
        console.error("NOL3: Could not clear LM uploaded data.", error);
        // Even if IndexedDB is unavailable, clear the current in-memory/uploaded file state.
        NOL3.lmInventory = { files: [], rows: [], filteredRows: [] };
        if (lmInput) lmInput.value = "";
        const summary = document.getElementById("lmSummary");
        const list = document.getElementById("lmList");
        if (summary) summary.textContent = "No files selected";
        if (list) list.innerHTML = "";
        if (button) button.disabled = true;
        closeClearModal(modal);
      }
    };

    const forceClearSimpleInventory = async function(type, inputId, summaryId, buttonId, modalId) {
      const input = document.getElementById(inputId);
      const summary = document.getElementById(summaryId);
      const button = document.getElementById(buttonId);
      const modal = document.getElementById(modalId);
      try { await NOL3.clearUploadedData(type); } catch (e) { console.warn("NOL3: saved data clear failed, clearing in-memory data.", e); }
      if (type === "incoming") NOL3.incomingInventory = null;
      if (type === "linehaul") NOL3.lineHaulInventory = null;
      if (input) input.value = "";
      if (summary) summary.textContent = "No file selected";
      if (button) button.disabled = true;
      if (modal) modal.classList.remove("show");
      window.dispatchEvent(new CustomEvent("inventorycleared", { detail: { type } }));
    };
    window.NOL3_forceClearIncoming = function(event) {
      if (event) { event.preventDefault(); event.stopPropagation(); }
      return forceClearSimpleInventory("incoming", "incomingFile", "incomingSummary", "clearIncomingBtn", "clearIncomingModal");
    };
    window.NOL3_forceClearLineHaul = function(event) {
      if (event) { event.preventDefault(); event.stopPropagation(); }
      return forceClearSimpleInventory("linehaul", "lineHaulFile", "lineHaulSummary", "clearLineHaulBtn", "clearLineHaulModal");
    };

    document.addEventListener("click", (event) => {
      const target = event.target.closest?.("#clearLMBtn, #clearIncomingBtn, #clearLineHaulBtn, #cancelClearLM, #cancelClearIncoming, #cancelClearLineHaul, #confirmClearLM, #confirmClearIncoming, #confirmClearLineHaul");
      if (!target) return;

      if (target.id === "clearLMBtn") {
        if (target.disabled) return;
        document.getElementById("clearLMModal")?.classList.add("show");
        return;
      }
      if (target.id === "clearIncomingBtn") {
        if (target.disabled) return;
        document.getElementById("clearIncomingModal")?.classList.add("show");
        return;
      }
      if (target.id === "clearLineHaulBtn") {
        if (target.disabled) return;
        document.getElementById("clearLineHaulModal")?.classList.add("show");
        return;
      }
      if (target.id === "cancelClearLM") {
        closeClearModal(document.getElementById("clearLMModal"));
        return;
      }
      if (target.id === "cancelClearIncoming") {
        closeClearModal(document.getElementById("clearIncomingModal"));
        return;
      }
      if (target.id === "cancelClearLineHaul") {
        closeClearModal(document.getElementById("clearLineHaulModal"));
        return;
      }
      if (target.id === "confirmClearLM") {
        clearInventoryUpload("lm", lmInput, "lmSummary", document.getElementById("clearLMBtn"), document.getElementById("clearLMModal"));
        return;
      }
      if (target.id === "confirmClearIncoming") {
        clearInventoryUpload("incoming", incomingInput, "incomingSummary", document.getElementById("clearIncomingBtn"), document.getElementById("clearIncomingModal"));
        return;
      }
      if (target.id === "confirmClearLineHaul") {
        clearInventoryUpload("linehaul", lineHaulInput, "lineHaulSummary", document.getElementById("clearLineHaulBtn"), document.getElementById("clearLineHaulModal"));
      }
    });

    document.addEventListener("click", (event) => {
      const modal = event.target.closest?.(".confirm-modal");
      if (modal && event.target === modal) closeClearModal(modal);
    });

    if (typeof NOL3.updateInventoryUploadSummaries === "function") {
      NOL3.updateInventoryUploadSummaries();
    }
    // Always reflect the live uploaded dataset immediately. This is intentionally
    // separate from IndexedDB so a page rebuild cannot make a successful upload
    // look like "No files selected" while storage is still being read.
    try {
      const liveLM = NOL3.lmInventory;
      const liveSummary = document.getElementById("lmSummary");
      const liveList = document.getElementById("lmList");
      const liveClear = document.getElementById("clearLMBtn");
      if (liveLM?.fileName && liveSummary) liveSummary.textContent = liveLM.fileName;
      if (liveLM?.files?.length && liveList) liveList.innerHTML = liveLM.files.map(item => `<li title="${NOL3.escapeHTML(item?.name || "")}">${NOL3.escapeHTML(item?.name || "")}</li>`).join("");
      if (liveClear) liveClear.disabled = !(liveLM?.files?.length);
    } catch (_) {}
    if (clearLMBtn) {
      clearLMBtn.disabled = !(NOL3.lmInventory && Array.isArray(NOL3.lmInventory.files) && NOL3.lmInventory.files.length);
      clearLMBtn.onclick = () => {
        if (clearLMBtn.disabled) return;
        document.getElementById("clearLMModal")?.classList.add("show");
      };
    }
    if (clearIncomingBtn) clearIncomingBtn.disabled = !NOL3.incomingInventory;
    if (clearLineHaulBtn) clearLineHaulBtn.disabled = !NOL3.lineHaulInventory;

    window.addEventListener("hubchange", () => {
      const status = document.getElementById("lmFilterStatus");
      if (status && NOL3.lmInventory) {
        const hub = (NOL3.getState && NOL3.getState().selectedHub) || "";
        const rows = NOL3.lmInventory.rows || [];
        const filteredRows = filterLMRows(rows, hub);
        NOL3.lmInventory.filteredRows = filteredRows;
        status.innerHTML = hub
          ? `Selected Hub filter: <strong>${escapeHTML(hub)}</strong> · Current Station must be ${escapeHTML(hub)} · ${filteredRows.length.toLocaleString()} matching order(s)`
          : `Selected Hub filter: <strong>Not selected</strong>`;
      }
    });

  };
})();

    const normalizeIncomingHeader = value => String(value ?? "")
      .replace(/^\uFEFF/, "")
      .trim()
      .toLowerCase()
      .replace(/[\s_\-./()]+/g, " ")
      .trim();

    const normalizeIncomingKey = value => String(value ?? "")
      .replace(/^\uFEFF/, "")
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "");

    const findIncomingHeaderIndex = (headers, candidates) => {
      const normalized = (Array.isArray(headers) ? headers : []).map(normalizeIncomingHeader);
      for (const candidate of candidates) {
        const index = normalized.indexOf(normalizeIncomingHeader(candidate));
        if (index >= 0) return index;
      }
      return -1;
    };

    const BUSINESS_DAY_SETTINGS_KEY = "nol3_business_day_settings_v1";
    const BUSINESS_DAY_DATE_KEY = "nol3_business_day_date_v1";
    const BUSINESS_DAY_DEFAULT_START = 3;
    const BUSINESS_DAY_DEFAULT_COT = 15;

    const formatBusinessDateInput = (date = new Date()) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };

    // NOL3 operates on Philippines business dates. Use Asia/Manila explicitly
    // for the NOW button so a browser/runtime using UTC cannot roll the date
    // back to the previous calendar day.
    const getNOL3TodayDate = () => {
      // NOL3 business dates are always Philippines dates (UTC+08:00).
      // Do not fall back to the device's local calendar date because some
      // Android/browser runtimes expose UTC to JavaScript, which can make
      // NOW select yesterday even though the phone shows today's date.
      try {
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "Asia/Manila",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());
        const values = Object.fromEntries(parts.map(p => [p.type, p.value]));
        if (/^\d{4}$/.test(values.year || "") && /^\d{2}$/.test(values.month || "") && /^\d{2}$/.test(values.day || "")) {
          return `${values.year}-${values.month}-${values.day}`;
        }
      } catch (_) {}

      // Hard fallback: compute the UTC+8 calendar date directly. This avoids
      // ever using the device/browser local timezone for the NOW date.
      const manilaMs = Date.now() + (8 * 60 * 60 * 1000);
      const manila = new Date(manilaMs);
      return `${manila.getUTCFullYear()}-${String(manila.getUTCMonth() + 1).padStart(2, "0")}-${String(manila.getUTCDate()).padStart(2, "0")}`;
    };

    const getBusinessDateValue = () => {
      // Planning always opens on the current Philippines calendar date.
      // A previously selected date is still usable during the current session,
      // but a page refresh/new session starts on today rather than yesterday's
      // saved business date.
      if (/^\d{4}-\d{2}-\d{2}$/.test(String(NOL3.currentBusinessDate || ""))) {
        return NOL3.currentBusinessDate;
      }
      const today = (typeof getNOL3TodayDate === "function")
        ? getNOL3TodayDate()
        : formatBusinessDateInput(new Date());
      NOL3.currentBusinessDate = today;
      try { NOL3Storage.set(BUSINESS_DAY_DATE_KEY, today); } catch (_) {}
      return today;
    };

    // Public getter: the topbar renderer is defined in a separate IIFE, so it
    // must access the live Business Date through NOL3 rather than its local scope.
    NOL3.getBusinessDateValue = getBusinessDateValue;

    const saveBusinessDateValue = (value) => {
      const normalized = String(value || "").trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(normalized)) NOL3.currentBusinessDate = normalized;
      try { NOL3Storage.set(BUSINESS_DAY_DATE_KEY, normalized); } catch (_) {}
    };

    const loadBusinessDaySettings = () => {
      try {
        const raw = JSON.parse(NOL3Storage.get(BUSINESS_DAY_SETTINGS_KEY) || "{}");
        return raw && typeof raw === "object" ? raw : {};
      } catch (_) { return {}; }
    };

    const saveBusinessDaySettings = (settings) => {
      try { NOL3Storage.set(BUSINESS_DAY_SETTINGS_KEY, JSON.stringify(settings || {})); } catch (_) {}
    };

    // Today's Volume freeze-at-COT: once LH COT passes for a business date, the
    // computed volume is captured once and reused from then on for that date,
    // regardless of later LM Inventory uploads. Keyed per hub + business date so
    // it resets automatically the moment the business date changes.
    const FROZEN_TODAY_VOLUME_KEY = "nol3_frozen_today_volume_v2";
    const loadFrozenTodayVolumeStore = () => {
      try {
        const raw = JSON.parse(NOL3Storage.get(FROZEN_TODAY_VOLUME_KEY) || "{}");
        return raw && typeof raw === "object" ? raw : {};
      } catch (_) { return {}; }
    };
    const saveFrozenTodayVolumeStore = (store) => {
      try { NOL3Storage.set(FROZEN_TODAY_VOLUME_KEY, JSON.stringify(store || {})); } catch (_) {}
    };
    const getFrozenTodayVolume = (hub, businessDate) => {
      const store = loadFrozenTodayVolumeStore();
      return store[`${String(hub || "__default__")}::${businessDate}`] || null;
    };
    const setFrozenTodayVolume = (hub, businessDate, value) => {
      const store = loadFrozenTodayVolumeStore();
      store[`${String(hub || "__default__")}::${businessDate}`] = { businessDate, value: Number(value) || 0, frozenAt: new Date().toISOString() };
      saveFrozenTodayVolumeStore(store);
    };

    // Migrate the old 00:00 / 12:00 defaults to the new 03:00 / 14:00 defaults.
    // Only values that exactly match the previous defaults are migrated.
    try {
      const stored = loadBusinessDaySettings();
      let changed = false;
      Object.keys(stored).forEach(key => {
        const value = stored[key];
        if (value && Number(value.businessDayStartHour) === 0 && Number(value.cotHour) === 12) {
          stored[key] = { businessDayStartHour: 3, cotHour: 15 };
          changed = true;
        }
      });
      if (changed) saveBusinessDaySettings(stored);
    } catch (_) {}

    const getHubBusinessDaySettings = (hub = getSelectedHub()) => {
      const all = loadBusinessDaySettings();
      const value = all[String(hub || "__default__")] || {};
      const start = Number.isFinite(Number(value.businessDayStartHour)) ? Number(value.businessDayStartHour) : BUSINESS_DAY_DEFAULT_START;
      const cot = Number.isFinite(Number(value.cotHour)) ? Number(value.cotHour) : BUSINESS_DAY_DEFAULT_COT;
      return {
        businessDayStartHour: Math.max(0, Math.min(23, Math.round(start))),
        cotHour: Math.max(0, Math.min(23, Math.round(cot)))
      };
    };

    const parseBusinessTimestamp = (value) => {
      if (value === null || value === undefined) return null;
      const raw = String(value).replace(/^\uFEFF/, "").trim();
      if (!raw) return null;
      const direct = new Date(raw);
      if (!Number.isNaN(direct.getTime())) return direct;
      const normalized = raw.replace(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})(?:\s+|T)(\d{1,2}:\d{2}(?::\d{2})?)/, "$3-$2-$1T$4");
      const fallback = new Date(normalized);
      return Number.isNaN(fallback.getTime()) ? null : fallback;
    };

    const findBusinessTimestampIndex = (headers, candidates) => {
      const exact = findIncomingHeaderIndex(headers, candidates);
      if (exact >= 0) return exact;

      // LM exports can use slightly different timestamp header names.
      // Fall back to a conservative semantic match so Business Date still works.
      const normalized = (Array.isArray(headers) ? headers : []).map(normalizeIncomingHeader);
      const wantsReceived = candidates === businessTimestampCandidates.received;
      const wantsPickedUp = candidates === businessTimestampCandidates.pickedUp;
      if (wantsReceived) {
        const i = normalized.findIndex(h => /\breceived?\b/.test(h) && /(date|time|at|timestamp|on)/.test(h));
        if (i >= 0) return i;
      }
      if (wantsPickedUp) {
        // Some LM exports use "Delivering Time" as the actual dispatch column.
        // Match it explicitly and first, with a negative check so it can never
        // accidentally match "Delivered Time" or "OnHold Time".
        const deliveringMatch = normalized.findIndex(h => /\bdelivering\b/.test(h) && !/\bdelivered\b/.test(h) && !/\bonhold\b/.test(h));
        if (deliveringMatch >= 0) return deliveringMatch;
        const i = normalized.findIndex(h => /(picked up|pickup|dispatched|dispatch)/.test(h) && /(date|time|at|timestamp|on)?/.test(h));
        if (i >= 0) return i;
      }
      return -1;
    };
    const businessTimestampCandidates = {
      received: ["Current Station Received Time","Current Station Received At","Current Station Received Timestamp","Received At","ReceivedAt","Received Timestamp","Received Time","Receive Time","Received Date","Received Date Time","Received On","Inbound Time","Inbound At","Received","Receive Date"],
      pickedUp: ["Delivering Time","pickedUpAt","Picked Up At","Picked Up Time","Picked Up Timestamp","Pickup Time","Pickup At","Dispatched At","Dispatch Time","Dispatch Timestamp","Picked Up Date Time","Picked Up","Pickup","Dispatched","Dispatch"]
    };

    const getBusinessWindow = (_now = new Date(), settings = getHubBusinessDaySettings()) => {
      const businessDate = getBusinessDateValue();
      const [year, month, day] = businessDate.split("-").map(Number);
      const start = new Date(year, month - 1, day, settings.businessDayStartHour, 0, 0, 0);
      const end = new Date(start);
      end.setDate(end.getDate() + 1);
      const cot = new Date(start);
      cot.setHours(settings.cotHour, 0, 0, 0);
      if (cot.getTime() < start.getTime()) cot.setDate(cot.getDate() + 1);
      return { start, end, cot, businessDate };
    };

    const getBusinessIdentityIndex = (headers) => findIncomingHeaderIndex(headers, [
      "Order ID","Order Id","OrderID","SPX TN","SPX Tracking Number","SLS TN","SLS Tracking Number","Tracking Number","Tracking No","Tracking ID"
    ]);

    const getBusinessDayMetrics = () => {
      const result = {
        todayVolume: 0,
        totalDispatched: 0,
        totalBacklogs: 0,
        dueIds: new Set(),
        dispatchedIds: new Set(),
        receivedIndex: -1,
        pickedUpIndex: -1,
        warning: ""
      };
      const lm = (typeof NOL3.getPlanningLMInventoryV10 === "function" ? NOL3.getPlanningLMInventoryV10() : NOL3.lmInventory);
      if (!lm || !Array.isArray(lm.filteredRows) || !Array.isArray(lm.headers)) {
        result.warning = "Upload LM Inventory to calculate today's volume, dispatches, and backlogs.";
        return result;
      }

      const headers = lm.headers;
      const exceptionSet = getPlanningExceptionSet();
      result.receivedIndex = findBusinessTimestampIndex(headers, businessTimestampCandidates.received);
      result.pickedUpIndex = findBusinessTimestampIndex(headers, businessTimestampCandidates.pickedUp);
      const identityIndex = getBusinessIdentityIndex(headers);
      const rowIdentity = (row, index) => {
        const raw = identityIndex >= 0 ? row[identityIndex] : "";
        const normalized = normalizeIncomingKey(raw);
        return normalized || `__row_${index}`;
      };

      const settings = getHubBusinessDaySettings();
      const { start, end, cot, businessDate } = getBusinessWindow(new Date(), settings);

      // Planning Total Volume is the CURRENT on-floor snapshot for the selected
      // hub. It intentionally does not filter by Current Station Received Time,
      // CFR1, LH COT, carry-over, or planning exceptions. This matches the
      // operator workflow: upload the LM file, filter Current Station = selected
      // hub, and count the resulting orders.
      lm.filteredRows.forEach((row, index) => {
        if (rowMatchesPlanningException(row, headers, exceptionSet)) return;
        const id = rowIdentity(row, index);
        result.dueIds.add(id);

        const pickedAt = result.pickedUpIndex >= 0
          ? parseBusinessTimestamp(row[result.pickedUpIndex])
          : null;
        if (pickedAt && pickedAt.getTime() >= start.getTime() && pickedAt.getTime() < end.getTime()) {
          result.dispatchedIds.add(id);
        }
      });

      const liveTodayVolume = result.dueIds.size;
      // Freeze at COT: once the viewed business date's own LH COT is reached,
      // capture the live volume once and lock it in for that specific date —
      // a later LM upload (which moves NOL3.lmInventory forward to a newer
      // date) must not change what a past date shows. Keyed by hub AND
      // business date together (not hub alone) so freezing one date can
      // never overwrite another date's already-locked value.
      const hubForFreeze = getSelectedHub() || "__default__";
      const frozen = getFrozenTodayVolume(hubForFreeze, businessDate);
      const realTodayForFreeze = (typeof getNOL3TodayDate === "function")
        ? getNOL3TodayDate()
