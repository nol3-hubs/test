<script id="badoc-forward-order-final-fix">
(function () {
  'use strict';

  // FINAL Forward Order path.
  // This runs before the older page-specific upload listeners (capture phase)
  // and intentionally bypasses their status partitioning. Forward Order files
  // are Planning data: the selected hub may appear in Current Station,
  // Destination Station, or both. Their town/zone fields must reach the
  // Planning LM dataset intact.

  const isForwardFile = (file) => /(^|[_\-\s])forward([_\-\s]|order)|export_forward_order/i.test(String(file?.name || ''));

  const parseCSV = (text) => {
    const rows = [];
    let row = [], value = '', quoted = false;
    const s = String(text ?? '').replace(/^\uFEFF/, '');
    for (let i = 0; i < s.length; i++) {
      const ch = s[i], nx = s[i + 1];
      if (ch === '"' && quoted && nx === '"') { value += '"'; i++; continue; }
      if (ch === '"') { quoted = !quoted; continue; }
      if (ch === ',' && !quoted) { row.push(value); value = ''; continue; }
      if ((ch === '\n' || ch === '\r') && !quoted) {
        if (ch === '\r' && nx === '\n') i++;
        row.push(value); value = '';
        if (row.some(v => String(v ?? '').trim() !== '')) rows.push(row);
        row = [];
        continue;
      }
      value += ch;
    }
    if (value.length || row.length) {
      row.push(value);
      if (row.some(v => String(v ?? '').trim() !== '')) rows.push(row);
    }
    return rows;
  };

  const norm = v => String(v ?? '').replace(/^\uFEFF/, '').trim().toLowerCase();
  const idxOf = (headers, ...names) => {
    const hs = headers.map(norm);
    for (const n of names) {
      const i = hs.indexOf(norm(n));
      if (i >= 0) return i;
    }
    return -1;
  };
  const stationNorm = v => norm(v)
    .replace(/[()\[\],.;:_\-]+/g, ' ')
    .replace(/\b(station|hub)\b/g, '')
    .replace(/\s+/g, '')
    .trim();

  const hubMatches = (v, hub) => {
    const a = stationNorm(v), b = stationNorm(hub);
    if (!a || !b) return false;
    if (a === b) return true;
    if ((b === 'badoc' || b === 'badoc') && a === '3061') return true;
    if ((a === 'badoc' || a === 'badoc') && b === '3061') return true;
    return false;
  };

  const canonicalMapRow = (row, sourceHeaders, targetHeaders) => {
    const out = Array(targetHeaders.length).fill('');
    sourceHeaders.forEach((h, i) => {
      const j = targetHeaders.findIndex(x => norm(x) === norm(h));
      if (j >= 0) out[j] = row[i] ?? '';
    });
    return out;
  };

  const latestTime = (row, headers) => {
    const names = [
      'status updated time','status update time','updated time','updated at',
      'last updated time','last update time','current station received time',
      'delivering time','delivered time','onhold time','reschedule time',
      'pick up time','collected time','transported to sp time','created at','created time'
    ];
    let best = 0;
    for (const name of names) {
      const i = idxOf(headers, name);
      if (i < 0) continue;
      const t = Date.parse(String(row[i] ?? '').trim());
      if (Number.isFinite(t) && t > best) best = t;
    }
    return best;
  };

  async function loadExistingToday() {
    try {
      const today = typeof getNOL3TodayDate === 'function'
        ? getNOL3TodayDate()
        : new Date().toISOString().slice(0, 10);
      if (typeof NOL3.getLMHistorySnapshot === 'function') {
        const saved = await NOL3.getLMHistorySnapshot(today);
        if (saved?.dataset && Array.isArray(saved.dataset.rows)) return saved;
      }
    } catch (_) {}
    try {
      const saved = await NOL3._storageGet?.('lm');
      if (saved?.dataset && Array.isArray(saved.dataset.rows)) return saved;
    } catch (_) {}
    return null;
  }

  async function ingestForward(file, input) {
    if (!isForwardFile(file)) return false;

    const statusEl = document.getElementById('lmFilterStatus') || document.getElementById('unifiedInventoryStatus');
    const summaryEl = document.getElementById('lmSummary') || document.getElementById('unifiedInventorySummary');
    const hub = String((NOL3.getState && NOL3.getState().selectedHub) || 'Badoc Hub').trim();
    const text = await file.text();
    const parsed = parseCSV(text);
    if (parsed.length < 2) throw new Error('Forward Order CSV contains no rows.');

    const incomingHeaders = parsed[0].map(v => String(v ?? '').replace(/^\uFEFF/, '').trim());
    const incomingRows = parsed.slice(1).filter(r => r.some(v => String(v ?? '').trim() !== ''));
    const incomingOrderIdx = idxOf(incomingHeaders, 'order id');
    if (incomingOrderIdx < 0) throw new Error('Forward Order CSV has no Order ID column.');

    const ci = idxOf(incomingHeaders, 'current station');
    const di = idxOf(incomingHeaders, 'destination station');
    const ti = idxOf(incomingHeaders, 'town name', 'town', 'municipality', 'city');
    const zi = idxOf(incomingHeaders, 'zone id', 'zoneid', 'zone_id');

    // Forward Order is intentionally permissive: if station columns exist,
    // keep only rows belonging to the selected hub. If neither exists, retain
    // the rows because the file itself is already a hub-specific export.
    // Forward Order is already a Badoc-hub export. Keep every row from the file.
    // Station fields in Forward Order exports are not reliable enough to use as
    // an upload gate (they may contain station IDs, codes, blank values, or
    // labels different from the selected hub text). Planning will treat this
    // snapshot as belonging to the currently locked Badoc Hub.
    const matchingRows = incomingRows.slice();

    const saved = await loadExistingToday();
    const previousDataset = saved?.dataset || {};
    const previousHeaders = Array.isArray(previousDataset.headers) ? previousDataset.headers : incomingHeaders;

    const headers = [...previousHeaders];
    for (const h of incomingHeaders) {
      if (!headers.some(x => norm(x) === norm(h))) headers.push(h);
    }

    const orderIdx = idxOf(headers, 'order id');
    if (orderIdx < 0) throw new Error('Order ID column could not be established.');

    const previousRows = Array.isArray(previousDataset.rows) ? previousDataset.rows : [];
    const map = new Map();
    previousRows.forEach(r => {
      const mapped = canonicalMapRow(r, previousHeaders, headers);
      const id = String(mapped[orderIdx] ?? '').trim();
      if (id) map.set(id, mapped);
    });

    let newCount = 0, updateCount = 0;
    matchingRows.forEach(r => {
      const mapped = canonicalMapRow(r, incomingHeaders, headers);
      const id = String(mapped[orderIdx] ?? '').trim();
      if (!id) return;
      const old = map.get(id);
      if (!old) { map.set(id, mapped); newCount++; return; }
      if (latestTime(mapped, headers) >= latestTime(old, headers)) {
        map.set(id, mapped); updateCount++;
      }
    });

    const mergedRows = [...map.values()];

    // Forward Order rows are part of the Planning LM dataset. Do not split them
    // away into Incoming simply because Status happens to be SOC_LHTransported.
    const lmDataset = {
      fileName: file.name,
      headers,
      rows: mergedRows,
      rawText: text,
      loadedAt: new Date().toISOString(),
      isForwardOrderSnapshot: true
    };

    const oldFiles = Array.isArray(saved?.files) ? saved.files : [];
    const fileMeta = [...oldFiles, { name: file.name, lastModified: file.lastModified || 0, text }]
      .filter((x, i, a) => a.findIndex(y => y.name === x.name && (y.lastModified || 0) === (x.lastModified || 0)) === i);

    NOL3.lmInventory = {
      files: fileMeta,
      fileName: fileMeta.map(x => x.name).join(', '),
      headers,
      rows: mergedRows,
      filteredRows: [],
      loadedAt: lmDataset.loadedAt,
      rowCount: mergedRows.length,
      rawText: text,
      isForwardOrderSnapshot: true
    };

    // Build filteredRows using OR station logic, never status partitioning.
    NOL3.lmInventory.filteredRows = (ci >= 0 || di >= 0)
      ? mergedRows.filter(r => {
          const c = idxOf(headers, 'current station');
          const d = idxOf(headers, 'destination station');
          return hubMatches(r[c], hub) || hubMatches(r[d], hub);
        })
      : mergedRows.slice();

    const today = typeof getNOL3TodayDate === 'function'
      ? getNOL3TodayDate()
      : new Date().toISOString().slice(0, 10);

    // V10/V11: save the exact freshly-built dataset immediately, BEFORE any
    // history-summary refresh or cloud/restore operation can replace the live
    // NOL3.lmInventory object. This is the authoritative Planning source.
    try {
      if (typeof NOL3.savePlanningLMInventoryV10 === "function") {
        NOL3.savePlanningLMInventoryV10(NOL3.lmInventory, "forward-built");
      } else {
        NOL3._planningDataSourceV10 = {
          fileName: NOL3.lmInventory.fileName || file.name,
          headers: Array.isArray(NOL3.lmInventory.headers) ? NOL3.lmInventory.headers.slice() : [],
          rows: Array.isArray(NOL3.lmInventory.rows) ? NOL3.lmInventory.rows.map(r => Array.isArray(r) ? r.slice() : r) : [],
          filteredRows: Array.isArray(NOL3.lmInventory.filteredRows) ? NOL3.lmInventory.filteredRows.map(r => Array.isArray(r) ? r.slice() : r) : [],
          files: Array.isArray(NOL3.lmInventory.files) ? NOL3.lmInventory.files.map(f => ({ name: f?.name || "", lastModified: f?.lastModified || 0 })) : [],
          loadedAt: NOL3.lmInventory.loadedAt || new Date().toISOString(),
          rowCount: Array.isArray(NOL3.lmInventory.rows) ? NOL3.lmInventory.rows.length : 0,
          isForwardOrderSnapshot: true
        };
      }
    } catch (_) {}

    // V8: capture the freshly-built Forward Order planning dataset BEFORE any
    // summary/cloud restore code can touch the live NOL3.lmInventory object.
    try { NOL3.captureForwardPlanningSnapshot?.(NOL3.lmInventory, hub, today); } catch (_) {}

    try {
      if (typeof NOL3.saveLMHistorySnapshot === 'function') {
        await NOL3.saveLMHistorySnapshot(today, lmDataset, fileMeta);
      }
    } catch (_) {}
    try {
      await NOL3._storagePut?.({
        type: 'lm',
        files: fileMeta,
        dataset: lmDataset,
        savedAt: lmDataset.loadedAt
      });
    } catch (_) {}

    // Also keep Unified Inventory synchronized so startup/cloud restore cannot
    // resurrect the pre-forward snapshot over this one.
    try {
      const existingUnified = await NOL3._storageGet?.('unifiedInventory');
      const ud = existingUnified?.dataset || {};
      const uheaders = headers;
      const urows = mergedRows;
      const u = {
        type: 'unifiedInventory',
        files: fileMeta,
        dataset: {
          fileName: fileMeta.map(x => x.name).join(', '),
          headers: uheaders,
          rows: urows,
          lmRows: urows,
          incomingRows: Array.isArray(ud.incomingRows) ? ud.incomingRows : [],
          rawText: text,
          loadedAt: lmDataset.loadedAt
        },
        savedAt: lmDataset.loadedAt
      };
      await NOL3._storagePut?.(u);
    } catch (_) {}

    if (summaryEl) summaryEl.textContent = `${file.name} · ${matchingRows.length.toLocaleString()} hub rows`;
    if (statusEl) statusEl.textContent = `Forward Order loaded · ${mergedRows.length.toLocaleString()} total LM orders · ${matchingRows.length.toLocaleString()} rows from ${hub} · ${newCount.toLocaleString()} new · ${updateCount.toLocaleString()} updated`;

    // Make the uploaded file visible even if another part of the app rebuilds the
    // Inventory page, and commit the exact snapshot before any cloud polling can
    // restore an older/empty remote file set.
    try { await NOL3.updateInventoryUploadSummaries?.(); } catch (_) {}
    try { await window.NOL3CloudSync?.commitFilesUploadNow?.(); } catch (_) {}

    // Force the Planning UI to redraw while it is already open.
    window.dispatchEvent(new CustomEvent('inventoryloaded', { detail: { type: 'lm', source: 'forward-final', data: NOL3.lmInventory } }));
    window.dispatchEvent(new CustomEvent('lminventoryfiltered', { detail: { hub, totalRows: mergedRows.length, filteredRows: NOL3.lmInventory.filteredRows, source: 'forward-final' } }));
    window.dispatchEvent(new CustomEvent('planningchanged', { detail: { type: 'forward-order', source: 'forward-final' } }));

    try { NOL3.refreshPlanningViews?.(); } catch (_) {}
    try { NOL3.renderBusinessDayMetrics?.(); } catch (_) {}
    try {
      requestAnimationFrame(() => { NOL3.updateInventoryUploadSummaries?.(); });
      setTimeout(() => { NOL3.updateInventoryUploadSummaries?.(); }, 100);
    } catch (_) {}

    if (input) input.dataset.nol3ForwardHandled = String(Date.now());
    return true;
  }

  const handleChange = async (event) => {
    // Bridge-generated SPX exports intentionally pass through the normal
    // unified Inventory importer so status partitions remain authoritative:
    // LMHub_Received / Delivering / Delivered / OnHold -> LM;
    // SOC_LHTransporting / SOC_LHTransported -> Incoming.
    // Never let the manual Forward Order handler intercept a synthetic bridge
    // import merely because SPX names the file export_forward_order*.csv.
    if (window.__NOL3BridgeInventoryDispatch === true) return;

    const input = event.target?.closest?.('#lmFiles, #unifiedInventoryFile');
    if (!input) return;
    const file = input.files?.[0];
    if (!file || !isForwardFile(file)) return;

    // Stop all older Forward Order handlers from running after this direct path.
    event.preventDefault();
    event.stopImmediatePropagation();
    try {
      await ingestForward(file, input);
      console.info('[NOL3] Forward Order final path handled:', file.name);
    } catch (error) {
      console.error('[NOL3] Forward Order final path failed:', error);
      const el = document.getElementById('lmFilterStatus') || document.getElementById('unifiedInventoryStatus');
      if (el) el.textContent = `Forward Order error: ${error?.message || 'unknown error'}`;
    }
  };

  document.addEventListener('change', handleChange, true);
})();
</script>

<script id="nol3-planning-lm-authority-v7">
/*
 * FINAL Planning LM authority layer.
 *
 * The application has several historical/local/cloud inventory restore paths.
 * A cloud/local restore can legitimately replace NOL3.lmInventory with an
 * empty or stale object after a successful upload. Planning must never depend
 * on that race. This layer keeps a compact local planning snapshot for each
 * hub + business date and hydrates it immediately before Planning renders.
 *
 * It never overwrites a non-empty live LM dataset. It only repairs Planning
 * when the live dataset is empty, and it never stores an empty snapshot.
 */
(function () {
  const KEY = "NOL3_PLANNING_LM_AUTHORITY_V1";

  const storageGet = () => {
    try {
      return (window.NOL3Storage && typeof NOL3Storage.get === "function")
        ? NOL3Storage.get(KEY)
        : window.localStorage.getItem(KEY);
    } catch (_) { return null; }
  };
  const storageSet = (value) => {
    try {
      if (window.NOL3Storage && typeof NOL3Storage.set === "function") NOL3Storage.set(KEY, value);
      else window.localStorage.setItem(KEY, value);
      return true;
    } catch (_) { return false; }
  };
  const storageRemove = () => {
    try {
      if (window.NOL3Storage && typeof NOL3Storage.remove === "function") NOL3Storage.remove(KEY);
      else window.localStorage.removeItem(KEY);
    } catch (_) {}
  };

  const hubName = () => String((NOL3.getState && NOL3.getState().selectedHub) || "").trim();
  const businessDate = () => {
    try {
      const v = typeof NOL3.getBusinessDateValue === "function"
        ? NOL3.getBusinessDateValue()
        : (NOL3.currentBusinessDate || "");
      if (/^\d{4}-\d{2}-\d{2}$/.test(String(v))) return String(v);
    } catch (_) {}
    try {
      if (typeof getNOL3TodayDate === "function") return getNOL3TodayDate();
    } catch (_) {}
    return new Date().toISOString().slice(0, 10);
  };
  const slotKey = () => `${hubName()}::${businessDate()}`;

  const readStore = () => {
    try {
      const raw = storageGet();
      const parsed = raw ? JSON.parse(raw) : {};
      return parsed && typeof parsed === "object" ? parsed : {};
    } catch (_) { return {}; }
  };

  const saveLiveSnapshot = (source) => {
    try {
      const lm = NOL3.lmInventory;
      if (!lm || !Array.isArray(lm.rows) || lm.rows.length === 0 || !Array.isArray(lm.headers) || !lm.headers.length) return false;
      const hub = hubName();
      const date = businessDate();
      if (!hub || !date) return false;

      const store = readStore();
      store[`${hub}::${date}`] = {
        hub,
        businessDate: date,
        fileName: lm.fileName || "",
        headers: lm.headers,
        rows: lm.rows,
        files: Array.isArray(lm.files) ? lm.files.map(f => ({
          name: f?.name || "",
          lastModified: f?.lastModified || 0
        })).filter(f => f.name) : [],
        savedAt: new Date().toISOString(),
        source: source || "inventory"
      };

      /* Keep at most 14 hub/date snapshots to avoid unbounded localStorage growth. */
      const entries = Object.entries(store).sort((a, b) => String(b[1]?.savedAt || "").localeCompare(String(a[1]?.savedAt || "")));
      const trimmed = {};
      entries.slice(0, 14).forEach(([k, v]) => { trimmed[k] = v; });
      storageSet(JSON.stringify(trimmed));
      return true;
    } catch (error) {
      console.warn("NOL3 Planning authority: could not save snapshot", error);
      return false;
    }
  };

  const restorePlanningSnapshot = () => {
    try {
      const live = NOL3.lmInventory;
      if (live && Array.isArray(live.rows) && live.rows.length > 0) return false;

      const key = slotKey();
      const store = readStore();
      let snapshot = store[key] || null;

      /* Fallback to today's slot when the currently selected date has no snapshot. */
      if (!snapshot) {
        const today = (() => {
          try { return typeof getNOL3TodayDate === "function" ? getNOL3TodayDate() : new Date().toISOString().slice(0, 10); }
          catch (_) { return new Date().toISOString().slice(0, 10); }
        })();
        snapshot = store[`${hubName()}::${today}`] || null;
      }
      if (!snapshot || !Array.isArray(snapshot.rows) || !snapshot.rows.length) return false;

      const restored = {
        fileName: snapshot.fileName || "",
        headers: Array.isArray(snapshot.headers) ? snapshot.headers : [],
        rows: snapshot.rows,
        filteredRows: [],
        files: Array.isArray(snapshot.files) ? snapshot.files : [],
        loadedAt: snapshot.savedAt || new Date().toISOString(),
        rowCount: snapshot.rows.length,
        rawText: ""
      };

      const hub = hubName();
      if (snapshot.isForwardOrderSnapshot) {
        restored.filteredRows = restored.rows.slice();
      } else if (hub && typeof NOL3.filterRowsToHub === "function") {
        try {
          restored.filteredRows = NOL3.filterRowsToHub(restored.headers, restored.rows, "auto").rows;
        } catch (_) {
          restored.filteredRows = restored.rows.slice();
        }
      } else {
        restored.filteredRows = restored.rows.slice();
      }

      NOL3.lmInventory = restored;
      console.info("[NOL3] Planning LM authority restored", {
        hub,
        businessDate: businessDate(),
        rows: restored.rows.length,
        filteredRows: restored.filteredRows.length
      });
      return true;
    } catch (error) {
      console.warn("NOL3 Planning authority: restore failed", error);
      return false;
    }
  };

  NOL3.savePlanningLMAuthoritySnapshot = saveLiveSnapshot;
  NOL3.restorePlanningLMAuthoritySnapshot = restorePlanningSnapshot;

  /* Save every non-empty LM result. Empty cloud restores never erase this. */
  window.addEventListener("inventoryloaded", event => {
    const detail = event?.detail || {};
    if (detail.type !== "lm") return;
    if (detail.empty === true) return;
    if (detail.source === "cloud" && !(NOL3.lmInventory?.rows?.length)) return;
    saveLiveSnapshot(detail.source || "inventoryloaded");
  });

  window.addEventListener("lminventoryfiltered", () => {
    if (NOL3.lmInventory?.rows?.length) saveLiveSnapshot("lminventoryfiltered");
  });

  window.addEventListener("inventorycleared", event => {
    const type = event?.detail?.type;
    if (type === "lm" || type === "all") storageRemove();
  });

  /*
   * Hydrate BEFORE Planning's DOM is built. This is the key part of the fix:
   * navigating from Inventory Upload -> Planning can no longer render against
   * an empty live LM object after a cloud/local restore race.
   */
  const originalRenderPage = NOL3.renderPage;
  if (typeof originalRenderPage === "function" && !NOL3._planningAuthorityWrappedV7) {
    NOL3.renderPage = function (page) {
      if (page === "planning") {
        restorePlanningSnapshot();
      }
      return originalRenderPage.apply(this, arguments);
    };
    NOL3._planningAuthorityWrappedV7 = true;
  }

  /* Also repair the currently visible Planning page if a late restore empties it. */
  window.addEventListener("inventoryloaded", event => {
    if (NOL3.getState?.().currentPage !== "planning" || event?.detail?.type !== "lm") return;
    if (!NOL3.lmInventory?.rows?.length && restorePlanningSnapshot()) {
      try { NOL3.refreshPlanningViews?.(); } catch (_) {}
      try { NOL3.renderBusinessDayMetrics?.(); } catch (_) {}
    }
  });
})();
</script>

<script id="nol3-planning-data-source-final-v10">
/*
 * V10 FINAL: decouple Planning from the volatile live LM object.
 *
 * The upload path can succeed and then be followed by another restore path that
 * replaces NOL3.lmInventory with an empty object. Planning must have a durable,
 * independent source for the Forward Order data it just accepted.
 */
(function () {
  const KEY = "NOL3_PLANNING_DATA_SOURCE_V10";
  const getHub = () => String((NOL3.getState && NOL3.getState().selectedHub) || "Badoc Hub").trim();
  const today = () => {
    try { if (typeof getNOL3TodayDate === "function") return getNOL3TodayDate(); } catch (_) {}
    return new Date().toISOString().slice(0, 10);
  };
  const normalize = value => String(value ?? "").replace(/^\uFEFF/, "").trim().toLowerCase();
  const hubAliases = value => {
    const s = normalize(value).replace(/\s+/g, " ");
    if (!s) return new Set();
    const out = new Set([s]);
    if (s === "badoc" || s === "badoc hub" || s === "3061") {
      out.add("badoc"); out.add("badoc hub"); out.add("3061");
    }
    return out;
  };
  const matchesHub = (value, hub) => {
    const v = normalize(value);
    if (!v) return false;
    const aliases = hubAliases(hub);
    if (aliases.has(v)) return true;
    if (aliases.has("badoc") && (v.includes("badoc hub") || v === "badoc")) return true;
    return false;
  };
  const cloneRows = rows => Array.isArray(rows) ? rows.map(r => Array.isArray(r) ? r.slice() : r) : [];
  const cloneInventory = (inv) => {
    if (!inv || !Array.isArray(inv.rows) || !inv.rows.length || !Array.isArray(inv.headers) || !inv.headers.length) return null;
    const headers = inv.headers.slice();
    const rows = cloneRows(inv.rows);
    const hs = headers.map(normalize);
    const ci = ["current station", "current station name", "current hub", "current hub name", "station", "station name"].map(normalize).map(x => hs.indexOf(x)).find(i => i >= 0);
    const di = ["destination station", "destination station name", "destination hub", "destination hub name", "to station", "to hub"].map(normalize).map(x => hs.indexOf(x)).find(i => i >= 0);
    const hub = getHub();
    const filteredRows = inv.isForwardOrderSnapshot
      ? rows.slice()
      : ((ci >= 0 || di >= 0)
        ? rows.filter(r => matchesHub(ci >= 0 ? r[ci] : "", hub) || matchesHub(di >= 0 ? r[di] : "", hub))
        : rows.slice());
    return {
      fileName: inv.fileName || "",
      headers,
      rows,
      filteredRows,
      files: Array.isArray(inv.files) ? inv.files.map(f => ({ name: f?.name || "", lastModified: f?.lastModified || 0 })) : [],
      loadedAt: inv.loadedAt || new Date().toISOString(),
      rowCount: rows.length,
      isForwardOrderSnapshot: !!inv.isForwardOrderSnapshot
    };
  };
  const read = () => {
    try {
      const raw = localStorage.getItem(KEY);
      const obj = raw ? JSON.parse(raw) : null;
      return obj && typeof obj === "object" ? obj : null;
    } catch (_) { return null; }
  };
  const write = (inv, source) => {
    const snap = cloneInventory(inv);
    if (!snap || !snap.rows.length) return false;
    try {
      localStorage.setItem(KEY, JSON.stringify({
        hub: getHub(), businessDate: today(), source: source || "inventory",
        savedAt: new Date().toISOString(), inventory: snap
      }));
      NOL3._planningDataSourceV10 = snap;
      return true;
    } catch (_) { return false; }
  };
  const getSnapshot = () => NOL3._planningDataSourceV10 || read()?.inventory || null;
  const hydrate = () => {
    const live = NOL3.lmInventory;
    if (live && Array.isArray(live.rows) && live.rows.length) return false;
    const snap = getSnapshot();
    if (!snap || !Array.isArray(snap.rows) || !snap.rows.length) return false;
    const restored = cloneInventory(snap);
    if (!restored) return false;
    NOL3.lmInventory = restored;
    return true;
  };

  NOL3.getPlanningLMInventoryV10 = function () {
    if (NOL3.lmInventory?.rows?.length) return NOL3.lmInventory;
    hydrate();
    return NOL3.lmInventory?.rows?.length ? NOL3.lmInventory : null;
  };
  NOL3.savePlanningLMInventoryV10 = function (inv, source) { return write(inv, source); };
  NOL3.restorePlanningLMInventoryV10 = hydrate;

  window.addEventListener("inventoryloaded", event => {
    const d = event?.detail || {};
    if (d.type !== "lm") return;
    const candidate = d.data && Array.isArray(d.data.rows) ? d.data : NOL3.lmInventory;
    if (d.empty === true && !(candidate?.rows?.length)) return;
    if (candidate?.rows?.length) write(candidate, d.source || "inventoryloaded");
    if (NOL3.getState?.().currentPage === "planning") {
      if (hydrate()) {
        try { NOL3.refreshPlanningViews?.(); } catch (_) {}
        try { NOL3.renderBusinessDayMetrics?.(); } catch (_) {}
      }
    }
  });

  window.addEventListener("planningchanged", event => {
    if (event?.detail?.source === "forward-final" || event?.detail?.type === "forward-order") {
      if (NOL3.lmInventory?.rows?.length) write(NOL3.lmInventory, "planningchanged-forward");
    }
  });

  window.addEventListener("inventorycleared", event => {
    const t = event?.detail?.type;
    if (t === "lm" || t === "all") {
      try { localStorage.removeItem(KEY); } catch (_) {}
      NOL3._planningDataSourceV10 = null;
    }
  });

  // Always hydrate before Planning's DOM is built. This wrapper is deliberately
  // installed last so it sits outside every older renderPage wrapper.
  const oldRenderPage = NOL3.renderPage;
  if (typeof oldRenderPage === "function" && !NOL3._planningDataSourceWrappedV10) {
    NOL3.renderPage = function (page) {
      if (page === "planning") hydrate();
      return oldRenderPage.apply(this, arguments);
    };
    NOL3._planningDataSourceWrappedV10 = true;
  }

  // Startup recovery: a previously accepted Forward Order upload must be
  // available to Planning immediately even if another restore path is empty.
  try { hydrate(); } catch (_) {}
})();
</script>
