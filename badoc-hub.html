            const bucket = zoneGroups.get(zoneId) || { total: 0, items: [] };
            bucket.total += count;
            bucket.items.push({ item, count });
            zoneGroups.set(zoneId, bucket);
          });
        });
        let groupEntries = [...zoneGroups.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));
        if (zoneFilterText) groupEntries = groupEntries.filter(([zoneId]) => zoneId.toLowerCase().includes(zoneFilterText));

        if (!groupEntries.length) {
          summary.innerHTML = `<div class="town-empty">No Zone ID matches "${NOL3.escapeHTML(NOL3._townZoneFilterText || '')}".</div>`;
        } else {
          summary.innerHTML = `
            <div class="town-list-header"><div>Zone ID</div><div style="text-align:right">Orders</div></div>
            ${groupEntries.map(([zoneId, bucket]) => {
              const collapsed = !NOL3._expandedZoneGroups.has(zoneId);
              const uniqueTowns = new Set(bucket.items.map(entry => entry.item.baseTown)).size;
              return `
              <div class="zone-group${collapsed ? '' : ' open'}" data-zone-group="${NOL3.escapeHTML(zoneId)}">
                <div class="zone-group-header" role="button" tabindex="0" aria-expanded="${collapsed ? 'false' : 'true'}">
                  <span class="zone-group-toggle">${collapsed ? '▸' : '▾'}</span>
                  <span class="zone-group-name">${NOL3.escapeHTML(zoneId)}</span>
                  <span class="zone-group-meta">${uniqueTowns.toLocaleString()} town${uniqueTowns === 1 ? '' : 's'} · ${bucket.total.toLocaleString()} orders</span>
                </div>
                <div class="zone-group-body"${collapsed ? ' hidden' : ''}>
                  ${bucket.items.map(entry => buildTownCardHTML(entry.item, entry.count, zoneId)).join("")}
                </div>
              </div>`;
            }).join("")}
          `;
        }

        summary.querySelectorAll('.zone-group-header').forEach(header => {
          const toggle = () => {
            const group = header.closest('.zone-group');
            const zoneId = group?.dataset.zoneGroup || '';
            const body = group?.querySelector('.zone-group-body');
            const collapsed = group?.classList.toggle('open') === false;
            if (body) body.hidden = collapsed;
            header.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            header.querySelector('.zone-group-toggle').textContent = collapsed ? '▸' : '▾';
            if (collapsed) NOL3._expandedZoneGroups.delete(zoneId); else NOL3._expandedZoneGroups.add(zoneId);
          };
          header.addEventListener('click', toggle);
          header.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(); } });
        });
        NOL3._lastZoneGroupIds = groupEntries.map(([zoneId]) => zoneId);
      }
      const bulkToggleRow = document.getElementById('zoneGroupBulkToggleRow');
      if (bulkToggleRow) bulkToggleRow.hidden = mode !== 'zone';

      const selectAllRow = document.getElementById('townSelectAllRow');
      const selectAllBox = document.getElementById('townSelectAllVisible');
      if (selectAllRow) selectAllRow.hidden = sorted.length === 0;
      if (selectAllBox) selectAllBox.checked = sorted.length > 0 && sorted.every(item => NOL3._selectedTowns.has(item.town));

      // A town can appear more than once in "By Zone" mode (once per Zone ID it
      // carries) — keep every instance of the same town in sync when one is
      // checked, instead of only the row actually clicked.
      summary.querySelectorAll('.town-select-checkbox').forEach(box => {
        box.addEventListener('click', event => event.stopPropagation());
        box.addEventListener('change', () => {
          const key = box.dataset.townSelect || '';
          if (!key) return;
          if (box.checked) NOL3._selectedTowns.add(key); else NOL3._selectedTowns.delete(key);
          summary.querySelectorAll(`.town-select-checkbox[data-town-select="${CSS.escape(key)}"]`).forEach(otherBox => {
            otherBox.checked = box.checked;
            otherBox.closest('.town-card')?.classList.toggle('selected', box.checked);
          });
          if (selectAllBox) selectAllBox.checked = sorted.length > 0 && sorted.every(item => NOL3._selectedTowns.has(item.town));
          updateTownBulkToolbar();
        });
      });
      updateTownBulkToolbar();

      summary.querySelectorAll('.town-zone-toggle').forEach(button => {
        button.addEventListener('click', event => {
          event.preventDefault(); event.stopPropagation();
          const card = button.closest('.town-card');
          const wasOpen = card?.classList.contains('zone-open');
          summary.querySelectorAll('.town-card.zone-open').forEach(other => {
            other.classList.remove('zone-open');
            other.querySelector('.town-zone-breakdown')?.remove();
            other.querySelector('.town-zone-toggle')?.setAttribute('aria-expanded','false');
            if (other.querySelector('.town-zone-toggle')) other.querySelector('.town-zone-toggle').textContent = '▸';
          });
          if (!wasOpen && card) {
            card.classList.add('zone-open');
            const parsed = parseOperationalTownKey(card.dataset.town || '');
            card.insertAdjacentHTML('beforeend', parsed ? renderOperationalTownZoneBreakdown(parsed.town, parsed.area) : renderTownZoneBreakdown(card.dataset.town || ''));
            if (!parsed) bindZoneRowDragging(card); // only plain (non-split) towns support zone-transfer dragging
            button.setAttribute('aria-expanded','true'); button.textContent = '▾';
          }
        });
      });
      if (typeof bindTownDragging === "function") bindTownDragging();
    };

    NOL3.deliveryAreas = Array.isArray(NOL3.deliveryAreas) ? NOL3.deliveryAreas : [];
    NOL3.pendingTownGroupAreaId = null;
    NOL3.pendingTownGroupTown = null;

    const PLANNING_LAYOUT_KEY = 'nol3_planning_layout_v1';

    const getPlanningHubKey = () => {
      const hub = (NOL3.getState && NOL3.getState().selectedHub) || '';
      return String(hub).trim() || '__NO_HUB__';
    };

    const getPlanningSnapshot = () => NOL3.deliveryAreas.map(area => ({
      id: area.id,
      title: area.title,
      collapsed: !!area.collapsed,
      groups: ensureAreaGroups(area).map(group => ({
        id: group.id,
        title: group.title,
        towns: [...group.towns],
        assignedRiders: Array.isArray(group.assignedRiders) ? [...group.assignedRiders] : []
      }))
    }));

    const savePlanningLayout = () => {
      try {
        const raw = NOL3Storage.get(PLANNING_LAYOUT_KEY);
        let store = raw ? JSON.parse(raw) : {};
        if (Array.isArray(store)) {
          // Migrate the older single-layout format to the hub-aware format.
          store = { version: 2, byHub: { __NO_HUB__: store } };
        }
        if (!store || typeof store !== 'object') store = {};
        store.version = 2;
        store.byHub = store.byHub && typeof store.byHub === 'object' ? store.byHub : {};
        store.byHub[getPlanningHubKey()] = getPlanningSnapshot();
        NOL3Storage.set(PLANNING_LAYOUT_KEY, JSON.stringify(store));
        // Town groups / delivery-area arrangements are part of the synced
        // hub settings channel.
        window.dispatchEvent(new CustomEvent("planningchanged", {
          detail: { type: "town-arrangement", source: "local" }
        }));
      } catch (error) {
        console.warn('NOL3: Could not save planning layout.', error);
      }
    };

    const loadPlanningLayout = () => {
      try {
        const raw = NOL3Storage.get(PLANNING_LAYOUT_KEY);
        if (!raw) return false;
        let store = JSON.parse(raw);
        let saved;
        if (Array.isArray(store)) {
          saved = store;
        } else {
          saved = store?.byHub?.[getPlanningHubKey()];
        }
        if (!Array.isArray(saved)) return false;

        const restored = saved.map(savedArea => ({
          id: String(savedArea.id || `area-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`),
          title: String(savedArea.title || 'Delivery Area'),
          collapsed: !!savedArea.collapsed,
          towns: [],
          groups: Array.isArray(savedArea.groups) && savedArea.groups.length
            ? savedArea.groups.map(group => ({
                id: String(group.id || `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`),
                title: String(group.title || 'Town Group'),
                towns: Array.isArray(group.towns) ? [...group.towns] : [],
                assignedRiders: Array.isArray(group.assignedRiders) ? [...group.assignedRiders].map(String) : []
              }))
            : [{
                id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                title: 'Town Group',
                towns: [],
                assignedRiders: []
              }]
        }));

        NOL3.deliveryAreas = restored;
        NOL3.deliveryAreas.forEach(ensureAreaGroups);
        return true;
      } catch (error) {
        console.warn('NOL3: Could not load saved planning layout.', error);
        return false;
      }
    };

    const ensureAreaGroups = (area) => {
      if (!area || typeof area !== 'object') return [];
      if (!Array.isArray(area.groups)) {
        const legacyTowns = Array.isArray(area.towns) ? area.towns : [];
        area.groups = [{
          id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          title: 'Town Group',
          towns: [...legacyTowns],
          assignedRiders: []
        }];
      }

      // Normalize groups in place. Do not replace the group objects on every
      // call: rider-picker event handlers keep a reference to their group,
      // and replacing the objects can make a rider removal write to a stale
      // object. That stale state can then make another group appear to regain
      // the last rider.
      area.groups.forEach(group => {
        if (!group || typeof group !== 'object') return;
        group.id = group.id || `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        group.title = String(group.title || 'Town Group');
        group.towns = Array.isArray(group.towns) ? group.towns : [];
        group.assignedRiders = Array.isArray(group.assignedRiders)
          ? group.assignedRiders.map(String)
          : [];
      });
      area.groups = area.groups.filter(group => group && typeof group === 'object');
      area.towns = area.groups.flatMap(group => group.towns);
      return area.groups;
    };

    NOL3.deliveryAreas.forEach(ensureAreaGroups);

    const getAssignedTownSet = () => {
      const set = new Set();
      NOL3.deliveryAreas.forEach(area => {
        ensureAreaGroups(area).forEach(group => group.towns.forEach(town => set.add(town)));
      });
      return set;
    };

    const getAvailableTowns = () => {
      const lm = NOL3.lmInventory;
      if (!lm || !lm.filteredRows || !lm.headers) return [];
      const headers = lm.headers.map(h => String(h || '').trim().toLowerCase());
      const townIndex = headers.indexOf('town name');
      if (townIndex < 0) return [];
      const set = new Set();
      lm.filteredRows.forEach(row => {
        const town = String(row[townIndex] || '').trim();
        if (town) set.add(town);
      });
      return [...set].sort((a,b)=>a.localeCompare(b));
    };

    const openDeliveryAreaModal = () => {
      const modal = document.getElementById('deliveryAreaModal');
      const input = document.getElementById('deliveryAreaName');
      if (!modal || !input) return;
      input.value = '';
      input.placeholder = 'e.g. North Area';
      modal.classList.add('show');
      setTimeout(() => input.focus(), 30);
    };

    const closeDeliveryAreaModal = () => {
      const modal = document.getElementById('deliveryAreaModal');
      if (modal) modal.classList.remove('show');
    };

    const openTownGroupModal = (areaId, town = null) => {
      const area = NOL3.deliveryAreas.find(item => item.id === areaId);
      if (!area) return;
      NOL3.pendingTownGroupAreaId = areaId;
      NOL3.pendingTownGroupTown = town || null;
      const modal = document.getElementById('townGroupModal');
      const input = document.getElementById('townGroupName');
      if (!modal || !input) return;
      input.value = '';
      input.placeholder = 'e.g. North Towns';
      modal.classList.add('show');
      setTimeout(() => input.focus(), 30);
    };

    const closeTownGroupModal = () => {
      const modal = document.getElementById('townGroupModal');
      if (modal) modal.classList.remove('show');
      NOL3.pendingTownGroupAreaId = null;
      NOL3.pendingTownGroupTown = null;
    };

    const saveDeliveryAreaFromModal = () => {
      const input = document.getElementById('deliveryAreaName');
      if (!input) return;
      const title = input.value.trim();
      if (!title) { input.focus(); return; }
      NOL3.deliveryAreas.push({
        id: `area-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        title,
        towns: [],
        groups: [{
          id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          title: 'Town Group',
          towns: [],
          assignedRiders: []
        }]
      });
      savePlanningLayout();
      renderDeliveryAreas();
      closeDeliveryAreaModal();
    };

    const saveTownGroupFromModal = () => {
      const input = document.getElementById('townGroupName');
      const areaId = NOL3.pendingTownGroupAreaId;
      if (!input || areaId === null || areaId === undefined) return;
      const title = input.value.trim();
      if (!title) { input.focus(); return; }
      const area = NOL3.deliveryAreas.find(item => item.id === areaId);
      if (!area) { closeTownGroupModal(); return; }

      const groups = ensureAreaGroups(area);
      const droppedTown = NOL3.pendingTownGroupTown;
      const newGroup = {
        id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        title,
        towns: droppedTown ? [droppedTown] : []
      };

      if (droppedTown) {
        NOL3.deliveryAreas.forEach(otherArea => {
          ensureAreaGroups(otherArea).forEach(group => {
            group.towns = group.towns.filter(existing => existing !== droppedTown);
          });
          otherArea.towns = ensureAreaGroups(otherArea).flatMap(group => group.towns);
        });
      }

      groups.push(newGroup);
      area.towns = groups.flatMap(group => group.towns);
      savePlanningLayout();
      renderDeliveryAreas();
      renderOnFloorTowns();
      closeTownGroupModal();
    };

    const openRemoveDeliveryAreaModal = (id, title) => {
      NOL3.pendingRemoveDeliveryAreaId = id;
      const modal = document.getElementById('removeDeliveryAreaModal');
      const text = document.getElementById('removeDeliveryAreaText');
      if (text) text.textContent = `This will remove the delivery area header "${title}" and its assigned towns.`;
      if (modal) modal.classList.add('show');
    };

    const closeRemoveDeliveryAreaModal = () => {
      const modal = document.getElementById('removeDeliveryAreaModal');
      if (modal) modal.classList.remove('show');
      NOL3.pendingRemoveDeliveryAreaId = null;
    };

    const confirmRemoveDeliveryArea = () => {
      const id = NOL3.pendingRemoveDeliveryAreaId;
      if (!id) return;
      NOL3.deliveryAreas = NOL3.deliveryAreas.filter(area => area.id !== id);
      savePlanningLayout();
      closeRemoveDeliveryAreaModal();
      renderDeliveryAreas();
      renderOnFloorTowns();
    };

    const createTownGroupFromDrop = (areaId, townInput) => {
      const towns = [...new Set((Array.isArray(townInput) ? townInput : [townInput]).filter(Boolean))];
      if (!areaId || !towns.length) return;
      const area = NOL3.deliveryAreas.find(item => item.id === areaId);
      if (!area) return;

      // Remove the town(s) from every existing group first so each can only belong once.
      NOL3.deliveryAreas.forEach(otherArea => {
        ensureAreaGroups(otherArea).forEach(group => {
          group.towns = group.towns.filter(existing => !towns.includes(existing));
        });
        otherArea.towns = ensureAreaGroups(otherArea).flatMap(group => group.towns);
      });

      // Fetch the groups array AFTER the removal loop above, since ensureAreaGroups()
      // rebuilds a fresh array/object identity on every call (including the call made
      // on this same area inside the loop). Grabbing it beforehand left us pushing
      // onto a stale, orphaned array that never made it back onto area.groups.
      const groups = ensureAreaGroups(area);

      const newGroup = {
        id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        title: `Town Group ${groups.length + 1}`,
        towns: [...towns]
      };
      groups.push(newGroup);
      area.towns = groups.flatMap(group => group.towns);
      savePlanningLayout();
      renderDeliveryAreas();
      renderOnFloorTowns();
    };

    const refreshDeliveryAreaAfterTownMove = (town, targetAreaId = null, targetGroupId = null) => {
      // Full re-render so group totals, FP, SR, area counts and the town chip's
      // status badges are all recalculated immediately (no need to leave and
      // re-open the page). Keep the scroll position so the view does not jump.
      const y = window.scrollY, x = window.scrollX;
      const zoneScroll = new Map();
      document.querySelectorAll('.town-group-dropzone').forEach(z => zoneScroll.set(z.dataset.groupId, z.scrollTop));
      renderDeliveryAreas();
      document.querySelectorAll('.town-group-dropzone').forEach(z => { const t = zoneScroll.get(z.dataset.groupId); if (t) z.scrollTop = t; });
      window.scrollTo(x, y);
    };

    const deleteTownGroup = (areaId, groupId) => {
      const area = NOL3.deliveryAreas.find(item => item.id === areaId);
      if (!area) return;
      const groups = ensureAreaGroups(area);
      const index = groups.findIndex(group => group.id === groupId);
      if (index < 0) return;

      // Removing a group deliberately leaves its towns unassigned.
      groups.splice(index, 1);
      area.towns = groups.flatMap(group => group.towns);
      savePlanningLayout();
      renderDeliveryAreas();
      renderOnFloorTowns();
    };

    const assignTownsToGroup = (towns, areaId, groupId) => {
      const list = [...new Set((Array.isArray(towns) ? towns : [towns]).filter(Boolean))];
      if (!list.length || !areaId || !groupId) return;
      NOL3.deliveryAreas.forEach(area => {
        const groups = ensureAreaGroups(area);
        groups.forEach(group => { group.towns = group.towns.filter(existing => !list.includes(existing)); });
        area.towns = groups.flatMap(group => group.towns);
      });
      const target = NOL3.deliveryAreas.find(area => area.id === areaId);
      if (target) {
        const groups = ensureAreaGroups(target);
        const group = groups.find(item => item.id === groupId) || groups[0];
        if (group) group.towns.push(...list);
        target.towns = groups.flatMap(item => item.towns);
      }
      savePlanningLayout();
      renderDeliveryAreas();
      renderOnFloorTowns();
    };

    const assignTownToGroup = (town, areaId, groupId) => {
      NOL3.deliveryAreas.forEach(area => {
        const groups = ensureAreaGroups(area);
        groups.forEach(group => {
          group.towns = group.towns.filter(existing => existing !== town);
        });
        area.towns = groups.flatMap(group => group.towns);
      });
      const target = NOL3.deliveryAreas.find(area => area.id === areaId);
      if (target) {
        const groups = ensureAreaGroups(target);
        const group = groups.find(item => item.id === groupId) || groups[0];
        if (group) group.towns.push(town);
        target.towns = groups.flatMap(item => item.towns);
      }
      savePlanningLayout();
      refreshDeliveryAreaAfterTownMove(town, areaId, groupId);
      renderOnFloorTowns();
    };

    const assignTownToArea = (town, areaId) => {
      const target = NOL3.deliveryAreas.find(area => area.id === areaId);
      if (!target) return;
      const groups = ensureAreaGroups(target);
      const firstGroup = groups[0];
      if (firstGroup) assignTownToGroup(town, areaId, firstGroup.id);
    };

    const removeTownFromGroups = (town) => {
      if (!town) return;
      let changed = false;
      NOL3.deliveryAreas.forEach(area => {
        const groups = ensureAreaGroups(area);
        groups.forEach(group => {
          const before = group.towns.length;
          group.towns = group.towns.filter(existing => existing !== town);
          if (group.towns.length !== before) changed = true;
        });
        area.towns = groups.flatMap(group => group.towns);
      });
      if (!changed) return;
      savePlanningLayout();
      refreshDeliveryAreaAfterTownMove(town);
      renderOnFloorTowns();
    };

    const swapTownGroups = (areaId, groupId, targetAreaId, targetGroupId) => {
      if (!areaId || !groupId || !targetAreaId || !targetGroupId) return;
      const sourceArea = NOL3.deliveryAreas.find(area => area.id === areaId);
      const targetArea = NOL3.deliveryAreas.find(area => area.id === targetAreaId);
      if (!sourceArea || !targetArea) return;

      const sourceGroups = ensureAreaGroups(sourceArea);
      const targetGroups = sourceArea === targetArea ? sourceGroups : ensureAreaGroups(targetArea);
      const sourceIndex = sourceGroups.findIndex(group => group.id === groupId);
      const targetIndex = targetGroups.findIndex(group => group.id === targetGroupId);
      if (sourceIndex < 0 || targetIndex < 0) return;

      // Move the dragged group before the target group. The target and the
      // groups after it automatically shift down, rather than swapping.
      const [movedGroup] = sourceGroups.splice(sourceIndex, 1);
      if (!movedGroup) return;

      if (sourceArea === targetArea) {
        const adjustedTargetIndex = sourceIndex < targetIndex ? targetIndex - 1 : targetIndex;
        sourceGroups.splice(adjustedTargetIndex, 0, movedGroup);
        sourceArea.towns = sourceGroups.flatMap(group => group.towns);
      } else {
        targetGroups.splice(targetIndex, 0, movedGroup);
        sourceArea.towns = sourceGroups.flatMap(group => group.towns);
        targetArea.towns = targetGroups.flatMap(group => group.towns);
      }

      renderDeliveryAreas();

    const openDeleteTownGroupModal = (areaId, groupId, title) => {

    const confirmDeleteTownGroup = () => {
      const pending = NOL3.pendingDeleteTownGroup;
      if (!pending) return;
      const area = NOL3.deliveryAreas.find(item => item.id === pending.areaId);
      if (!area) { closeDeleteTownGroupModal(); return; }
      const groups = ensureAreaGroups(area);
      const index = groups.findIndex(group => group.id === pending.groupId);
      if (index < 0) { closeDeleteTownGroupModal(); return; }

      groups.splice(index, 1);
      area.towns = groups.flatMap(group => group.towns);
      savePlanningLayout();
      closeDeleteTownGroupModal();
      renderDeliveryAreas();
      renderOnFloorTowns();

    const bindTownGroupDragging = () => {
      document.querySelectorAll('.town-group-header').forEach(header => {
        if (header.dataset.groupDragBound === '1') return;
        header.dataset.groupDragBound = '1';

        const groupId = group.dataset.groupId || '';

          NOL3.activeDraggedTownGroup = { areaId, groupId };

          event.dataTransfer.setData('application/x-nol3-town-group', payload);
          event.dataTransfer.setData('text/plain', payload);

        });
        header.addEventListener('drop', event => {
          event.preventDefault();
          event.stopPropagation();
          group.classList.remove('group-drag-target');
          let payload = NOL3.activeDraggedTownGroup;
          if (!payload) {
            const raw = event.dataTransfer.getData('application/x-nol3-town-group');
            if (raw) { try { payload = JSON.parse(raw); } catch (_) {} }
          }
          NOL3.activeDraggedTownGroup = null;
          if (!payload) return;

        let pointerDrag = null;
        header.addEventListener('pointerdown', event => {

          const target = document.elementFromPoint(event.clientX, event.clientY);
          const targetHeader = target?.closest('.town-group-header');
          document.querySelectorAll('.town-group.group-drag-target').forEach(el => el.classList.remove('group-drag-target'));

    const bindTownDragging = () => {

      const townsPanel = document.getElementById('townsPanel');
      const handleReturn = (event) => {

        const towns = readTownDragPayload(event);
        if (!towns.length) return;
        NOL3.deliveryAreas.forEach(area => {
          const groups = ensureAreaGroups(area);
          groups.forEach(group => {
            group.towns = group.towns.filter(existing => !towns.includes(existing));
          });

      [townsPanel].forEach(target => {

      document.querySelectorAll('.town-group-dropzone').forEach(zone => {
        if (zone.dataset.dropBound === '1') return;
        zone.dataset.dropBound = '1';
        zone.addEventListener('dragover', event => { event.preventDefault(); zone.classList.add('dragover'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
        zone.addEventListener('drop', event => {
          event.preventDefault();
          zone.classList.remove('dragover');

          const areaId = zone.dataset.areaId;
          const groupId = zone.dataset.groupId;
          if (towns.length && areaId && groupId) { assignTownsToGroup(towns, areaId, groupId); NOL3._selectedTowns?.clear(); }
        });
      });

      // Fallback for browsers that do not deliver the drop event directly to the tile.
      // We keep the existing HTML5 drag system and only intercept drops whose target is + NEW GROUP.
      if (!NOL3.newGroupDocumentDropBound) {
        NOL3.newGroupDocumentDropBound = true;
        document.addEventListener('dragover', event => {
          const tile = event.target && event.target.closest ? event.target.closest('.new-town-group-tile') : null;
          if (!tile) return;
          event.preventDefault();
          event.stopPropagation();
          document.querySelectorAll('.new-town-group-tile.dragover').forEach(el => el.classList.remove('dragover'));
          tile.classList.add('dragover');
        }, true);

        document.addEventListener('drop', event => {

          event.stopPropagation();

          const batchRaw = event.dataTransfer && event.dataTransfer.getData('application/x-nol3-town-batch');
          if (batchRaw) { try { batchTowns = JSON.parse(batchRaw); } catch (_) { batchTowns = []; } }
          const single = (event.dataTransfer && (event.dataTransfer.getData('application/x-nol3-town') || event.dataTransfer.getData('text/plain'))) || NOL3.activeDraggedTown || '';
          const towns = (Array.isArray(batchTowns) && batchTowns.length) ? batchTowns : (single ? [single] : []);
          const areaId = tile.dataset.areaId;
          tile.classList.remove('dragover');
          NOL3.activeDraggedTown = null;
          if (areaId && towns.length) { createTownGroupFromDrop(areaId, towns); NOL3._selectedTowns?.clear(); }
        }, true);
      }

      document.querySelectorAll('.new-town-group-tile').forEach(tile => {
        if (tile.dataset.dropBound === '1') return;
        tile.dataset.dropBound = '1';
        tile.addEventListener('dragover', event => {
          event.preventDefault();
          event.stopPropagation();
          tile.classList.add('dragover');
        });
        tile.addEventListener('dragleave', event => {
          event.stopPropagation();
          tile.classList.remove('dragover');
        });
        tile.addEventListener('drop', event => {
          event.preventDefault();
          event.stopPropagation();
          tile.classList.remove('dragover');
          const towns = readTownDragPayload(event);
          const areaId = tile.dataset.areaId;
          if (areaId && towns.length) { createTownGroupFromDrop(areaId, towns); NOL3._selectedTowns?.clear(); }
        });

      // Touch/pointer fallback for phones/tablets. Keep the existing HTML5 drag path intact.
      let pointerDrag = null;
      let pointerDropTarget = null;

      const clearPointerDropState = () => {
        document.querySelectorAll('.new-town-group-tile.dragover, .town-group-dropzone.dragover')
          .forEach(el => el.classList.remove('dragover'));
        pointerDropTarget = null;
      };

      const updatePointerDropTarget = (event) => {
        const target = document.elementFromPoint(event.clientX, event.clientY);
        const dropTarget = target && target.closest('.new-town-group-tile, .town-group-dropzone');
        clearPointerDropState();
        if (dropTarget) {
          dropTarget.classList.add('dragover');

      document.querySelectorAll('.town-card[draggable="true"], .town-chip[draggable="true"]').forEach(card => {
        if (card.dataset.pointerBound === '1') return;

          if (event.pointerType === 'mouse') return;
          const town = card.dataset.town || '';
          if (!town) return;

        });

        });

        card.addEventListener('pointerup', event => {
          if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;

            const target = document.elementFromPoint(event.clientX, event.clientY);

            createTownGroupFromDrop(dropTarget.dataset.areaId, drag.town);
          } else if (dropTarget.classList.contains('town-group-dropzone')) {
            assignTownToGroup(drag.town, dropTarget.dataset.areaId, dropTarget.dataset.groupId);
          }
          clearPointerDropState();
        });

        card.addEventListener('pointercancel', () => {
          pointerDrag = null;
          clearPointerDropState();
        });
      });
      bindTownGroupDragging();
    };

    const getActiveRidersForPlanning = () => {
      const result = [];
      const data = NOL3.riderData;
      if (!data || !data.rawText) return result;
      const rows = [];
      let row = [], value = '', inQuotes = false;
      const text = String(data.rawText || '');
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"') {
            if (text[i + 1] === '"') { value += '"'; i++; }
            else inQuotes = false;
          } else value += ch;
        } else if (ch === '"') inQuotes = true;
        else if (ch === ',') { row.push(value.trim()); value = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(value.trim()); value = '';
          if (row.some(cell => cell !== '')) rows.push(row);
          row = [];
        } else value += ch;
      }
      if (value !== '' || row.length) { row.push(value.trim()); if (row.some(cell => cell !== '')) rows.push(row); }
      if (rows.length < 2) return result;
      const headers = rows[0].map(h => String(h || '').trim().toLowerCase());
      const nameIndex = headers.indexOf('driver name');
      const idIndex = headers.indexOf('driver id');
      const statusIndex = headers.indexOf('spx status');
      const vehicleTypeIndex = headers.indexOf('vehicle type');
      const seen = new Set();
      rows.slice(1).forEach(cells => {
        const status = statusIndex >= 0 ? String(cells[statusIndex] || '').trim().toLowerCase() : '';
        if (status.includes('suspend')) return;
        const name = nameIndex >= 0 ? String(cells[nameIndex] || '').trim() : '';
        const id = idIndex >= 0 ? String(cells[idIndex] || '').trim() : '';
        const key = id || name;
        if (!key || seen.has(key)) return;
        seen.add(key);
        const vehicleType = vehicleTypeIndex >= 0 ? String(cells[vehicleTypeIndex] || '').trim() : '';
        result.push({ id: key, name: name || id, vehicleType: vehicleType || 'Vehicle' });
      });
      return result.sort((a,b) => a.name.localeCompare(b.name));
    };

    const closeTownGroupRiderMenus = (except = null) => {
      document.querySelectorAll('.town-group-rider-picker.open').forEach(picker => {
        if (picker !== except) picker.classList.remove('open');
      });
    };

    if (!NOL3.townGroupRiderMenuCloseBound) {
      NOL3.townGroupRiderMenuCloseBound = true;
      document.addEventListener('click', () => closeTownGroupRiderMenus());
    }

    const PLANNING_FP_KEY = 'nol3_fleet_productivity_v1';
    const PLANNING_EXCEPTION_KEY = 'nol3_planning_exceptions_v1';
    const getPlanningHubStorageKey = base => {
      const hub = (NOL3.getState && NOL3.getState().selectedHub) || '';
      return `${base}:${String(hub).trim() || '__NO_HUB__'}`;
    };
    const getFleetProductivityStorageKey = () => {
      const hub = (NOL3.getState && NOL3.getState().selectedHub) || '';
      return `${PLANNING_FP_KEY}:${String(hub).trim() || '__NO_HUB__'}`;
    };
    const getFleetProductivityTarget = () => {
      try {
        const hubKey = getFleetProductivityStorageKey();
        const scoped = NOL3Storage.get(hubKey);
        const value = Number(scoped);
        if (Number.isFinite(value) && value > 0) return value;
        // Preserve the existing target once, then future saves are hub-scoped.
        const legacy = Number(NOL3Storage.get(PLANNING_FP_KEY));
        return Number.isFinite(legacy) && legacy > 0 ? legacy : 50;
      } catch (error) { return 50; }
    };
    const saveFleetProductivityTarget = value => {
      const numeric = Number(value); if (!Number.isFinite(numeric) || numeric <= 0) return;
      try { NOL3Storage.set(getFleetProductivityStorageKey(), String(numeric)); } catch (error) {}
    };
    const loadPlanningExceptions = () => {
      try { const raw = NOL3Storage.get(getPlanningHubStorageKey(PLANNING_EXCEPTION_KEY)); const parsed = raw ? JSON.parse(raw) : []; return Array.isArray(parsed) ? parsed.map(String).map(v => v.trim()).filter(Boolean) : []; } catch (error) { return []; }
    };
    const savePlanningExceptions = list => { try { NOL3Storage.set(getPlanningHubStorageKey(PLANNING_EXCEPTION_KEY), JSON.stringify(list)); } catch (error) {} };
    const normalizePlanningExceptionKey = value =>
      normalizeIncomingKey(String(value ?? '').replace(/^\uFEFF/, ''));

    const getPlanningExceptionSet = () => new Set(
      loadPlanningExceptions()
        .map(normalizePlanningExceptionKey)
        .filter(Boolean)
    );

    // A single global exclusion test used by EVERY Planning count.
    // The value entered in Exception is treated as a tracking/order search
    // term, not as a column-specific value.
    const planningExceptionValueMatches = (cellValue, exceptionSet) => {
      if (!exceptionSet?.size) return false;

      const value = normalizePlanningExceptionKey(cellValue);
      if (!value) return false;

      for (const exception of exceptionSet) {
        const key = normalizePlanningExceptionKey(exception);
        if (!key) continue;

        // Exact match is the normal case.
        if (value === key) return true;

        // Also handle common export formatting where the tracking number is
        // embedded in a larger cell (quotes, prefixes, suffixes, etc.).
        // Only allow substring matching for realistic tracking identifiers.
        if (key.length >= 8 && value.includes(key)) return true;
      }

      return false;
    };

    const rowMatchesPlanningException = (row, headers, exceptionSet) => {
      if (!row || !exceptionSet?.size || !Array.isArray(headers)) return false;

      // Exceptions are tracking/order identifiers. Do NOT search every cell in
      // the row: operational fields such as Delivery Attempts, Total of On Hold
      // Times, Reschedule Date, etc. can legitimately contain values like "1".
      // Searching every cell would therefore exclude unrelated orders when an
      // operator enters a short tracking value such as 1.
      const normalizedHeaders = headers.map(h => String(h || '').trim().toLowerCase());
      const identityNames = [
        'order id', 'orderid', 'order no', 'order number',
        'sls tracking number', 'sls tn', 'tracking number', 'tracking no',
        'tracking id', 'spx tracking number', 'spx tn', 'spx tracking no',
        'shopee order sn'
      ];
      const identityIndexes = [];
      normalizedHeaders.forEach((header, index) => {
        if (identityNames.includes(header)) identityIndexes.push(index);
      });

      // If a source has no recognized identifier column, do not fall back to
      // all cells. That is safer than silently excluding orders because a
      // numeric operational field happens to equal an exception value.
      for (const index of identityIndexes) {
        if (planningExceptionValueMatches(row[index], exceptionSet)) return true;
      }
      return false;
    };
    const renderPlanningExceptions = () => {
      const listEl = document.getElementById('planningExceptionList'); const countEl = document.getElementById('planningExceptionCount'); if (!listEl || !countEl) return;
      const list = loadPlanningExceptions(); countEl.textContent = list.length.toLocaleString();
      listEl.innerHTML = list.map((tracking,index) => `<div class="planning-exception-item"><span>${NOL3.escapeHTML(tracking)}</span><button class="planning-exception-remove" type="button" data-exception-index="${index}" aria-label="Remove exception">×</button></div>`).join('');
      listEl.querySelectorAll('.planning-exception-remove').forEach(button => button.addEventListener('click', () => { const current=loadPlanningExceptions(); const index=Number(button.dataset.exceptionIndex); if(index>=0&&index<current.length){current.splice(index,1);savePlanningExceptions(current); if(typeof refreshAllExceptionAffectedViews === 'function') refreshAllExceptionAffectedViews(); else { renderPlanningExceptions(); renderDeliveryAreas(); } } }));
    };
    // Parcel Records filter state is mirrored here so Planning > On-Floor
    // can show the filtered parcel volume when the user applies a Parcel Records filter.
    NOL3.parcelRecordsFilteredCount = null;
    NOL3.parcelRecordsFilterActive = false;

    const updatePlanningSummary = (townCounts = null) => {
      const totalEl=document.getElementById('planningTotalVolume'); const fpInput=document.getElementById('planningFleetProductivity');
      if(totalEl){
        const hasParcelFilter = !!NOL3.parcelRecordsFilterActive;
        const parcelCount = Number(NOL3.parcelRecordsFilteredCount);
        if (hasParcelFilter && Number.isFinite(parcelCount)) {
          totalEl.textContent = parcelCount.toLocaleString();
        } else {
          const counts=townCounts||new Map();
          const lmTotal = [...counts.values()].reduce((sum,count)=>sum+Number(count||0),0);

          // A confirmed-arrived Incoming Linehaul is now physically on-floor,
          // so its matched orders must be added to Total Volume. Keep this
          // separate from the LM snapshot so the existing LM calculation is
          // not altered.
          let arrivedTotal = 0;
          try {
            if (typeof getArrivedIncomingTownCounts === 'function') {
              const arrivedCounts = getArrivedIncomingTownCounts();
              arrivedTotal = [...arrivedCounts.values()].reduce((sum,count)=>sum+Number(count||0),0);
            }
          } catch (_) { arrivedTotal = 0; }

          totalEl.textContent=(lmTotal + arrivedTotal).toLocaleString();
        }
      }
      if(fpInput&&document.activeElement!==fpInput) fpInput.value=String(getFleetProductivityTarget());
      renderPlanningExceptions();
    };

    const renderDeliveryAreas = () => {
      const groupsRoot = document.getElementById('deliveryAreaGroups');
      // Repair the hub-filtered LM view before calculating Delivery Areas.
      try {
        const lmRepair = NOL3.lmInventory;
        if (lmRepair && Array.isArray(lmRepair.rows) && lmRepair.rows.length &&
            (!Array.isArray(lmRepair.filteredRows) || !lmRepair.filteredRows.length)) {
          const repaired = typeof NOL3.filterRowsToHub === 'function'
            ? NOL3.filterRowsToHub(lmRepair.headers || [], lmRepair.rows, 'auto').rows
            : lmRepair.rows.slice();
          if (repaired.length) lmRepair.filteredRows = repaired;
        }
      } catch (_) {}
      if (!groupsRoot) return;
      groupsRoot.innerHTML = '';

      const townCounts = new Map();
      const lm = (typeof NOL3.getPlanningLMInventoryV10 === "function" ? NOL3.getPlanningLMInventoryV10() : NOL3.lmInventory);
      if (lm && Array.isArray(lm.filteredRows) && Array.isArray(lm.headers)) {
        const headers = lm.headers.map(h => String(h || '').trim().toLowerCase());
        const townIndex = headers.indexOf('town name');
        const zoneIndex = headers.indexOf('zone id');
        if (townIndex >= 0) {
          const exceptionSet = getPlanningExceptionSet();
          const businessMetrics = typeof getBusinessDayMetrics === 'function' ? getBusinessDayMetrics() : null;
          const receivedIndex = businessMetrics?.receivedIndex ?? -1;
          const identityIndex = typeof getBusinessIdentityIndex === 'function' ? getBusinessIdentityIndex(lm.headers) : -1;
          const dueIds = businessMetrics?.dueIds instanceof Set ? businessMetrics.dueIds : null;
          const hasBusinessWindow = dueIds && receivedIndex >= 0;
          lm.filteredRows.forEach((row, index) => {
            if (rowMatchesPlanningException(row, lm.headers, exceptionSet)) return;
            if (hasBusinessWindow) {
              const rawId = identityIndex >= 0 ? row[identityIndex] : '';
              const id = normalizeIncomingKey(rawId) || `__row_${index}`;
              if (!dueIds.has(id)) return;
            }
            const town = resolveRowTown(row, townIndex, zoneIndex);
            if (town) townCounts.set(town, (townCounts.get(town) || 0) + 1);
          });
        }
      }

      // When an incoming linehaul is selected, add its incoming town counts
      // to the existing On-Floor town counts, including towns already assigned
      // to Delivery Areas/Town Groups.
      if (showIncomingOrdersOnFloor && Array.isArray(selectedIncomingLinehauls) && selectedIncomingLinehauls.length > 0) {
        const incomingCounts = getIncomingTownCounts();
        incomingCounts.forEach((count, town) => {
          const normalizedTown = parseTownValue(town);
          if (!normalizedTown) return;
          townCounts.set(normalizedTown, (townCounts.get(normalizedTown) || 0) + Number(count || 0));
        });
      }

      // Add operational Zone Settings towns to the same maps used by Delivery Area totals.
      if (lm?.filteredRows?.length && Array.isArray(lm.headers)) {
        const baseTowns = new Set();
        const ti = findTownColumn(lm.headers);
        if (ti >= 0) lm.filteredRows.forEach(row => { const t = parseTownValue(row[ti]); if (t) baseTowns.add(t); });
        baseTowns.forEach(baseTown => {
          getOperationalTownDefinitions(baseTown).forEach(def => {
            const stats = getOperationalTownStats(baseTown, def.area);
            townCounts.set(def.key, stats.count);
            // These orders are already counted once under the base town's raw
            // entry (from the per-row loop above) — subtract them there so a
            // split order is never summed twice when Total Volume adds up
            // every value in this map. Matches the remainder math already
            // used by On-Floor Towns (rawCount - splitSum).
            townCounts.set(baseTown, Math.max(0, (townCounts.get(baseTown) || 0) - stats.count));
          });
        });
      }
      updatePlanningSummary(townCounts);
      const townStatusMetrics = getLMStatusMetrics();
      // Synthetic status metrics for operational towns.
      if (lm?.filteredRows?.length && Array.isArray(lm.headers)) {
        const ti = findTownColumn(lm.headers);
        if (ti >= 0) new Set(lm.filteredRows.map(row => parseTownValue(row[ti])).filter(Boolean)).forEach(baseTown => {
          getOperationalTownDefinitions(baseTown).forEach(def => { townStatusMetrics.set(def.key, getOperationalTownStats(baseTown, def.area)); });
        });
      }

      // Zone Settings integration: when a town has been split into operational
      // delivery areas, render those areas as separate rows inside the town group.
      // The source Town and Zone ID values remain unchanged.
      const getZoneOperationalSplits = (town) => {
        try {
          const data = getZoneSettingsTownData(town);
          const areas = Array.isArray(data?.areas) ? data.areas : [];
          const assignments = data?.assignments && typeof data.assignments === 'object' ? data.assignments : {};
          if (!areas.length) return null;
          const lmData = NOL3.lmInventory;
          if (!lmData?.filteredRows?.length || !Array.isArray(lmData.headers)) return null;
          const headers = lmData.headers;
          const townIndex = findTownColumn(headers);
          const zoneIndex = findZoneIdColumn(headers);
          if (townIndex < 0 || zoneIndex < 0) return null;
          const statusIndex = headers.findIndex(h => String(h || '').trim().toLowerCase() === 'status');
          const exceptionSet = getPlanningExceptionSet();
          const businessMetrics = typeof getBusinessDayMetrics === 'function' ? getBusinessDayMetrics() : null;
          const identityIndex = typeof getBusinessIdentityIndex === 'function' ? getBusinessIdentityIndex(headers) : -1;
          const dueIds = businessMetrics?.dueIds instanceof Set ? businessMetrics.dueIds : null;
          const receivedIndex = businessMetrics?.receivedIndex ?? -1;
          const hasBusinessWindow = dueIds && receivedIndex >= 0;
          const stats = new Map(areas.map(area => [String(area), {count:0, received:0, delivering:0, delivered:0, hold:0}]));
          lmData.filteredRows.forEach((row, index) => {
            if (parseTownValue(row[townIndex]) !== town) return;
            if (rowMatchesPlanningException(row, headers, exceptionSet)) return;
            if (hasBusinessWindow) {
              const rawId = identityIndex >= 0 ? row[identityIndex] : '';
              const id = normalizeIncomingKey(rawId) || `__row_${index}`;
              if (!dueIds.has(id)) return;
            }
            const zone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim();
            const areaName = String(assignments[zone] || '');
            if (!areaName || !stats.has(areaName)) return;
            const item = stats.get(areaName);
            item.count += 1;
            const status = statusIndex >= 0 ? String(row[statusIndex] || '').trim().toLowerCase() : '';
            if (status.includes('deliver')) item.delivering += 1;
            else if (status.includes('received')) item.received += 1;
            if (status.includes('delivered')) { item.delivered += 1; item.delivering = Math.max(0, item.delivering - 1); }
            if (status.includes('hold')) item.hold += 1;
          });
          return stats;
        } catch (_) { return null; }
      };

      // Single source of truth: the same number a chip displays is what group/area totals add up.
      const _spCache = new Map(), _ccCache = new Map();
      const _splitFor = town => {
        if (_spCache.has(town)) return _spCache.get(town);
        let s = null;
        if (!parseOperationalTownKey(town)) {
          const x = getZoneOperationalSplits(town);
          if (x && [...x.values()].some(item => item.count > 0)) s = x;
        }
        _spCache.set(town, s); return s;
      };
      const chipCount = town => {
        if (_ccCache.has(town)) return _ccCache.get(town);
        const s = _splitFor(town);
        const v = s ? [...s.values()].reduce((n, item) => n + item.count, 0) : Number(townCounts.get(town) || 0);
        _ccCache.set(town, v); return v;
      };
      const chipStatus = town => {
        const z = {received:0,delivering:0,delivered:0,hold:0};
        const s = _splitFor(town);
        if (!s) return townStatusMetrics.get(town) || z;
        s.forEach(item => { z.received += item.received; z.delivering += item.delivering; z.delivered += item.delivered; z.hold += item.hold; });
        return z;
      };
      NOL3.deliveryAreas.forEach(area => {
        const groups = ensureAreaGroups(area);
        const totalTowns = groups.reduce((sum, group) => sum + group.towns.length, 0);
        // Total parcel count for every town assigned to this Delivery Area.
        // This uses the same townCounts map that drives the individual town/group totals,
        // so the Delivery Area total follows the existing Planning calculations.
        const totalAreaVolume = groups.reduce((sum, group) =>
          sum + group.towns.reduce((townSum, town) => townSum + chipCount(town), 0), 0);
        const section = document.createElement('div');
        section.className = 'delivery-area-group';
        section.dataset.areaId = area.id;
        section.innerHTML = `
          <div class="delivery-area-group-header" role="button" tabindex="0" aria-expanded="true">
            <div>
              <div class="delivery-area-group-title">${NOL3.escapeHTML(area.title)}</div>
              <div class="delivery-area-group-count">${totalTowns.toLocaleString()} town${totalTowns === 1 ? '' : 's'} · ${groups.length} group${groups.length === 1 ? '' : 's'} · ${totalAreaVolume.toLocaleString()} orders</div>
            </div>
            <button class="delivery-area-remove" type="button" title="Remove delivery area" aria-label="Remove delivery area">×</button>
          </div>
          <div class="town-groups">
            ${groups.map(group => `
              <div class="town-group" data-group-id="${group.id}">
                <div class="town-group-header">
                  <div class="town-group-rider-picker" data-area-id="${area.id}" data-group-id="${group.id}">
                    <button class="town-group-rider-button" type="button" aria-haspopup="true" aria-expanded="false">Assign Riders</button>
                    <div class="town-group-rider-menu" role="menu"></div>
                  </div>
                  <div class="town-group-metrics">
                    <span class="town-group-fp" title="Fleet Productivity">FP —</span>
  <span class="town-group-sr" data-area-id="${area.id}" data-group-id="${group.id}" title="Group Success Rate">SR ${formatSuccessRate(group.towns.reduce((acc, town) => { const m = chipStatus(town); acc.received += m.received; acc.delivering += m.delivering; acc.delivered += m.delivered; acc.hold += m.hold; return acc; }, {received:0,delivering:0,delivered:0,hold:0}))}%</span>
                    <span class="town-group-total" data-area-id="${area.id}" data-group-id="${group.id}" title="${group.towns.map(t => chipCount(t)).join(' + ') || 0}">${group.towns.reduce((sum, town) => sum + chipCount(town), 0).toLocaleString()}</span>
                    <button class="town-group-delete" type="button" data-area-id="${area.id}" data-group-id="${group.id}" title="Delete town group" aria-label="Delete ${NOL3.escapeHTML(group.title)}">×</button>
                  </div>
                </div>
                <div class="town-group-dropzone" data-area-id="${area.id}" data-group-id="${group.id}">
                  ${group.towns.length ? group.towns.map(town => {
                    const operational = parseOperationalTownKey(town);
                    if (operational) {
                      const stats = getOperationalTownStats(operational.town, operational.area);
                      const m = stats;
                      return `
                        <div class="town-chip" draggable="true" data-town="${NOL3.escapeHTML(town)}" title="${NOL3.escapeHTML(operational.town)} — ${NOL3.escapeHTML(operational.area)}">
                          <button class="town-zone-toggle" type="button" aria-expanded="false" aria-label="Show Zone IDs for ${NOL3.escapeHTML(operational.town)} in ${NOL3.escapeHTML(operational.area)}">▸</button>
                          <span class="town-chip-name">${NOL3.escapeHTML(operational.town)}</span>
                          <span class="town-chip-statuses">
                            <span class="town-status-badge received" title="Received">R ${m.received.toLocaleString()}</span>
                            <span class="town-status-badge delivering" title="Delivering">D ${m.delivering.toLocaleString()}</span>
                            <span class="town-status-badge delivered" title="Delivered">DV ${m.delivered.toLocaleString()}</span>
                            <span class="town-status-badge hold" title="On Hold">H ${m.hold.toLocaleString()}</span>
                            <span class="town-status-badge success-rate" title="Success Rate">SR ${formatSuccessRate(m)}%</span>
                          </span>
                          <span class="town-chip-count">${m.count.toLocaleString()}</span>
                        </div>`;
                    }
                    const splitStats = getZoneOperationalSplits(town);
                    if (splitStats && [...splitStats.values()].some(item => item.count > 0)) {
                      const totalSplit = [...splitStats.values()].reduce((sum, item) => sum + item.count, 0);
                      const splitRows = [...splitStats.entries()].filter(([,item]) => item.count > 0).map(([areaName,item]) => `
                        <div class="zone-operational-row" data-parent-town="${NOL3.escapeHTML(town)}">
                          <span class="zone-operational-name">${NOL3.escapeHTML(areaName)}</span>
                          <span class="town-chip-statuses">
                            <span class="town-status-badge received" title="Received">R ${item.received.toLocaleString()}</span>
                            <span class="town-status-badge delivering" title="Delivering">D ${item.delivering.toLocaleString()}</span>
                            <span class="town-status-badge delivered" title="Delivered">DV ${item.delivered.toLocaleString()}</span>
                            <span class="town-status-badge hold" title="On Hold">H ${item.hold.toLocaleString()}</span>
                            <span class="town-status-badge success-rate" title="Success Rate">SR ${formatSuccessRate(item)}%</span>
                          </span>
                          <span class="town-chip-count">${item.count.toLocaleString()}</span>
                        </div>`).join('');
                      return `
                        <div class="town-chip town-chip-split-parent" draggable="true" data-town="${NOL3.escapeHTML(town)}" title="${NOL3.escapeHTML(town)}">
                          <button class="town-zone-toggle" type="button" aria-expanded="false" aria-label="Show Zone IDs for ${NOL3.escapeHTML(town)}">▸</button>
                          <span class="town-chip-name">${NOL3.escapeHTML(town)}</span>
                          <span class="town-chip-count">${totalSplit.toLocaleString()}</span>
                        </div>
                        <div class="zone-operational-splits" data-town="${NOL3.escapeHTML(town)}">${splitRows}</div>`;
                    }
                    return `
                      <div class="town-chip" draggable="true" data-town="${NOL3.escapeHTML(town)}" title="${NOL3.escapeHTML(town)}">
                        <button class="town-zone-toggle" type="button" aria-expanded="false" aria-label="Show Zone IDs for ${NOL3.escapeHTML(town)}">▸</button>
                        <span class="town-chip-name">${NOL3.escapeHTML(town)}</span>
                        <span class="town-chip-statuses">
                          <span class="town-status-badge received" title="Received">R ${((townStatusMetrics.get(town) || {}).received || 0).toLocaleString()}</span>
                          <span class="town-status-badge delivering" title="Delivering">D ${((townStatusMetrics.get(town) || {}).delivering || 0).toLocaleString()}</span>
                          <span class="town-status-badge delivered" title="Delivered">DV ${((townStatusMetrics.get(town) || {}).delivered || 0).toLocaleString()}</span>
                          <span class="town-status-badge hold" title="On Hold">H ${((townStatusMetrics.get(town) || {}).hold || 0).toLocaleString()}</span>
                          <span class="town-status-badge success-rate" title="Success Rate">SR ${formatSuccessRate(townStatusMetrics.get(town) || {received:0,delivering:0,delivered:0,hold:0})}%</span>
                        </span>
                        <span class="town-chip-count">${(townCounts.get(town) || 0).toLocaleString()}</span>
                      </div>`;
                  }).join('') : '<div class="delivery-area-empty">Drag towns here</div>'}
                </div>
              </div>
            `).join('')}
            <div class="new-town-group-tile" data-area-id="${area.id}" aria-label="Drop a town here to create a new town group">
              <div>
                <div class="new-town-group-title">NEW TOWN GROUP</div>
              </div>
            </div>
          </div>
        `;
        const areaHeader = section.querySelector('.delivery-area-group-header');
        const areaRemove = section.querySelector('.delivery-area-remove');
        if (area.collapsed) {
          section.classList.add('collapsed');
        }
        areaHeader.setAttribute('aria-expanded', area.collapsed ? 'false' : 'true');
        const toggleDeliveryArea = () => {
          const collapsed = section.classList.toggle('collapsed');
          area.collapsed = collapsed;
          areaHeader.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
          savePlanningLayout();
        };
        areaHeader.addEventListener('click', (event) => {
          if (event.target.closest('.delivery-area-remove')) return;
          toggleDeliveryArea();
        });
        areaHeader.addEventListener('keydown', (event) => {
          if (event.target.closest('.delivery-area-remove')) return;
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggleDeliveryArea();
          }
        });
        areaRemove.addEventListener('click', (event) => {
          event.stopPropagation();
          openRemoveDeliveryAreaModal(area.id, area.title);
        });
        groupsRoot.appendChild(section);
      });

      groupsRoot.querySelectorAll('.town-zone-toggle').forEach(button => {
        button.addEventListener('click', event => {
          event.preventDefault();
          event.stopPropagation();
          const chip = button.closest('.town-chip');
          const root = chip?.closest('.town-group-dropzone');
          const wasOpen = chip?.classList.contains('zone-open');
          root?.querySelectorAll('.town-chip.zone-open').forEach(other => {
            other.classList.remove('zone-open');
            other.querySelector('.town-zone-breakdown')?.remove();
            const otherButton = other.querySelector('.town-zone-toggle');
            otherButton?.setAttribute('aria-expanded','false');
            if (otherButton) otherButton.textContent = '▸';
          });
          if (!wasOpen && chip) {
            chip.classList.add('zone-open');
            const parsedChipTown = parseOperationalTownKey(chip.dataset.town || '');
            chip.insertAdjacentHTML('beforeend', parsedChipTown ? renderOperationalTownZoneBreakdown(parsedChipTown.town, parsedChipTown.area) : renderTownZoneBreakdown(chip.dataset.town || ''));
            if (!parsedChipTown) bindZoneRowDragging(chip); // only plain (non-split) towns support zone-transfer dragging
            button.setAttribute('aria-expanded','true');
            button.textContent = '▾';
          }
        });
      });

      const activeRiders = getActiveRidersForPlanning();
      const riderById = new Map(activeRiders.map(rider => [String(rider.id), rider]));

      // Keep rider assignment unique across all Town Groups. If older saved
      // data contains a duplicate, keep the first occurrence and remove the
      // duplicate everywhere else. This prevents a rider from reappearing in
      // another group after being removed from the current group.
      const normalizeRiderAssignments = () => {
        const seen = new Set();
        NOL3.deliveryAreas.forEach(areaItem => {
          ensureAreaGroups(areaItem).forEach(groupItem => {
            const ids = Array.isArray(groupItem.assignedRiders) ? groupItem.assignedRiders.map(String) : [];
            groupItem.assignedRiders = ids.filter(id => {
              if (seen.has(id)) return false;
              seen.add(id);
              return true;
            });
          });
        });
      };
      normalizeRiderAssignments();

      const getRiderOwnerLabel = (riderId, areaId, groupId) => {
        for (const ai of NOL3.deliveryAreas) {
          const gs = ensureAreaGroups(ai);
          for (let gi = 0; gi < gs.length; gi++) {
            if (ai.id === areaId && gs[gi].id === groupId) continue;
            if ((gs[gi].assignedRiders || []).map(String).includes(String(riderId))) return `${ai.title} · Group ${gi + 1}`;
          }
        }
        return '';
      };

      const getAssignedElsewhere = (areaId, groupId) => {
        const assigned = new Set();
        NOL3.deliveryAreas.forEach(areaItem => {
          ensureAreaGroups(areaItem).forEach(groupItem => {
            if (areaItem.id === areaId && groupItem.id === groupId) return;
            (Array.isArray(groupItem.assignedRiders) ? groupItem.assignedRiders : []).forEach(id => assigned.add(String(id)));
          });
        });
        return assigned;
      };

      const updateRiderButton = (button, group) => {
        const ids = Array.isArray(group.assignedRiders) ? group.assignedRiders.map(String) : [];
        const assigned = ids.map(id => riderById.get(id)).filter(Boolean)
          .sort((a, b) => String(a.name || a.id).localeCompare(String(b.name || b.id)));
        const groupTotal = group.towns.reduce((sum, town) => sum + chipCount(town), 0);
        const groupStatus = group.towns.reduce((acc, town) => {
          const m = chipStatus(town);
          acc.received += m.received; acc.delivering += m.delivering; acc.delivered += m.delivered; acc.hold += m.hold;
          return acc;
        }, {received:0,delivering:0,delivered:0,hold:0});
        button.textContent = assigned.length ? `Assign Riders (${assigned.length})` : 'Assign Riders';
        button.title = assigned.map(r => r.name || r.id).join('\n') || 'Assign Riders';
        const pk = button.closest('.town-group-rider-picker');
        let chipsEl = pk.querySelector('.town-group-rider-chips');
        if (!chipsEl) { chipsEl = document.createElement('div'); chipsEl.className = 'town-group-rider-chips'; pk.insertBefore(chipsEl, button); }
        NOL3._riderChipsOpen = NOL3._riderChipsOpen || new Set();
        const chipsOpen = NOL3._riderChipsOpen.has(group.id);
        const CHIP_LIMIT = 2;
        const shownRiders = chipsOpen ? assigned : assigned.slice(0, CHIP_LIMIT);
        chipsEl.classList.toggle('open', chipsOpen);
        chipsEl.innerHTML = shownRiders.map(r => `<span class="rider-chip" title="${NOL3.escapeHTML(r.name || r.id)}"><span class="rider-chip-name">${NOL3.escapeHTML(r.name || r.id)}</span><button type="button" class="rider-chip-x" data-rider-id="${NOL3.escapeHTML(r.id)}" aria-label="Unassign ${NOL3.escapeHTML(r.name || r.id)}" title="Unassign">×</button></span>`).join('')
          + (assigned.length > CHIP_LIMIT ? `<button type="button" class="rider-chip-more">${chipsOpen ? 'Show less' : '+' + (assigned.length - CHIP_LIMIT) + ' more'}</button>` : '');
        chipsEl.querySelector('.rider-chip-more')?.addEventListener('click', ev => {
          ev.preventDefault(); ev.stopPropagation();
          if (chipsOpen) NOL3._riderChipsOpen.delete(group.id); else NOL3._riderChipsOpen.add(group.id);
          updateRiderButton(button, group);
        });
        chipsEl.querySelectorAll('.rider-chip-x').forEach(x => x.addEventListener('click', ev => {
          ev.preventDefault(); ev.stopPropagation();
          group.assignedRiders = (group.assignedRiders || []).map(String).filter(id => id !== String(x.dataset.riderId));
          savePlanningLayout();
          renderDeliveryAreas();
        }));
        const picker = button.closest('.town-group-rider-picker');
        const totalEl = picker?.parentElement?.querySelector('.town-group-total');
        if (totalEl) totalEl.textContent = groupTotal.toLocaleString();
        const srEl = picker?.parentElement?.querySelector('.town-group-sr');
        if (srEl) srEl.textContent = `SR ${formatSuccessRate(groupStatus)}%`;
  const fpEl = picker?.parentElement?.querySelector('.town-group-fp');
  if (fpEl) {
    const fpTarget = Number(getFleetProductivityTarget()) || 0;
    const assignedCount = assigned.length;
    const actualFp = assignedCount > 0 ? groupTotal / assignedCount : 0;
    const fpValue = fpTarget > 0 ? (actualFp / fpTarget) * 100 : 0;
    fpEl.textContent = `FP ${fpValue.toLocaleString(undefined, {maximumFractionDigits: 1})}%`;
  }
      };

      const renderRiderPicker = (picker, searchValue = '') => {
        const areaId = picker.dataset.areaId || '';
        const groupId = picker.dataset.groupId || '';
        const group = NOL3.deliveryAreas.find(area => area.id === areaId)?.groups?.find(item => item.id === groupId);
        if (!group) return;
        group.assignedRiders = Array.isArray(group.assignedRiders) ? group.assignedRiders.map(String) : [];
        const button = picker.querySelector('.town-group-rider-button');
        const menu = picker.querySelector('.town-group-rider-menu');
        if (!button || !menu) return;

        updateRiderButton(button, group);
        const assignedToOtherGroups = getAssignedElsewhere(areaId, groupId);
        const availableRiders = activeRiders.slice().sort((a, b) => String(a.name || a.id).localeCompare(String(b.name || b.id)));

        menu.innerHTML = `
          <input class="town-group-rider-search" type="search" placeholder="Search rider name..." value="${NOL3.escapeHTML(searchValue)}" autocomplete="off">
          <div class="rider-bulk"><button type="button" class="rider-bulk-all">Select all visible</button><button type="button" class="rider-bulk-none">Clear all</button></div>
          <div class="town-group-rider-options">
            ${availableRiders.length ? availableRiders.map(rider => {
              const checked = group.assignedRiders.includes(String(rider.id));

    const renderParcelRecords = () => {
      const container = document.getElementById("parcelRecordsContainer");
      const summary = document.getElementById("parcelRecordsSummary");
      const search = document.getElementById("parcelRecordsSearch");
      if (!container) return;

      const hub = String(getSelectedHub() || "").trim();
      const { start: dayStart, end: dayEnd, businessDate } = typeof getBusinessWindow === 'function'
        ? getBusinessWindow(new Date(), getHubBusinessDaySettings())
        : { start:null, end:null, businessDate:getBusinessDateValue?.() || "" };
      const query = String(search?.value || '').trim().toLowerCase();
      const filterIds = ['parcelFilterTown','parcelFilterZone','parcelFilterStatus','parcelFilterCurrent','parcelFilterDestination'];
      // Filter selections are stored as JSON arrays in hidden inputs. Always parse
      // them before using them for cross-filter counts; otherwise a selection such
      // as ["Badoc Hub"] is treated as one literal string and makes every other
      // filter show 0.
      const parseParcelFilterValue = (id) => {
        const raw = String(document.getElementById(id)?.value || '');
        if (!raw) return [];
        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed.map(v => String(v)) : [String(parsed)];
        } catch (_) {
          return [raw];
        }
      };
      const filterValues = Object.fromEntries(filterIds.map(id => [id, parseParcelFilterValue(id)]));
      const exceptionSet = getPlanningExceptionSet();
      const recordsById = new Map();

      const addDataset = (dataset, sourceName) => {
        if (!dataset || !Array.isArray(dataset.rows) || !Array.isArray(dataset.headers)) return;
        const headers = dataset.headers;
        const normalized = headers.map(h => String(h ?? '').replace(/^\uFEFF/, '').trim().toLowerCase());
        const idx = name => normalized.indexOf(name);
        const orderIndex = findIncomingHeaderIndex(headers, ["Order ID","Order Id","OrderID","SPX TN","SPX Tracking Number","SLS TN","SLS Tracking Number","Tracking Number","Tracking No","Tracking ID"]);
        const statusIndex = findIncomingHeaderIndex(headers, ["SPX Status","Status","Parcel Status","Order Status"]);
        const townIndex = findTownColumn(headers);
        const zoneIndex = findIncomingHeaderIndex(headers, ["Zone ID","Zone Id","ZoneID","Zone"]);
        const currentIndex = findIncomingHeaderIndex(headers, ["Current Station"]);
        const destinationIndex = findIncomingHeaderIndex(headers, ["Destination Station"]);
        const currentStationReceivedIndex = findIncomingHeaderIndex(headers, ["Current Station Received Time"]);
        const receivedIndex = currentStationReceivedIndex >= 0
          ? currentStationReceivedIndex
          : findBusinessTimestampIndex(headers, businessTimestampCandidates.received);
        const pickedIndex = findBusinessTimestampIndex(headers, businessTimestampCandidates.pickedUp);
        const identityIndex = getBusinessIdentityIndex(headers);
        if (orderIndex < 0) return;

        dataset.rows.forEach((row, i) => {
          if (rowMatchesPlanningException(row, headers, exceptionSet)) return;
          const idRaw = row[orderIndex] ?? (identityIndex >= 0 ? row[identityIndex] : '');
          const id = normalizeIncomingKey(idRaw);
          if (!id) return;

          const current = currentIndex >= 0 ? String(row[currentIndex] ?? '').trim() : '';
          const destination = destinationIndex >= 0 ? String(row[destinationIndex] ?? '').trim() : '';

          // LM uses the already hub-filtered rows. Incoming Inventory is inbound to
          // the selected hub, so its Destination Station is the hub filter.
          if (sourceName === 'incoming' && hub && destination.toLowerCase() !== hub.toLowerCase()) return;
          if (sourceName === 'lm' && hub && current.toLowerCase() !== hub.toLowerCase()) return;

          const receivedAt = receivedIndex >= 0 ? parseBusinessTimestamp(row[receivedIndex]) : null;
          const pickedAt = pickedIndex >= 0 ? parseBusinessTimestamp(row[pickedIndex]) : null;

          // Business Date controls Parcel Records. Keep records whose operational
          // received timestamp falls in the selected business-day window. For LM,
          // also retain carried-over parcels that were not picked up before the day.
          if (dayStart && dayEnd && receivedAt) {
            const inWindow = receivedAt.getTime() >= dayStart.getTime() && receivedAt.getTime() < dayEnd.getTime();
            const carriedOver = receivedAt.getTime() < dayStart.getTime() && (!pickedAt || pickedAt.getTime() < dayStart.getTime());
            if (!inWindow && !carriedOver) return;
          } else if (dayStart && dayEnd && !receivedAt) {
            return;
          }

          const status = statusIndex >= 0 ? String(row[statusIndex] ?? '').trim() : '';
          const town = townIndex >= 0 ? String(row[townIndex] ?? '').trim() : '';
          const zone = zoneIndex >= 0 ? String(row[zoneIndex] ?? '').trim() : '';
          const currentStationReceivedTime = currentStationReceivedIndex >= 0
            ? String(row[currentStationReceivedIndex] ?? '').trim()
            : (receivedIndex >= 0 ? String(row[receivedIndex] ?? '').trim() : '');
          const timestamp = Math.max(receivedAt?.getTime() || 0, pickedAt?.getTime() || 0);
          const values = [
            idRaw,
            town,
            zone,
            status,
            currentStationReceivedTime,
            current,
            destination
          ].map(v => String(v ?? '').trim());

          const existing = recordsById.get(id);
          if (!existing || timestamp >= existing.timestamp) recordsById.set(id, { values, timestamp });
        });
      };

      // Read both parcel sources. LM is already filtered by the selected hub;
      // Incoming Inventory is filtered here by its Destination Station.
      addDataset(NOL3.lmInventory, 'lm');
      addDataset(NOL3.incomingInventory, 'incoming');

      const escFilter = value => String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');
      const allRecords = [...recordsById.values()].map(x => x.values);
      const optionSets = [
        ['parcelFilterTown', 1, 'All Towns'],
        ['parcelFilterZone', 2, 'All Zone IDs'],

      const triggerLeft = rect.left / zoom;
      const triggerTop = rect.top / zoom;
      const triggerBottom = rect.bottom / zoom;
