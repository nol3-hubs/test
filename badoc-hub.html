      const areaList = document.getElementById('zoneSettingsAreaList');
      const preview = document.getElementById('zoneSettingsPreview');
      if (!townSelect || !zoneList || !areaList) return;
      const lm = NOL3.lmInventory;
      const currentTown = townSelect.value;
      const towns = new Set();
      if (lm?.filteredRows?.length && Array.isArray(lm.headers)) {
        const townIndex = findTownColumn(lm.headers);
        if (townIndex >= 0) lm.filteredRows.forEach(row => { const t=parseTownValue(row[townIndex]); if(t) towns.add(t); });
      }
      const sortedTowns = [...towns].sort((a,b)=>a.localeCompare(b));
      townSelect.innerHTML = sortedTowns.length
        ? sortedTowns.map(t=>`<option value="${NOL3.escapeHTML(t)}">${NOL3.escapeHTML(t)}</option>`).join('')
        : `<option value="">No towns available</option>`;
      if (sortedTowns.includes(currentTown)) {
        townSelect.value = currentTown;
      } else {
        townSelect.value = '';
      }
      setupZoneTownDropdown();
      syncZoneSettingsAreaInput();
      const town = townSelect.value;
      if (!town) {
        zoneList.innerHTML='<div class="zone-settings-empty">Upload LM Inventory to see Zone IDs.</div>';
        areaList.innerHTML='<div class="zone-settings-empty">Create a delivery area to begin.</div>';
        if (preview) preview.innerHTML='';
        if (zoneSummary) zoneSummary.textContent='0 zones';
        return;
      }
      const rows = getZoneSettingsRows(town);
      const townData = getZoneSettingsTownData(town);
      const areas = Array.isArray(townData.areas) ? townData.areas : [];
      const assignments = townData.assignments && typeof townData.assignments === 'object' ? townData.assignments : {};
      if (zoneSummary) zoneSummary.textContent = `${rows.length.toLocaleString()} zone${rows.length===1?'':'s'} · ${rows.reduce((n,[,c])=>n+c,0).toLocaleString()} orders`;
      zoneList.innerHTML = rows.length ? rows.map(([zone,count]) => {
        const selected = assignments[zone] || '';
        return `<div class="zone-settings-zone-row"><div class="zone-settings-zone" title="${NOL3.escapeHTML(zone)}">${NOL3.escapeHTML(zone)}</div><div class="zone-settings-zone-count">${count.toLocaleString()}</div><select class="zone-settings-select zone-settings-assignment" data-zone-id="${NOL3.escapeHTML(zone)}"><option value="">Unassigned</option>${areas.map(a=>`<option value="${NOL3.escapeHTML(a)}" ${selected===a?'selected':''}>${NOL3.escapeHTML(a)}</option>`).join('')}</select></div>`;
      }).join('') : '<div class="zone-settings-empty">No Zone IDs found for this town.</div>';
      /* ZONE IDS ONLY: rebuilt custom dropdown. The native select remains the
         source of truth for the existing assignment/save logic. */
      const upgradeZoneAssignmentDropdowns = () => {
        document.querySelectorAll('.zone-id-rebuilt-menu').forEach(m => m.remove());
        document.querySelectorAll('.zone-id-rebuilt-wrap').forEach(w => {
          const sel=w.querySelector('select.zone-settings-assignment');
          if(sel) w.parentNode.insertBefore(sel,w);
          w.remove();
        });

        const closeAll = () => {
          document.querySelectorAll('.zone-id-rebuilt-menu.is-open').forEach(m => {
            m.classList.remove('is-open');
            m.style.display='none';
          });
          document.querySelectorAll('.zone-id-rebuilt-wrap.is-open').forEach(w => w.classList.remove('is-open'));
        };

        zoneList.querySelectorAll('select.zone-settings-assignment').forEach(select => {
          const wrap=document.createElement('div');
          wrap.className='zone-id-rebuilt-wrap';
          const parent=select.parentNode;
          parent.insertBefore(wrap,select);
          wrap.appendChild(select);
          select.classList.add('zone-id-rebuilt-native');

          const trigger=document.createElement('button');
          trigger.type='button';
          trigger.className='zone-id-rebuilt-trigger';
          trigger.setAttribute('aria-haspopup','listbox');
          trigger.setAttribute('aria-expanded','false');

          const menu=document.createElement('div');
          menu.className='zone-id-rebuilt-menu';
          menu.setAttribute('role','listbox');
          const search=document.createElement('input');
          search.type='search';
          search.className='zone-id-rebuilt-search';
          search.placeholder='Search delivery area';
          search.autocomplete='off';
          const list=document.createElement('div');
          list.className='zone-id-rebuilt-list';
          menu.append(search,list);
          document.body.appendChild(menu);

          function syncTrigger(){
            trigger.textContent=select.options[select.selectedIndex]?.textContent?.trim() || 'Unassigned';
            const arrow=document.createElement('span');
            arrow.className='zone-id-rebuilt-arrow';
            arrow.textContent='⌄';
            trigger.appendChild(arrow);
          }
          function position(){
            const r=trigger.getBoundingClientRect();
            // The dashboard uses html{zoom:80%}. Fixed-position coordinates need
            // to be converted back to the page's unzoomed CSS coordinate space.
            const zoom = Math.max(0.01, parseFloat(getComputedStyle(document.documentElement).zoom) || 1);
            menu.style.left=Math.round(r.left / zoom)+'px';
            menu.style.top=Math.round((r.bottom + 5) / zoom)+'px';
            menu.style.width=Math.round(r.width / zoom)+'px';
          }
          function renderOptions(){
            const q=String(search.value||'').trim().toLowerCase();
            list.innerHTML='';
            [...select.options].filter(o=>!q || o.textContent.toLowerCase().includes(q)).forEach(opt=>{
              const b=document.createElement('button');
              b.type='button';
              b.className='zone-id-rebuilt-option'+(opt.value===select.value?' selected':'');
              b.setAttribute('role','option');
              b.setAttribute('aria-selected',opt.value===select.value?'true':'false');
              const radio=document.createElement('span'); radio.className='zone-id-rebuilt-radio';
              const label=document.createElement('span'); label.textContent=opt.textContent.trim();
              b.append(radio,label);
              b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();});
              b.addEventListener('click',e=>{
                e.preventDefault(); e.stopPropagation();
                select.value=opt.value;
                closeAll();
                select.dispatchEvent(new Event('change',{bubbles:true}));
              });
              list.appendChild(b);
            });
            if(!list.children.length){
              const empty=document.createElement('div'); empty.className='zone-id-rebuilt-empty'; empty.textContent='No matching delivery areas'; list.appendChild(empty);
            }
          }
          function open(){
            closeAll();
            wrap.classList.add('is-open');
            menu.classList.add('is-open');
            menu.style.display='block';
            trigger.setAttribute('aria-expanded','true');
            search.value='';
            renderOptions();
            position();
            requestAnimationFrame(()=>{position(); search.focus({preventScroll:true});});
          }
          window.addEventListener('resize',()=>{ if(menu.classList.contains('is-open')) position(); }, {passive:true});
          window.addEventListener('scroll',()=>{ if(menu.classList.contains('is-open')) position(); }, {passive:true});

          trigger.addEventListener('click',e=>{
            e.preventDefault(); e.stopPropagation();
            if(menu.classList.contains('is-open')) closeAll(); else open();
          });
          menu.addEventListener('click',e=>e.stopPropagation());
          search.addEventListener('click',e=>e.stopPropagation());
          search.addEventListener('input',renderOptions);
          search.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeAll();trigger.focus();}});
          select.addEventListener('change',syncTrigger);
          syncTrigger();

          const reposition=()=>{if(menu.classList.contains('is-open')) position();};
          window.addEventListener('resize',reposition,{passive:true});
          window.addEventListener('scroll',reposition,true);
          trigger._zoneIdRebuiltCleanup=()=>{window.removeEventListener('resize',reposition);window.removeEventListener('scroll',reposition,true);menu.remove();};
          wrap.appendChild(trigger);
        });

        if(!window.__zoneIdsRebuiltOutsideBound){
          window.__zoneIdsRebuiltOutsideBound=true;
          document.addEventListener('pointerdown',e=>{
            if(e.target.closest?.('.zone-id-rebuilt-trigger,.zone-id-rebuilt-menu')) return;
            document.querySelectorAll('.zone-id-rebuilt-menu.is-open').forEach(m=>{m.classList.remove('is-open');m.style.display='none';});
            document.querySelectorAll('.zone-id-rebuilt-wrap.is-open').forEach(w=>w.classList.remove('is-open'));
          },true);
          document.addEventListener('keydown',e=>{
            if(e.key!=='Escape') return;
            document.querySelectorAll('.zone-id-rebuilt-menu.is-open').forEach(m=>{m.classList.remove('is-open');m.style.display='none';});
            document.querySelectorAll('.zone-id-rebuilt-wrap.is-open').forEach(w=>w.classList.remove('is-open'));
          },true);
        }
      };
      upgradeZoneAssignmentDropdowns();

      // Show ALL saved delivery areas for this hub, not only the currently selected town.
      // This lets the user see the areas they already created while switching between towns.
      const hubData = getZoneSettingsHubStore().data || {};
      const savedAreaEntries = [];
      Object.entries(hubData).forEach(([savedTown, townData]) => {
        if (!townData || typeof townData !== 'object' || !Array.isArray(townData.areas)) return;
        const savedAssignments = townData.assignments && typeof townData.assignments === 'object' ? townData.assignments : {};
        const savedRows = getZoneSettingsRows(savedTown);
        townData.areas.forEach(area => {
          const count = savedRows.filter(([zone])=>savedAssignments[zone]===area).reduce((n,[,c])=>n+c,0);
          savedAreaEntries.push({ town: savedTown, area, count });
        });
      });
      savedAreaEntries.sort((a,b) => a.town.localeCompare(b.town) || a.area.localeCompare(b.area));
      areaList.innerHTML = savedAreaEntries.length ? savedAreaEntries.map(({town: savedTown, area, count}) => {
        return `<div class="zone-settings-area-row"><div><span class="zone-settings-area-name">${NOL3.escapeHTML(area)}</span><div class="zone-settings-muted" style="margin-top:3px">${NOL3.escapeHTML(savedTown)}</div></div><div class="zone-settings-area-actions"><span class="zone-settings-area-count">${count.toLocaleString()}</span><button type="button" class="zone-settings-delete" data-zone-area-delete="${NOL3.escapeHTML(area)}" data-zone-area-town="${NOL3.escapeHTML(savedTown)}">Delete</button></div></div>`;
      }).join('') : '<div class="zone-settings-empty">No delivery areas added for this hub yet.</div>';
      if (preview) {
        const grouped = areas.map(area => ({area,zones:rows.filter(([zone])=>assignments[zone]===area)})).filter(g=>g.zones.length);
        preview.innerHTML = grouped.length ? `<div class="zone-settings-card-head"><h4>Preview</h4><span class="zone-settings-muted">${town}</span></div>${grouped.map(g=>`<div class="zone-settings-preview-group"><div class="zone-settings-preview-title"><span>${NOL3.escapeHTML(g.area)}</span><span>${g.zones.reduce((n,[,c])=>n+c,0).toLocaleString()}</span></div>${g.zones.map(([z,c])=>`<div class="zone-settings-preview-zone"><span>${NOL3.escapeHTML(z)}</span><strong>${c.toLocaleString()}</strong></div>`).join('')}</div>`).join('')}` : '';
      }
    };
    // Keep the saved delivery areas visible whenever Zone Settings is rendered.
    const getSavedDeliveryAreasForTown = (town) => {
      const { data } = getZoneSettingsHubStore();
      const townData = data && data[town] && typeof data[town] === 'object' ? data[town] : null;
      return townData && Array.isArray(townData.areas) ? townData.areas.filter(Boolean) : [];
    };

    const notifyZoneSettingsChanged = () => {
      window.dispatchEvent(new CustomEvent("zonesettingschanged", { detail: { hub: getSelectedHub() } }));
    };

    const saveZoneSettingAssignment = (town, zone, area) => {
      const { store, hub, data } = getZoneSettingsHubStore();
      data[town] = data[town] && typeof data[town] === 'object' ? data[town] : { areas: [], assignments: {} };
      data[town].areas = Array.isArray(data[town].areas) ? data[town].areas : [];
      data[town].assignments = data[town].assignments && typeof data[town].assignments === 'object' ? data[town].assignments : {};
      if (area) data[town].assignments[zone] = area; else delete data[town].assignments[zone];
      store[hub] = data;
      if (saveZoneSettingsStore(store)) notifyZoneSettingsChanged();
    };
    document.getElementById('zoneSettingsTown')?.addEventListener('change', renderZoneSettings);
    document.getElementById('zoneSettingsAddArea')?.addEventListener('click', () => {
      const town = document.getElementById('zoneSettingsTown')?.value || '';
      const input = document.getElementById('zoneSettingsAreaName');
      const area = String(input?.value || '').trim();
      if (!town || !area) { input?.focus(); return; }
      const { store, hub, data } = getZoneSettingsHubStore();
      data[town] = data[town] && typeof data[town] === 'object' ? data[town] : { areas: [], assignments: {} };
      data[town].areas = Array.isArray(data[town].areas) ? data[town].areas : [];
      if (!data[town].areas.some(a=>String(a).toLowerCase()===area.toLowerCase())) data[town].areas.push(area);
      store[hub] = data;
      if (saveZoneSettingsStore(store)) { input.value=''; renderZoneSettings(); notifyZoneSettingsChanged(); }
    });
    document.getElementById('zoneSettingsAreaName')?.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();document.getElementById('zoneSettingsAddArea')?.click();} });
    root.addEventListener('click', event => {
      const btn = event.target.closest?.('[data-zone-area-delete]');
      if (!btn) return;
      const town = btn.getAttribute('data-zone-area-town') || document.getElementById('zoneSettingsTown')?.value || '';
      const area = btn.getAttribute('data-zone-area-delete') || '';
      if (!town || !area) return;
      const confirmed = window.confirm(`Delete delivery area \"${area}\"?Zone assignments under this area will become Unassigned.`);
      if (!confirmed) return;
      const { store, hub, data } = getZoneSettingsHubStore();
      data[town] = data[town] && typeof data[town] === 'object' ? data[town] : { areas: [], assignments: {} };
      data[town].areas = Array.isArray(data[town].areas) ? data[town].areas : [];
      data[town].assignments = data[town].assignments && typeof data[town].assignments === 'object' ? data[town].assignments : {};
      data[town].areas = data[town].areas.filter(a => String(a) !== String(area));
      Object.keys(data[town].assignments).forEach(zone => { if (String(data[town].assignments[zone]) === String(area)) delete data[town].assignments[zone]; });
      store[hub] = data;
      if (saveZoneSettingsStore(store)) { renderZoneSettings(); notifyZoneSettingsChanged(); }
    });
    root.addEventListener('change', event => {
      const select = event.target.closest?.('.zone-settings-assignment');
      if (!select) return;
      const town = document.getElementById('zoneSettingsTown')?.value || '';
      saveZoneSettingAssignment(town, select.dataset.zoneId || '', select.value || '');
      renderZoneSettings();
    });
    // Expose the Planning page's closure-scoped renderers so external
    // Business Date / cloud-restore handlers can refresh the CURRENT DOM.
    // These functions are intentionally inside the Planning page scope;
    // calling renderDeliveryAreas() from outside this scope does nothing.
    NOL3.refreshPlanningViews = function () {
      try { renderOnFloorTowns(); } catch (_) {}
      try { renderDeliveryAreas(); } catch (_) {}
      try { renderIncomingOrders(); } catch (_) {}
      try { updateIncomingOrdersNotification(); } catch (_) {}
      try { renderPlanningExceptions(); } catch (_) {}
      try { renderUnassignedOrders(); } catch (_) {}
      try { renderParcelRecords(); } catch (_) {}
      try { renderZoneSettings(); } catch (_) {}
      try { renderZoneClusterRules(); } catch (_) {}
      try { renderControlRoom(); } catch (_) {}
      try { renderBusinessDayMetrics(); } catch (_) {}
    };

    window.addEventListener('inventoryloaded', event => { if (event.detail?.type === 'lm') { renderZoneSettings(); renderOnFloorTowns(); renderDeliveryAreas(); } });
    window.addEventListener('inventorycleared', event => { if (event.detail?.type === 'lm') { renderZoneSettings(); renderOnFloorTowns(); renderDeliveryAreas(); } });
    window.addEventListener('hubchange', () => { renderZoneSettings(); renderOnFloorTowns(); renderDeliveryAreas(); });
    window.addEventListener('zonesettingschanged', () => {
      // Rebuild the available/assigned town lists immediately after a Zone Settings change.
      // No manual refresh or menu switch is required.
      renderOnFloorTowns();
      renderDeliveryAreas();
      renderZoneSettings();
    });

    // Bind Planning tabs BEFORE running any renderers. Some of the imported
    // Bauko renderers can fail when a dataset is still restoring; a renderer
    // error must never make the Planning UI itself unclickable.
    const tabs = root.querySelectorAll("[data-planning-tab]");
    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const target = tab.dataset.planningTab;
        tabs.forEach((item) => {
          const active = item === tab;
          item.classList.toggle("active", active);
          item.setAttribute("aria-selected", active ? "true" : "false");
        });
        root.querySelectorAll(".planning-panel").forEach((panel) => {
          panel.classList.toggle("active", panel.id === `planning-panel-${target}`);
        });
        try { if (target === "incoming") renderIncomingOrders(); } catch (_) {}
        try { if (target === "unassigned") renderUnassignedOrders(); } catch (_) {}
        try { if (target === "parcels") renderParcelRecords(); } catch (_) {}
        try { if (target === "zonesettings") renderZoneSettings(); } catch (_) {}
      });
    });

    // Zone Settings is now initialized after the navigation handlers are safe.
    try { recoverZoneSplitTownAssignments(); } catch (_) {}
    try { renderOnFloorTowns(); } catch (e) { console.warn("NOL3 Planning: renderOnFloorTowns failed", e); }
    try { renderDeliveryAreas(); } catch (e) { console.warn("NOL3 Planning: renderDeliveryAreas failed", e); }
    try { renderIncomingOrders(); } catch (e) { console.warn("NOL3 Planning: renderIncomingOrders failed", e); }
    try { renderUnassignedOrders(); } catch (e) { console.warn("NOL3 Planning: renderUnassignedOrders failed", e); }
    try { renderParcelRecords(); } catch (e) { console.warn("NOL3 Planning: renderParcelRecords failed", e); }
    try { renderZoneSettings(); } catch (e) { console.warn("NOL3 Planning: renderZoneSettings failed", e); }
    try { renderZoneClusterRules(); } catch (e) { console.warn("NOL3 Planning: renderZoneClusterRules failed", e); }
    try { renderControlRoom(); } catch (e) { console.warn("NOL3 Planning: renderControlRoom failed", e); }

    renderBusinessDaySettings();
    // These cards used to live on the separate Dashboard page; they're now
    // part of Planning's own render so they populate as soon as Planning
    // loads, the same way Dashboard used to on its own load.
    if (typeof renderBusinessDayMetrics === "function") {
      renderBusinessDayMetrics();
      setTimeout(() => renderBusinessDayMetrics(), 0);
      setTimeout(() => renderBusinessDayMetrics(), 100);
      setTimeout(() => renderBusinessDayMetrics(), 500);
    }
    window.addEventListener("inventoryloaded", (event) => {
      if (event.detail?.type === "lm") renderUnassignedOrders();
    });
    window.addEventListener("inventorycleared", (event) => {
      if (event.detail?.type === "lm") renderUnassignedOrders();
    });
    window.addEventListener("hubchange", () => { renderUnassignedOrders(); renderParcelRecords(); renderBusinessDaySettings(); });
    window.addEventListener("businessdatechange", () => { setTimeout(() => renderParcelRecords(), 0); });
    window.addEventListener("inventoryloaded", (event) => { if (event.detail?.type === "lm") renderParcelRecords(); });
    window.addEventListener("inventorycleared", (event) => { if (event.detail?.type === "lm") renderParcelRecords(); });
    window.addEventListener("inventoryloaded", (event) => { if (event.detail?.type === "lm") renderBusinessDayMetrics(); });
    window.addEventListener("inventorycleared", (event) => { if (event.detail?.type === "lm") renderBusinessDayMetrics(); });
  };
})();


(function () {
  NOL3.pages = NOL3.pages || {};

NOL3.pages.riders = function (root) {
    root.innerHTML = `
      <div class="page active riders-page" id="page-riders">
        <div class="riders-toolbar">
          <div>
            <h2 class="section-title">Riders Data</h2>
            <div class="riders-file-name" id="ridersFileName">No rider file uploaded</div>
          </div>

          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="riders-upload-btn">
            Upload Rider CSV
            <input id="ridersFile" type="file" accept=".csv,text/csv" hidden>

        </div>

        <div class="riders-controls">
          <input
            id="riderSearch"
            class="riders-search"
            type="search"
            placeholder="Search rider name, Driver ID, plate number, station..."

          <label class="riders-filter">
            <input id="hideSuspended" type="checkbox" checked>
            Hide suspended riders

        </div>

        <div class="rider-metrics">
          <div class="rider-metric">
            <div class="rider-metric-label">Total Riders</div>
            <div class="rider-metric-value" id="riderTotal">0</div>
          </div>
          <div class="rider-metric">
            <div class="rider-metric-label">Regulars</div>
            <div class="rider-metric-value" id="riderRegulars">0</div>
          </div>
          <div class="rider-metric">
            <div class="rider-metric-label">Flexi</div>
            <div class="rider-metric-value" id="riderFlexi">0</div>
          </div>
          <div class="rider-metric rider-metric-placeholder" aria-hidden="true"></div>
        </div>

        <div class="riders-table-card">
          <div class="riders-table-wrap">
            <div class="riders-empty" id="ridersEmpty">
              Upload the rider CSV to view the rider roster.
            </div>
            <table class="riders-table" id="ridersTable" style="display:none">
              <thead><tr id="ridersHead"></tr></thead>
              <tbody id="ridersBody"></tbody>
            </table>
          </div>
          <div class="riders-status" id="ridersStatus">
            Ready for rider data.
          </div>
        </div>
      </div>
    `;

    const fileInput = document.getElementById("ridersFile");
    const searchInput = document.getElementById("riderSearch");
    const hideSuspendedInput = document.getElementById("hideSuspended");

    let loadedRiderResult = NOL3.riderData || null;

    if (loadedRiderResult) {
      document.getElementById("ridersFileName").textContent = loadedRiderResult.fileName || "Saved rider data";
      renderRiderData(loadedRiderResult);
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      document.getElementById("ridersFileName").textContent = file.name;

      if (typeof NOL3.readCSVFile === "function") {
        NOL3.readCSVFile(file, (result) => {
          NOL3.riderData = result;
          loadedRiderResult = result;
          if (window.NOL3RiderHubStore?.save) window.NOL3RiderHubStore.save(result);
          renderRiderData(result);
          if (typeof NOL3.saveUploadedData === "function") {
            NOL3.saveUploadedData("riders", [file]);
          }
          window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "riders" } }));
        });
      }
    });

    searchInput.addEventListener("input", () => {
      if (loadedRiderResult) renderRiderData(loadedRiderResult);
    });

    hideSuspendedInput.addEventListener("change", () => {
      if (loadedRiderResult) renderRiderData(loadedRiderResult);
    });

    document.getElementById("clearRidersBtn")?.addEventListener("click", async () => {
      const ok = window.confirm("CLEAR RIDER DATA?\n\nThis removes the uploaded rider roster and all rider assignments for this hub, including the cloud copy.\n\nTowns, zone settings, and inventory are NOT changed.\n\nContinue?");
      if (!ok) return;
      const btn = document.getElementById("clearRidersBtn");
      if (btn) { btn.disabled = true; btn.textContent = "CLEARING..."; }
      try { await NOL3.clearRiderData(); }
      catch (error) { console.error("NOL3: Could not clear rider data.", error); alert("Could not clear rider data: " + (error?.message || "unknown error")); if (btn) { btn.disabled = false; btn.textContent = "Clear Rider Data"; } }
    });

    function renderRiderData(result) {
      const rows = parseCSV(result.rawText);
      if (!rows.length) return;

      const headers = rows[0];
      const allRows = rows.slice(1).filter(row => row.some(value => value.trim() !== ""));

      const statusIndex = headers.indexOf("SPX Status");
      const searchableIndexes = [
        headers.indexOf("Driver ID"),
        headers.indexOf("Driver Name"),
        headers.indexOf("Plate Number"),
        headers.indexOf("Delivery Station ID"),
        headers.indexOf("Pickup Station ID"),
        headers.indexOf("Agency"),
        headers.indexOf("Driver Group"),
        headers.indexOf("Zone")
      ].filter(index => index >= 0);

      const query = (searchInput.value || "").trim().toLowerCase();
      const hideSuspended = hideSuspendedInput.checked;

      const dataRows = allRows.filter(row => {
        const status = statusIndex >= 0 ? String(row[statusIndex] || "").trim().toLowerCase() : "";
        const suspended = status.includes("suspend");

        if (hideSuspended && suspended) return false;

        if (!query) return true;

        return searchableIndexes.some(index =>
          String(row[index] || "").toLowerCase().includes(query)
        );
      });

      const headerEl = document.getElementById("ridersHead");
      const bodyEl = document.getElementById("ridersBody");
      const tableEl = document.getElementById("ridersTable");
      const emptyEl = document.getElementById("ridersEmpty");
      const statusEl = document.getElementById("ridersStatus");

      headerEl.innerHTML = headers.map(h => `<th>${escapeHTML(h)}</th>`).join("");

      bodyEl.innerHTML = dataRows.map(row => {
        const cells = headers.map((_, index) => row[index] ?? "");
        return `<tr>${cells.map(cell => `<td>${escapeHTML(cell)}</td>`).join("")}</tr>`;
      }).join("");

      emptyEl.style.display = "none";
      tableEl.style.display = "table";
      const totalText = allRows.length.toLocaleString();
      const visibleText = dataRows.length.toLocaleString();
      statusEl.textContent = `${visibleText} of ${totalText} rider records shown from ${result.fileName}.`;

      document.getElementById("riderTotal").textContent = dataRows.length.toLocaleString();

      const vehicleIndex = headers.findIndex(h => String(h || "").trim().toLowerCase() === "vehicle type");

      // Rider type is read from the Vehicle Type column in the exported Driver Profile.
      // Flexi riders are marked as "Flexi" there; Agency is not the rider-type field.
      const regularCount = vehicleIndex >= 0
        ? dataRows.filter(row => /^(2wh|3wc|4wh)$/i.test(String(row[vehicleIndex] || "").trim())).length
        : 0;

      const flexiCount = vehicleIndex >= 0
        ? dataRows.filter(row => /flexi/i.test(String(row[vehicleIndex] || "").trim())).length
        : 0;

      document.getElementById("riderRegulars").textContent = regularCount.toLocaleString();
      document.getElementById("riderFlexi").textContent = flexiCount.toLocaleString();
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && inQuotes && next === '"') {
          value += '"';
          i++;
          continue;
        }

        if (char === '"') {
          inQuotes = !inQuotes;
          continue;
        }

        if (char === "," && !inQuotes) {
          row.push(value);
          value = "";
          continue;
        }

        if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i++;
          row.push(value);
          value = "";
          rows.push(row);
          row = [];
          continue;
        }

        value += char;
      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows;
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  };
})();

  };

  NOL3.openDeleteHubModal = function (hub) {
    const modal = document.getElementById("deleteHubModal");
    const text = document.getElementById("deleteHubText");
    if (!modal || !hub) return;
    NOL3.pendingDeleteHub = hub;
    if (text) text.textContent = `Delete "${hub}"? This will also remove its saved planning, zone, exception, and business-day settings.`;
    modal.classList.add("show");
  };

  NOL3.closeDeleteHubModal = function () {
    const modal = document.getElementById("deleteHubModal");
    if (modal) modal.classList.remove("show");
    NOL3.pendingDeleteHub = null;
  };

  NOL3.confirmDeleteHub = function () {
    const hub = NOL3.pendingDeleteHub;
    if (!hub) return;
    NOL3.removeHub(hub);
    NOL3.closeDeleteHubModal();
    NOL3.renderSidebar();
    NOL3.renderTopbar();
    NOL3.renderPage(NOL3.getState().currentPage);
  };

  NOL3.initHubModal = function () {
    const modal = document.getElementById("hubModal");
    const input = document.getElementById("hubName");
    const cancelButton = document.getElementById("cancelHub");
    const saveButton = document.getElementById("saveHub");

    if (!modal || !input || !cancelButton || !saveButton) {
      console.error("NOL3: Hub modal controls are missing.", {
        modal: !!modal,
        input: !!input,
        cancelButton: !!cancelButton,
        saveButton: !!saveButton
      });
      return;
    }

    cancelButton.addEventListener("click", NOL3.closeHubModal);
    saveButton.addEventListener("click", save);

    const deleteHubModal = document.getElementById("deleteHubModal");
    const cancelDeleteHub = document.getElementById("cancelDeleteHub");
    const confirmDeleteHub = document.getElementById("confirmDeleteHub");
    cancelDeleteHub?.addEventListener("click", NOL3.closeDeleteHubModal);
    confirmDeleteHub?.addEventListener("click", NOL3.confirmDeleteHub);
    deleteHubModal?.addEventListener("click", function (event) {
      if (event.target === deleteHubModal) NOL3.closeDeleteHubModal();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && deleteHubModal?.classList.contains("show")) NOL3.closeDeleteHubModal();
    });

    modal.addEventListener("click", function (event) {
      if (event.target === modal) NOL3.closeHubModal();
    });

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") save();
      if (event.key === "Escape") NOL3.closeHubModal();
    });

    function save() {
      const name = input.value.trim();
      if (!name || name === "Main Hub") return;
      if (!NOL3.addHub(name)) return;

      NOL3.setSelectedHub(name);
      NOL3.renderSidebar();
      NOL3.renderTopbar();
      NOL3.closeHubModal();
    }
  };
})();



/* NOL3 File Store fallback
 * Android content:// / downloaded HTML files can expose IndexedDB.open() but
 * fail internally when opening the backing store. The dashboard therefore
 * uses a memory-backed file store for operational uploads. Supabase remains
 * the durable cross-device store through NOL3CloudSync.
 */
(function () {
  const records = new Map();
  const histories = new Map();

  function clone(value) {
    if (value == null) return value;
    try { return JSON.parse(JSON.stringify(value)); }
    catch (_) { return value; }
  }

  window.NOL3FileStore = {
    getAll() {
      return Array.from(records.values()).map(clone);
    },
    get(type) {
      return clone(records.get(String(type)) || null);
    },
    put(record) {
      if (record && record.type) records.set(String(record.type), clone(record));
    },
    remove(type) {
      records.delete(String(type));
    },
    putHistory(record) {
      if (record && record.businessDate) histories.set(String(record.businessDate), clone(record));
    },
    getHistory(date) {
      return clone(histories.get(String(date || '').trim()) || null);
    },
    removeHistory(date) {
      histories.delete(String(date || '').trim());
    },
    getHistories() {
      return Array.from(histories.values()).map(clone);
    },
    clearOperational() {
      records.delete("lm");
      records.delete("incoming");
      records.delete("linehaul");
      records.delete("unifiedInventory");
      records.delete("unifiedInventoryUndo");
      histories.clear();
    }
  };
})();


(function () {
  // NOL3 Save Data: export a portable backup of the current browser-local data.
  // Includes localStorage plus all records in the uploaded-file IndexedDB store.
  // This is intentionally local-only until the cloud backend is connected.
  const DB_NAME = "NOL3_Planning_Dashboard_DB_BADOC";
  const DB_VERSION = 4;
  const STORE = "uploadedFiles";
  const LM_HISTORY_STORE = "lmHistory";

  function readLocalStorage() {
    const data = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key !== null) data[key] = localStorage.getItem(key);
      }
    } catch (error) {
      console.warn("NOL3: Could not read localStorage for backup.", error);
    }
    return data;
  }

  function readIndexedDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { resolve({}); return; }
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error || new Error("Could not open saved-data database."));
      request.onsuccess = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(STORE)) { db.close(); resolve({}); return; }
        const tx = db.transaction(STORE, "readonly");
        const getAllRequest = tx.objectStore(STORE).getAll();
        getAllRequest.onsuccess = () => {
          const records = Array.isArray(getAllRequest.result) ? getAllRequest.result : [];
          db.close();
          const byType = {};
          records.forEach(record => {
            if (record && record.type) byType[String(record.type)] = record;
          });
          resolve(byType);
        };
        getAllRequest.onerror = () => {
          db.close();
          reject(getAllRequest.error || new Error("Could not read uploaded data."));
        };
      };
    });
  }

  function csvEscape(value) {
    const text = value == null ? "" : String(value);
    return `"${text.replace(/"/g, '""')}"`;
  }

  function downloadCSV(rows, fileName) {
    const csv = rows.map(row => row.map(csvEscape).join(",")).join("\r\n") + "\r\n";
    const blob = new Blob(["\uFEFF", csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = fileName;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  NOL3.saveDataBackup = async function () {
    const button = document.getElementById("saveDataBtn");
    const originalText = button ? button.textContent : "SAVE DATA";
    if (button) {
      button.disabled = true;
      button.textContent = "SAVING...";
      button.classList.remove("saved");
    }

    try {
      try { if (typeof NOL3.syncBusinessDateFromDom === "function") NOL3.syncBusinessDateFromDom(); } catch (_) {}

      const state = typeof NOL3.getState === "function" ? NOL3.getState() : {};
      const hub = String(state.selectedHub || "").trim();
      const businessDate = typeof getBusinessDateValue === "function"
        ? getBusinessDateValue()
        : new Date().toISOString().slice(0, 10);

      if (!hub) throw new Error("Select a hub before saving the daily summary.");

      // SAVE DATA is now the explicit cloud-save action. Nothing else writes
      // local edits to Supabase automatically.
      if (window.NOL3CloudSync?.syncNow) await window.NOL3CloudSync.syncNow();

      const date = new Date(`${businessDate}T00:00:00`);
      const day = date.getDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;
      const weekStartDate = new Date(date);
      weekStartDate.setDate(date.getDate() + mondayOffset);
      const weekEndDate = new Date(weekStartDate);
      weekEndDate.setDate(weekStartDate.getDate() + 6);
      const isoDate = d => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${dd}`;
      };
      const weekStart = isoDate(weekStartDate);
      const weekEnd = isoDate(weekEndDate);
      const weekLabel = `${weekStart}_to_${weekEnd}`;

      const textValue = id => {
        const el = document.getElementById(id);
        return el ? String(el.textContent || "").trim() : "";
      };
      const inputValue = id => {
        const el = document.getElementById(id);
        return el ? String(el.value ?? "").trim() : "";
      };

      // Save one daily snapshot for the selected hub. Re-saving the same business
      // date replaces that day's snapshot, so the weekly CSV stays clean.
      const storageKey = `NOL3_WEEKLY_DAILY_SUMMARY_${hub}`;
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem(storageKey) || "[]");
        if (!Array.isArray(history)) history = [];
      } catch (_) { history = []; }

      const dailySnapshot = {
        weekStart,
        weekEnd,
        businessDate,
        hub,
        todayVolume: textValue("todayVolumeValue"),
        totalDispatched: textValue("totalDispatchedValue"),
        totalBacklogs: textValue("totalBacklogsValue"),
        planningVolume: textValue("planningTotalVolume"),
        fleetProductivityTarget: inputValue("planningFleetProductivity"),
        planningExceptions: textValue("planningExceptionCount"),
        townsOrders: textValue("townTotalBadge"),
        parcelRecords: textValue("parcelRecordsSummary"),
        riderTotal: textValue("riderTotal"),
        lastUpdated: new Date().toISOString()
      };

      history = history.filter(row => row && row.businessDate !== businessDate);
      history.push(dailySnapshot);
      history.sort((a, b) => String(a.businessDate).localeCompare(String(b.businessDate)));

      // Keep only a practical amount of history for this hub.
      history = history.slice(-31);
      localStorage.setItem(storageKey, JSON.stringify(history));

      // Export the current reporting week only, with one row per captured day.
      const weekRows = history.filter(row => row.weekStart === weekStart && row.weekEnd === weekEnd);
      const summaryRows = [
        ["NOL3 DAILY SUMMARY"],
        ["Week Start", weekStart],
        ["Week End", weekEnd],
        ["Hub", hub],
        [],
        ["DATE", "TODAY'S VOLUME", "TOTAL DISPATCHED", "TOTAL BACKLOGS", "PLANNING VOLUME", "FLEET PRODUCTIVITY TARGET", "PLANNING EXCEPTIONS", "TOWNS / ORDERS", "PARCEL RECORDS", "RIDER TOTAL", "LAST UPDATED"]
      ];

      weekRows.forEach(row => {
        summaryRows.push([
          row.businessDate,
          row.todayVolume,
          row.totalDispatched,
          row.totalBacklogs,
          row.planningVolume,
          row.fleetProductivityTarget,
          row.planningExceptions,
          row.townsOrders,
          row.parcelRecords,
          row.riderTotal,
          row.lastUpdated
        ]);
      });

      const stamp = new Date();
      const pad = n => String(n).padStart(2, "0");
      const safeHub = hub.replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "");
      const fileName = `NOL3_Weekly_Daily_Summary_${safeHub}_${weekLabel}_${stamp.getHours()}-${pad(stamp.getMinutes())}-${pad(stamp.getSeconds())}.csv`;
      downloadCSV(summaryRows, fileName);

      if (button) {
        button.textContent = "SAVED ✓";
        button.classList.add("saved");
        setTimeout(() => {
          if (!button.isConnected) return;
          button.disabled = false;
          button.textContent = originalText;
          button.classList.remove("saved");
        }, 1800);
      }
    } catch (error) {
      console.error("NOL3: Could not create daily summary.", error);
      if (button) { button.disabled = false; button.textContent = originalText; }
      alert(`Could not save daily summary: ${error?.message || "unknown error"}`);
    }
  };

  document.addEventListener("click", function (event) {
    const button = event.target?.closest?.("#saveDataBtn");
    if (!button) return;
    event.preventDefault();
    event.stopPropagation();
    if (!button.disabled && typeof NOL3.saveDataBackup === "function") NOL3.saveDataBackup();
  }, true);

  // Manual Clear: remove uploaded operational files only.
  // Rider roster, town arrangements, zone settings, planning exceptions, and other hub settings are preserved.
  const clearAllUploadedFiles = async () => {
    const clearBtn = document.getElementById("clearDataBtn");
    if (clearBtn) {
      clearBtn.disabled = true;
      clearBtn.textContent = "CLEARING...";

    try {
      // Clear every operational upload source, including the persistent
      // unified-inventory/undo records that could otherwise resurrect data
      // after a refresh.
      const clearTypes = ["lm", "incoming", "linehaul"];
      for (const type of clearTypes) {
        try { await NOL3.clearUploadedData(type); } catch (_) {}
      }

      // Remove every browser-local operational record, including ALL LM
      // history dates. Clearing only today's LM history is not sufficient:
      // restoreSavedUploads can otherwise resurrect an older saved snapshot
      // during the next page load.
      try { NOL3FileStore?.clearOperational?.(); } catch (_) {}
      try { if (NOL3._inventoryUndoMemory) NOL3._inventoryUndoMemory = null; } catch (_) {}

      NOL3.lmInventory = { files: [], rows: [], filteredRows: [], fileName: "", headers: [], loadedAt: "", rowCount: 0 };
      NOL3.incomingInventory = { files: [], rows: [], filteredRows: [], fileName: "", headers: [], loadedAt: "", rowCount: 0 };
      NOL3.lineHaulInventory = { files: [], rows: [], filteredRows: [], fileName: "", headers: [], loadedAt: "", rowCount: 0 };

      try { window.dispatchEvent(new CustomEvent("inventorycleared", { detail: { type: "all", source: "manual" } })); } catch (_) {}
      try { if (typeof renderBusinessDayMetrics === "function") renderBusinessDayMetrics(); } catch (_) {}
      try { if (typeof renderDeliveryAreas === "function") renderDeliveryAreas(); } catch (_) {}
      try { if (typeof renderIncomingOrders === "function") renderIncomingOrders(); } catch (_) {}
      try { if (typeof renderUnassignedOrders === "function") renderUnassignedOrders(); } catch (_) {}
      try { if (typeof renderPlanning === "function") renderPlanning(); } catch (_) {}

      // Write the cleared operational snapshot directly to the files channel.
      // This is a deliberate user action, so an empty snapshot is valid.
      // A clearedAt/cledByUser tombstone also prevents the normal startup
      // merge logic from treating the empty snapshot as missing data.
      if (window.NOL3CloudSync?.clearUploadedFilesCloud) {
        await window.NOL3CloudSync.clearUploadedFilesCloud();
      } else {

  // Automatic weekly export: on Monday, export the PREVIOUS week's captured
  // daily summaries for the currently selected hub. This is intentionally
  // separate from any future Clear Weekly logic, so clearing cannot mark an
  // export as complete or otherwise interfere with the export state.
  NOL3.autoExportPreviousWeekSummary = async function () {
    try {
      try { if (typeof NOL3.syncBusinessDateFromDom === "function") NOL3.syncBusinessDateFromDom(); } catch (_) {}

      const state = typeof NOL3.getState === "function" ? NOL3.getState() : {};
      const hub = String(state.selectedHub || "").trim();
      const businessDate = typeof getBusinessDateValue === "function"
        ? getBusinessDateValue()
        : new Date().toISOString().slice(0, 10);
      if (!hub || !businessDate) return;

      const date = new Date(`${businessDate}T00:00:00`);
      if (Number.isNaN(date.getTime()) || date.getDay() !== 1) return; // Monday only

      const currentWeekStart = new Date(date);
      currentWeekStart.setDate(date.getDate());
      const previousWeekStart = new Date(currentWeekStart);
      previousWeekStart.setDate(currentWeekStart.getDate() - 7);
      const previousWeekEnd = new Date(currentWeekStart);
      previousWeekEnd.setDate(currentWeekStart.getDate() - 1);

      const isoDate = d => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${dd}`;
      };
      const weekStart = isoDate(previousWeekStart);
      const weekEnd = isoDate(previousWeekEnd);

      // One export marker per hub/week. Reopening the HTML during the same
      // Monday will not download another copy.
      const exportKey = `NOL3_WEEKLY_AUTO_EXPORTED_${hub}_${weekStart}`;
      if (localStorage.getItem(exportKey) === "1") return;

      const storageKey = `NOL3_WEEKLY_DAILY_SUMMARY_${hub}`;
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem(storageKey) || "[]");
        if (!Array.isArray(history)) history = [];
      } catch (_) { history = []; }

      const weekRows = history
        .filter(row => row && row.weekStart === weekStart && row.weekEnd === weekEnd)
        .sort((a, b) => String(a.businessDate).localeCompare(String(b.businessDate)));

      // Do not create an empty weekly file. If there are no captured daily
      // summaries, leave the marker unset so a later Monday open can retry.
      if (!weekRows.length) return;

      const summaryRows = [
        ["NOL3 WEEKLY DAILY SUMMARY"],
        ["Week Start", weekStart],
        ["Week End", weekEnd],
        ["Hub", hub],
        [],
        ["DATE", "TODAY'S VOLUME", "TOTAL DISPATCHED", "TOTAL BACKLOGS", "PLANNING VOLUME", "FLEET PRODUCTIVITY TARGET", "PLANNING EXCEPTIONS", "TOWNS / ORDERS", "PARCEL RECORDS", "RIDER TOTAL", "LAST UPDATED"]
      ];

      weekRows.forEach(row => {
        summaryRows.push([
          row.businessDate,
          row.todayVolume,
          row.totalDispatched,
          row.totalBacklogs,
          row.planningVolume,
          row.fleetProductivityTarget,
          row.planningExceptions,
          row.townsOrders,
          row.parcelRecords,
          row.riderTotal,
          row.lastUpdated
        ]);
      });

      const stamp = new Date();
      const pad = n => String(n).padStart(2, "0");
      const safeHub = hub.replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "");
      const fileName = `NOL3_${safeHub}_Weekly_Summary_${weekStart}.csv`;
      downloadCSV(summaryRows, fileName);

      // Mark only after the file has been handed to the browser. This marker
      // is independent of Clear Weekly and is scoped to hub + week.
      localStorage.setItem(exportKey, "1");
      console.info(`NOL3: Automatically exported ${fileName}`);
    } catch (error) {
      console.error("NOL3: Automatic weekly export failed.", error);
    }
  };

  // Run after the dashboard has had a chance to restore its selected hub/date.
  // The small delay also keeps the export separate from startup rendering.
  window.addEventListener("load", function () {
    setTimeout(() => {
      if (typeof NOL3.autoExportPreviousWeekSummary === "function") {
        NOL3.autoExportPreviousWeekSummary();
      }
    }, 750);
  });
})();

    const parsed = [];
    let row = [], value = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const char = text[i], next = text[i + 1];
      if (char === '"' && inQuotes && next === '"') { value += '"'; i++; continue; }
      if (char === '"') { inQuotes = !inQuotes; continue; }
      if (char === ',' && !inQuotes) { row.push(value); value = ""; continue; }
      if ((char === '\n' || char === '\r') && !inQuotes) {
        if (char === '\r' && next === '\n') i++;
        row.push(value); value = ""; parsed.push(row); row = []; continue;
      }
      value += char;
    }
    if (value.length || row.length) { row.push(value); parsed.push(row); }
    return parsed;
  }

        const hasDedicatedLM = !!(savedLM && Array.isArray(savedLM.dataset?.rows));
        if (!hasDedicatedLM) {
          NOL3.lmInventory = { ...resultBase, rows: Array.isArray(d.lmRows) ? d.lmRows : [], filteredRows: [], rowCount: Array.isArray(d.lmRows) ? d.lmRows.length : 0, files: savedUnified.files || [] };
          filterLMForHub(NOL3.lmInventory);
          window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "lm", data: NOL3.lmInventory } }));
        }
        NOL3.incomingInventory = { ...resultBase, rows: Array.isArray(d.incomingRows) ? d.incomingRows : [], filteredRows: [], rowCount: Array.isArray(d.incomingRows) ? d.incomingRows.length : 0, files: savedUnified.files || [] };
        restoredUnified = true;
        window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "incoming", data: NOL3.incomingInventory } }));
      }

      for (const type of ["incoming", "linehaul"]) {
        if (type === "incoming" && restoredUnified) continue;
        const saved = await get(type);
        if (!saved || !Array.isArray(saved.files) || !saved.files[0]) continue;
        const item = saved.files[0];
        const text = item.text || "";
        const storedDataset = saved.dataset && Array.isArray(saved.dataset.rows) ? saved.dataset : null;
        const parsed = storedDataset ? null : parseStoredCSV(text);
        const headers = storedDataset
          ? (Array.isArray(storedDataset.headers) ? storedDataset.headers : [])
          : (parsed && parsed.length ? parsed[0].map(value => String(value).trim()) : []);
        const rows = storedDataset
          ? storedDataset.rows
          : (parsed && parsed.length ? parsed.slice(1).filter(row => row.some(value => String(value || "").trim() !== "")) : []);
        const result = {
          fileName: storedDataset?.fileName || item.name,
          rowCount: rows.length,
          rawText: text,
          headers,
          rows,
          loadedAt: storedDataset?.loadedAt || saved.savedAt || new Date().toISOString()
        };
        if (type === "incoming") NOL3.incomingInventory = result;
        else NOL3.lineHaulInventory = result;
        window.dispatchEvent(new CustomEvent("inventoryloaded", {
          detail: { type, data: result }
        }));
      }
    } catch (error) {
      console.warn("NOL3: Could not restore saved uploaded files.", error);
    }
  };

  NOL3.updateInventoryUploadSummaries = async function () {
    try {
      const lm = await get("lm");
      const incoming = await get("incoming");
      const linehaul = await get("linehaul");
      const lmSummary = document.getElementById("lmSummary");
      const lmList = document.getElementById("lmList");
      const incomingSummary = document.getElementById("incomingSummary");
      const lineHaulSummary = document.getElementById("lineHaulSummary");
      const memoryUnified = !!(NOL3.lmInventory?.rows?.length || NOL3.incomingInventory?.rows?.length);
      if (lm && Array.isArray(lm.files) && lm.files.length) {
        if (lmSummary) lmSummary.textContent = lm.files.length === 1 ? lm.files[0].name : `${lm.files.length} files saved`;
        if (lmList) lmList.innerHTML = lm.files.map(item => `<li title="${NOL3.escapeHTML(item.name)}">${NOL3.escapeHTML(item.name)}</li>`).join("");
        if (clearLMBtn) clearLMBtn.disabled = false;
      } else {
        // Do not disable the clear button if a freshly uploaded LM dataset is
        // already present in memory but the IndexedDB read returned stale data.
        const hasMemoryLM = !!(NOL3.lmInventory && Array.isArray(NOL3.lmInventory.files) && NOL3.lmInventory.files.length);
        if (lmSummary && !hasMemoryLM) lmSummary.textContent = "No files selected";
        if (lmList && !hasMemoryLM) lmList.innerHTML = "";
        if (clearLMBtn) clearLMBtn.disabled = !hasMemoryLM;
      }
      if (incoming && incoming.files && incoming.files[0] && incomingSummary) incomingSummary.textContent = incoming.files[0].name;
      if (linehaul && linehaul.files && linehaul.files[0] && lineHaulSummary) lineHaulSummary.textContent = linehaul.files[0].name;
      if (memoryUnified) {
        const unifiedName = NOL3.lmInventory?.fileName || NOL3.incomingInventory?.fileName || 'Saved inventory';
        const unifiedSummary = document.getElementById('unifiedInventorySummary');
        const unifiedStatus = document.getElementById('unifiedInventoryStatus');
        if (unifiedSummary) unifiedSummary.textContent = unifiedName;
        if (unifiedStatus && !unifiedStatus.textContent.trim()) unifiedStatus.textContent = `${((NOL3.lmInventory?.rows?.length || 0) + (NOL3.incomingInventory?.rows?.length || 0)).toLocaleString()} records loaded`;
        const clearBtnEl = document.getElementById("clearUnifiedInventoryBtn");
        if (clearBtnEl) clearBtnEl.disabled = false;
      }
    } catch (error) {
      console.warn("NOL3: Could not update saved upload summaries.", error);
    }
  };
})();

(function () {
  NOL3.readCSVFile = function (file, callback) {
    const reader = new FileReader();

    reader.onload = function (event) {
      // Strip NUL (\u0000) characters: they can end up here if a binary file
      // (e.g. a mis-saved .xlsx) gets read as text, and the database layer's
      // jsonb columns reject \u0000 outright ("unsupported Unicode escape
      // sequence"), which breaks cloud sync for the whole snapshot.
      const text = String(event.target.result || "").replace(/\u0000/g, "");
      const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
      callback({
        fileName: file.name,
        rowCount: Math.max(0, rows.length - 1),
        rawText: text,
        rows
      });
    };

    reader.onerror = function () {
      console.error("NOL3: Could not read file:", file.name);
    };

    reader.readAsText(file);
  };

  function parseFlexibleCSV(text) {
    const sample = String(text || "").split(/\r?\n/).filter(line => line.trim()).slice(0, 5).join("\n");
    const candidates = [",", "\t", ";", "|"];
    let delimiter = ",", best = -1;
    candidates.forEach(d => {
      let count = 0, quoted = false;
      for (const ch of sample) {
        if (ch === '"') quoted = !quoted;
        else if (ch === d && !quoted) count++;
      }
      if (count > best) { best = count; delimiter = d; }
    });
    const parsedRows = []; let row = [], value = "", inQuotes = false;
    for (let i = 0; i < String(text || "").length; i++) {
      const char = text[i], next = text[i + 1];
      if (char === '"' && inQuotes && next === '"') { value += '"'; i++; continue; }
      if (char === '"') { inQuotes = !inQuotes; continue; }
      if (char === delimiter && !inQuotes) { row.push(value); value = ""; continue; }
      if ((char === '\n' || char === '\r') && !inQuotes) {
        if (char === '\r' && next === '\n') i++;
        row.push(value); value = ""; parsedRows.push(row); row = []; continue;
      }
      value += char;
    }
    if (value.length || row.length) { row.push(value); parsedRows.push(row); }
    return parsedRows;
  }

  NOL3.readIncomingInventory = function (file) {
    NOL3.readCSVFile(file, function (result) {
      const parsed = parseFlexibleCSV(result.rawText);
      result.headers = parsed.length ? parsed[0].map(value => String(value).trim()) : [];
      result.rows = parsed.length ? parsed.slice(1).filter(row => row.some(value => String(value || "").trim() !== "")) : [];
      { const hf = NOL3.filterRowsToHub(result.headers, result.rows, 'incoming');
        if (hf.dropped > 0) { result.rows = hf.rows; result.rawText = NOL3.rowsToCSV(result.headers, hf.rows); } }
      result.rowCount = result.rows.length;
      NOL3.incomingInventory = result;
      NOL3.saveUploadedData("incoming", [file], result);
      window.dispatchEvent(new CustomEvent("inventoryloaded", {
        detail: { type: "incoming", data: result }
      }));
      // Push the complete Incoming Orders source data immediately. This avoids
      // relying only on the 5-second polling loop after a large CSV upload.
      try { if (window.NOL3CloudSync?.syncNow) window.NOL3CloudSync.syncNow(); } catch (_) {}
      console.log("Incoming Inventory loaded:", result.fileName, result.rowCount, "data rows");
    });
  };

  // Accepts one File or an array of Files. Every upload is STACKED onto the
  // existing From-To List: rows are merged, and a duplicate (same LH Trip +
  // same tracking number) is kept only once — the record from the most
  // recently processed file wins.
  NOL3.readLineHaulInventory = function (filesInput) {
    const files = (Array.isArray(filesInput) ? filesInput : [filesInput]).filter(Boolean);
    if (!files.length) return;

    const readOne = file => new Promise(resolve => NOL3.readCSVFile(file, resolve));
    const looksLikeIncomingFile = headers =>
      NOL3._findHeaderIdx(headers, ["Order ID", "Order Id", "OrderID"]) >= 0 &&
      (NOL3._findHeaderIdx(headers, ["Current Station"]) >= 0 ||
       NOL3._findHeaderIdx(headers, ["Destination Station"]) >= 0 ||
       NOL3._findHeaderIdx(headers, ["Town Name"]) >= 0);

    (async () => {
      let baseHeaders = Array.isArray(NOL3.lineHaulInventory?.headers) ? [...NOL3.lineHaulInventory.headers] : [];
      let baseRows = Array.isArray(NOL3.lineHaulInventory?.rows) ? [...NOL3.lineHaulInventory.rows] : [];
      let addedTotal = 0, dupTotal = 0, lastFileName = "";
      const skipped = [];

      const remapRow = (row, srcHeaders, targetHeaders) => {
        if (srcHeaders === targetHeaders) return [...row];
        const out = Array(targetHeaders.length).fill("");
        srcHeaders.forEach((h, i) => {
          const target = targetHeaders.findIndex(x => String(x).trim().toLowerCase() === String(h).trim().toLowerCase());
          if (target >= 0) out[target] = row[i] ?? "";
        });
        return out;
      };

      for (const file of files) {
        const result = await readOne(file);
        const parsed = parseFlexibleCSV(result.rawText);
        const headers = parsed.length ? parsed[0].map(v => String(v).replace(/^\uFEFF/, "").trim()) : [];
        const rows = parsed.length ? parsed.slice(1).filter(row => row.some(v => String(v || "").trim() !== "")) : [];
        if (!headers.length) continue;

        const fileTaskIdx = NOL3._findHeaderIdx(headers, ["Line Haul Task ID", "Linehaul Task ID", "Line Haul Task", "Linehaul Task", "Task ID", "Task", "Linehaul"]);
        const fileSpxIdx = NOL3._findHeaderIdx(headers, ["SPX TN", "SPX Tracking Number", "SLS TN", "SLS Tracking Number", "Tracking Number", "Tracking No", "Tracking ID"]);
        if (fileTaskIdx < 0 || fileSpxIdx < 0) {
          const reason = looksLikeIncomingFile(headers)
            ? "this looks like an Incoming Inventory file — upload it in the INCOMING INVENTORY box (or the main INVENTORY box) instead"
            : "no Line Haul Task ID / SPX TN column was found";
          skipped.push(`${file.name} — ${reason}`);
          continue;
        }
        lastFileName = file.name;

        const mergedHeaders = baseHeaders.length ? [...baseHeaders] : [...headers];
        headers.forEach(h => {
          if (!mergedHeaders.some(x => String(x).trim().toLowerCase() === String(h).trim().toLowerCase())) mergedHeaders.push(h);
        });

        const taskIdx = NOL3._findHeaderIdx(mergedHeaders, ["Line Haul Task ID", "Linehaul Task ID", "Line Haul Task", "Linehaul Task", "Task ID", "Task", "Linehaul"]);
        const spxIdx = NOL3._findHeaderIdx(mergedHeaders, ["SPX TN", "SPX Tracking Number", "SLS TN", "SLS Tracking Number", "Tracking Number", "Tracking No", "Tracking ID"]);
        const keyOf = row => (taskIdx >= 0 && spxIdx >= 0)
          ? `${String(row[taskIdx] || "").trim().toLowerCase()}|${String(row[spxIdx] || "").trim().toLowerCase()}`
          : row.join("|").toLowerCase();

        const combined = new Map();
        baseRows.forEach(row => {
          const mapped = remapRow(row, baseHeaders.length ? baseHeaders : mergedHeaders, mergedHeaders);
          combined.set(keyOf(mapped), mapped);
        });

        let added = 0, dup = 0;
        rows.forEach(row => {
          const mapped = remapRow(row, headers, mergedHeaders);
          const key = keyOf(mapped);
          if (combined.has(key)) dup++; else added++;
          combined.set(key, mapped);
        });

        baseHeaders = mergedHeaders;
        baseRows = [...combined.values()];
        addedTotal += added;
        dupTotal += dup;
      }

      if (skipped.length) {
        console.warn("NOL3: Skipped file(s) in Incoming Inventory From-To List upload:", skipped);
        alert(`Some file(s) were not added to the Incoming Inventory From-To List:\n\n${skipped.join("\n")}`);
        const summary = document.getElementById("lineHaulSummary");
        if (summary && !baseHeaders.length) summary.textContent = "No valid From-To List file selected";
      }
      if (!baseHeaders.length) return;

      const merged = {
        fileName: files.length > 1 ? `${files.length} files (latest: ${lastFileName})` : lastFileName,
        headers: baseHeaders,
        rows: baseRows,
        rowCount: baseRows.length,
        rawText: typeof NOL3.rowsToCSV === "function" ? NOL3.rowsToCSV(baseHeaders, baseRows) : "",
        loadedAt: new Date().toISOString()
      };
      NOL3.lineHaulInventory = merged;
      await NOL3.saveUploadedData("linehaul", files, merged);
      window.dispatchEvent(new CustomEvent("inventoryloaded", {
        detail: { type: "linehaul", data: merged, addedRows: addedTotal, duplicateRows: dupTotal, filesProcessed: files.length }
      }));
      try { if (window.NOL3CloudSync?.syncNow) window.NOL3CloudSync.syncNow(); } catch (_) {}
      console.log("Line Haul Task ID file(s) loaded:", merged.fileName, merged.rowCount, "total rows,", addedTotal, "new,", dupTotal, "duplicates merged");
    })();
  };
})();


// HARD Business Date persistence guard. This runs in capture phase so the
// selected date is committed even on mobile browsers where the native date
// picker can rebuild/blur the control before the page's local handler runs.
(function () {
  const valid = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v || "").trim());
  const sync = (rerender = false) => {
    const input = document.getElementById("businessDayDate");
    if (!input || !valid(input.value)) return;
    const value = String(input.value).trim();
    NOL3.currentBusinessDate = value;
    try { NOL3Storage.set("nol3_business_day_date_v1", value); } catch (_) {}
    if (rerender) {
      window.dispatchEvent(new CustomEvent("businessdatechange", { detail: { businessDate: value, source: "picker" } }));
    }
  };

  document.addEventListener("input", event => {
    if (event.target?.id === "businessDayDate") sync(false);
  }, true);
  document.addEventListener("change", event => {
    if (event.target?.id === "businessDayDate") sync(true);
  }, true);
  document.addEventListener("blur", event => {
    if (event.target?.id === "businessDayDate") sync(false);
  }, true);
  document.addEventListener("pointerdown", event => {
    if (event.target?.closest?.(".nav-item")) sync(false);
  }, true);
  document.addEventListener("click", event => {
    if (event.target?.closest?.(".nav-item")) sync(false);
  }, true);
})();

// When the Business Date changes, switch the active LM dataset to the snapshot
// uploaded on that calendar date. This is what keeps yesterday's upload in
// yesterday and today's upload in today.
(function () {
  let switching = false;
  window.addEventListener("businessdatechange", async event => {
    const date = String(event.detail?.businessDate || NOL3.currentBusinessDate || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || switching) return;
    if (typeof NOL3.loadLMHistoryForDate !== "function") return;
    switching = true;
    try {
      // NOW loads the snapshot before dispatching this event. Do not start a
      // second IndexedDB read in that case; doing so created a race where the
      // first click rendered an empty dataset and the second click appeared to
      // fix it. Normal date-picker changes still load here.
      if (!event.detail?.lmAlreadyLoaded) {
        await NOL3.loadLMHistoryForDate(date);
      }

      // loadLMHistoryForDate() already rebuilds filteredRows. Do not repeat
      // the full row filter here; doing it again on large LM files was a major
      // source of date-switch lag.
      if (typeof NOL3.updateInventoryUploadSummaries === "function") {
        try { await NOL3.updateInventoryUploadSummaries(); } catch (_) {}
      }

      // Refresh only the views that depend on the dated LM dataset. Avoid a
      // full renderPage() because rebuilding the entire DOM can be expensive
      // with large uploads and was unnecessary for a date switch.
      const renderAfterDateRestore = () => {
        if (typeof NOL3.renderBusinessDayMetrics === "function") NOL3.renderBusinessDayMetrics();
        if (typeof renderOnFloorTowns === "function") renderOnFloorTowns();
        if (typeof renderDeliveryAreas === "function") renderDeliveryAreas();
        if (typeof renderIncomingOrders === "function") renderIncomingOrders();
        if (typeof updateIncomingOrdersNotification === "function") updateIncomingOrdersNotification();
        if (typeof renderPlanningExceptions === "function") renderPlanningExceptions();
        if (typeof renderUnassignedOrders === "function") renderUnassignedOrders();
        if (typeof renderParcelRecords === "function") renderParcelRecords();
      };
      // Rebuild the active page once after the dated snapshot is fully loaded.
      // The metric elements can be recreated by the page renderer; updating
      // only the old DOM nodes is why the data sometimes appeared only after
      // a manual Refresh. This is still much cheaper than a full app reload.
      try {
        const currentPage = NOL3.state?.currentPage || "planning";
        if (typeof NOL3.renderPage === "function") NOL3.renderPage(currentPage);
      } catch (_) {}

      // renderPage() recreates the Planning DOM, so the closure-scoped
      // Planning renderers must run AFTER that rebuild. Use the exported
      // refresh hook rather than trying to call those local functions from
      // this outer scope.
      const refreshCurrentPlanningDOM = () => {
        try {
          if (typeof NOL3.refreshPlanningViews === "function") {
            NOL3.refreshPlanningViews();
            return;
          }
        } catch (_) {}
        renderAfterDateRestore();
      };
      refreshCurrentPlanningDOM();
      requestAnimationFrame(() => {
        refreshCurrentPlanningDOM();
        requestAnimationFrame(refreshCurrentPlanningDOM);
        setTimeout(refreshCurrentPlanningDOM, 100);
        setTimeout(refreshCurrentPlanningDOM, 500);
      });
    } catch (error) {
      console.warn("NOL3: Could not switch LM snapshot for Business Date.", error);
    } finally {
      switching = false;
    }
  });
})();

// Global LM restore hook. Dashboard must refresh when saved LM data arrives;
// this listener is registered independently of the Planning page.
(function () {
  const refresh = () => {
    if (typeof NOL3.renderBusinessDayMetrics !== "function") return;
    NOL3.renderBusinessDayMetrics();
    requestAnimationFrame(() => NOL3.renderBusinessDayMetrics());
    setTimeout(() => {
      if (typeof NOL3.renderBusinessDayMetrics === "function") NOL3.renderBusinessDayMetrics();
    }, 50);
  };
  window.addEventListener("inventoryloaded", event => {
    if (event.detail?.type === "lm") refresh();
  });
  window.addEventListener("lminventoryfiltered", refresh);
})();

(function () {
  async function startApp() {
    NOL3.initHubModal();

    // IMPORTANT: Business-day metric functions are defined inside the Planning
    // page initializer. Previously, they were not exposed until the user
    // visited Planning, which is why Dashboard showed 0 on a fresh open.
    // Initialize that function scope once using a detached root so no Planning
    // navigation is required. The actual visible page remains Dashboard.
    try {
      if (typeof NOL3.renderBusinessDayMetrics !== "function" &&
          typeof NOL3.pages?.planning === "function") {
        const metricInitRoot = document.createElement("div");
        metricInitRoot.style.display = "none";
        metricInitRoot.setAttribute("aria-hidden", "true");
        document.body.appendChild(metricInitRoot);
        try { NOL3.pages.planning(metricInitRoot); } catch (error) {
          console.warn("NOL3: Planning metric initialization failed.", error);
        }
        metricInitRoot.remove();
      }
    } catch (error) {
      console.warn("NOL3: Could not initialize Dashboard metric functions.", error);
    }

    // Do not calculate metrics yet. Saved LM data is restored below.
    // Calculating before the IndexedDB restore completes can produce 0.

    // Render the shell immediately so the Business Date / CFR1 / LH COT
    // controls are populated on first open. Upload restoration can take a
    // moment because it uses IndexedDB, so it must not block the topbar.
    NOL3.renderSidebar();
    NOL3.renderTopbar();
    NOL3.renderPage(NOL3.getState().currentPage);

    // Global fallback for the NOW button. This listener survives every topbar
    // rebuild caused by navigation and cannot depend on the current menu.
    document.addEventListener("click", function (event) {
      const nowButton = event.target.closest?.("#businessDayNow");
      if (!nowButton) return;
      event.preventDefault();
      event.stopPropagation();
      if (typeof NOL3.setBusinessDateNow === "function") NOL3.setBusinessDateNow();
    }, true);

    window.addEventListener("hubchange", function () {
      NOL3.renderTopbar();
    });

    if (typeof NOL3.restoreSavedUploads === "function") {
      await NOL3.restoreSavedUploads();

      // Rebuild the LM filteredRows from the restored dataset before calculating
      // Business Date metrics. The dashboard uses Current Station = Selected Hub.
      const hub = (NOL3.getState && NOL3.getState().selectedHub) || "";
      const lm = NOL3.lmInventory;
      if (lm && Array.isArray(lm.rows) && Array.isArray(lm.headers)) {
        lm.filteredRows = hub
          ? NOL3.filterRowsToHub(lm.headers, lm.rows, 'auto').rows
          : lm.rows.slice();
      }

      // Preserve the Business Date selected by the user.
      // getBusinessDateValue() uses the saved date when one exists and only
      // falls back to today when no Business Date has ever been set.
      // Do NOT overwrite it with today's date on every startup/LM restore.
      const activeBusinessDate = (typeof getBusinessDateValue === "function")
        ? getBusinessDateValue()
        : (window.NOL3InitialBusinessDate || "");
      if (/^\d{4}-\d{2}-\d{2}$/.test(String(activeBusinessDate || ""))) {
        NOL3.currentBusinessDate = activeBusinessDate;
      }

      NOL3.renderTopbar();
      NOL3.renderPage(NOL3.getState().currentPage);

      const refreshStartupDashboard = () => {
        const state = NOL3.getState ? NOL3.getState() : {};
        const lmNow = NOL3.lmInventory;
        if (lmNow && Array.isArray(lmNow.rows) && Array.isArray(lmNow.headers)) {
          const hub = String(state.selectedHub || "").trim();
          lmNow.filteredRows = hub
            ? NOL3.filterRowsToHub(lmNow.headers, lmNow.rows, 'auto').rows
            : lmNow.rows.slice();
        }
        if (typeof NOL3.renderBusinessDayMetrics === "function") NOL3.renderBusinessDayMetrics();
      };
      // Keep checking briefly after startup because Android/local browser storage
      // can restore the saved LM dataset after the first Dashboard render.
      // Stop once the dataset is present and the Dashboard has been populated.
      refreshStartupDashboard();
      setTimeout(refreshStartupDashboard, 0);
      setTimeout(refreshStartupDashboard, 100);
      setTimeout(refreshStartupDashboard, 250);
      setTimeout(refreshStartupDashboard, 500);
      setTimeout(refreshStartupDashboard, 1000);
      setTimeout(refreshStartupDashboard, 2000);
      setTimeout(refreshStartupDashboard, 3000);
      setTimeout(refreshStartupDashboard, 5000);
      setTimeout(refreshStartupDashboard, 8000);
      setTimeout(refreshStartupDashboard, 12000);

      // Android content:// pages can defer IndexedDB restoration until after the
      // initial event loop. Poll only while the home page (Planning) is visible
      // so a later navigation elsewhere is never required to populate the cards.
      let startupRefreshAttempts = 0;
      const startupRefreshTimer = setInterval(() => {
        startupRefreshAttempts += 1;
        const state = NOL3.getState ? NOL3.getState() : {};
        const lmNow = NOL3.lmInventory;
        const visibleDashboard = state.currentPage === "planning";
        if (!visibleDashboard || startupRefreshAttempts > 60) {
          clearInterval(startupRefreshTimer);
          return;
        }
        if (lmNow && Array.isArray(lmNow.rows) && lmNow.rows.length &&
            typeof NOL3.renderBusinessDayMetrics === "function") {
          refreshStartupDashboard();
          const todayEl = document.getElementById("todayVolumeValue");
          if (todayEl && todayEl.textContent !== "0") {
            clearInterval(startupRefreshTimer);
          }
        }
      }, 250);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startApp);
  } else {
    startApp();
  }
})();

</script>

<script id="zone-settings-popup-behavior">
(function(){
  function markZoneSettingsPopups(){
    document.querySelectorAll(
      '[id*="zone"][id*="Modal"], [id*="zone"][id*="Dialog"], ' +
      '[class*="zone-settings"][class*="modal"], [class*="zone-settings"][class*="dialog"]'
    ).forEach(function(el){
      el.classList.add('zone-settings-popup-upgraded');
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', markZoneSettingsPopups);
  } else {
    markZoneSettingsPopups();
  }
  new MutationObserver(markZoneSettingsPopups).observe(document.documentElement,{subtree:true,childList:true});
})();

<script id="zone-settings-town-first-exact">
(function(){
  function sync(){
    var town=document.getElementById('zoneSettingsTown');
    var input=document.getElementById('zoneSettingsAreaName');
    var add=document.getElementById('zoneSettingsAddArea');
    if(!town||!input)return;
    var ok=String(town.value||'').trim()!=='' && town.value!=='No towns available';

<script id="zone-settings-area-input-guard">

    town.addEventListener('change',sync); sync();
