<script id="nol3-column-resolver-fix">
/* Restored V12 global column resolver. Several Planning modules call
 * NOL3.resolveColumnIndex(), but the helper was missing from the pre-rebuild
 * file. Keep this implementation dependency-free and compatible with V12. */
(function () {
  window.NOL3 = window.NOL3 || {};
  const root = window.NOL3;
  root._colLetterIndex = root._colLetterIndex || function (letters) {
    let n = 0;
    for (const ch of String(letters || '').toUpperCase()) {
      if (ch < 'A' || ch > 'Z') continue;
      n = n * 26 + (ch.charCodeAt(0) - 64);
    }
    return n - 1;
  };
  root._getIdxByNameOrLetter = root._getIdxByNameOrLetter || function (headers, names, letter) {
    const byName = typeof root._findHeaderIdx === 'function' ? root._findHeaderIdx(headers, names) : -1;
    if (byName >= 0) return byName;
    if (!letter) return -1;
    const idx = root._colLetterIndex(letter);
    return Array.isArray(headers) && idx >= 0 && idx < headers.length ? idx : -1;
  };
  const key = 'nol3_column_mapping_v1';
  root.getColumnMapping = root.getColumnMapping || function () {
    try {
      const raw = root.Storage?.get ? root.Storage.get(key) : (window.NOL3Storage?.get ? NOL3Storage.get(key) : null);
      const store = raw ? JSON.parse(raw) : {};
      const hub = String((root.getState && root.getState().selectedHub) || '').trim() || '__NO_HUB__';
      return store && typeof store[hub] === 'object' ? store[hub] : {};
    } catch (_) { return {}; }
  };
  root.setColumnMappingField = root.setColumnMappingField || function (namespace, field, headerName) {
    try {
      const getter = window.NOL3Storage?.get;
      const setter = window.NOL3Storage?.set;
      const raw = typeof getter === 'function' ? getter(key) : null;
      const store = raw ? JSON.parse(raw) : {};
      const hub = String((root.getState && root.getState().selectedHub) || '').trim() || '__NO_HUB__';
      store[hub] = store[hub] && typeof store[hub] === 'object' ? store[hub] : {};
      store[hub][namespace] = store[hub][namespace] && typeof store[hub][namespace] === 'object' ? store[hub][namespace] : {};
      const value = String(headerName || '').trim();
      if (value) store[hub][namespace][field] = value;
      else delete store[hub][namespace][field];
      if (typeof setter === 'function') setter(key, JSON.stringify(store));
      window.dispatchEvent(new CustomEvent('planningchanged', { detail: { type: 'column-mapping', source: 'local' } }));
    } catch (_) {}
  };
  root.resolveColumnIndex = root.resolveColumnIndex || function (headers, namespace, field, autoCandidates, autoLetter) {
    const mapping = root.getColumnMapping();
    const override = mapping?.[namespace]?.[field];
    if (override) {
      const idx = (headers || []).findIndex(h => String(h || '').replace(/^\uFEFF/, '').trim().toLowerCase() === String(override).trim().toLowerCase());
      if (idx >= 0) return idx;
    }
    if (autoLetter) return root._getIdxByNameOrLetter(headers, autoCandidates, autoLetter);
    return typeof root._findHeaderIdx === 'function' ? root._findHeaderIdx(headers, autoCandidates) : -1;
  };
})();
</script>
<script id="nol3-hub-row-filter">
/* Keep only rows that belong to the selected hub:
 * LM statuses      -> Current Station = Hub
 * Incoming statuses-> Destination Station = Hub
 * other statuses   -> Current OR Destination Station = Hub */
NOL3.filterRowsToHub = function (headers, rows, kind) {
  const hubRaw = String((NOL3.getState && NOL3.getState().selectedHub) || "").trim();
  const list = Array.isArray(rows) ? rows : [];
  if (!hubRaw) return { rows: list, dropped: 0 };
  const hs = (headers || []).map(h => String(h || "").replace(/^\uFEFF/, "").trim().toLowerCase());
  const ci = hs.indexOf("current station"), di = hs.indexOf("destination station"), si = hs.indexOf("status");
  if (ci < 0 && di < 0) return { rows: list, dropped: 0 };

  const LM = new Set(["lmhub_received", "delivered", "delivering", "onhold"]);
  const INC = new Set(["soc_lhtransported", "soc_lhtransporting", "soc_packed", "soc_packing"]);

  const normalizeStation = value => String(value ?? "")
    .replace(/^\uFEFF/, "")
    .trim()
    .toLowerCase()
    .replace(/[()\[\],.;:_\-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  const compactStation = value => normalizeStation(value).replace(/\b(station|hub)\b/g, "").replace(/\s+/g, "").trim();
  const targetNorm = normalizeStation(hubRaw);
  const targetCompact = compactStation(hubRaw);

  // Badoc-specific station-code aliases. Forward Order exports can contain the
  // numeric station ID instead of the text name. 3061 is Badoc Hub in this app.
  const aliases = new Set([targetNorm, targetCompact]);
  if (targetCompact === "badoc" || targetNorm === "badoc hub") {
    aliases.add("badoc");
    aliases.add("badoc hub");
    aliases.add("3061");
  }

  const stationMatches = value => {
    const n = normalizeStation(value);
    const c = compactStation(value);
    return aliases.has(n) || aliases.has(c);
  };

  const eq = (r, i) => i >= 0 && stationMatches(r[i]);
  const kept = list.filter(r => {
    let k = kind || "auto";
    if (k === "auto") {
      const st = si >= 0 ? String(r[si] || "").trim().toLowerCase().replace(/\s+/g, "_") : "";
      k = LM.has(st) ? "lm" : INC.has(st) ? "incoming" : "any";
    }
    // LMHub/Delivered/Delivering/OnHold are on-hub records: Current Station
    // is authoritative when present, but Destination Station is accepted when
    // Current Station is blank (common in Forward Order exports).
    if (k === "lm") return eq(r, ci) || (ci >= 0 && !String(r[ci] ?? "").trim() && eq(r, di));
    // Incoming/linehaul records belong to the destination hub.
    if (k === "incoming") return eq(r, di) || (di >= 0 && !String(r[di] ?? "").trim() && eq(r, ci));
    // Mixed/unknown exports: accept either station so no valid Forward Order
    // record disappears before Planning gets a chance to classify it.
    return eq(r, ci) || eq(r, di);
  });
  return { rows: kept, dropped: list.length - kept.length };
};
NOL3.rowsToCSV = function (headers, rows) {
  const esc = v => { v = String(v ?? ""); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [headers, ...rows].map(r => r.map(esc).join(",")).join("\r\n") + "\r\n";
};
</script>

<script id="badoc-lh-trip-dashboard">

  const getDetails = () => {

    const ih=n.incomingInventory.headers||[], lh=n.lineHaulInventory.headers||[];

    const ci=findCol(ih,["Current Station"],32), di=findCol(ih,["Destination Station"],37), ni=findCol(ih,["Next Station"],38),
          ti=findCol(lh,["Line Haul Task ID","Linehaul Task ID","Line Haul Task","Linehaul Task","Task ID","Task","Linehaul"],0),

    return {rows,currentStations:[...cs].sort((a,b)=>a.localeCompare(b)),destinationStations:[...ds].sort((a,b)=>a.localeCompare(b)),nextStations:[...ns].sort((a,b)=>a.localeCompare(b))};
  };
  const render = () => {
    const list=document.getElementById("lhTripList"),summary=document.getElementById("lhTripSummary"),cot=document.getElementById("lhTripCotLabel"); if(!list)return;

    const d=getDetails(), f=getFilters();
    const fill=(id,vals,selected)=>{const el=document.getElementById(id);if(!el)return;el.innerHTML='<option value="">All</option>'+vals.map(v=>'<option value="'+esc(v)+'"'+(v===selected?' selected':'')+'>'+esc(v)+'</option>').join("");};
    fill("lhFilterCurrent",d.currentStations,f.current);fill("lhFilterDestination",d.destinationStations,f.destination);fill("lhFilterNext",d.nextStations,f.next);
    if(!d.rows.length){list.innerHTML='<div class="lh-trip-empty">'+(window.NOL3?.incomingInventory?.rows?.length&&window.NOL3?.lineHaulInventory?.rows?.length?'No matched LH trips found. Check that the Line Haul Task ID and SPX TN columns are present in both files.':'Upload Incoming Inventory and the Incoming Inventory From-To List to see LH trips here.')+'</div>';if(summary)summary.innerHTML="";return;}
    const filtered=d.rows.filter(r=>(!f.current||r.current===f.current)&&(!f.destination||r.destination===f.destination)&&(!f.next||r.next===f.next));
    const totals=new Map();filtered.forEach(r=>totals.set(r.task,(totals.get(r.task)||0)+1));
    const arrivals=getArrivalStore(), cotMin=cotHour*60;

    const rows=[...totals.entries()].map(([task,total])=>{const time=arrivals[task]||"";return{task,total,time,status:classify(time)};}).sort((a,b)=>{if(!!a.time!==!!b.time)return a.time?-1:1;if(a.time!==b.time)return a.time.localeCompare(b.time);return a.task.localeCompare(b.task);});
    if(!rows.length){list.innerHTML='<div class="lh-trip-empty">No LH trips match the selected Current / Destination / Next Station filters.</div>';if(summary)summary.innerHTML="";return;}
    const counts={before:0,after:0,pending:0};rows.forEach(r=>counts[r.status]+=r.total);if(summary)summary.innerHTML='<span class="lh-trip-chip before">Before COT · '+counts.before.toLocaleString()+'</span><span class="lh-trip-chip after">After COT · '+counts.after.toLocaleString()+'</span><span class="lh-trip-chip pending">No time set · '+counts.pending.toLocaleString()+'</span>';
    list.innerHTML=rows.map(r=>'<div class="lh-trip-row" data-lh-task="'+esc(r.task)+'"><div class="lh-trip-row-top"><div class="lh-trip-name" title="'+esc(r.task)+'">'+esc(r.task)+'</div><div class="lh-trip-total">'+r.total.toLocaleString()+' orders</div></div><div class="lh-trip-row-bottom"><div class="lh-trip-time-wrap"><input class="lh-trip-time" type="time" value="'+esc(r.time)+'" aria-label="Expected arrival time for '+esc(r.task)+'"></div><span class="lh-trip-badge '+r.status+'">'+(r.status==='before'?'Before COT':r.status==='after'?'After COT':'No time set')+'</span></div></div>').join("");
    list.querySelectorAll(".lh-trip-time").forEach(input=>input.addEventListener("change",()=>{const row=input.closest(".lh-trip-row"),task=row?.dataset.lhTask||"";if(task){setArrival(task,input.value||"");render();}}));
  };
  const init=()=>{if(!window.NOL3)return;window.NOL3.renderLinehaulTripDashboard=render;document.getElementById("lhFilterCurrent")?.addEventListener("change",e=>{const f=getFilters();f.current=e.target.value;saveFilters(f);render();});document.getElementById("lhFilterDestination")?.addEventListener("change",e=>{const f=getFilters();f.destination=e.target.value;saveFilters(f);render();});document.getElementById("lhFilterNext")?.addEventListener("change",e=>{const f=getFilters();f.next=e.target.value;saveFilters(f);render();});document.getElementById("lhTripFilterClear")?.addEventListener("click",()=>{const f={current:"",destination:"",next:""};saveFilters(f);render();});render();window.addEventListener("inventoryloaded",e=>{if(["incoming","linehaul"].includes(e.detail?.type))render();});window.addEventListener("inventorycleared",e=>{if(["incoming","linehaul"].includes(e.detail?.type)||e.detail?.type==="all")render();});window.addEventListener("hubchange",render);window.addEventListener("planningchanged",e=>{if(e.detail?.type==="business-day-settings"||e.detail?.type==="linehaul-arrival")render();});};
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else setTimeout(init,0);

<script id="nol3-inventory-upload-fallback">
(function(){

    if (window.__NOL3InventoryFallbackBound) return;
    window.__NOL3InventoryFallbackBound = true;
    document.addEventListener('change', async function(event){
      const input = event.target && event.target.id === 'unifiedInventoryFile' ? event.target : null;
      if (!input || input.dataset.nol3InventoryBound === '1') return;
      const files = Array.from(input.files || []);

      const summary = document.getElementById('unifiedInventorySummary');
      if (summary) summary.textContent = files.length === 1 ? files[0].name : files.length + ' files selected';
      if (status) status.textContent = 'Processing inventory…';
      const batchInfo = {errors:[],added:0,dups:0,ignored:0};
      try {
        if (typeof NOL3._processUnifiedInventoryFile !== 'function') {
          throw new Error('Inventory upload handler is not initialized. Please reload the page.');
        }
        files.sort((a,b)=>(a.lastModified||0)-(b.lastModified||0));
        for (const file of files) await NOL3._processUnifiedInventoryFile(file,batchInfo);

        }
      } catch(e) {
        console.error('NOL3 inventory fallback:',e);

  }

<script id="nol3-forward-planning-authority-v8">
/*
 * V8 Forward Order Planning Authority
 *
 * The upload itself is now known to succeed. The remaining bug is a race:
 * another inventory/cloud restore path can empty/replace NOL3.lmInventory after
 * Forward Order ingestion, so Planning renders "Upload LM Inventory" even though
 * the file was accepted. Keep a compact hub+today snapshot of the exact Forward
 * Order merge and rehydrate it BEFORE Planning renders whenever the live LM object
 * is empty.
 */
(function () {
  const KEY = "NOL3_FORWARD_PLANNING_AUTHORITY_V8";

  const readStore = () => {
    try {
      const raw = (window.NOL3Storage && typeof NOL3Storage.get === "function")
        ? NOL3Storage.get(KEY)
        : window.localStorage.getItem(KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      return parsed && typeof parsed === "object" ? parsed : {};
    } catch (_) { return {}; }
  };
  const writeStore = (store) => {
    try {
      const raw = JSON.stringify(store || {});
      if (window.NOL3Storage && typeof NOL3Storage.set === "function") NOL3Storage.set(KEY, raw);
      else window.localStorage.setItem(KEY, raw);
      return true;
    } catch (_) { return false; }
  };
  const removeStore = () => {
    try {
      if (window.NOL3Storage && typeof NOL3Storage.remove === "function") NOL3Storage.remove(KEY);
      else window.localStorage.removeItem(KEY);
    } catch (_) {}
  };
  const today = () => {
    try { if (typeof getNOL3TodayDate === "function") return getNOL3TodayDate(); } catch (_) {}
    return new Date().toISOString().slice(0, 10);
  };
  const hubName = () => String((NOL3.getState && NOL3.getState().selectedHub) || "").trim();
  const keyFor = (hub, date) => `${String(hub || "").trim()}::${String(date || today()).trim()}`;

  const cloneRows = rows => Array.isArray(rows) ? rows.map(r => Array.isArray(r) ? [...r] : r) : [];

  NOL3.captureForwardPlanningSnapshot = function (lm, hub, date) {
    try {
      if (!lm || !Array.isArray(lm.rows) || !lm.rows.length || !Array.isArray(lm.headers) || !lm.headers.length) return false;
      const h = String(hub || hubName()).trim();
      const d = String(date || today()).trim();
      if (!h || !d) return false;
      const store = readStore();
      store[keyFor(h, d)] = {
        hub: h,
        businessDate: d,
        fileName: lm.fileName || "",
        headers: [...lm.headers],
        rows: cloneRows(lm.rows),
        filteredRows: cloneRows(lm.filteredRows),
        files: Array.isArray(lm.files) ? lm.files.map(f => ({
          name: f?.name || "",
          lastModified: f?.lastModified || 0
        })).filter(f => f.name) : [],
        savedAt: new Date().toISOString(),
        source: "forward-order"
      };
      // Keep only a small number of snapshots.
      const ordered = Object.entries(store).sort((a,b) => String(b[1]?.savedAt || "").localeCompare(String(a[1]?.savedAt || "")));
      const trimmed = {};
      ordered.slice(0, 20).forEach(([k,v]) => { trimmed[k] = v; });
      return writeStore(trimmed);
    } catch (error) {
      console.warn("[NOL3] V8 forward planning snapshot failed", error);
      return false;
    }
  };

  NOL3.restoreForwardPlanningSnapshot = function () {
    try {
      const live = NOL3.lmInventory;
      if (live && Array.isArray(live.rows) && live.rows.length) return false;
      const h = hubName();
      const d = today();
      if (!h || !d) return false;
      const store = readStore();
      const snap = store[keyFor(h, d)];
      if (!snap || !Array.isArray(snap.rows) || !snap.rows.length) return false;
      NOL3.lmInventory = {
        files: Array.isArray(snap.files) ? snap.files : [],
        fileName: snap.fileName || "",
        headers: Array.isArray(snap.headers) ? snap.headers : [],
        rows: cloneRows(snap.rows),
        filteredRows: [],
        loadedAt: snap.savedAt || new Date().toISOString(),
        rowCount: snap.rows.length,
        rawText: "",
        isForwardOrderSnapshot: true
      };
      if (typeof NOL3.filterRowsToHub === "function") {
        try {
          NOL3.lmInventory.filteredRows = NOL3.filterRowsToHub(
            NOL3.lmInventory.headers,
            NOL3.lmInventory.rows,
            "auto"
          ).rows;
        } catch (_) {
          NOL3.lmInventory.filteredRows = cloneRows(snap.filteredRows || snap.rows);
        }
      } else {
        NOL3.lmInventory.filteredRows = cloneRows(snap.filteredRows || snap.rows);
      }
      console.info("[NOL3] V8 Forward Planning snapshot restored", {
        hub: h, businessDate: d,
        rows: NOL3.lmInventory.rows.length,
        filteredRows: NOL3.lmInventory.filteredRows.length
      });
      return true;
    } catch (error) {
      console.warn("[NOL3] V8 forward planning restore failed", error);
      return false;
    }
  };

  // Clear the authority snapshot only on an intentional LM/all clear.
  window.addEventListener("inventorycleared", event => {
    const t = event?.detail?.type;
    if (t === "lm" || t === "all") removeStore();
  });

  // On the upload event, preserve the current non-empty forward dataset and
  // immediately repair Planning if a restore has already emptied live LM data.
  window.addEventListener("inventoryloaded", event => {
    const detail = event?.detail || {};
    if (detail.type !== "lm") return;
    if (detail.source === "forward-final" && NOL3.lmInventory?.rows?.length) {
      NOL3.captureForwardPlanningSnapshot(NOL3.lmInventory, hubName(), today());
    }
    if (NOL3.getState?.().currentPage === "planning") {
      if (!NOL3.lmInventory?.rows?.length && NOL3.restoreForwardPlanningSnapshot()) {
        try { NOL3.refreshPlanningViews?.(); } catch (_) {}
        try { NOL3.renderBusinessDayMetrics?.(); } catch (_) {}
      }
    }
  });

  window.addEventListener("lminventoryfiltered", () => {
    if (NOL3.getState?.().currentPage !== "planning") return;
    if (!NOL3.lmInventory?.rows?.length && NOL3.restoreForwardPlanningSnapshot()) {
      try { NOL3.refreshPlanningViews?.(); } catch (_) {}
      try { NOL3.renderBusinessDayMetrics?.(); } catch (_) {}
    }
  });

  // Hydrate before Planning's DOM is created.
  const oldRenderPage = NOL3.renderPage;
  if (typeof oldRenderPage === "function" && !NOL3._v8ForwardPlanningWrapped) {
    NOL3.renderPage = function (page) {
      if (page === "planning") {
        NOL3.restoreForwardPlanningSnapshot();
      }
      return oldRenderPage.apply(this, arguments);
    };
    NOL3._v8ForwardPlanningWrapped = true;
  }

  // Restore once on startup as well, but only when live LM is empty.
  try { NOL3.restoreForwardPlanningSnapshot(); } catch (_) {}
})();
</script>

<script id="nol3-planning-lm-source-v9">
/* V9: Planning reads from a dedicated, synchronous local snapshot. */
(function () {
  'use strict';
  const KEY = 'NOL3_PLANNING_LM_SOURCE_V9';

  const today = () => {
    try {
      if (typeof getNOL3TodayDate === 'function') {
        const d = String(getNOL3TodayDate() || '').trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
      }
    } catch (_) {}
    return new Date().toISOString().slice(0, 10);
  };
  const hub = () => String((NOL3.getState && NOL3.getState().selectedHub) || '').trim();
  const date = () => {
    try {
      const d = typeof NOL3.getBusinessDateValue === 'function' ? NOL3.getBusinessDateValue() : '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(String(d))) return String(d);
    } catch (_) {}
    return today();
  };
  const slot = (h, d) => `${String(h || '').trim()}::${String(d || '').trim()}`;
  const cloneRows = rows => Array.isArray(rows) ? rows.map(r => Array.isArray(r) ? [...r] : r) : [];

  const readStore = () => {
    try {
      const raw = window.localStorage.getItem(KEY);
      const v = raw ? JSON.parse(raw) : {};
      return v && typeof v === 'object' ? v : {};
    } catch (_) { return {}; }
  };
  const writeStore = store => {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(store || {}));
      return true;
    } catch (_) { return false; }
  };

  function saveDatasetSnapshot(dataset, files, businessDateValue, source, hubValue) {
    try {
      if (!dataset || !Array.isArray(dataset.rows) || !dataset.rows.length || !Array.isArray(dataset.headers) || !dataset.headers.length) return false;
      const h = String(hubValue || hub()).trim();
      const d = String(businessDateValue || today()).trim();
      if (!h || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
      const store = readStore();
      store[slot(h, d)] = {
        hub: h,
        businessDate: d,
        fileName: String(dataset.fileName || ''),
        headers: [...dataset.headers],
        rows: cloneRows(dataset.rows),
        files: Array.isArray(files) ? files.map(f => ({
          name: String(f?.name || ''),
          lastModified: Number(f?.lastModified || 0)
        })).filter(f => f.name) : [],
        savedAt: new Date().toISOString(),
        source: String(source || 'v9')
      };
      const ordered = Object.entries(store).sort((a,b) =>
        String(b[1]?.savedAt || '').localeCompare(String(a[1]?.savedAt || ''))
      );
      const trimmed = {};
      ordered.slice(0, 5).forEach(([k,v]) => { trimmed[k] = v; });
      return writeStore(trimmed);
    } catch (e) {
      console.warn('[NOL3 V9] save dataset failed', e);
      return false;
    }
  }

  function saveSnapshot(source) {
    const lm = NOL3.lmInventory;
    if (!lm || !Array.isArray(lm.rows) || !lm.rows.length) return false;
    return saveDatasetSnapshot(lm, lm.files, date(), source, hub());
  }

  function getSnapshot() {
    const h = hub(), d = date();
    if (!h || !d) return null;
    const store = readStore();
    return store[slot(h,d)] || null;
  }

  function restore(force) {
    try {
      const snap = getSnapshot();
      if (!snap || !Array.isArray(snap.rows) || !snap.rows.length || !Array.isArray(snap.headers) || !snap.headers.length) return false;
      const live = NOL3.lmInventory;
      if (!force && live && Array.isArray(live.rows) && live.rows.length) return false;

      const restored = {
        files: Array.isArray(snap.files) ? snap.files.map(f => ({name:f.name,lastModified:f.lastModified || 0})) : [],
        fileName: snap.fileName || '',
        headers: [...snap.headers],
        rows: cloneRows(snap.rows),
        filteredRows: [],
        loadedAt: snap.savedAt || new Date().toISOString(),
        rowCount: snap.rows.length,
        rawText: '',
        isPlanningSourceV9: true
      };
      try {
        if (typeof NOL3.filterRowsToHub === 'function') {
          restored.filteredRows = NOL3.filterRowsToHub(restored.headers, restored.rows, 'auto').rows;
        } else {
          restored.filteredRows = restored.rows.slice();
        }
      } catch (_) {
        restored.filteredRows = restored.rows.slice();
      }
      NOL3.planningLMInventory = restored;
      NOL3.lmInventory = restored;
      return true;
    } catch (e) {
      console.warn('[NOL3 V9] restore failed', e);
      return false;
    }
  }

  function clearSnapshot() {
    try {
      const store = readStore();
      const h = hub();
      if (h) {
        delete store[slot(h, date())];
        delete store[slot(h, today())];
      }
      writeStore(store);
      delete NOL3.planningLMInventory;
    } catch (_) {}
  }

  NOL3.savePlanningLMSourceV9 = saveSnapshot;
  NOL3.savePlanningLMDatasetV9 = saveDatasetSnapshot;
  NOL3.restorePlanningLMSourceV9 = restore;
  NOL3.clearPlanningLMSourceV9 = clearSnapshot;

  // CRITICAL: capture the dataset passed into saveLMHistorySnapshot BEFORE
  // any cloud commit can replace NOL3.lmInventory. The upload path already
  // calls this function with the freshly-built Forward Order dataset.
  const originalSaveHistory = NOL3.saveLMHistorySnapshot;
  if (typeof originalSaveHistory === 'function' && !NOL3._planningSaveHistoryV9Wrapped) {
    NOL3.saveLMHistorySnapshot = async function(businessDateValue, dataset, files) {
      try {
        const name = String(dataset?.fileName || files?.[0]?.name || '').toLowerCase();
        const isForward = !!dataset?.isForwardOrderSnapshot || /forward.*order|export_forward_order/i.test(name);
        if (isForward && Array.isArray(dataset?.rows) && dataset.rows.length) {
          saveDatasetSnapshot(dataset, files, businessDateValue || today(), 'saveLMHistorySnapshot-forward', hub());
        }
      } catch (_) {}
      return originalSaveHistory.apply(this, arguments);
    };
    NOL3._planningSaveHistoryV9Wrapped = true;
  }

  // Save ONLY successful non-empty LM uploads. An empty restore never overwrites it.
  window.addEventListener('inventoryloaded', event => {
    const detail = event?.detail || {};
    if (detail.type !== 'lm' || detail.empty === true) return;
    const name = String(detail.fileName || NOL3.lmInventory?.fileName || '').toLowerCase();
    const source = String(detail.source || '').toLowerCase();
    const isForward = source === 'forward-final' || /forward.*order|export_forward_order/i.test(name);
    if (isForward && NOL3.lmInventory?.rows?.length) saveSnapshot(source || 'forward-upload');

    // If Planning is visible, repair it immediately after any LM event.
    if (NOL3.getState?.().currentPage === 'planning') {
      setTimeout(() => {
        const repaired = restore(false);
        if (repaired) {
          try { NOL3.refreshPlanningViews?.(); } catch (_) {}
          try { NOL3.renderBusinessDayMetrics?.(); } catch (_) {}
        }
      }, 0);
    }
  }, true);

  window.addEventListener('lminventoryfiltered', () => {
    if (NOL3.lmInventory?.rows?.length && NOL3.lmInventory?.isForwardOrderSnapshot) saveSnapshot('forward-filtered');
  }, true);

  window.addEventListener('inventorycleared', event => {
    const type = event?.detail?.type;
    if (type === 'lm' || type === 'all') clearSnapshot();
  }, true);

  // Wrap the final renderPage, so Planning receives the source BEFORE its DOM is built.
  const oldRenderPage = NOL3.renderPage;
  if (typeof oldRenderPage === 'function' && !NOL3._planningLMSourceV9Wrapped) {
    NOL3.renderPage = function(page) {
      if (page === 'planning') restore(false);
      return oldRenderPage.apply(this, arguments);
    };
    NOL3._planningLMSourceV9Wrapped = true;
  }

  // Wrap the exported planning refresh hook too. Older restore code can call it later.
  const oldRefresh = NOL3.refreshPlanningViews;
  if (typeof oldRefresh === 'function' && !NOL3._planningRefreshSourceV9Wrapped) {
    NOL3.refreshPlanningViews = function() {
      restore(false);
      return oldRefresh.apply(this, arguments);
    };
    NOL3._planningRefreshSourceV9Wrapped = true;
  }

  // Re-apply the dedicated source after dated history loads.
  const oldLoadHistory = NOL3.loadLMHistoryForDate;
  if (typeof oldLoadHistory === 'function' && !NOL3._planningHistorySourceV9Wrapped) {
    NOL3.loadLMHistoryForDate = async function(dateValue) {
      const result = await oldLoadHistory.apply(this, arguments);
      if (NOL3.getState?.().currentPage === 'planning') restore(false);
      return result;
    };
    NOL3._planningHistorySourceV9Wrapped = true;
  }

  try { if (NOL3.getState?.().currentPage === 'planning') restore(false); } catch (_) {}
})();
</script>
<script id="badoc-planning-spx-inventory-sync-v1">
(function(){
  if(window.__badocPlanningSpxInventorySyncV1)return;
  window.__badocPlanningSpxInventorySyncV1=true;

  const BRIDGE_SOURCE="BADOC_SPX_BRIDGE";
  const PAGE_SOURCE="BADOC_PAGE";
  const BUSY_TIMEOUT=180000;

  const setStatus=(id,msg,state)=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.textContent=msg||"";
    el.classList.remove("is-working","is-success","is-error");
    if(state)el.classList.add("is-"+state);
  };

  const setBusy=(id,busy)=>{
    const btn=document.getElementById(id);
    if(!btn)return;
    btn.disabled=!!busy;
    if(busy)btn.dataset.busy="1";else delete btn.dataset.busy;
  };

  const post=(type,data={})=>window.postMessage({source:PAGE_SOURCE,type,...data},"*");

  function todayManilaBounds(){
    const parts=new Intl.DateTimeFormat("en-CA",{
      timeZone:"Asia/Manila",year:"numeric",month:"2-digit",day:"2-digit"
    }).formatToParts(new Date());
    const map=Object.fromEntries(parts.filter(p=>p.type!=="literal").map(p=>[p.type,p.value]));
    const y=Number(map.year),m=Number(map.month)-1,d=Number(map.day);
    const startMs=Date.UTC(y,m,d)-8*60*60*1000;
    const endMs=startMs+24*60*60*1000-1;
    const today=`${map.year}-${map.month}-${map.day}`;
    return {
      date:today,
      assignedStartUnix:Math.floor(startMs/1000),
      assignedEndUnix:Math.floor(endMs/1000),
      assignedStart:`${today} 00:00:00`,
      assignedEnd:`${today} 23:59:59`,
      assignedLabel:`${today} 00:00:00 → ${today} 23:59:59`
    };
  }

  function fileFromText(text,name){
    return new File([String(text||"")],name,{type:"text/csv",lastModified:Date.now()});
  }

  function parseCsvForBridge(text){
    const out=[];
    let row=[],cell="",quote=false;
    const t=String(text||"").replace(/^\uFEFF/,'');
    for(let i=0;i<t.length;i++){
      const ch=t[i],next=t[i+1];
      if(ch==='"' && quote && next==='"'){cell+='"';i++;continue;}
      if(ch==='"'){quote=!quote;continue;}
      if(ch===',' && !quote){row.push(cell);cell="";continue;}
      if((ch==='\n'||ch==='\r')&&!quote){
        if(ch==='\r'&&next==='\n')i++;
        row.push(cell);
        if(row.some(v=>String(v).trim()!==''))out.push(row);
        row=[];cell="";continue;
      }
      cell+=ch;
    }
    if(cell!==""||row.length){row.push(cell);if(row.some(v=>String(v).trim()!==''))out.push(row);}
    return out;
  }

  function csvForBridge(rows){
    const esc=v=>{const x=String(v??"");return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;};
    return rows.map(r=>r.map(esc).join(',')).join('\r\n')+'\r\n';
  }

  function normalizeBridgeStatus(v){
    return String(v??'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  }

  // Station matching is case/spacing/punctuation tolerant so SPX values such as
  // "BADOC HUB", "Badoc Hub", or "SOC 6" are treated consistently.
  function normalizeBridgeStation(v){
    return String(v??'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'');
  }

  function findBridgeHeaderIndex(headers,candidates){
    const wanted=new Set(candidates.map(v=>String(v).trim().toLowerCase()));
    return headers.findIndex(h=>wanted.has(String(h??'').trim().toLowerCase()));
  }

  function filterInboundInventoryCsv(text){
    const rows=parseCsvForBridge(text);
    if(rows.length<2)return {csv:'',count:0,total:0};
    const headers=rows[0].map(v=>String(v??'').trim());
    const statusIdx=findBridgeHeaderIndex(headers,['status','spx status','parcel status','order status']);
    const currentIdx=findBridgeHeaderIndex(headers,['current station','current station name','current hub','current hub name','station','station name']);
    const destinationIdx=findBridgeHeaderIndex(headers,['destination station','destination station name','destination hub','destination hub name','to station','to hub']);
    if(statusIdx<0)throw new Error('Inbound SPX export has no Status column.');
    if(currentIdx<0)throw new Error('Inbound SPX export has no Current Station column.');
    if(destinationIdx<0)throw new Error('Inbound SPX export has no Destination Station column.');

    // Filter 1:
    // Status = LMHub_Received OR SOC_LHTransporting OR SOC_LHTransported
    // Destination Station = BADOC HUB
    // Current Station = BADOC HUB OR CAGAYAN DC OR SOC6
    const allowedStatus=new Set(['lmhub_received','soc_lhtransporting','soc_lhtransported']);
    const allowedCurrent=new Set(['badochub','cagayandc','soc6']);
    const requiredDestination='badochub';
    const kept=rows.slice(1).filter(r=>{
      const status=normalizeBridgeStatus(r[statusIdx]);
      const current=normalizeBridgeStation(r[currentIdx]);
      const destination=normalizeBridgeStation(r[destinationIdx]);
      const statusOk=allowedStatus.has(status) || allowedStatus.has(status.replace(/_/g,''));
      return statusOk && destination===requiredDestination && allowedCurrent.has(current);
    });
    if(!kept.length)throw new Error('No inbound rows matched: Status = LMHub_Received / SOC_LHTransporting / SOC_LHTransported; Destination Station = BADOC HUB; Current Station = BADOC HUB / CAGAYAN DC / SOC6.');
    return {csv:csvForBridge([headers,...kept]),count:kept.length,total:rows.length-1};
  }

  function parseBridgeDate(v){
    const raw=String(v??'').trim();
    if(!raw)return null;
    if(/^\d{10,13}$/.test(raw)){
      const n=Number(raw);
      return new Date(raw.length===10?n*1000:n);
    }
    let d=new Date(raw);
    if(!Number.isFinite(d.getTime()) && /^\d{4}[-/]\d{1,2}[-/]\d{1,2}(?:[ T]\d{1,2}:\d{2}(?::\d{2})?)?$/.test(raw)){
      d=new Date(raw.replace(/^([0-9]{4})\/([0-9]{1,2})\/([0-9]{1,2})/,"$1-$2-$3").replace(' ','T')+'+08:00');
    }
    return Number.isFinite(d.getTime())?d:null;
  }

  function filterDeliveryInventoryCsv(text){
    const rows=parseCsvForBridge(text);
    if(rows.length<2)return {csv:'',count:0,total:0,assignedLabel:todayManilaBounds().assignedLabel};
    const headers=rows[0].map(v=>String(v??'').trim());
    const statusIdx=findBridgeHeaderIndex(headers,[
      'status','spx status','parcel status','order status','status log','status_log','display status','display_status'
    ]);
    const currentIdx=findBridgeHeaderIndex(headers,[
      'current station','current station name','current hub','current hub name','station','station name','current_station_name'
    ]);
    const destinationIdx=findBridgeHeaderIndex(headers,[
      'destination station','destination station name','destination hub','destination hub name','to station','to hub','station_name'
    ]);
    if(statusIdx<0)throw new Error('Delivery SPX export has no Status column.');
    if(currentIdx<0)throw new Error('Delivery SPX export has no Current Station column.');
    if(destinationIdx<0)throw new Error('Delivery SPX export has no Destination Station column.');

    // Filter 2:
    // Status = Delivering OR Delivered OR OnHold
    // Current Station = BADOC HUB
    // Destination Station = BADOC HUB
    // Assignment date = today. The bridge request itself already applies
    // pick_up_time = today's exact 00:00:00–23:59:59 window. Some SPX CSVs do
    // not expose that field consistently, so the local CSV filter must not
    // reject valid server-filtered rows just because the timestamp column is
    // absent or blank.
    const allowedStatus=new Set(['delivering','delivered','onhold','on_hold','2','4','5']);
    const requiredStation='badochub';
    const normalizeDeliveryStation=v=>String(v??'').replace(/^\uFEFF/,'').trim().toLowerCase()
      .replace(/[()\[\],.;:_\-]+/g,' ')
      .replace(/\s+/g,' ')
      .trim();
    const stationMatches=v=>{
      const raw=normalizeDeliveryStation(v);
      const compact=raw.replace(/\b(station|hub)\b/g,'').replace(/\s+/g,'');
      return compact===requiredStation || /(^|[^a-z0-9])badoc([^a-z0-9]|$)/.test(raw)
        || /\bbadoc\s+hub\b/.test(raw) || compact==='3061' || /(^|[^0-9])3061([^0-9]|$)/.test(raw);
    };

    const day=todayManilaBounds();
    const assignedIdx=findBridgeHeaderIndex(headers,[
      'assigned time','assigned at','assigned timestamp','assignment time','assigned date time',
      'delivering time','pickup time','pick up time'
    ]);
    const start=day.assignedStartUnix*1000,end=(day.assignedEndUnix+1)*1000;

    let dateChecked=0, dateAccepted=0;
    const kept=rows.slice(1).filter(r=>{
      const statusRaw=String(r[statusIdx]??'').trim().toLowerCase();
      const status=normalizeBridgeStatus(statusRaw);
      const statusOk=allowedStatus.has(status) || allowedStatus.has(status.replace(/_/g,''));
      if(!statusOk)return false;
      if(!stationMatches(r[currentIdx]))return false;
      if(!stationMatches(r[destinationIdx]))return false;

      // Trust the bridge's server-side today filter. If the CSV exposes an
      // assignment timestamp, validate it; if not/blank/unparseable, do not
      // discard the row because the SPX request already constrained it.
      if(assignedIdx>=0){
        const rawDate=String(r[assignedIdx]??'').trim();
        if(rawDate){
          dateChecked++;
          const d=parseBridgeDate(rawDate);
          if(d && d.getTime()>=start && d.getTime()<end){dateAccepted++; return true;}
          if(d && !(d.getTime()>=start && d.getTime()<end))return false;
          // Unparseable timestamp: retain because the server-side filter is authoritative.
        }
      }
      return true;
    });

    if(!kept.length){
      throw new Error(`No delivery rows matched SPX result: Status = Delivering / Delivered / OnHold; Current Station = BADOC HUB; Destination Station = BADOC HUB; server-side Assigned Time = ${day.assignedLabel}. Returned ${(rows.length-1).toLocaleString()} rows.`);
    }
    return {
      csv:csvForBridge([headers,...kept]),
      count:kept.length,
      total:rows.length-1,
      assignedLabel:day.assignedLabel,
      dateChecked,
      dateAccepted
    };
  }

  function dispatchToUnifiedInventory(text,name){
    return new Promise((resolve,reject)=>{
      const input=document.getElementById("unifiedInventoryFile");
      if(!input)return reject(new Error("Inventory upload control is not available. Open the Inventory page and try again."));

      let done=false;
      let timer=null;
      const finish=(fn,value)=>{
        if(done)return;
        done=true;
        clearTimeout(timer);
        window.removeEventListener("unifiedinventoryloaded",onLoaded);
        fn(value);
      };
      const onLoaded=e=>{
        const d=e.detail||{};
        if(d.type===undefined || d.fileName===undefined || String(d.fileName)===String(name)) finish(resolve,d);
      };
      timer=setTimeout(()=>finish(reject,new Error("Inventory import timed out after the SPX export was received.")),BUSY_TIMEOUT);
      window.addEventListener("unifiedinventoryloaded",onLoaded);

      try{
        const dt=new DataTransfer();
        dt.items.add(fileFromText(text,name));
        input.files=dt.files;

        // Mark synthetic SPX imports so the manual Forward Order compatibility
        // handler does not intercept the bridge-generated export. Without this
        // guard, export_forward_order.csv is mistaken for a user-uploaded
        // Forward Order file and the whole SPX export is written into LM, which
        // breaks Incoming Orders and can put transport rows into Total Volume.
        window.__NOL3BridgeInventoryDispatch = true;
        try {
          input.dispatchEvent(new Event("change",{bubbles:true}));
        } finally {
          window.__NOL3BridgeInventoryDispatch = false;
        }
      }catch(err){
        window.__NOL3BridgeInventoryDispatch = false;
        finish(reject,err);
      }
    });
  }

  function importLinehaulFromBridge(text,name){
    return new Promise((resolve,reject)=>{
      if(!window.NOL3 || typeof NOL3.readLineHaulInventory!=="function")
        return reject(new Error("Incoming Inventory From-To List processor is not available. Refresh BADOC and try again."));

      let done=false;
      let timer=null;
      const finish=(fn,value)=>{
        if(done)return;
        done=true;
        clearTimeout(timer);
        window.removeEventListener("inventoryloaded",onLoaded);
        fn(value);
      };
      const onLoaded=e=>{
        const d=e.detail||{};
        if(d.type==="linehaul")finish(resolve,d);
      };
      timer=setTimeout(()=>finish(reject,new Error("TO List import timed out after the SPX export was received.")),BUSY_TIMEOUT);
      window.addEventListener("inventoryloaded",onLoaded);

      try{ NOL3.readLineHaulInventory([fileFromText(text,name)]); }
      catch(err){ finish(reject,err); }
    });
  }

  async function requestBridge(kind){
    if(kind==="inbound"){
      setBusy("syncParcelInboundFromSPX",true);
      setStatus("parcelInboundSpxSyncStatus","Connecting to SPX…","working");
      post("BADOC_START_PARCEL_INBOUND_SYNC");
    }else if(kind==="delivery"){
      const day=todayManilaBounds();
      setBusy("syncParcelDeliveryFromSPX",true);
      setStatus("parcelDeliverySpxSyncStatus",`Filtered Assigned: ${day.assignedLabel} · Connecting to SPX…`,`working`);
      post("BADOC_START_PARCEL_DELIVERY_SYNC",{
        trackingStatus:"4,2,5",
        bulkyType:"1,0,2",
        assignedStartUnix:day.assignedStartUnix,
        assignedEndUnix:day.assignedEndUnix,
        assignedStart:day.assignedStart,
        assignedEnd:day.assignedEnd,
        assignedLabel:day.assignedLabel,
        createdEndUnix:day.assignedStartUnix
      });
    }else{
      setBusy("syncLinehaulFromSPX",true);
      setStatus("linehaulSpxSyncStatus","Exporting Inbound → TO List from SPX…","working");
      post("BADOC_START_LINEHAUL_SYNC");
    }
  }

  document.addEventListener("click",function(event){
    const el=event.target.closest?.("#syncParcelInboundFromSPX,#syncParcelDeliveryFromSPX,#syncLinehaulFromSPX");
    if(!el)return;
    if(el.dataset.busy==="1")return;
    if(el.id==="syncParcelInboundFromSPX")requestBridge("inbound");
    else if(el.id==="syncParcelDeliveryFromSPX")requestBridge("delivery");
    else requestBridge("linehaul");
  });

  window.addEventListener("message",async function(event){
    if(event.source!==window)return;
    const data=event.data||{};
    if(data.source!==BRIDGE_SOURCE)return;

    if(data.type==="BADOC_SPX_PROGRESS"){
      if(document.getElementById("syncLinehaulFromSPX")?.dataset.busy==="1")
        setStatus("linehaulSpxSyncStatus",data.message||"Exporting Inbound → TO List from SPX…","working");
      return;
    }

    if(data.type==="BADOC_SPX_PARCEL_PROGRESS" || data.type==="BADOC_SPX_PARCEL_INBOUND_PROGRESS"){
      if(document.getElementById("syncParcelInboundFromSPX")?.dataset.busy==="1")
        setStatus("parcelInboundSpxSyncStatus",data.message||"Exporting LMHub_Received / Transporting / Transported…","working");
      return;
    }

    if(data.type==="BADOC_SPX_PARCEL_DELIVERY_PROGRESS"){
      if(document.getElementById("syncParcelDeliveryFromSPX")?.dataset.busy==="1")
        setStatus("parcelDeliverySpxSyncStatus",data.message||"Exporting Delivering / Delivered / On-Hold…","working");
      return;
    }

    if(data.type==="BADOC_SPX_PARCEL_CSV"){
      try{
        if(!data.csvText)throw new Error("The bridge returned an empty inbound inventory CSV.");
        const filtered=filterInboundInventoryCsv(data.csvText);
        setStatus("parcelInboundSpxSyncStatus",`Importing ${filtered.count.toLocaleString()} LMHub_Received / Transporting / Transported rows into Inventory…`,`working`);
        const result=await dispatchToUnifiedInventory(filtered.csv,data.fileName||"spx_inbound_inventory_filtered.csv");
        setStatus("parcelInboundSpxSyncStatus",`✓ Imported LMHub_Received / Transporting / Transported · ${filtered.count.toLocaleString()} rows`,"success");
      }catch(err){
        console.error("BADOC SPX inbound inventory import failed:",err);
        setStatus("parcelInboundSpxSyncStatus",`✕ ${err.message||"Inbound inventory sync failed."}`,"error");
        alert(`SPX inbound inventory sync failed.\n\n${err.message||"Unknown error"}\n\nExisting inventory was kept.`);
      }finally{
        setBusy("syncParcelInboundFromSPX",false);
      }
      return;
    }

    if(data.type==="BADOC_SPX_PARCEL_DELIVERY_CSV"){
      try{
        if(!data.csvText)throw new Error("The bridge returned an empty delivery-status CSV.");
        const filtered=filterDeliveryInventoryCsv(data.csvText);
        setStatus("parcelDeliverySpxSyncStatus",`Importing ${filtered.count.toLocaleString()} Delivering / Delivered / On-Hold rows…`,`working`);
        const result=await dispatchToUnifiedInventory(filtered.csv,data.fileName||"spx_delivery_status_today.csv");
        setStatus("parcelDeliverySpxSyncStatus",`✓ Imported Delivering / Delivered / On-Hold · Assigned ${filtered.assignedLabel} · ${filtered.count.toLocaleString()} rows`,"success");
      }catch(err){
        console.error("BADOC SPX delivery inventory import failed:",err);
        setStatus("parcelDeliverySpxSyncStatus",`✕ ${err.message||"Delivery inventory sync failed."}`,"error");
        alert(`SPX delivery inventory sync failed.\n\n${err.message||"Unknown error"}\n\nExisting inventory was kept.`);
      }finally{
        setBusy("syncParcelDeliveryFromSPX",false);
      }
      return;
    }

    if(data.type==="BADOC_SPX_CSV"){
      try{
        if(!data.csvText)throw new Error("The bridge returned an empty TO List CSV.");
        setStatus("linehaulSpxSyncStatus",`Importing Inbound → TO List ${data.taskId||""}…`,`working`);
        const result=await importLinehaulFromBridge(data.csvText,data.fileName||"inbound_to_list_spx.csv");
        setStatus("linehaulSpxSyncStatus",`✓ Imported Inbound → TO List · ${Number(result?.addedRows||0).toLocaleString()} new · ${Number(result?.duplicateRows||0).toLocaleString()} duplicates`,"success");
      }catch(err){
        console.error("BADOC SPX TO List import failed:",err);
        setStatus("linehaulSpxSyncStatus",`✕ ${err.message||"TO List sync failed."}`,"error");
        alert(`SPX Inbound → TO List sync failed.\n\n${err.message||"Unknown error"}\n\nExisting TO List data was kept.`);
      }finally{
        setBusy("syncLinehaulFromSPX",false);
      }
      return;
    }

    if(data.type==="BADOC_SPX_ERROR"){
      const kind=data.kind||"";
      if(kind==="parcel-delivery"){
        setBusy("syncParcelDeliveryFromSPX",false);
        setStatus("parcelDeliverySpxSyncStatus",`✕ ${data.message||"Delivery inventory sync failed."}`,"error");
      }else if(kind==="parcel-inbound"){
        setBusy("syncParcelInboundFromSPX",false);
        setStatus("parcelInboundSpxSyncStatus",`✕ ${data.message||"Inbound inventory sync failed."}`,"error");
      }else{
        setBusy("syncLinehaulFromSPX",false);
        setStatus("linehaulSpxSyncStatus",`✕ ${data.message||"TO List sync failed."}`,"error");
      }
      return;
    }
  });
})();
</script>

<script id="badoc-planning-spx-bridge-handshake-fix-v2">
(function(){
  'use strict';
  if(window.__badocPlanningSpxBridgeHandshakeFixV2)return;
  window.__badocPlanningSpxBridgeHandshakeFixV2=true;

  const BRIDGE_SOURCE='BADOC_SPX_BRIDGE';
  const PAGE_SOURCE='BADOC_PAGE';
  const BUTTONS={
    inbound:'syncParcelInboundFromSPX',
    delivery:'syncParcelDeliveryFromSPX',
    linehaul:'syncLinehaulFromSPX'
  };
  const pending={inbound:null,delivery:null,linehaul:null};
  let bridgeReady=false;
  let bridgeVersion='';
  let helloTimer=null;

  const postHello=()=>{
    try{ window.postMessage({source:PAGE_SOURCE,type:'BADOC_BRIDGE_HELLO'},'*'); }catch(_){ }
  };

  function setStatus(id,msg,state){
    const el=document.getElementById(id);
    if(!el)return;
    el.textContent=msg||'';
    el.classList.remove('is-working','is-success','is-error');
    if(state)el.classList.add('is-'+state);
  }

  function setBusy(id,busy){
    const el=document.getElementById(id);
    if(!el)return;
    el.disabled=!!busy;
    if(busy)el.dataset.busy='1';
    else delete el.dataset.busy;
  }

  function clearPending(kind){
    if(pending[kind]){clearTimeout(pending[kind]);pending[kind]=null;}
  }

  function setBridge(state,version){
    bridgeReady=state==='ready';
    bridgeVersion=String(version||'');
    window.__badocPlanningSpxBridgeReady=bridgeReady;
    window.__badocPlanningSpxBridgeVersion=bridgeVersion;
  }

  function startHandshake(){
    postHello();
    clearInterval(helloTimer);
    helloTimer=setInterval(()=>{ if(!bridgeReady)postHello(); },1500);
    setTimeout(()=>clearInterval(helloTimer),15000);
  }

  // Listen for bridge lifecycle/progress messages before the existing sync
  // handler. The previous patch had no handshake listener, so a disconnected
  // or missing content script left the button permanently at "Connecting…".
  window.addEventListener('message',function(event){
    if(event.source!==window)return;
    const data=event.data||{};
    if(data.source!==BRIDGE_SOURCE)return;

    if(data.type==='BADOC_BRIDGE_READY'){
      setBridge('ready',data.version||'');
      return;
    }

    if(data.type==='BADOC_BRIDGE_DISCONNECTED'){
      setBridge('missing','');
      Object.entries(BUTTONS).forEach(([kind,id])=>{
        clearPending(kind);
        setBusy(id,false);
      });
      setStatus('parcelInboundSpxSyncStatus','SPX Bridge disconnected. Reload the extension, then refresh BADOC.','error');
      return;
    }

    if(data.type==='BADOC_SPX_PROGRESS' || data.type==='BADOC_SPX_PARCEL_PROGRESS' || data.type==='BADOC_SPX_PARCEL_INBOUND_PROGRESS'){
      setBridge('ready',data.version||bridgeVersion);
      clearPending('inbound');
      setStatus('parcelInboundSpxSyncStatus',data.message||'Exporting LMHub_Received / Transporting / Transported from SPX…','working');
      return;
    }

    if(data.type==='BADOC_SPX_PARCEL_DELIVERY_PROGRESS'){
      setBridge('ready',data.version||bridgeVersion);
      clearPending('delivery');
      setStatus('parcelDeliverySpxSyncStatus',data.message||'Exporting Delivering / Delivered / On-Hold from SPX…','working');
      return;
    }

    if(data.type==='BADOC_SPX_CSV'){
      clearPending('linehaul');
      return;
    }

    if(data.type==='BADOC_SPX_PARCEL_CSV' || data.type==='BADOC_SPX_PARCEL_DONE'){
      clearPending('inbound');
      return;
    }

    if(data.type==='BADOC_SPX_PARCEL_DELIVERY_CSV'){
      clearPending('delivery');
      return;
    }

    if(data.type==='BADOC_SPX_ERROR'){
      const kind=data.kind==='parcel-delivery'?'delivery':data.kind==='parcel-inbound'?'inbound':'linehaul';
      clearPending(kind);
    }
  });

  // Prevent the original click handler from starting a request when the
  // extension bridge is not actually connected. This replaces an indefinite
  // "Connecting to SPX…" state with an actionable error.
  document.addEventListener('click',function(event){
    const el=event.target.closest?.('#syncParcelInboundFromSPX,#syncParcelDeliveryFromSPX,#syncLinehaulFromSPX');
    if(!el)return;
    if(bridgeReady)return;

    event.preventDefault();
    event.stopImmediatePropagation();

    const kind=el.id==='syncParcelInboundFromSPX'?'inbound':el.id==='syncParcelDeliveryFromSPX'?'delivery':'linehaul';
    const statusId=kind==='inbound'?'parcelInboundSpxSyncStatus':kind==='delivery'?'parcelDeliverySpxSyncStatus':'linehaulSpxSyncStatus';
    setBusy(el.id,false);
    setStatus(statusId,
      'SPX Bridge not connected. Reload the SPX BRIDGE extension, reopen BADOC, then try again.',
      'error'
    );
    postHello();
  },true);

  // Give every accepted click a finite response window. This does not alter
  // the bridge protocol; it only stops a silent failure from leaving the UI
  // stuck forever.
  document.addEventListener('click',function(event){
    const el=event.target.closest?.('#syncParcelInboundFromSPX,#syncParcelDeliveryFromSPX,#syncLinehaulFromSPX');
    if(!el || !bridgeReady || el.dataset.busy!=='1')return;
    const kind=el.id==='syncParcelInboundFromSPX'?'inbound':el.id==='syncParcelDeliveryFromSPX'?'delivery':'linehaul';
    const statusId=kind==='inbound'?'parcelInboundSpxSyncStatus':kind==='delivery'?'parcelDeliverySpxSyncStatus':'linehaulSpxSyncStatus';
    clearPending(kind);
    pending[kind]=setTimeout(()=>{
      if(el.dataset.busy!=='1')return;
      setBusy(el.id,false);
      setStatus(statusId,
        `SPX Bridge did not respond after 30 minutes${bridgeVersion?` · detected v${bridgeVersion}`:''}. Reload the extension and try again.`,
        'error'
      );
      postHello();
    },30*60*1000);
  },false);

  startHandshake();
})();
</script>

<script id="badoc-transport-status-lm-cleanup-v3">
(function(){
  'use strict';
  if(window.__badocTransportStatusCleanupV3)return;
  window.__badocTransportStatusCleanupV3=true;

  const badStatuses=new Set(['soc_lhtransporting','soc_lhtransported']);
  const normStatus=v=>String(v??'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/\s+/g,'_');

  function scrubInventory(){
    try{
      const lm=NOL3?.lmInventory;
      if(lm && Array.isArray(lm.rows) && Array.isArray(lm.headers)){
        const si=lm.headers.findIndex(h=>String(h??'').trim().toLowerCase()==='status');
        if(si>=0){
          const cleaned=lm.rows.filter(r=>!badStatuses.has(normStatus(r?.[si])));
          if(cleaned.length!==lm.rows.length){
            lm.rows=cleaned;
            lm.filteredRows=typeof NOL3.filterRowsToHub==='function'
              ? NOL3.filterRowsToHub(lm.headers,cleaned,'auto').rows
              : cleaned.slice();
            lm.rowCount=cleaned.length;
          }
        }
      }
      try{ if(typeof renderBusinessDayMetrics==='function')renderBusinessDayMetrics(); }catch(_){ }
      try{ if(typeof renderOnFloorTowns==='function')renderOnFloorTowns(); }catch(_){ }
      try{ if(typeof renderDeliveryAreas==='function')renderDeliveryAreas(); }catch(_){ }
    }catch(_){ }
  }

  window.addEventListener('inventoryloaded',e=>{
    if(['lm','unified'].includes(String(e?.detail?.type||'')))setTimeout(scrubInventory,0);
  });
  window.addEventListener('load',()=>setTimeout(scrubInventory,1200));
})();
