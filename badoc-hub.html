        : formatBusinessDateInput(new Date());
      const isViewingRealTodayForFreeze = businessDate === realTodayForFreeze;
      let frozenForThisDate = false;
      let displayVolume = liveTodayVolume;
      if (frozen && frozen.businessDate === businessDate) {
        displayVolume = Number(frozen.value) || 0;
        frozenForThisDate = true;
      } else if (isViewingRealTodayForFreeze && new Date().getTime() >= cot.getTime()) {
        displayVolume = liveTodayVolume;
        setFrozenTodayVolume(hubForFreeze, businessDate, displayVolume);
        frozenForThisDate = true;
      }
      result.todayVolume = displayVolume;
      result.todayVolumeFrozen = frozenForThisDate;
      result.liveTodayVolume = liveTodayVolume;
      result.totalDispatched = result.dispatchedIds.size;
      result.totalBacklogs = Math.max(0, result.todayVolume - result.totalDispatched);
      result.start = start;
      result.end = end;
      result.cot = cot;
      result.settings = settings;
      result.businessDate = businessDate;
      return result;
    };

    const renderBusinessDayMetrics = () => {
      const metrics = getBusinessDayMetrics();
      const todayEl = document.getElementById("todayVolumeValue");
      const dispatchedEl = document.getElementById("totalDispatchedValue");
      const backlogEl = document.getElementById("totalBacklogsValue");
      if (todayEl) todayEl.textContent = metrics.todayVolume.toLocaleString();
      if (dispatchedEl) dispatchedEl.textContent = metrics.totalDispatched.toLocaleString();
      if (backlogEl) backlogEl.textContent = metrics.totalBacklogs.toLocaleString();
      const note = document.getElementById("todayVolumeNote");
      const status = document.getElementById("businessDayStatus");
      if (metrics.warning) {
        if (note) note.textContent = metrics.warning;
        if (status) status.textContent = metrics.warning;
        return;
      }
      const f = value => value.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", hour12:false});
      const dateLabel = metrics.start.toLocaleDateString([], {year:"numeric", month:"2-digit", day:"2-digit"});
      if (note) note.textContent = metrics.todayVolumeFrozen
        ? `Frozen at COT for ${dateLabel} · current station = selected hub`
        : `Live volume for ${dateLabel} · current station = selected hub · freezes at COT (${f(metrics.cot)})`;
      if (status) status.textContent = `${getSelectedHub() || "Selected hub"}: ${dateLabel} · ${f(metrics.start)} business-day start · ${f(metrics.cot)} COT · window ends ${f(metrics.end)}`;
    };

    // Expose the renderer so the Dashboard and startup restore flow can
    // calculate the metrics without requiring the Planning page to be opened.
    NOL3.renderBusinessDayMetrics = renderBusinessDayMetrics;

    const renderBusinessDaySettings = () => {
      const dateInput = document.getElementById("businessDayDate");
      const startInput = document.getElementById("businessDayStartHour");
      const cotInput = document.getElementById("businessDayCotHour");
      const nowButton = document.getElementById("businessDayNow");
      if (!dateInput || !startInput || !cotInput) return;

      const settings = getHubBusinessDaySettings();
      dateInput.value = getBusinessDateValue();
      startInput.value = String(settings.businessDayStartHour);
      cotInput.value = String(settings.cotHour);

      const saveHours = () => {
        const hub = getSelectedHub() || "__default__";
        const all = loadBusinessDaySettings();
        const start = Math.max(0, Math.min(23, Math.round(Number(startInput.value) || 0)));
        const cot = Math.max(0, Math.min(23, Math.round(Number(cotInput.value) || 0)));
        startInput.value = String(start);
        cotInput.value = String(cot);
        all[hub] = { businessDayStartHour: start, cotHour: cot };
        saveBusinessDaySettings(all);
        renderBusinessDayMetrics();
        window.dispatchEvent(new CustomEvent("planningchanged", { detail: { type: "business-day-settings", source: "local" } }));
      };

      const saveDate = () => {
        const value = String(dateInput.value || "").trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return;
        // Business Date is an explicit user selection. Never replace it with
        // today's date while the user is changing the picker.
        NOL3.currentBusinessDate = value;
        saveBusinessDateValue(value);
        dateInput.value = value;
        // Wait for the dated LM snapshot to load before rendering derived metrics.
        window.dispatchEvent(new CustomEvent("businessdatechange", { detail: { businessDate: value, source: "picker" } }));
      };

      startInput.onchange = saveHours;
      cotInput.onchange = saveHours;
      startInput.onblur = saveHours;
      cotInput.onblur = saveHours;
      dateInput.oninput = saveDate;
      dateInput.onchange = saveDate;
      dateInput.onblur = saveDate;
      // NOW is handled by the global capture listener below. Keeping one
      // handler prevents Android from executing two competing date updates.
      if (nowButton) nowButton.onclick = null;
      renderBusinessDayMetrics();
    };
    NOL3.renderBusinessDaySettings = renderBusinessDaySettings;

    // Global Business Date controls: the topbar is rebuilt whenever the user
    // changes menus, so the date controls must remain functional on every page.
    // Read the live date control before ANY menu navigation. On some mobile
    // browsers a date picker may delay the native `change` event until after
    // the navigation click. This prevents the topbar from being rebuilt with
    // the previous date.
    NOL3.syncBusinessDateFromDom = () => {
      const input = document.getElementById('businessDayDate');
      const value = input ? String(input.value || '').trim() : '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        NOL3.currentBusinessDate = value;
        try { NOL3Storage.set(BUSINESS_DAY_DATE_KEY, value); } catch (_) {}
        return value;
      }
      return NOL3.getBusinessDateValue();
    };

    NOL3.commitBusinessDate = (value) => {
      const normalized = String(value || '').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(normalized)) return;
      NOL3.currentBusinessDate = normalized;
      try { NOL3Storage.set(BUSINESS_DAY_DATE_KEY, normalized); } catch (_) {}
      const input = document.getElementById('businessDayDate');
      if (input) input.value = normalized;
      window.dispatchEvent(new CustomEvent('businessdatechange', { detail: { businessDate: normalized } }));
      // The async businessdatechange handler restores the dated snapshot and
      // rebuilds all derived views before the page is rendered.
      if (typeof NOL3.renderTopbar === 'function') NOL3.renderTopbar();
    };

    // Always derive TODAY at the moment NOW is pressed. Do not rely on the
    // page-load date or the value rendered into the topbar.
    NOL3.setBusinessDateNow = async () => {
      const today = getNOL3TodayDate();

      // NOW intentionally uses the same full application refresh as the
      // REFRESH button. This guarantees every Planning view is rebuilt from
      // the restored/current snapshot instead of trying to update stale DOM.
      NOL3.currentBusinessDate = today;
      const input = document.getElementById("businessDayDate");
      if (input) input.value = today;
      saveBusinessDateValue(today);

      try {
        if (typeof NOL3.loadLMHistoryForDate === "function") {
          await NOL3.loadLMHistoryForDate(today);
        }
      } catch (error) {
        console.warn("NOL3: Could not restore today's LM snapshot from NOW before refresh.", error);
      }

      // Give the local snapshot write/event loop a moment to settle, then use
      // the exact same reload path as the REFRESH button. Startup will restore
      // today's dated snapshot and rebuild the entire Planning DOM.
      setTimeout(() => {
        try { window.location.reload(); } catch (_) {}
      }, 0);
    };

    const INCOMING_ARRIVED_STORAGE_KEY = "nol3_incoming_arrived_tasks_v1";
    let pendingIncomingArrivedTask = null;

    const getArrivedIncomingTasks = () => {
      try {
        const raw = NOL3Storage.get(INCOMING_ARRIVED_STORAGE_KEY);
        const parsed = JSON.parse(raw || "[]");
        return new Set(Array.isArray(parsed) ? parsed.map(v => String(v || "").trim()).filter(Boolean) : []);
      } catch (_) { return new Set(); }
    };

    const saveArrivedIncomingTasks = (set) => {
      try { NOL3Storage.set(INCOMING_ARRIVED_STORAGE_KEY, JSON.stringify([...set])); } catch (_) {}
    };

    const getArrivedIncomingTownCounts = () => {
      const taskTownCounts = getIncomingLinehaulTownCounts();
      const arrived = getArrivedIncomingTasks();
      const result = new Map();
      arrived.forEach(task => {
        const counts = taskTownCounts.get(task);
        if (!counts) return;
        counts.forEach((count, town) => result.set(town, (result.get(town) || 0) + Number(count || 0)));
      });
      return result;
    };

    const openIncomingArrivedConfirm = (task, checked) => {
      const modal = document.getElementById("confirmIncomingArrivedModal");
      const text = document.getElementById("confirmIncomingArrivedText");
      if (!modal) return;
      pendingIncomingArrivedTask = { task: String(task || "").trim(), checked: !!checked };
      if (text) text.textContent = checked
        ? `Confirm that ${String(task || "this incoming linehaul")} has arrived?`
        : `Mark ${String(task || "this incoming linehaul")} as not arrived?`;
      modal.classList.add("open");
      modal.style.display = "flex";
    };

    const closeIncomingArrivedConfirm = () => {
      const modal = document.getElementById("confirmIncomingArrivedModal");
      pendingIncomingArrivedTask = null;
      if (modal) {
        modal.classList.remove("open");
        modal.style.display = "none";
      }
    };

    const applyIncomingArrivedState = (task, checked) => {
      const value = String(task || "").trim();
      if (!value) return;
      const arrived = getArrivedIncomingTasks();
      if (checked) arrived.add(value); else arrived.delete(value);
      saveArrivedIncomingTasks(arrived);
      window.dispatchEvent(new CustomEvent("planningchanged", {
        detail: { type: "incoming-arrived", source: "local" }
      }));
      renderIncomingOrders();
      renderIncomingLinehaulSelector();

      // Rebuild the Planning summary so Total Volume immediately includes
      // the newly confirmed/cleared linehaul.
      if (typeof renderDeliveryAreas === 'function') renderDeliveryAreas();
      renderOnFloorTowns();
      updateIncomingOrdersNotification();
    };

    const updateIncomingOrdersNotification = () => {
      const badge = document.getElementById("incomingOrdersNotif");
      if (!badge) return;
      let total = 0;
      try {
        if (typeof getIncomingLinehaulTownCounts === "function") {
          const taskTownCounts = getIncomingLinehaulTownCounts();
          const arrived = getArrivedIncomingTasks();
          total = [...taskTownCounts.entries()].reduce((sum, [task, counts]) => {
            if (arrived.has(task)) return sum;
            return sum + [...counts.values()].reduce((n, count) => n + Number(count || 0), 0);
          }, 0);
        }
      } catch (_) { total = 0; }
      badge.textContent = total.toLocaleString();
      badge.classList.toggle("show", total > 0);
    };

    const renderIncomingOrders = () => {
      const list = document.getElementById("incomingLinehaulList");
      updateIncomingOrdersNotification();
      if (!list) return;

      // Use the exact same calculation as the Incoming Linehaul dropdown.
      // This prevents the dropdown and Incoming Orders tab from using two
      // different matching/filtering paths.
      if (typeof getIncomingLinehaulTownCounts !== "function") {
        list.innerHTML = `<div class="incoming-empty">Incoming Orders is still loading. Please try again after the uploads finish.</div>`;
        return;
      }

      const taskTownCounts = getIncomingLinehaulTownCounts();
      const tasks = [...taskTownCounts.entries()].sort((a,b) => a[0].localeCompare(b[0]));

      if (!tasks.length) {
        const incoming = NOL3.incomingInventory;
        const linehaul = NOL3.lineHaulInventory;
        if (!incoming?.rows?.length || !linehaul?.rows?.length) {
          list.innerHTML = `<div class="incoming-empty">Upload Incoming Inventory and Incoming Inventory From-To List to see matched line haul tasks.</div>`;
        } else {
          list.innerHTML = `<div class="incoming-empty">No Incoming Orders matched the selected hub and From-To List.</div>`;
        }
        return;
      }

      list.innerHTML = tasks.map(([task, counts], index) => {
        const towns = [...counts.entries()].sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
        const total = towns.reduce((sum, [,count]) => sum + count, 0);
        const arrived = getArrivedIncomingTasks().has(String(task || "").trim());
        return `<div class="incoming-linehaul-card${arrived ? ' arrived' : ''}" data-linehaul-card="${index}">
          <button class="incoming-linehaul-header" type="button" aria-expanded="false">
            <span class="incoming-linehaul-title">${NOL3.escapeHTML(task)}</span>
            <span class="incoming-linehaul-meta"><span>${total.toLocaleString()} orders · ${towns.length.toLocaleString()} towns</span><span class="incoming-linehaul-chevron">›</span>
              <label class="incoming-arrived-wrap" title="Mark linehaul as arrived">
                <input class="incoming-arrived-checkbox" type="checkbox" data-incoming-arrived="${NOL3.escapeHTML(task)}" ${arrived ? 'checked' : ''} aria-label="Arrived">
                <span class="incoming-arrived-label">Arrived</span>
              </label>
            </span>
          </button>
          <div class="incoming-linehaul-body"><div class="incoming-town-counts">
            ${towns.map(([town,count]) => `<div class="incoming-town-count"><span class="incoming-town-count-name" title="${NOL3.escapeHTML(town)}">${NOL3.escapeHTML(town)}</span><span class="incoming-town-count-value">${count.toLocaleString()}</span></div>`).join("")}
          </div></div>
        </div>`;
      }).join("");

      list.querySelectorAll(".incoming-linehaul-header").forEach(button => button.addEventListener("click", (event) => {
        if (event.target.closest(".incoming-arrived-wrap")) return;
        const card = button.closest(".incoming-linehaul-card");
        const open = card.classList.toggle("open");
        button.setAttribute("aria-expanded", open ? "true" : "false");
      }));
      list.querySelectorAll(".incoming-arrived-checkbox").forEach(checkbox => checkbox.addEventListener("click", event => {
        event.stopPropagation();
      }));
      list.querySelectorAll(".incoming-arrived-checkbox").forEach(checkbox => checkbox.addEventListener("change", event => {
        event.stopPropagation();
        const task = checkbox.getAttribute("data-incoming-arrived") || "";
        const desired = checkbox.checked;
        checkbox.checked = !desired;
        openIncomingArrivedConfirm(task, desired);
      }));
    };

    document.getElementById("cancelIncomingArrived")?.addEventListener("click", closeIncomingArrivedConfirm);
    document.getElementById("confirmIncomingArrived")?.addEventListener("click", () => {
      const pending = pendingIncomingArrivedTask;
      closeIncomingArrivedConfirm();
      if (pending) applyIncomingArrivedState(pending.task, pending.checked);
    });
    document.getElementById("confirmIncomingArrivedModal")?.addEventListener("click", event => {
      if (event.target.id === "confirmIncomingArrivedModal") closeIncomingArrivedConfirm();
    });

    window.addEventListener("inventoryloaded", renderIncomingOrders);
    window.addEventListener("inventorycleared", renderIncomingOrders);

    const getSelectedHub = () =>
      (NOL3.getState && NOL3.getState().selectedHub) || "";

    const parseTownValue = (value) => {
      const text = String(value || "").trim();
      if (!text) return "Unknown";
      return text;
    };

    // A Zone ID can be manually reassigned from its native town to a different
    // town for planning purposes (drag a Zone ID row onto another town). This
    // is the single place that decides which town a row's volume counts under.
    const resolveRowTown = (row, townIndex, zoneIndex) => {
      const base = parseTownValue(row[townIndex]);
      if (zoneIndex >= 0) {
        const zone = String(row[zoneIndex] ?? "").replace(/^\uFEFF/, "").trim();
        if (zone) {
          const target = NOL3.getZoneReassignments()[zone];
          if (target) return target;
        }
      }
      return base;
    };

    const updateTownToggleVisibility = (visible) => {
      const button = document.getElementById("townToggleBtn");
      const workspace = document.getElementById("onFloorWorkspace");
      if (button) button.style.display = "inline-flex";
      if (workspace) workspace.classList.toggle("no-towns", !visible);
    };

    const findTownColumn = (headers) => NOL3.resolveColumnIndex(headers, "parcel", "townName", [
      "town name", "town", "municipality", "destination town", "destination municipality",
      "destination city", "destination", "receiver town"
    ], null);

    let showIncomingOrdersOnFloor = false;
    let selectedIncomingLinehauls = [];
    // Backward-compatible single-value alias used only by older state paths.
    let selectedIncomingLinehaul = "";

    const getIncomingLinehaulTownCounts = () => {
      const incoming = NOL3.incomingInventory;
      const linehaul = NOL3.lineHaulInventory;
      const taskTownCounts = new Map();
      if (!incoming?.rows?.length || !linehaul?.rows?.length) return taskTownCounts;

      const norm = value => normalizeIncomingKey(value);
      const ih = Array.isArray(incoming.headers) ? incoming.headers : [];
      const lh = Array.isArray(linehaul.headers) ? linehaul.headers : [];
      const orderIndex = findIncomingHeaderIndex(ih, ["Order ID", "Order Id", "OrderID", "SPX TN", "SPX Tracking Number", "SLS TN", "SLS Tracking Number", "Tracking Number"]);
      const townIndex = findIncomingHeaderIndex(ih, ["Town Name", "Town", "Municipality", "Destination Town", "Destination Municipality", "Destination City", "Receiver Town"]);
      const destinationIndex = findIncomingHeaderIndex(ih, ["Destination Station", "Destination Station Name", "Destination Hub", "To Station", "To Hub", "Destination Station Code"]);
      const taskIndex = findIncomingHeaderIndex(lh, ["Line Haul Task ID", "Linehaul Task ID", "Line Haul Task", "Linehaul Task", "Task ID", "Task", "Linehaul"]);
      const spxIndex = findIncomingHeaderIndex(lh, ["SPX TN", "SPX Tracking Number", "SLS TN", "SLS Tracking Number", "Tracking Number", "Tracking No", "Tracking ID"]);
      if (orderIndex < 0 || townIndex < 0 || taskIndex < 0 || spxIndex < 0) return taskTownCounts;

      const exceptionSet = getPlanningExceptionSet();
      const selectedHub = norm(getSelectedHub());
      if (selectedHub && destinationIndex < 0) return taskTownCounts;

      const spxToTasks = new Map();
      linehaul.rows.forEach(row => {
        // The exception may exist only in the From-To/Linehaul export.
        // Exclude it here before creating the SPX -> task relationship.
        if (rowMatchesPlanningException(row, lh, exceptionSet)) return;

        const spx = norm(row[spxIndex]);
        const task = String(row[taskIndex] ?? "").trim();
        if (!spx || !task) return;
        if (!spxToTasks.has(spx)) spxToTasks.set(spx, new Set());
        spxToTasks.get(spx).add(task);
      });

      incoming.rows.forEach(row => {
        // Also exclude it if the exception appears in the Incoming Inventory
        // export. Both datasets therefore participate in the same exclusion.
        if (rowMatchesPlanningException(row, ih, exceptionSet)) return;

        const orderId = norm(row[orderIndex]);
        if (!orderId) return;
        if (selectedHub && norm(row[destinationIndex]) !== selectedHub) return;
        const tasks = spxToTasks.get(orderId);
        if (!tasks) return;
        const town = parseTownValue(row[townIndex]);
        tasks.forEach(task => {
          if (!taskTownCounts.has(task)) taskTownCounts.set(task, new Map());
          const counts = taskTownCounts.get(task);
          counts.set(town, (counts.get(town) || 0) + 1);
        });
      });

      return taskTownCounts;
    };

    const renderIncomingLinehaulSelector = () => {
      const select = document.getElementById("incomingLinehaulSelect");
      const menu = document.getElementById("incomingLinehaulMenu");
      const triggerText = document.getElementById("incomingLinehaulTriggerText");
      if (!select || !menu || !triggerText) return;
      const taskTownCounts = getIncomingLinehaulTownCounts();
      const arrivedTasks = getArrivedIncomingTasks();
      // Arrived linehauls are already on-floor, so they must no longer appear
      // as selectable Incoming Linehaul options.
      const tasks = [...taskTownCounts.keys()]
        .filter(task => !arrivedTasks.has(String(task || "").trim()))
        .sort((a,b) => a.localeCompare(b));

      // Keep only linehauls that still exist and are not already arrived.
      selectedIncomingLinehauls = Array.isArray(selectedIncomingLinehauls)
        ? selectedIncomingLinehauls.filter(v => taskTownCounts.has(v) && !arrivedTasks.has(String(v || "").trim()))
        : [];
      selectedIncomingLinehaul = selectedIncomingLinehauls.length === 1 ? selectedIncomingLinehauls[0] : "";

      select.innerHTML = `<option value="">Select Incoming Linehaul</option>` +
        tasks.map(task => `<option value="${NOL3.escapeHTML(task)}">${NOL3.escapeHTML(task)}</option>`).join("");
      select.value = selectedIncomingLinehauls.length === 1 ? selectedIncomingLinehauls[0] : "";

      const selectedCounts = getIncomingTownCounts();
      const selectedTotal = [...selectedCounts.values()].reduce((sum, n) => sum + Number(n || 0), 0);
      if (selectedIncomingLinehauls.length === 1) {
        triggerText.textContent = `${selectedIncomingLinehauls[0]} · ${selectedTotal.toLocaleString()} orders · ${selectedCounts.size.toLocaleString()} towns`;
      } else if (selectedIncomingLinehauls.length > 1) {
        triggerText.textContent = `${selectedIncomingLinehauls.length} linehauls selected · ${selectedTotal.toLocaleString()} orders · ${selectedCounts.size.toLocaleString()} towns`;
      } else {
        triggerText.textContent = tasks.length ? "Select Incoming Linehaul" : "No Incoming Linehaul Available";
      }

      const optionRows = tasks.map(task => {
        const counts = taskTownCounts.get(task) || new Map();
        const total = [...counts.values()].reduce((sum, n) => sum + Number(n || 0), 0);
        const isSelected = selectedIncomingLinehauls.includes(task);
        return `<button class="incoming-linehaul-option${isSelected ? ' selected' : ''}" type="button" data-incoming-linehaul="${NOL3.escapeHTML(task)}" role="option" aria-selected="${isSelected}">
          <div class="incoming-linehaul-option-main">
            <span class="incoming-linehaul-option-title">${NOL3.escapeHTML(task)}</span>
            ${isSelected ? '<span class="incoming-linehaul-option-check">✓</span>' : ''}
          </div>
          <div class="incoming-linehaul-option-meta">${total.toLocaleString()} orders · ${counts.size.toLocaleString()} towns</div>
        </button>`;
      }).join("");

      menu.innerHTML = `<input class="incoming-linehaul-search" id="incomingLinehaulSearch" type="search" placeholder="Search linehaul..." autocomplete="off" aria-label="Search incoming linehaul">
        <div class="incoming-linehaul-selection-hint">Select one or more linehauls. Click again to unselect.</div>
        <div class="incoming-linehaul-options">
          <button class="incoming-linehaul-option${!selectedIncomingLinehauls.length ? ' selected' : ''}" type="button" data-incoming-linehaul="" role="option" aria-selected="${!selectedIncomingLinehauls.length}">
            <div class="incoming-linehaul-option-main"><span class="incoming-linehaul-option-title">No incoming linehaul</span>${!selectedIncomingLinehauls.length ? '<span class="incoming-linehaul-option-check">✓</span>' : ''}</div>
            <div class="incoming-linehaul-option-meta">Show On-Floor counts only</div>
          </button>
          ${optionRows || '<div class="incoming-linehaul-empty">No incoming linehaul available.</div>'}
        </div>`;
      updateIncomingOrdersButton();
      updateIncomingOrdersNotification();
    };

    const getIncomingTownCounts = () => {
      const taskTownCounts = getIncomingLinehaulTownCounts();
      const result = new Map();
      const arrived = getArrivedIncomingTasks();
      (selectedIncomingLinehauls || []).forEach(task => {
        if (arrived.has(String(task || "").trim())) return;
        const counts = taskTownCounts.get(task);
        if (!counts) return;
        counts.forEach((count, town) => result.set(town, (result.get(town) || 0) + Number(count || 0)));
      });
      return result;
    };

    const updateIncomingOrdersButton = () => {
      // Incoming orders are now controlled directly by the linehaul dropdown.
      showIncomingOrdersOnFloor = Array.isArray(selectedIncomingLinehauls) && selectedIncomingLinehauls.length > 0;
    };

    const getLMStatusMetrics = () => {
      const result = new Map();
      const lm = (typeof NOL3.getPlanningLMInventoryV10 === "function" ? NOL3.getPlanningLMInventoryV10() : NOL3.lmInventory);
      if (!lm || !Array.isArray(lm.filteredRows) || !Array.isArray(lm.headers)) return result;
      const normalizeHeader = value => String(value ?? '').replace(/^\uFEFF/, '').trim().toLowerCase();
      const normalizeStatus = value => String(value ?? '').replace(/^\uFEFF/, '').trim().toUpperCase().replace(/[\s_-]+/g, ' ');
      const headers = lm.headers.map(normalizeHeader);
      const exceptionSet = getPlanningExceptionSet();
      const townIndex = headers.indexOf('town name');
      const zoneIndex = headers.indexOf('zone id');
      const statusCandidates = ['spx status','status','parcel status','order status'];
      const statusIndex = statusCandidates.map(name => headers.indexOf(name)).find(index => index >= 0) ?? -1;
      if (townIndex < 0 || statusIndex < 0) return result;
      lm.filteredRows.forEach(row => {
        if (rowMatchesPlanningException(row, lm.headers, exceptionSet)) return;
        const town = resolveRowTown(row, townIndex, zoneIndex);
        if (!town) return;
        if (!result.has(town)) result.set(town, {received:0, delivering:0, delivered:0, hold:0});
        const metrics = result.get(town);
        const status = normalizeStatus(row[statusIndex]);
        if (status === 'DELIVERED') metrics.delivered += 1;
        else if (status === 'DELIVERING') metrics.delivering += 1;
        else if (status === 'RECEIVED' || status === 'LMHUB RECEIVED') metrics.received += 1;
        else if (status === 'ONHOLD' || status === 'ON HOLD' || status === 'LMHUB ONHOLD' || status === 'LMHUB ON HOLD') metrics.hold += 1;
      });
      return result;
    };

    const formatSuccessRate = metrics => {
      const total = Number(metrics?.received || 0) + Number(metrics?.delivering || 0) + Number(metrics?.delivered || 0) + Number(metrics?.hold || 0);
      const rate = total ? (Number(metrics?.delivered || 0) / total) * 100 : 0;
      return rate % 1 === 0 ? rate.toFixed(0) : rate.toFixed(1);
    };

    // Zones are grouped by TOWN THEY ARE CURRENTLY ATTRIBUTED TO (i.e. after any
    // manual reassignment), not by their raw Town Name — so a transferred zone
    // shows under its new town, with an origin tag pointing back to the old one.
    const getTownZoneBreakdown = (town) => {
      const result = new Map(); // zone -> { count, nativeTown, reassigned }
      const lm = (typeof NOL3.getPlanningLMInventoryV10 === "function" ? NOL3.getPlanningLMInventoryV10() : NOL3.lmInventory);
      if (!lm || !Array.isArray(lm.filteredRows) || !Array.isArray(lm.headers)) return result;
      const townIndex = findTownColumn(lm.headers);
      const zoneIndex = findZoneIdColumn(lm.headers);
      if (townIndex < 0 || zoneIndex < 0) return result;
      const exceptionSet = getPlanningExceptionSet();
      const reassignments = NOL3.getZoneReassignments();
      // A zone already split into one of this town's Zone Settings areas is
      // shown by that area's own (operational) breakdown, not here — otherwise
      // the same orders would be counted in two places at once and this plain
      // card's breakdown would no longer match its own displayed total.
      const zoneData = getZoneSettingsTownData(town);
      const splitAssignments = zoneData?.assignments && typeof zoneData.assignments === 'object' ? zoneData.assignments : {};
      lm.filteredRows.forEach(row => {
        if (rowMatchesPlanningException(row, lm.headers, exceptionSet)) return;
        const nativeTown = parseTownValue(row[townIndex]);
        const zone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim() || 'No Zone ID';
        const attributedTown = (zone !== 'No Zone ID' && reassignments[zone]) || nativeTown;
        if (attributedTown !== town) return;
        if (zone !== 'No Zone ID' && splitAssignments[zone]) return;
        if (!result.has(zone)) result.set(zone, { count: 0, nativeTown, reassigned: attributedTown !== nativeTown });
        result.get(zone).count += 1;
      });
      return result;
    };

    const renderTownZoneBreakdown = (town) => {
      const zones = [...getTownZoneBreakdown(town).entries()].sort((a,b) => a[0].localeCompare(b[0], undefined, {numeric:true}));
      if (!zones.length) return '<div class="town-zone-breakdown"><div class="town-zone-row"><span>No Zone ID data</span><strong>0</strong></div></div>';
      return `<div class="town-zone-breakdown">${zones.map(([zone,info]) => {
        const draggable = zone !== 'No Zone ID';
        const originTag = info.reassigned ? ` <span class="town-zone-origin">from ${NOL3.escapeHTML(info.nativeTown)}</span>` : '';
        const undoBtn = info.reassigned ? `<button type="button" class="town-zone-undo" data-zone-undo="${NOL3.escapeHTML(zone)}" title="Return to ${NOL3.escapeHTML(info.nativeTown)}">↩</button>` : '';
        return `<div class="town-zone-row${draggable ? ' town-zone-draggable' : ''}" ${draggable ? `draggable="true" data-zone-id="${NOL3.escapeHTML(zone)}" data-zone-native="${NOL3.escapeHTML(info.nativeTown)}"` : ''}><span>${NOL3.escapeHTML(zone)}${originTag}</span><strong>${info.count.toLocaleString()}</strong>${undoBtn}</div>`;
      }).join('')}</div>`;
    };

    // Binds drag-start on the zone rows just inserted into a breakdown panel
    // (called right after each insertAdjacentHTML of renderTownZoneBreakdown).
    // Breakdown for an OPERATIONAL (zone-split) card: only the Zone IDs actually
    // assigned to that one area, for that one base town — never the town's full
    // raw zone list, which is what was leaking in as "combined zones" before.
    const getOperationalTownZoneBreakdown = (town, area) => {
      const result = new Map();
      const lm = (typeof NOL3.getPlanningLMInventoryV10 === "function" ? NOL3.getPlanningLMInventoryV10() : NOL3.lmInventory);
      if (!lm || !Array.isArray(lm.filteredRows) || !Array.isArray(lm.headers)) return result;
      const townIndex = findTownColumn(lm.headers);
      const zoneIndex = findZoneIdColumn(lm.headers);
      if (townIndex < 0 || zoneIndex < 0) return result;
      const exceptionSet = getPlanningExceptionSet();
      const zoneData = getZoneSettingsTownData(town);
      const assignments = zoneData?.assignments && typeof zoneData.assignments === 'object' ? zoneData.assignments : {};
      lm.filteredRows.forEach(row => {
        if (rowMatchesPlanningException(row, lm.headers, exceptionSet)) return;
        if (parseTownValue(row[townIndex]) !== town) return;
        const zone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim() || 'No Zone ID';
        if (String(assignments[zone] || '') !== area) return;
        result.set(zone, (result.get(zone) || 0) + 1);
      });
      return result;
    };
    const renderOperationalTownZoneBreakdown = (town, area) => {
      const zones = [...getOperationalTownZoneBreakdown(town, area).entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));
      if (!zones.length) return '<div class="town-zone-breakdown"><div class="town-zone-row"><span>No Zone ID data</span><strong>0</strong></div></div>';
      return `<div class="town-zone-breakdown">${zones.map(([zone, count]) => `<div class="town-zone-row"><span>${NOL3.escapeHTML(zone)}</span><strong>${count.toLocaleString()}</strong></div>`).join('')}</div>`;
    };

    const bindZoneRowDragging = (container) => {
      container?.querySelectorAll('.town-zone-draggable[draggable="true"]').forEach(row => {
        row.addEventListener('dragstart', event => {
          event.stopPropagation();
          const payload = JSON.stringify({ zoneId: row.dataset.zoneId || '', nativeTown: row.dataset.zoneNative || '' });
          event.dataTransfer.setData('application/x-nol3-zone-transfer', payload);
          event.dataTransfer.effectAllowed = 'move';
          row.classList.add('dragging');
        });
        row.addEventListener('dragend', () => row.classList.remove('dragging'));
      });
    };
    if (!NOL3._zoneUndoBound) {
      NOL3._zoneUndoBound = true;
      document.addEventListener('click', event => {
        const btn = event.target.closest('[data-zone-undo]');
        if (!btn) return;
        event.preventDefault(); event.stopPropagation();
        const zoneId = btn.dataset.zoneUndo || '';
        if (!zoneId) return;
        NOL3.clearZoneReassignment(zoneId);
        if (typeof NOL3.refreshPlanningViews === 'function') NOL3.refreshPlanningViews();
      });
    }

    // ---- Zone Clustering Rules: auto-place unassigned towns into a Delivery
    // Area based on a Zone ID condition (e.g. "starts with A" -> "Bauko"). ----
    const getAllTownZoneSetsForClustering = () => {
      const result = new Map();
      const lm = (typeof NOL3.getPlanningLMInventoryV10 === "function" ? NOL3.getPlanningLMInventoryV10() : NOL3.lmInventory);
      if (!lm?.filteredRows?.length || !Array.isArray(lm.headers)) return result;
      const townIndex = findTownColumn(lm.headers);
      const zoneIndex = findZoneIdColumn(lm.headers);
      if (townIndex < 0 || zoneIndex < 0) return result;
      const exceptionSet = getPlanningExceptionSet();
      lm.filteredRows.forEach(row => {
        if (rowMatchesPlanningException(row, lm.headers, exceptionSet)) return;
        const town = resolveRowTown(row, townIndex, zoneIndex);
        const zone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim();
        if (!town || !zone) return;
        if (!result.has(town)) result.set(town, new Set());
        result.get(town).add(zone);
      });
      return result;
    };

    const findOrCreateDeliveryAreaByTitle = (title) => {
      const clean = String(title || '').trim();
      if (!clean) return null;
      let area = NOL3.deliveryAreas.find(a => String(a.title || '').trim().toLowerCase() === clean.toLowerCase());
      if (!area) {
        area = {
          id: `area-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          title: clean, towns: [],
          groups: [{ id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, title: 'Town Group', towns: [], assignedRiders: [] }]
        };
        NOL3.deliveryAreas.push(area);
      }
      const groups = ensureAreaGroups(area);
      return { area, group: groups[0] };
    };

    let zoneClusterApplyRunning = false;
    // A rule splits ONLY the matching Zone ID's orders out of a town — it does
    // NOT move the whole town. This reuses the same per-town Zone Settings
    // splitting data (areas/assignments) that the Zone Splitting tab writes to
    // by hand, so a town with zones under several initials (e.g. "A-" and "E-")
    // ends up with one exact-count card per matched zone, and the rest of the
    // town's volume stays put, separate and uncombined.
    const applyZoneClusterRules = (options = {}) => {
      const statusEl = document.getElementById('zoneClusterStatus');
      const setStatus = text => { if (statusEl && !options.silent) statusEl.textContent = text; };
      if (zoneClusterApplyRunning) return { moved: 0 }; // re-entrancy guard
      const rules = NOL3.getZoneClusterRules();
      if (!rules.length) { setStatus('No rules to apply.'); return { moved: 0 }; }
      if (!NOL3.lmInventory?.filteredRows?.length) { setStatus('Upload LM Inventory first.'); return { moved: 0 }; }
      const zoneColIndex = findZoneIdColumn(NOL3.lmInventory.headers || []);
      if (zoneColIndex < 0) { setStatus('No Zone ID column found.'); return { moved: 0 }; }

      zoneClusterApplyRunning = true;
      try {
        const townZones = getAllTownZoneSetsForClustering(); // town -> Set(raw Zone ID)
        const { store, hub, data } = getZoneSettingsHubStore();
        const touchedKeys = new Set(); // "town::areaTitle" pairs actually created/changed this pass

        townZones.forEach((zones, town) => {
          zones.forEach(zone => {
            for (const rule of rules) {
              if (!NOL3.matchZoneClusterRule(rule, zone)) continue;
              const areaTitle = String(rule.targetArea || '').trim();
              if (!areaTitle) break;
              data[town] = data[town] && typeof data[town] === 'object' ? data[town] : { areas: [], assignments: {} };
              data[town].areas = Array.isArray(data[town].areas) ? data[town].areas : [];
              data[town].assignments = data[town].assignments && typeof data[town].assignments === 'object' ? data[town].assignments : {};
              if (!data[town].areas.some(a => String(a).toLowerCase() === areaTitle.toLowerCase())) data[town].areas.push(areaTitle);
              if (data[town].assignments[zone] !== areaTitle) {
                data[town].assignments[zone] = areaTitle;
                touchedKeys.add(`${town}::${areaTitle}`);
              }
              break; // first matching rule wins for THIS zone — the rest of the town's zones are untouched
            }
          });
        });

        store[hub] = data;
        const changed = touchedKeys.size > 0;
        if (changed) saveZoneSettingsStore(store);

        // Place each newly-split piece straight into its matching Delivery Area,
        // carrying only that zone's exact count — never the whole town's total.
        let movedOrders = 0;
        touchedKeys.forEach(key => {
          const sep = key.lastIndexOf('::');
          const town = key.slice(0, sep), areaTitle = key.slice(sep + 2);
          const opKey = makeOperationalTownKey(town, areaTitle);
          movedOrders += getOperationalTownStats(town, areaTitle).count;
          const resolved = findOrCreateDeliveryAreaByTitle(areaTitle);
          if (!resolved) return;
          NOL3.deliveryAreas.forEach(a => ensureAreaGroups(a).forEach(g => { g.towns = g.towns.filter(t => t !== opKey); }));
          resolved.group.towns.push(opKey);
          resolved.area.towns = ensureAreaGroups(resolved.area).flatMap(g => g.towns);
        });

        if (changed) {
          savePlanningLayout();
          renderDeliveryAreas();
          renderOnFloorTowns();
          renderZoneSettings();
          notifyZoneSettingsChanged();
        }
        setStatus(changed
          ? `${touchedKeys.size} Zone ID split${touchedKeys.size === 1 ? '' : 's'} applied · ${movedOrders.toLocaleString()} orders placed — the rest of each town's volume is untouched.`
          : 'No unmatched Zone IDs to split — everything matching the rules is already placed.');
        return { moved: movedOrders };
      } finally {
        zoneClusterApplyRunning = false;
      }
    };
    NOL3.applyZoneClusterRules = applyZoneClusterRules;

    const renderZoneClusterRules = () => {
      const list = document.getElementById('zoneClusterRulesList');
      const datalist = document.getElementById('zoneClusterAreaOptions');
      if (!list) return;
      if (datalist) datalist.innerHTML = NOL3.deliveryAreas.map(a => `<option value="${NOL3.escapeHTML(a.title)}">`).join('');
      const rules = NOL3.getZoneClusterRules();
      if (!rules.length) { list.innerHTML = '<div class="zone-settings-empty">No clustering rules yet.</div>'; return; }
      const condLabel = { startswith: 'starts with', contains: 'contains', equals: 'equals' };
      list.innerHTML = rules.map(rule => `
        <div class="zone-cluster-rule-row${editingZoneClusterRuleId === rule.id ? ' editing' : ''}" data-rule-id="${NOL3.escapeHTML(rule.id)}">
          <span class="zone-cluster-rule-text">Zone ID <b>${condLabel[rule.condition] || 'starts with'}</b> "${NOL3.escapeHTML(rule.value)}" → <b>${NOL3.escapeHTML(rule.targetArea)}</b></span>
          <span class="zone-cluster-rule-row-actions">
            <button type="button" class="zone-cluster-rule-edit" data-edit-rule="${NOL3.escapeHTML(rule.id)}" aria-label="Edit rule">Edit</button>
            <button type="button" class="zone-cluster-rule-delete" data-delete-rule="${NOL3.escapeHTML(rule.id)}" aria-label="Delete rule">×</button>
          </span>
        </div>`).join('');
      list.querySelectorAll('[data-delete-rule]').forEach(btn => btn.addEventListener('click', () => {
        if (editingZoneClusterRuleId === btn.dataset.deleteRule) cancelZoneClusterEdit();
        NOL3.saveZoneClusterRules(NOL3.getZoneClusterRules().filter(r => r.id !== btn.dataset.deleteRule));
        renderZoneClusterRules();
      }));
      list.querySelectorAll('[data-edit-rule]').forEach(btn => btn.addEventListener('click', () => startZoneClusterEdit(btn.dataset.editRule)));
    };
    NOL3.renderZoneClusterRules = renderZoneClusterRules;

    let editingZoneClusterRuleId = null;
    const zoneClusterFormEls = () => ({
      condition: document.getElementById('zoneClusterCondition'),
      value: document.getElementById('zoneClusterValue'),
      target: document.getElementById('zoneClusterTarget'),
      addBtn: document.getElementById('zoneClusterAddRule'),
      cancelBtn: document.getElementById('zoneClusterCancelEdit')
    });
    const startZoneClusterEdit = (ruleId) => {
      const rule = NOL3.getZoneClusterRules().find(r => r.id === ruleId);
      if (!rule) return;
      editingZoneClusterRuleId = ruleId;
      const els = zoneClusterFormEls();
      if (els.condition) els.condition.value = rule.condition || 'startswith';
      if (els.value) els.value.value = rule.value || '';
      if (els.target) els.target.value = rule.targetArea || '';
      if (els.addBtn) els.addBtn.textContent = 'Save Changes';
      if (els.cancelBtn) els.cancelBtn.hidden = false;
      els.value?.focus();
      renderZoneClusterRules();
    };
    const cancelZoneClusterEdit = () => {
      editingZoneClusterRuleId = null;
      const els = zoneClusterFormEls();
      if (els.value) els.value.value = '';
      if (els.target) els.target.value = '';
      if (els.addBtn) els.addBtn.textContent = '+ Add Rule';
      if (els.cancelBtn) els.cancelBtn.hidden = true;
      renderZoneClusterRules();
    };
    document.getElementById('zoneClusterCancelEdit')?.addEventListener('click', cancelZoneClusterEdit);

    document.getElementById('zoneClusterAddRule')?.addEventListener('click', () => {
      const condition = document.getElementById('zoneClusterCondition')?.value || 'startswith';
      const valueInput = document.getElementById('zoneClusterValue');
      const targetInput = document.getElementById('zoneClusterTarget');
      const value = String(valueInput?.value || '').trim();
      const targetArea = String(targetInput?.value || '').trim();
      if (!value || !targetArea) { (!value ? valueInput : targetInput)?.focus(); return; }
      const rules = NOL3.getZoneClusterRules();
      if (editingZoneClusterRuleId) {
        const existing = rules.find(r => r.id === editingZoneClusterRuleId);
        if (existing) { existing.condition = condition; existing.value = value; existing.targetArea = targetArea; }
      } else {
        rules.push({ id: `rule-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, condition, value, targetArea });
      }
      NOL3.saveZoneClusterRules(rules);
      cancelZoneClusterEdit();
      applyZoneClusterRules({ silent: false });
    });
    document.getElementById('zoneClusterApplyNow')?.addEventListener('click', () => applyZoneClusterRules({ silent: false }));

    // ---- Bulk setup: detect every Zone ID prefix (e.g. "A-", "B-") and let the
    // planner assign each one to a Delivery Area in a single pass. ----
    const detectZoneClusterInitials = () => {
      const listEl = document.getElementById('zoneClusterBulkList');
      const createBtn = document.getElementById('zoneClusterCreateAll');
      if (!listEl) return;
      const lm = (typeof NOL3.getPlanningLMInventoryV10 === "function" ? NOL3.getPlanningLMInventoryV10() : NOL3.lmInventory);
      if (!lm?.filteredRows?.length || !Array.isArray(lm.headers)) {
        listEl.innerHTML = '<div class="zone-settings-empty">Upload LM Inventory first.</div>';
        if (createBtn) createBtn.hidden = true;
        return;
      }
      const zoneIndex = findZoneIdColumn(lm.headers);
      const townIndex = findTownColumn(lm.headers);
      if (zoneIndex < 0) {
        listEl.innerHTML = '<div class="zone-settings-empty">No Zone ID column found.</div>';
        if (createBtn) createBtn.hidden = true;
        return;
      }
      const exceptionSet = getPlanningExceptionSet();
      const prefixInfo = new Map(); // prefix -> { orders, towns:Set }
      lm.filteredRows.forEach(row => {
        if (rowMatchesPlanningException(row, lm.headers, exceptionSet)) return;
        const zone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim();
        if (!zone) return;
        const dashIdx = zone.indexOf('-');
        const prefix = dashIdx >= 0 ? zone.slice(0, dashIdx + 1) : zone;
        if (!prefixInfo.has(prefix)) prefixInfo.set(prefix, { orders: 0, towns: new Set() });
        const entry = prefixInfo.get(prefix);
        entry.orders += 1;
        if (townIndex >= 0) entry.towns.add(parseTownValue(row[townIndex]));
      });
      const entries = [...prefixInfo.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));
      if (!entries.length) {
        listEl.innerHTML = '<div class="zone-settings-empty">No Zone IDs found in the current snapshot.</div>';
        if (createBtn) createBtn.hidden = true;
        return;
      }
      const existingRules = NOL3.getZoneClusterRules();
      const existingTargetFor = prefix => existingRules.find(r => r.condition === 'startswith' && String(r.value).toLowerCase() === prefix.toLowerCase())?.targetArea || '';
      listEl.innerHTML = entries.map(([prefix, info]) => `
        <div class="zone-cluster-bulk-row" data-prefix="${NOL3.escapeHTML(prefix)}">
          <span class="zone-cluster-bulk-prefix">${NOL3.escapeHTML(prefix)}</span>
          <span class="zone-cluster-bulk-meta">${info.towns.size.toLocaleString()} town${info.towns.size === 1 ? '' : 's'} · ${info.orders.toLocaleString()} orders</span>
          <input type="text" class="zone-settings-input zone-cluster-bulk-target" list="zoneClusterAreaOptions" placeholder="Delivery Area" value="${NOL3.escapeHTML(existingTargetFor(prefix))}">
        </div>`).join('');
      if (createBtn) createBtn.hidden = false;
    };
    document.getElementById('zoneClusterDetectInitials')?.addEventListener('click', detectZoneClusterInitials);
    document.getElementById('zoneClusterCreateAll')?.addEventListener('click', () => {
      const rows = document.querySelectorAll('#zoneClusterBulkList .zone-cluster-bulk-row');
      const rules = NOL3.getZoneClusterRules();
      let added = 0, updated = 0;
      rows.forEach(row => {
        const prefix = row.dataset.prefix || '';
        const target = String(row.querySelector('.zone-cluster-bulk-target')?.value || '').trim();
        if (!prefix || !target) return;
        const existing = rules.find(r => r.condition === 'startswith' && String(r.value).toLowerCase() === prefix.toLowerCase());
        if (existing) { existing.targetArea = target; updated++; }
        else { rules.push({ id: `rule-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, condition: 'startswith', value: prefix, targetArea: target }); added++; }
      });
      if (!added && !updated) return;
      NOL3.saveZoneClusterRules(rules);
      renderZoneClusterRules();
      const result = applyZoneClusterRules({ silent: true });
      const statusEl = document.getElementById('zoneClusterStatus');
      if (statusEl) statusEl.textContent = `${added} rule${added === 1 ? '' : 's'} created, ${updated} updated · ${result.moved} town${result.moved === 1 ? '' : 's'} moved.`;
    });

    // ---- Control Room: manual column-mapping overrides, per hub. ----
    const CONTROL_ROOM_FIELDS = [
      { namespace: 'parcel', field: 'townName', label: 'Town Name', candidates: ["Town Name", "Town", "Municipality", "Destination Town", "Destination Municipality", "Destination City", "Receiver Town"], letter: null, sourceHeaders: () => [...(NOL3.lmInventory?.headers || []), ...(NOL3.incomingInventory?.headers || [])] },
      { namespace: 'parcel', field: 'zoneId', label: 'Zone ID', candidates: ["Zone ID", "ZoneID", "Zone_ID"], letter: null, sourceHeaders: () => NOL3.lmInventory?.headers || [] },
      { namespace: 'parcel', field: 'orderId', label: 'Order ID / Tracking No.', candidates: ["Order ID", "Order Id", "OrderID", "SPX TN", "SPX Tracking Number", "SLS TN", "SLS Tracking Number", "Tracking Number"], letter: 'A', sourceHeaders: () => NOL3.incomingInventory?.headers || [] },
      { namespace: 'parcel', field: 'currentStation', label: 'Current Station', candidates: ["Current Station"], letter: 'AG', sourceHeaders: () => NOL3.incomingInventory?.headers || [] },
      { namespace: 'parcel', field: 'destinationStation', label: 'Destination Station', candidates: ["Destination Station"], letter: 'AL', sourceHeaders: () => NOL3.incomingInventory?.headers || [] },
      { namespace: 'parcel', field: 'nextStation', label: 'Next Station', candidates: ["Next Station"], letter: 'AM', sourceHeaders: () => NOL3.incomingInventory?.headers || [] },
      { namespace: 'linehaul', field: 'taskId', label: 'Line Haul Task ID', candidates: ["Line Haul Task ID", "Linehaul Task ID", "Line Haul Task", "Linehaul Task", "Task ID", "Task", "Linehaul"], letter: 'A', sourceHeaders: () => NOL3.lineHaulInventory?.headers || [] },
      { namespace: 'linehaul', field: 'spxTn', label: 'SPX TN (From-To List)', candidates: ["SPX TN", "SPX Tracking Number", "SLS TN", "SLS Tracking Number", "Tracking Number", "Tracking No", "Tracking ID"], letter: 'D', sourceHeaders: () => NOL3.lineHaulInventory?.headers || [] }
    ];
    const renderControlRoom = () => {
      const root = document.getElementById('controlRoomFieldList');
      if (!root) return;
      const mapping = NOL3.getColumnMapping();
      root.innerHTML = CONTROL_ROOM_FIELDS.map(f => {
        const headers = [...new Set(f.sourceHeaders().filter(Boolean))];
        const override = mapping?.[f.namespace]?.[f.field] || '';
        const resolvedIdx = NOL3.resolveColumnIndex(f.sourceHeaders(), f.namespace, f.field, f.candidates, f.letter);
        const resolvedName = resolvedIdx >= 0 ? (f.sourceHeaders()[resolvedIdx] || `Column ${resolvedIdx + 1}`) : 'Not found — upload the file';
        return `
          <div class="control-room-row">
            <div class="control-room-label">${NOL3.escapeHTML(f.label)}</div>
            <div class="control-room-current">Using: <b>${NOL3.escapeHTML(resolvedName)}</b>${override ? '<span class="control-room-override-tag">manual</span>' : ''}</div>
            <select class="control-room-select" data-namespace="${f.namespace}" data-field="${f.field}">
              <option value="">— Auto-detect —</option>
              ${headers.map(h => `<option value="${NOL3.escapeHTML(h)}" ${h === override ? 'selected' : ''}>${NOL3.escapeHTML(h)}</option>`).join('')}
            </select>
          </div>`;
      }).join('');
      root.querySelectorAll('.control-room-select').forEach(select => {
        select.addEventListener('change', () => {
          NOL3.setColumnMappingField(select.dataset.namespace, select.dataset.field, select.value);
          renderControlRoom();
          if (typeof NOL3.refreshPlanningViews === 'function') NOL3.refreshPlanningViews();
          if (typeof NOL3.renderLinehaulTripDashboard === 'function') NOL3.renderLinehaulTripDashboard();
        });
      });
    };
    NOL3.renderControlRoom = renderControlRoom;

    const ZS_TAB_PANELS = { split: 'zoneSettingsTabSplit', cluster: 'zoneSettingsTabCluster', control: 'zoneSettingsTabControl' };
    document.querySelectorAll('.zone-settings-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.zone-settings-tab').forEach(t => { const active = t === tab; t.classList.toggle('active', active); t.setAttribute('aria-selected', active ? 'true' : 'false'); });
        const target = tab.dataset.zsTab;
        Object.entries(ZS_TAB_PANELS).forEach(([key, id]) => { const el = document.getElementById(id); if (el) el.hidden = key !== target; });
        if (target === 'cluster') renderZoneClusterRules();
        if (target === 'control') renderControlRoom();
      });
    });

    window.addEventListener('inventoryloaded', event => {
      if (event.detail?.type === 'lm') applyZoneClusterRules({ silent: true });
    });

    // Zone Settings operational towns: each configured Zone-ID area becomes
    // its own draggable "town" in the On-Floor Towns panel. The source CSV
    // town remains unchanged; only the operational display/assignment key is new.
    const makeOperationalTownKey = (town, area) => `__NOL3_ZONE_TOWN__${encodeURIComponent(String(town || ''))}::${encodeURIComponent(String(area || ''))}`;
    const parseOperationalTownKey = (key) => {
      const value = String(key || '');
      const prefix = '__NOL3_ZONE_TOWN__';
      if (!value.startsWith(prefix)) return null;
      const body = value.slice(prefix.length);
      const split = body.split('::');
      if (split.length < 2) return null;
      try {
        return { town: decodeURIComponent(split[0]), area: decodeURIComponent(split.slice(1).join('::')) };
      } catch (_) { return null; }
    };
    const getOperationalTownDefinitions = (town) => {
      const data = getZoneSettingsTownData(town);
      const areas = Array.isArray(data?.areas) ? data.areas : [];
      const assignments = data?.assignments && typeof data.assignments === 'object' ? data.assignments : {};
      const assignedAreas = new Set(Object.values(assignments).map(v => String(v || '')).filter(Boolean));
      return areas.filter(area => assignedAreas.has(String(area))).map(area => ({
        key: makeOperationalTownKey(town, area), town, area: String(area)
      }));
    };
    const getOperationalTownStats = (town, area) => {
      const result = { count: 0, incomingCount: 0, received: 0, delivering: 0, delivered: 0, hold: 0 };
      const lm = (typeof NOL3.getPlanningLMInventoryV10 === "function" ? NOL3.getPlanningLMInventoryV10() : NOL3.lmInventory);
      if (!lm?.filteredRows?.length || !Array.isArray(lm.headers)) return result;
      const townIndex = findTownColumn(lm.headers);
      const zoneIndex = findZoneIdColumn(lm.headers);
      if (townIndex < 0 || zoneIndex < 0) return result;
      const statusCandidates = ['spx status','status','parcel status','order status'];
      const normalizedHeaders = lm.headers.map(h => String(h ?? '').replace(/^\uFEFF/, '').trim().toLowerCase());
      const statusIndex = statusCandidates.map(name => normalizedHeaders.indexOf(name)).find(i => i >= 0) ?? -1;
      const businessMetrics = typeof getBusinessDayMetrics === 'function' ? getBusinessDayMetrics() : null;
      const identityIndex = typeof getBusinessIdentityIndex === 'function' ? getBusinessIdentityIndex(lm.headers) : -1;
      const dueIds = businessMetrics?.dueIds instanceof Set ? businessMetrics.dueIds : null;
      const receivedIndex = businessMetrics?.receivedIndex ?? -1;
      const hasBusinessWindow = dueIds && receivedIndex >= 0;
      const exceptionSet = getPlanningExceptionSet();
      const assignedZones = new Set();
      const zoneData = getZoneSettingsTownData(town);
      const assignments = zoneData?.assignments && typeof zoneData.assignments === 'object' ? zoneData.assignments : {};
      Object.keys(assignments).forEach(zone => { if (String(assignments[zone]) === String(area)) assignedZones.add(String(zone).trim()); });
      lm.filteredRows.forEach((row, index) => {
        // Effective town (after any Zone reassignment) — never the raw native
        // town — so a zone moved to this town via reassignment is correctly
        // counted here, and a zone moved AWAY is correctly excluded.
        if (resolveRowTown(row, townIndex, zoneIndex) !== town) return;
        if (rowMatchesPlanningException(row, lm.headers, exceptionSet)) return;
        if (hasBusinessWindow) {
          const rawId = identityIndex >= 0 ? row[identityIndex] : '';
          const id = normalizeIncomingKey(rawId) || `__row_${index}`;
          if (!dueIds.has(id)) return;
        }
        const zone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim();
        if (!assignedZones.has(zone)) return;
        result.count += 1;
        const status = statusIndex >= 0 ? String(row[statusIndex] || '').replace(/^\uFEFF/, '').trim().toUpperCase().replace(/[\s_-]+/g, ' ') : '';
        if (status === 'DELIVERED') result.delivered += 1;
        else if (status === 'DELIVERING') result.delivering += 1;
        else if (status === 'RECEIVED' || status === 'LMHUB RECEIVED') result.received += 1;
        else if (status === 'ONHOLD' || status === 'ON HOLD' || status === 'LMHUB ONHOLD' || status === 'LMHUB ON HOLD') result.hold += 1;
      });
      return result;
    };

    const migrateZoneSplitAssignments = () => {
      let changed = false;
      NOL3.deliveryAreas.forEach(area => {
        const groups = ensureAreaGroups(area);
        groups.forEach(group => {
          const next = [];
          group.towns.forEach(townKey => {
            const splitDefs = getOperationalTownDefinitions(townKey);
            if (splitDefs.length) {
              splitDefs.forEach(def => { if (!next.includes(def.key)) next.push(def.key); });
              changed = true;
            } else if (!next.includes(townKey)) next.push(townKey);
          });
          group.towns = next;
        });
        area.towns = groups.flatMap(group => group.towns);
      });
      if (changed) savePlanningLayout();
    };

    const updateTownBulkToolbar = () => {
      const toolbar = document.getElementById('townBulkToolbar');
      const countEl = document.getElementById('townSelectedCount');
      const targetSelect = document.getElementById('townBulkTarget');
      const moveBtn = document.getElementById('townBulkMoveBtn');
      const selected = NOL3._selectedTowns instanceof Set ? NOL3._selectedTowns : new Set();
      if (!toolbar) return;
      toolbar.hidden = selected.size === 0;
      if (countEl) countEl.textContent = String(selected.size);
      if (targetSelect) {
        const current = targetSelect.value;
        const options = [];
        NOL3.deliveryAreas.forEach(area => {
          ensureAreaGroups(area).forEach((group, gi) => {
            options.push(`<option value="${area.id}::${group.id}">${NOL3.escapeHTML(area.title)} → ${NOL3.escapeHTML(group.title || ('Group ' + (gi + 1)))}</option>`);
          });
        });
        targetSelect.innerHTML = `<option value="">Move to…</option>${options.join('')}`;
        if ([...targetSelect.options].some(o => o.value === current)) targetSelect.value = current;
      }
      if (moveBtn) moveBtn.disabled = selected.size === 0 || !targetSelect?.value;
    };

    const bindTownFilterAndBulkControls = () => {
      const modeButtons = document.querySelectorAll('.town-view-mode-btn');
      NOL3._townListMode = (NOL3._townListMode === 'town') ? 'town' : 'zone';
      modeButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.townViewMode === NOL3._townListMode);
        btn.addEventListener('click', () => {
          if (NOL3._townListMode === btn.dataset.townViewMode) return;
          NOL3._townListMode = btn.dataset.townViewMode;
          modeButtons.forEach(other => other.classList.toggle('active', other === btn));
          renderOnFloorTowns();
        });
      });

      const filterInput = document.getElementById('townZoneFilterInput');
      const filterClear = document.getElementById('townZoneFilterClear');
      const selectAllBox = document.getElementById('townSelectAllVisible');
      const targetSelect = document.getElementById('townBulkTarget');
      const moveBtn = document.getElementById('townBulkMoveBtn');
      const clearBtn = document.getElementById('townBulkClearBtn');
      if (filterInput) {
        filterInput.value = NOL3._townZoneFilterText || '';
        filterInput.addEventListener('input', () => { NOL3._townZoneFilterText = filterInput.value; renderOnFloorTowns(); });
      }
      filterClear?.addEventListener('click', () => { NOL3._townZoneFilterText = ''; if (filterInput) filterInput.value = ''; renderOnFloorTowns(); });
      document.getElementById('zoneGroupExpandAll')?.addEventListener('click', () => {
        (NOL3._lastZoneGroupIds || []).forEach(zoneId => NOL3._expandedZoneGroups.add(zoneId));
        renderOnFloorTowns();
      });
      document.getElementById('zoneGroupCollapseAll')?.addEventListener('click', () => {
        NOL3._expandedZoneGroups?.clear();
        renderOnFloorTowns();
      });
      selectAllBox?.addEventListener('change', () => {
        const cards = document.querySelectorAll('#onFloorTownSummary .town-card');
        NOL3._selectedTowns = NOL3._selectedTowns instanceof Set ? NOL3._selectedTowns : new Set();
        cards.forEach(card => { if (selectAllBox.checked) NOL3._selectedTowns.add(card.dataset.town || ''); else NOL3._selectedTowns.delete(card.dataset.town || ''); });
        renderOnFloorTowns();
      });
      targetSelect?.addEventListener('change', () => updateTownBulkToolbar());
      moveBtn?.addEventListener('click', () => {
        const [areaId, groupId] = String(targetSelect?.value || '').split('::');
        if (!areaId || !groupId) return;
        const selected = [...(NOL3._selectedTowns instanceof Set ? NOL3._selectedTowns : [])];
        if (!selected.length) return;
        assignTownsToGroup(selected, areaId, groupId);
        NOL3._selectedTowns.clear();
      });
      clearBtn?.addEventListener('click', () => { NOL3._selectedTowns?.clear(); renderOnFloorTowns(); });
    };
    bindTownFilterAndBulkControls();

    const renderOnFloorTowns = () => {
      const summary = document.getElementById("onFloorTownSummary");
      if (!summary) return;

      const lm = (typeof NOL3.getPlanningLMInventoryV10 === "function" ? NOL3.getPlanningLMInventoryV10() : NOL3.lmInventory);
      const hub = getSelectedHub();
      const townToggleBadge = document.getElementById("townToggleBadge");
      const setUnassignedCount = (count) => {
        const value = Number(count || 0);
        if (townToggleBadge) {
          townToggleBadge.textContent = value.toLocaleString();
          townToggleBadge.setAttribute("aria-label", `${value.toLocaleString()} unassigned town${value === 1 ? "" : "s"}`);
        }
      };

      if (!lm || !lm.rows || !lm.rows.length) {
        summary.innerHTML = `<div class="town-empty">Upload LM Inventory to see towns.</div>`;
        updateTownToggleVisibility(false);
        const badge = document.getElementById("townTotalBadge");
        if (badge) badge.textContent = "0 towns · 0 orders";
        setUnassignedCount(0);
        return;
      }
      if (!hub) {
        summary.innerHTML = `<div class="town-empty">Select a hub to view filtered towns.</div>`;
        updateTownToggleVisibility(false);
        const badge = document.getElementById("townTotalBadge");
        if (badge) badge.textContent = "0 towns · 0 orders";
        setUnassignedCount(0);
        return;
      }

      // Always derive the Planning rows from the actual LM snapshot when the
      // cached filteredRows array is empty/stale. Forward Order exports are LM
      // data too, and a restore/cloud refresh can temporarily leave filteredRows
      // empty even though lm.rows already contains the uploaded orders.
      const headers = lm.headers || [];
      let filteredRows = Array.isArray(lm.filteredRows) ? lm.filteredRows : [];
      if (lm.isForwardOrderSnapshot && Array.isArray(lm.rows) && lm.rows.length) {
        filteredRows = lm.rows.slice();
        lm.filteredRows = filteredRows;
      }
      if (!filteredRows.length && Array.isArray(lm.rows) && lm.rows.length) {
        try {
          const repaired = typeof NOL3.filterRowsToHub === 'function'
            ? NOL3.filterRowsToHub(headers, lm.rows, 'auto').rows
            : lm.rows.slice();
          if (repaired.length) {
            filteredRows = repaired;
            lm.filteredRows = repaired;
          }
        } catch (_) {}
      }
      const townIndex = findTownColumn(headers);
      const zoneIndex = findZoneIdColumn(headers);
      const assignedTowns = getAssignedTownSet();
      NOL3._selectedTowns = NOL3._selectedTowns instanceof Set ? NOL3._selectedTowns : new Set();
      if (townIndex < 0) {
        summary.innerHTML = `<div class="town-empty">No town/municipality column was found in the LM Inventory file.</div>`;
        updateTownToggleVisibility(false);
        const badge = document.getElementById("townTotalBadge");
        if (badge) badge.textContent = "0 towns · 0 orders";
        setUnassignedCount(0);
        return;
      }

      const grouped = new Map();
      const rawTownCounts = new Map();
      const townZoneSets = new Map(); // town -> Map(raw Zone ID -> count) — powers the filter AND the By Zone grouping
      const exceptionSet = getPlanningExceptionSet();

      // Exact status totals for each Town + Zone ID. The By Zone view must use
      // these values instead of the whole-town totals so statuses never leak
      // from one Zone ID into another.
      const townStatusMetricsForCards = new Map();
      const zoneStatusMetrics = new Map();
      const zoneStatusOperationalMetrics = new Map();
      const normalizePlanningStatus = value => String(value ?? '').replace(/^\uFEFF/, '').trim().toUpperCase().replace(/[\s_-]+/g, ' ');
      const normalizePlanningHeader = value => String(value ?? '').replace(/^\uFEFF/, '').trim().toLowerCase();
      const statusCandidates = ['spx status','status','parcel status','order status'];
      const normalizedPlanningHeaders = headers.map(normalizePlanningHeader);
      const statusIndex = statusCandidates.map(name => normalizedPlanningHeaders.indexOf(name)).find(index => index >= 0) ?? -1;
      const addPlanningStatus = (map, key, status) => {
        if (!map.has(key)) map.set(key, {received:0, delivering:0, delivered:0, hold:0});
        const m = map.get(key);
        if (status === 'DELIVERED') m.delivered += 1;
        else if (status === 'DELIVERING') m.delivering += 1;
        else if (status === 'RECEIVED' || status === 'LMHUB RECEIVED') m.received += 1;
        else if (status === 'ONHOLD' || status === 'ON HOLD' || status === 'LMHUB ONHOLD' || status === 'LMHUB ON HOLD') m.hold += 1;
        return m;
      };
      if (statusIndex >= 0 && zoneIndex >= 0) {
        filteredRows.forEach(row => {
          if (rowMatchesPlanningException(row, headers, exceptionSet)) return;
          const town = resolveRowTown(row, townIndex, zoneIndex);
          if (!town) return;
          const zone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim();
          if (!zone) return;
          const status = normalizePlanningStatus(row[statusIndex]);
          addPlanningStatus(townStatusMetricsForCards, town, status);
          addPlanningStatus(zoneStatusMetrics, `${town}\u0000${zone}`, status);
          try {
            const data = getZoneSettingsTownData(town);
            const assignments = data?.assignments && typeof data.assignments === 'object' ? data.assignments : {};
            const area = String(assignments[zone] || '').trim();
            if (area) addPlanningStatus(zoneStatusOperationalMetrics, `${town}\u0000${area}\u0000${zone}`, status);
          } catch (_) {}
        });
      }

      // On-Floor Towns and Total Volume use the same current LM snapshot,
      // but every row matching an Exception must be removed first.
      // No CFR1/LH COT/date filtering is introduced here.
      filteredRows.forEach(row => {
        if (rowMatchesPlanningException(row, headers, exceptionSet)) return;
        const town = resolveRowTown(row, townIndex, zoneIndex);
        if (!town) return;
        rawTownCounts.set(town, (rawTownCounts.get(town) || 0) + 1);
        if (zoneIndex >= 0) {
          const rawZone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim();
          if (rawZone) {
            if (!townZoneSets.has(town)) townZoneSets.set(town, new Map());
            const zm = townZoneSets.get(town);
            zm.set(rawZone, (zm.get(rawZone) || 0) + 1);
          }
        }
      });

      rawTownCounts.forEach((rawCount, town) => {
        const splitDefs = getOperationalTownDefinitions(town);
        if (splitDefs.length) {
          let splitSum = 0;
          splitDefs.forEach(def => {
            const stats = getOperationalTownStats(town, def.area);
            splitSum += stats.count;
            if (assignedTowns.has(def.key)) return;
            if (stats.count > 0) grouped.set(def.key, { town: def.key, displayTown: town, baseTown: town, splitArea: def.area, count: stats.count, incomingCount: 0 });
          });
          // A town split only PARTLY (e.g. one Zone ID initial matched a cluster
          // rule, others didn't) keeps its own card for the remaining, still-
          // unsplit volume — nothing disappears just because part of it moved.
          const remainder = rawCount - splitSum;
          if (remainder > 0 && !assignedTowns.has(town)) {
            grouped.set(town, { town, displayTown: town, baseTown: town, splitArea: '', count: remainder, incomingCount: 0 });
          }
        } else if (!assignedTowns.has(town)) {
          grouped.set(town, { town, displayTown: town, baseTown: town, splitArea: '', count: rawCount, incomingCount: 0 });
        }
      });

      if (showIncomingOrdersOnFloor) {
        const incomingCounts = getIncomingTownCounts();
        incomingCounts.forEach((count, town) => {
          if (getOperationalTownDefinitions(town).length) return;
          if (assignedTowns.has(town)) return;
          const existing = grouped.get(town) || { town, displayTown: town, baseTown: town, splitArea: '', count: 0, incomingCount: 0 };
          existing.incomingCount += count;
          grouped.set(town, existing);
        });
      }

      // Arrived linehauls add their towns to the On-Floor Towns view only.
      // They do NOT change Total Volume; the LM snapshot remains the source
      // of Total Volume. Arrived orders also stop contributing to the Incoming
      // Orders notification above.
      const arrivedCounts = getArrivedIncomingTownCounts();
      arrivedCounts.forEach((count, town) => {
        if (getOperationalTownDefinitions(town).length) return;
        if (assignedTowns.has(town)) return;
        const existing = grouped.get(town) || { town, displayTown: town, baseTown: town, splitArea: '', count: 0, incomingCount: 0 };
        existing.incomingCount += count;
        grouped.set(town, existing);
      });

      if (!grouped.size) {
        summary.innerHTML = `<div class="town-empty">No unassigned towns are available for ${NOL3.escapeHTML(hub)}.</div>`;
        updateTownToggleVisibility(false);
        const badge = document.getElementById("townTotalBadge");
        if (badge) badge.textContent = "0 towns · 0 orders";
        setUnassignedCount(0);
        return;
      }

      // Zone ID filter. In "By Town" mode it keeps only towns that carry a
      // matching Zone ID; in "By Zone" mode it keeps only Zone groups whose ID
      // matches. Either way this is what makes a 300+-town hub manageable.
      let sorted = [...grouped.values()].sort((a, b) => a.displayTown.localeCompare(b.displayTown) || b.count - a.count);
      const zoneFilterText = String(NOL3._townZoneFilterText || '').trim().toLowerCase();
      const mode = (NOL3._townListMode === 'town') ? 'town' : 'zone';
      if (zoneFilterText && mode === 'town') {
        sorted = sorted.filter(item => {
          const zones = townZoneSets.get(item.baseTown);
          if (!zones) return false;
          for (const z of zones.keys()) if (z.toLowerCase().includes(zoneFilterText)) return true;
          return false;
        });
      }
      // Drop selections that are no longer visible (moved away, filtered out, etc.).
      const visibleKeys = new Set(sorted.map(item => item.town));
      [...NOL3._selectedTowns].forEach(key => { if (!visibleKeys.has(key)) NOL3._selectedTowns.delete(key); });
      updateTownToggleVisibility(true);
      const townTotalBadge = document.getElementById("townTotalBadge");
      if (townTotalBadge) {
        const uniqueTownCount = sorted.length;
        const orderTotal = sorted.reduce((total, item) => total + item.count + (item.incomingCount || 0), 0);
        townTotalBadge.textContent = `${uniqueTownCount.toLocaleString()} town${uniqueTownCount === 1 ? "" : "s"} · ${orderTotal.toLocaleString()} orders`;
        setUnassignedCount(uniqueTownCount);
      }

      const formatTownZoneIds = (baseTown) => {
        const zones = townZoneSets.get(baseTown);
        if (!zones || !zones.size) return "";
        const list = [...zones.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        const shown = list.slice(0, 4);
        const more = list.length - shown.length;
        return shown.join(", ") + (more > 0 ? ` +${more} more` : "");
      };

      // One town-row template shared by both "By Town" (flat) and "By Zone"
      // (grouped) views, so checkbox/drag binding below stays a single code path.
      // zoneContext (set only when rendering inside a specific Zone ID group)
      // means this one card instance represents EXACTLY that one zone's own
      // orders — nothing further to break down. The expand toggle and the
      // multi-zone subtitle are both dropped there on purpose: showing either
      // was exactly the "combined zones" bug (a town's unrelated zones leaking
      // into one specific zone group's row). In "By Town" mode, or for a card's
      // own un-grouped total, both still render normally.
      const buildTownCardHTML = (item, countOverride, zoneContext) => {
        const zoneIdLine = zoneContext
          ? ''
          : (item.splitArea
            ? (() => {
                const list = [...getOperationalTownZoneBreakdown(item.baseTown, item.splitArea).keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
                const shown = list.slice(0, 4);
                const more = list.length - shown.length;
                return shown.join(", ") + (more > 0 ? ` +${more} more` : "");
              })()
            : formatTownZoneIds(item.baseTown));
        const displayCount = countOverride != null ? countOverride : (item.count + (item.incomingCount || 0));
        const toggleHTML = zoneContext ? '' : `<button class="town-zone-toggle" type="button" aria-expanded="false" aria-label="Show Zone IDs for ${NOL3.escapeHTML(item.displayTown)}">▸</button>`;
        const title = zoneContext
          ? `${NOL3.escapeHTML(item.displayTown)} — ${NOL3.escapeHTML(zoneContext)}`
          : `${NOL3.escapeHTML(item.displayTown)}${zoneIdLine ? ' — ' + NOL3.escapeHTML(zoneIdLine) : ''}`;
        return `
          <div class="town-card${NOL3._selectedTowns.has(item.town) ? ' selected' : ''}" draggable="true" data-town="${NOL3.escapeHTML(item.town)}" title="${title}">
            <div class="town-name-wrap">
              <input type="checkbox" class="town-select-checkbox" data-town-select="${NOL3.escapeHTML(item.town)}" ${NOL3._selectedTowns.has(item.town) ? 'checked' : ''} aria-label="Select ${NOL3.escapeHTML(item.displayTown)} for batch move">
              ${toggleHTML}
              <div class="town-name-col">
                <div class="town-name">${NOL3.escapeHTML(item.displayTown)}</div>
                ${zoneIdLine ? `<div class="town-zone-ids">${NOL3.escapeHTML(zoneIdLine)}</div>` : ''}
              </div>
            </div>
            <div class="town-count-stack">
              <div class="town-count">${displayCount.toLocaleString()}</div>
            </div>
          </div>`;
      };

      if (mode === 'town') {
        summary.innerHTML = `
          <div class="town-list-header"><div>Town</div><div style="text-align:right">Orders</div></div>
          ${sorted.map(buildTownCardHTML).join("")}
        `;
      } else {
        // By Zone: group towns under the Zone ID(s) they carry. A town with
        // several Zone IDs appears once under each — exactly the segregation
        // needed to see, at a glance, which towns belong to a given zone.
        // Collapsed by default — with dozens of zone groups, auto-expanding
        // everything makes the list unusable. Clicking a header reveals it.
        NOL3._expandedZoneGroups = NOL3._expandedZoneGroups instanceof Set ? NOL3._expandedZoneGroups : new Set();
        const zoneGroups = new Map(); // zoneId -> { total, items: [{item,count},...] }
        // A card's OWN zones — never its base town's whole zone list. A split
        // card (e.g. "Abatan · C5") only carries the zone(s) actually assigned
        // to that area; a plain/remainder card carries whatever hasn't been
        // split away. This is what keeps a card out of zone groups it has no
        // real orders in.
        const getItemZoneBreakdown = (item) => {
          if (item.splitArea) return getOperationalTownZoneBreakdown(item.baseTown, item.splitArea);
          const full = townZoneSets.get(item.baseTown);
          if (!full) return new Map();
          const defs = getOperationalTownDefinitions(item.baseTown);
          if (!defs.length) return full;
          const zoneData = getZoneSettingsTownData(item.baseTown);
          const assignments = zoneData?.assignments && typeof zoneData.assignments === 'object' ? zoneData.assignments : {};
          const remaining = new Map();
          full.forEach((count, zoneId) => { if (!assignments[zoneId]) remaining.set(zoneId, count); });
          return remaining;
        };
        sorted.forEach(item => {
          const zones = getItemZoneBreakdown(item);
          if (!zones || !zones.size) {
            const bucket = zoneGroups.get('No Zone ID') || { total: 0, items: [] };
            bucket.total += item.count + (item.incomingCount || 0);
            bucket.items.push({ item, count: item.count + (item.incomingCount || 0) });
            zoneGroups.set('No Zone ID', bucket);
            return;
          }
          zones.forEach((count, zoneId) => {
