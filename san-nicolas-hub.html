      </div>
    `;

    const normalizeIncomingHeader = value => String(value ?? "")
      .replace(/^\uFEFF/, "")
      .trim()
      .toLowerCase()
      .replace(/[\s_\-./()]+/g, " ")
      .trim();

    const normalizeIncomingKey = value => String(value ?? "")
      .replace(/^\uFEFF/, "")
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "");

    const findIncomingHeaderIndex = (headers, candidates) => {
      const normalized = (Array.isArray(headers) ? headers : []).map(normalizeIncomingHeader);
      for (const candidate of candidates) {
        const index = normalized.indexOf(normalizeIncomingHeader(candidate));
        if (index >= 0) return index;
      }
      return -1;
    };

    const BUSINESS_DAY_SETTINGS_KEY = "nol3_business_day_settings_v1";
    const BUSINESS_DAY_DATE_KEY = "nol3_business_day_date_v1";
    const BUSINESS_DAY_DEFAULT_START = 3;
    const BUSINESS_DAY_DEFAULT_COT = 15;

    const formatBusinessDateInput = (date = new Date()) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };

    // NOL3 operates on Philippines business dates. Use Asia/Manila explicitly
    // for the NOW button so a browser/runtime using UTC cannot roll the date
    // back to the previous calendar day.
    const getNOL3TodayDate = () => {
      // NOL3 business dates are always Philippines dates (UTC+08:00).
      // Do not fall back to the device's local calendar date because some
      // Android/browser runtimes expose UTC to JavaScript, which can make
      // NOW select yesterday even though the phone shows today's date.
      try {
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "Asia/Manila",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());
        const values = Object.fromEntries(parts.map(p => [p.type, p.value]));
        if (/^\d{4}$/.test(values.year || "") && /^\d{2}$/.test(values.month || "") && /^\d{2}$/.test(values.day || "")) {
          return `${values.year}-${values.month}-${values.day}`;
        }
      } catch (_) {}

      // Hard fallback: compute the UTC+8 calendar date directly. This avoids
      // ever using the device/browser local timezone for the NOW date.
      const manilaMs = Date.now() + (8 * 60 * 60 * 1000);
      const manila = new Date(manilaMs);
      return `${manila.getUTCFullYear()}-${String(manila.getUTCMonth() + 1).padStart(2, "0")}-${String(manila.getUTCDate()).padStart(2, "0")}`;
    };

    const getBusinessDateValue = () => {
      // Planning always opens on the current Philippines calendar date.
      // A previously selected date is still usable during the current session,
      // but a page refresh/new session starts on today rather than yesterday's
      // saved business date.
      if (/^\d{4}-\d{2}-\d{2}$/.test(String(NOL3.currentBusinessDate || ""))) {
        return NOL3.currentBusinessDate;
      }
      const today = (typeof getNOL3TodayDate === "function")
        ? getNOL3TodayDate()
        : formatBusinessDateInput(new Date());
      NOL3.currentBusinessDate = today;
      try { NOL3Storage.set(BUSINESS_DAY_DATE_KEY, today); } catch (_) {}
      return today;
    };

    // Public getter: the topbar renderer is defined in a separate IIFE, so it
    // must access the live Business Date through NOL3 rather than its local scope.
    NOL3.getBusinessDateValue = getBusinessDateValue;

    const saveBusinessDateValue = (value) => {
      const normalized = String(value || "").trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(normalized)) NOL3.currentBusinessDate = normalized;
      try { NOL3Storage.set(BUSINESS_DAY_DATE_KEY, normalized); } catch (_) {}
    };

    const loadBusinessDaySettings = () => {
      try {
        const raw = JSON.parse(NOL3Storage.get(BUSINESS_DAY_SETTINGS_KEY) || "{}");
        return raw && typeof raw === "object" ? raw : {};
      } catch (_) { return {}; }
    };

    const saveBusinessDaySettings = (settings) => {
      try { NOL3Storage.set(BUSINESS_DAY_SETTINGS_KEY, JSON.stringify(settings || {})); } catch (_) {}
    };

    // Today's Volume freeze-at-COT: once LH COT passes for a business date, the
    // computed volume is captured once and reused from then on for that date,
    // regardless of later LM Inventory uploads. Keyed per hub + business date so
    // it resets automatically the moment the business date changes.
    const FROZEN_TODAY_VOLUME_KEY = "nol3_frozen_today_volume_v2";
    const loadFrozenTodayVolumeStore = () => {
      try {
        const raw = JSON.parse(NOL3Storage.get(FROZEN_TODAY_VOLUME_KEY) || "{}");
        return raw && typeof raw === "object" ? raw : {};
      } catch (_) { return {}; }
    };
    const saveFrozenTodayVolumeStore = (store) => {
      try { NOL3Storage.set(FROZEN_TODAY_VOLUME_KEY, JSON.stringify(store || {})); } catch (_) {}
    };
    const getFrozenTodayVolume = (hub) => {
      const store = loadFrozenTodayVolumeStore();
      return store[String(hub || "__default__")] || null;
    };
    const setFrozenTodayVolume = (hub, businessDate, value) => {
      const store = loadFrozenTodayVolumeStore();
      store[String(hub || "__default__")] = { businessDate, value: Number(value) || 0, frozenAt: new Date().toISOString() };
      saveFrozenTodayVolumeStore(store);
    };

    // Migrate the old 00:00 / 12:00 defaults to the new 03:00 / 14:00 defaults.
    // Only values that exactly match the previous defaults are migrated.
    try {
      const stored = loadBusinessDaySettings();
      let changed = false;
      Object.keys(stored).forEach(key => {
        const value = stored[key];
        if (value && Number(value.businessDayStartHour) === 0 && Number(value.cotHour) === 12) {
          stored[key] = { businessDayStartHour: 3, cotHour: 15 };
          changed = true;
        }
      });
      if (changed) saveBusinessDaySettings(stored);
    } catch (_) {}

    const getHubBusinessDaySettings = (hub = getSelectedHub()) => {
      const all = loadBusinessDaySettings();
      const value = all[String(hub || "__default__")] || {};
      const start = Number.isFinite(Number(value.businessDayStartHour)) ? Number(value.businessDayStartHour) : BUSINESS_DAY_DEFAULT_START;
      const cot = Number.isFinite(Number(value.cotHour)) ? Number(value.cotHour) : BUSINESS_DAY_DEFAULT_COT;
      return {
        businessDayStartHour: Math.max(0, Math.min(23, Math.round(start))),
        cotHour: Math.max(0, Math.min(23, Math.round(cot)))
      };
    };

    const parseBusinessTimestamp = (value) => {
      if (value === null || value === undefined) return null;
      const raw = String(value).replace(/^\uFEFF/, "").trim();
      if (!raw) return null;
      const direct = new Date(raw);
      if (!Number.isNaN(direct.getTime())) return direct;
      const normalized = raw.replace(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})(?:\s+|T)(\d{1,2}:\d{2}(?::\d{2})?)/, "$3-$2-$1T$4");
      const fallback = new Date(normalized);
      return Number.isNaN(fallback.getTime()) ? null : fallback;
    };

    const findBusinessTimestampIndex = (headers, candidates) => {
      const exact = findIncomingHeaderIndex(headers, candidates);
      if (exact >= 0) return exact;

      // LM exports can use slightly different timestamp header names.
      // Fall back to a conservative semantic match so Business Date still works.
      const normalized = (Array.isArray(headers) ? headers : []).map(normalizeIncomingHeader);
      const wantsReceived = candidates === businessTimestampCandidates.received;
      const wantsPickedUp = candidates === businessTimestampCandidates.pickedUp;
      if (wantsReceived) {
        const i = normalized.findIndex(h => /\breceived?\b/.test(h) && /(date|time|at|timestamp|on)/.test(h));
        if (i >= 0) return i;
      }
      if (wantsPickedUp) {
        // Some LM exports use "Delivering Time" as the actual dispatch column.
        // Match it explicitly and first, with a negative check so it can never
        // accidentally match "Delivered Time" or "OnHold Time".
        const deliveringMatch = normalized.findIndex(h => /\bdelivering\b/.test(h) && !/\bdelivered\b/.test(h) && !/\bonhold\b/.test(h));
        if (deliveringMatch >= 0) return deliveringMatch;
        const i = normalized.findIndex(h => /(picked up|pickup|dispatched|dispatch)/.test(h) && /(date|time|at|timestamp|on)?/.test(h));
        if (i >= 0) return i;
      }
      return -1;
    };
    const businessTimestampCandidates = {
      received: ["Current Station Received Time","Current Station Received At","Current Station Received Timestamp","Received At","ReceivedAt","Received Timestamp","Received Time","Receive Time","Received Date","Received Date Time","Received On","Inbound Time","Inbound At","Received","Receive Date"],
      pickedUp: ["Delivering Time","pickedUpAt","Picked Up At","Picked Up Time","Picked Up Timestamp","Pickup Time","Pickup At","Dispatched At","Dispatch Time","Dispatch Timestamp","Picked Up Date Time","Picked Up","Pickup","Dispatched","Dispatch"]
    };

    const getBusinessWindow = (_now = new Date(), settings = getHubBusinessDaySettings()) => {
      const businessDate = getBusinessDateValue();
      const [year, month, day] = businessDate.split("-").map(Number);
      const start = new Date(year, month - 1, day, settings.businessDayStartHour, 0, 0, 0);
      const end = new Date(start);
      end.setDate(end.getDate() + 1);
      const cot = new Date(start);
      cot.setHours(settings.cotHour, 0, 0, 0);
      if (cot.getTime() < start.getTime()) cot.setDate(cot.getDate() + 1);
      return { start, end, cot, businessDate };
    };

    const getBusinessIdentityIndex = (headers) => findIncomingHeaderIndex(headers, [
      "Order ID","Order Id","OrderID","SPX TN","SPX Tracking Number","SLS TN","SLS Tracking Number","Tracking Number","Tracking No","Tracking ID"
    ]);

    const getBusinessDayMetrics = () => {
      const result = {
        todayVolume: 0,
        totalDispatched: 0,
        totalBacklogs: 0,
        dueIds: new Set(),
        dispatchedIds: new Set(),
        receivedIndex: -1,
        pickedUpIndex: -1,
        warning: ""
      };
      const lm = NOL3.lmInventory;
      if (!lm || !Array.isArray(lm.filteredRows) || !Array.isArray(lm.headers)) {
        result.warning = "Upload LM Inventory to calculate today's volume, dispatches, and backlogs.";
        return result;
      }

      const headers = lm.headers;
      const exceptionSet = getPlanningExceptionSet();
      result.receivedIndex = findBusinessTimestampIndex(headers, businessTimestampCandidates.received);
      result.pickedUpIndex = findBusinessTimestampIndex(headers, businessTimestampCandidates.pickedUp);
      const identityIndex = getBusinessIdentityIndex(headers);
      const rowIdentity = (row, index) => {
        const raw = identityIndex >= 0 ? row[identityIndex] : "";
        const normalized = normalizeIncomingKey(raw);
        return normalized || `__row_${index}`;
      };

      const settings = getHubBusinessDaySettings();
      const { start, end, cot, businessDate } = getBusinessWindow(new Date(), settings);

      // Planning Total Volume is the CURRENT on-floor snapshot for the selected
      // hub. It intentionally does not filter by Current Station Received Time,
      // CFR1, LH COT, carry-over, or planning exceptions. This matches the
      // operator workflow: upload the LM file, filter Current Station = selected
      // hub, and count the resulting orders.
      lm.filteredRows.forEach((row, index) => {
        if (rowMatchesPlanningException(row, headers, exceptionSet)) return;
        const id = rowIdentity(row, index);
        result.dueIds.add(id);

        const pickedAt = result.pickedUpIndex >= 0
          ? parseBusinessTimestamp(row[result.pickedUpIndex])
          : null;
        if (pickedAt && pickedAt.getTime() >= start.getTime() && pickedAt.getTime() < end.getTime()) {
          result.dispatchedIds.add(id);
        }
      });

      const liveTodayVolume = result.dueIds.size;
      result.todayVolume = liveTodayVolume;
      result.todayVolumeFrozen = false;
      result.liveTodayVolume = liveTodayVolume;
      result.totalDispatched = result.dispatchedIds.size;
      result.totalBacklogs = Math.max(0, result.todayVolume - result.totalDispatched);
      result.start = start;
      result.end = end;
      result.cot = cot;
      result.settings = settings;
      result.businessDate = businessDate;
      return result;
    };

    const renderBusinessDayMetrics = () => {
      const metrics = getBusinessDayMetrics();
      const todayEl = document.getElementById("todayVolumeValue");
      const dispatchedEl = document.getElementById("totalDispatchedValue");
      const backlogEl = document.getElementById("totalBacklogsValue");
      if (todayEl) todayEl.textContent = metrics.todayVolume.toLocaleString();
      if (dispatchedEl) dispatchedEl.textContent = metrics.totalDispatched.toLocaleString();
      if (backlogEl) backlogEl.textContent = metrics.totalBacklogs.toLocaleString();
      const note = document.getElementById("todayVolumeNote");
      const status = document.getElementById("businessDayStatus");
      if (metrics.warning) {
        if (note) note.textContent = metrics.warning;
        if (status) status.textContent = metrics.warning;
        return;
      }
      const f = value => value.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", hour12:false});
      const dateLabel = metrics.start.toLocaleDateString([], {year:"numeric", month:"2-digit", day:"2-digit"});
      if (note) note.textContent = metrics.todayVolumeFrozen
        ? `Frozen at COT for ${dateLabel} · current station = selected hub`
        : `Live volume for ${dateLabel} · current station = selected hub · freezes at COT (${f(metrics.cot)})`;
      if (status) status.textContent = `${getSelectedHub() || "Selected hub"}: ${dateLabel} · ${f(metrics.start)} business-day start · ${f(metrics.cot)} COT · window ends ${f(metrics.end)}`;
    };

    // Expose the renderer so the Dashboard and startup restore flow can
    // calculate the metrics without requiring the Planning page to be opened.
    NOL3.renderBusinessDayMetrics = renderBusinessDayMetrics;

    const renderBusinessDaySettings = () => {
      const dateInput = document.getElementById("businessDayDate");
      const startInput = document.getElementById("businessDayStartHour");
      const cotInput = document.getElementById("businessDayCotHour");
      const nowButton = document.getElementById("businessDayNow");
      if (!dateInput || !startInput || !cotInput) return;

      const settings = getHubBusinessDaySettings();
      dateInput.value = getBusinessDateValue();
      startInput.value = String(settings.businessDayStartHour);
      cotInput.value = String(settings.cotHour);

      const saveHours = () => {
        const hub = getSelectedHub() || "__default__";
        const all = loadBusinessDaySettings();
        const start = Math.max(0, Math.min(23, Math.round(Number(startInput.value) || 0)));
        const cot = Math.max(0, Math.min(23, Math.round(Number(cotInput.value) || 0)));
        startInput.value = String(start);
        cotInput.value = String(cot);
        all[hub] = { businessDayStartHour: start, cotHour: cot };
        saveBusinessDaySettings(all);
        renderBusinessDayMetrics();
      };

      const saveDate = () => {
        const value = String(dateInput.value || "").trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return;
        // Business Date is an explicit user selection. Never replace it with
        // today's date while the user is changing the picker.
        NOL3.currentBusinessDate = value;
        saveBusinessDateValue(value);
        dateInput.value = value;
        // Wait for the dated LM snapshot to load before rendering derived metrics.
        window.dispatchEvent(new CustomEvent("businessdatechange", { detail: { businessDate: value, source: "picker" } }));
      };

      startInput.onchange = saveHours;
      cotInput.onchange = saveHours;
      startInput.onblur = saveHours;
      cotInput.onblur = saveHours;
      dateInput.oninput = saveDate;
      dateInput.onchange = saveDate;
      dateInput.onblur = saveDate;
      // NOW is handled by the global capture listener below. Keeping one
      // handler prevents Android from executing two competing date updates.
      if (nowButton) nowButton.onclick = null;
      renderBusinessDayMetrics();
    };
    NOL3.renderBusinessDaySettings = renderBusinessDaySettings;

    // Global Business Date controls: the topbar is rebuilt whenever the user
    // changes menus, so the date controls must remain functional on every page.
    // Read the live date control before ANY menu navigation. On some mobile
    // browsers a date picker may delay the native `change` event until after
    // the navigation click. This prevents the topbar from being rebuilt with
    // the previous date.
    NOL3.syncBusinessDateFromDom = () => {
      const input = document.getElementById('businessDayDate');
      const value = input ? String(input.value || '').trim() : '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        NOL3.currentBusinessDate = value;
        try { NOL3Storage.set(BUSINESS_DAY_DATE_KEY, value); } catch (_) {}
        return value;
      }
      return NOL3.getBusinessDateValue();
    };

    NOL3.commitBusinessDate = (value) => {
      const normalized = String(value || '').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(normalized)) return;
      NOL3.currentBusinessDate = normalized;
      try { NOL3Storage.set(BUSINESS_DAY_DATE_KEY, normalized); } catch (_) {}
      const input = document.getElementById('businessDayDate');
      if (input) input.value = normalized;
      window.dispatchEvent(new CustomEvent('businessdatechange', { detail: { businessDate: normalized } }));
      // The async businessdatechange handler restores the dated snapshot and
      // rebuilds all derived views before the page is rendered.
      if (typeof NOL3.renderTopbar === 'function') NOL3.renderTopbar();
    };

    // Always derive TODAY at the moment NOW is pressed. Do not rely on the
    // page-load date or the value rendered into the topbar.
    NOL3.setBusinessDateNow = async () => {
      const today = getNOL3TodayDate();

      // NOW intentionally uses the same full application refresh as the
      // REFRESH button. This guarantees every Planning view is rebuilt from
      // the restored/current snapshot instead of trying to update stale DOM.
      NOL3.currentBusinessDate = today;
      const input = document.getElementById("businessDayDate");
      if (input) input.value = today;
      saveBusinessDateValue(today);

      try {
        if (typeof NOL3.loadLMHistoryForDate === "function") {
          await NOL3.loadLMHistoryForDate(today);
        }
      } catch (error) {
        console.warn("NOL3: Could not restore today's LM snapshot from NOW before refresh.", error);
      }

      // Give the local snapshot write/event loop a moment to settle, then use
      // the exact same reload path as the REFRESH button. Startup will restore
      // today's dated snapshot and rebuild the entire Planning DOM.
      setTimeout(() => {
        try { window.location.reload(); } catch (_) {}
      }, 0);
    };

    const INCOMING_ARRIVED_STORAGE_KEY = "nol3_incoming_arrived_tasks_v1";
    let pendingIncomingArrivedTask = null;

    const getArrivedIncomingTasks = () => {
      try {
        const raw = NOL3Storage.get(INCOMING_ARRIVED_STORAGE_KEY);
        const parsed = JSON.parse(raw || "[]");
        return new Set(Array.isArray(parsed) ? parsed.map(v => String(v || "").trim()).filter(Boolean) : []);
      } catch (_) { return new Set(); }
    };

    const saveArrivedIncomingTasks = (set) => {
      try { NOL3Storage.set(INCOMING_ARRIVED_STORAGE_KEY, JSON.stringify([...set])); } catch (_) {}
    };

    const getArrivedIncomingTownCounts = () => {
      const taskTownCounts = getIncomingLinehaulTownCounts();
      const arrived = getArrivedIncomingTasks();
      const result = new Map();
      arrived.forEach(task => {
        const counts = taskTownCounts.get(task);
        if (!counts) return;
        counts.forEach((count, town) => result.set(town, (result.get(town) || 0) + Number(count || 0)));
      });
      return result;
    };

    const openIncomingArrivedConfirm = (task, checked) => {
      const modal = document.getElementById("confirmIncomingArrivedModal");
      const text = document.getElementById("confirmIncomingArrivedText");
      if (!modal) return;
      pendingIncomingArrivedTask = { task: String(task || "").trim(), checked: !!checked };
      if (text) text.textContent = checked
        ? `Confirm that ${String(task || "this incoming linehaul")} has arrived?`
        : `Mark ${String(task || "this incoming linehaul")} as not arrived?`;
      modal.classList.add("open");
      modal.style.display = "flex";
    };

    const closeIncomingArrivedConfirm = () => {
      const modal = document.getElementById("confirmIncomingArrivedModal");
      pendingIncomingArrivedTask = null;
      if (modal) {
        modal.classList.remove("open");
        modal.style.display = "none";
      }
    };

    const applyIncomingArrivedState = (task, checked) => {
      const value = String(task || "").trim();
      if (!value) return;
      const arrived = getArrivedIncomingTasks();
      if (checked) arrived.add(value); else arrived.delete(value);
      saveArrivedIncomingTasks(arrived);
      window.dispatchEvent(new CustomEvent("planningchanged", {
        detail: { type: "incoming-arrived", source: "local" }
      }));
      renderIncomingOrders();
      renderIncomingLinehaulSelector();

      // Rebuild the Planning summary so Total Volume immediately includes
      // the newly confirmed/cleared linehaul.
      if (typeof renderDeliveryAreas === 'function') renderDeliveryAreas();
      renderOnFloorTowns();
      updateIncomingOrdersNotification();
    };

    const updateIncomingOrdersNotification = () => {
      const badge = document.getElementById("incomingOrdersNotif");
      if (!badge) return;
      let total = 0;
      try {
        if (typeof getIncomingLinehaulTownCounts === "function") {
          const taskTownCounts = getIncomingLinehaulTownCounts();
          const arrived = getArrivedIncomingTasks();
          total = [...taskTownCounts.entries()].reduce((sum, [task, counts]) => {
            if (arrived.has(task)) return sum;
            return sum + [...counts.values()].reduce((n, count) => n + Number(count || 0), 0);
          }, 0);
        }
      } catch (_) { total = 0; }
      badge.textContent = total.toLocaleString();
      badge.classList.toggle("show", total > 0);
    };

    const renderIncomingOrders = () => {
      const list = document.getElementById("incomingLinehaulList");
      updateIncomingOrdersNotification();
      if (!list) return;

      // Use the exact same calculation as the Incoming Linehaul dropdown.
      // This prevents the dropdown and Incoming Orders tab from using two
      // different matching/filtering paths.
      if (typeof getIncomingLinehaulTownCounts !== "function") {
        list.innerHTML = `<div class="incoming-empty">Incoming Orders is still loading. Please try again after the uploads finish.</div>`;
        return;
      }

      const taskTownCounts = getIncomingLinehaulTownCounts();
      const tasks = [...taskTownCounts.entries()].sort((a,b) => a[0].localeCompare(b[0]));

      if (!tasks.length) {
        const incoming = NOL3.incomingInventory;
        const linehaul = NOL3.lineHaulInventory;
        if (!incoming?.rows?.length || !linehaul?.rows?.length) {
          list.innerHTML = `<div class="incoming-empty">Upload Incoming Inventory and Incoming Inventory From-To List to see matched line haul tasks.</div>`;
        } else {
          list.innerHTML = `<div class="incoming-empty">No Incoming Orders matched the selected hub and From-To List.</div>`;
        }
        return;
      }

      list.innerHTML = tasks.map(([task, counts], index) => {
        const towns = [...counts.entries()].sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
        const total = towns.reduce((sum, [,count]) => sum + count, 0);
        const arrived = getArrivedIncomingTasks().has(String(task || "").trim());
        return `<div class="incoming-linehaul-card${arrived ? ' arrived' : ''}" data-linehaul-card="${index}">
          <button class="incoming-linehaul-header" type="button" aria-expanded="false">
            <span class="incoming-linehaul-title">${NOL3.escapeHTML(task)}</span>
            <span class="incoming-linehaul-meta"><span>${total.toLocaleString()} orders · ${towns.length.toLocaleString()} towns</span><span class="incoming-linehaul-chevron">›</span>
              <label class="incoming-arrived-wrap" title="Mark linehaul as arrived">
                <input class="incoming-arrived-checkbox" type="checkbox" data-incoming-arrived="${NOL3.escapeHTML(task)}" ${arrived ? 'checked' : ''} aria-label="Arrived">
                <span class="incoming-arrived-label">Arrived</span>
              </label>
            </span>
          </button>
          <div class="incoming-linehaul-body"><div class="incoming-town-counts">
            ${towns.map(([town,count]) => `<div class="incoming-town-count"><span class="incoming-town-count-name" title="${NOL3.escapeHTML(town)}">${NOL3.escapeHTML(town)}</span><span class="incoming-town-count-value">${count.toLocaleString()}</span></div>`).join("")}
          </div></div>
        </div>`;
      }).join("");

      list.querySelectorAll(".incoming-linehaul-header").forEach(button => button.addEventListener("click", (event) => {
        if (event.target.closest(".incoming-arrived-wrap")) return;
        const card = button.closest(".incoming-linehaul-card");
        const open = card.classList.toggle("open");
        button.setAttribute("aria-expanded", open ? "true" : "false");
      }));
      list.querySelectorAll(".incoming-arrived-checkbox").forEach(checkbox => checkbox.addEventListener("click", event => {
        event.stopPropagation();
      }));
      list.querySelectorAll(".incoming-arrived-checkbox").forEach(checkbox => checkbox.addEventListener("change", event => {
        event.stopPropagation();
        const task = checkbox.getAttribute("data-incoming-arrived") || "";
        const desired = checkbox.checked;
        checkbox.checked = !desired;
        openIncomingArrivedConfirm(task, desired);
      }));
    };

    document.getElementById("cancelIncomingArrived")?.addEventListener("click", closeIncomingArrivedConfirm);
    document.getElementById("confirmIncomingArrived")?.addEventListener("click", () => {
      const pending = pendingIncomingArrivedTask;
      closeIncomingArrivedConfirm();
      if (pending) applyIncomingArrivedState(pending.task, pending.checked);
    });
    document.getElementById("confirmIncomingArrivedModal")?.addEventListener("click", event => {
      if (event.target.id === "confirmIncomingArrivedModal") closeIncomingArrivedConfirm();
    });

    window.addEventListener("inventoryloaded", renderIncomingOrders);
    window.addEventListener("inventorycleared", renderIncomingOrders);

    const getSelectedHub = () =>
      (NOL3.getState && NOL3.getState().selectedHub) || "";

    const parseTownValue = (value) => {
      const text = String(value || "").trim();
      if (!text) return "Unknown";
      return text;
    };

    const updateTownToggleVisibility = (visible) => {
      const button = document.getElementById("townToggleBtn");
      const workspace = document.getElementById("onFloorWorkspace");
      if (button) button.style.display = "inline-flex";
      if (workspace) workspace.classList.toggle("no-towns", !visible);
    };

    const findTownColumn = (headers) => {
      const normalized = headers.map(h => String(h || "").trim().toLowerCase());

      const candidates = [
        "town name",
        "town",
        "municipality",
        "destination town",
        "destination municipality",
        "destination city",
        "destination",
        "receiver town"
      ];

      for (const candidate of candidates) {
        const index = normalized.indexOf(candidate);
        if (index >= 0) return index;
      }

      return -1;
    };

    let showIncomingOrdersOnFloor = false;
    let selectedIncomingLinehauls = [];
    // Backward-compatible single-value alias used only by older state paths.
    let selectedIncomingLinehaul = "";

    const getIncomingLinehaulTownCounts = () => {
      const incoming = NOL3.incomingInventory;
      const linehaul = NOL3.lineHaulInventory;
      const taskTownCounts = new Map();
      if (!incoming?.rows?.length || !linehaul?.rows?.length) return taskTownCounts;

      const norm = value => normalizeIncomingKey(value);
      const ih = Array.isArray(incoming.headers) ? incoming.headers : [];
      const lh = Array.isArray(linehaul.headers) ? linehaul.headers : [];
      const orderIndex = findIncomingHeaderIndex(ih, ["Order ID", "Order Id", "OrderID", "SPX TN", "SPX Tracking Number", "SLS TN", "SLS Tracking Number", "Tracking Number"]);
      const townIndex = findIncomingHeaderIndex(ih, ["Town Name", "Town", "Municipality", "Destination Town", "Destination Municipality", "Destination City", "Receiver Town"]);
      const destinationIndex = findIncomingHeaderIndex(ih, ["Destination Station", "Destination Station Name", "Destination Hub", "To Station", "To Hub", "Destination Station Code"]);
      const taskIndex = findIncomingHeaderIndex(lh, ["Line Haul Task ID", "Linehaul Task ID", "Line Haul Task", "Linehaul Task", "Task ID", "Task", "Linehaul"]);
      const spxIndex = findIncomingHeaderIndex(lh, ["SPX TN", "SPX Tracking Number", "SLS TN", "SLS Tracking Number", "Tracking Number", "Tracking No", "Tracking ID"]);
      if (orderIndex < 0 || townIndex < 0 || taskIndex < 0 || spxIndex < 0) return taskTownCounts;

      const exceptionSet = getPlanningExceptionSet();
      const selectedHub = norm(getSelectedHub());
      if (selectedHub && destinationIndex < 0) return taskTownCounts;

      const spxToTasks = new Map();
      linehaul.rows.forEach(row => {
        // The exception may exist only in the From-To/Linehaul export.
        // Exclude it here before creating the SPX -> task relationship.
        if (rowMatchesPlanningException(row, lh, exceptionSet)) return;

        const spx = norm(row[spxIndex]);
        const task = String(row[taskIndex] ?? "").trim();
        if (!spx || !task) return;
        if (!spxToTasks.has(spx)) spxToTasks.set(spx, new Set());
        spxToTasks.get(spx).add(task);
      });

      incoming.rows.forEach(row => {
        // Also exclude it if the exception appears in the Incoming Inventory
        // export. Both datasets therefore participate in the same exclusion.
        if (rowMatchesPlanningException(row, ih, exceptionSet)) return;

        const orderId = norm(row[orderIndex]);
        if (!orderId) return;
        if (selectedHub && norm(row[destinationIndex]) !== selectedHub) return;
        const tasks = spxToTasks.get(orderId);
        if (!tasks) return;
        const town = parseTownValue(row[townIndex]);
        tasks.forEach(task => {
          if (!taskTownCounts.has(task)) taskTownCounts.set(task, new Map());
          const counts = taskTownCounts.get(task);
          counts.set(town, (counts.get(town) || 0) + 1);
        });
      });

      return taskTownCounts;
    };

    const renderIncomingLinehaulSelector = () => {
      const select = document.getElementById("incomingLinehaulSelect");
      const menu = document.getElementById("incomingLinehaulMenu");
      const triggerText = document.getElementById("incomingLinehaulTriggerText");
      if (!select || !menu || !triggerText) return;
      const taskTownCounts = getIncomingLinehaulTownCounts();
      const arrivedTasks = getArrivedIncomingTasks();
      // Arrived linehauls are already on-floor, so they must no longer appear
      // as selectable Incoming Linehaul options.
      const tasks = [...taskTownCounts.keys()]
        .filter(task => !arrivedTasks.has(String(task || "").trim()))
        .sort((a,b) => a.localeCompare(b));

      // Keep only linehauls that still exist and are not already arrived.
      selectedIncomingLinehauls = Array.isArray(selectedIncomingLinehauls)
        ? selectedIncomingLinehauls.filter(v => taskTownCounts.has(v) && !arrivedTasks.has(String(v || "").trim()))
        : [];
      selectedIncomingLinehaul = selectedIncomingLinehauls.length === 1 ? selectedIncomingLinehauls[0] : "";

      select.innerHTML = `<option value="">Select Incoming Linehaul</option>` +
        tasks.map(task => `<option value="${NOL3.escapeHTML(task)}">${NOL3.escapeHTML(task)}</option>`).join("");
      select.value = selectedIncomingLinehauls.length === 1 ? selectedIncomingLinehauls[0] : "";

      const selectedCounts = getIncomingTownCounts();
      const selectedTotal = [...selectedCounts.values()].reduce((sum, n) => sum + Number(n || 0), 0);
      if (selectedIncomingLinehauls.length === 1) {
        triggerText.textContent = `${selectedIncomingLinehauls[0]} · ${selectedTotal.toLocaleString()} orders · ${selectedCounts.size.toLocaleString()} towns`;
      } else if (selectedIncomingLinehauls.length > 1) {
        triggerText.textContent = `${selectedIncomingLinehauls.length} linehauls selected · ${selectedTotal.toLocaleString()} orders · ${selectedCounts.size.toLocaleString()} towns`;
      } else {
        triggerText.textContent = tasks.length ? "Select Incoming Linehaul" : "No Incoming Linehaul Available";
      }

      const optionRows = tasks.map(task => {
        const counts = taskTownCounts.get(task) || new Map();
        const total = [...counts.values()].reduce((sum, n) => sum + Number(n || 0), 0);
        const isSelected = selectedIncomingLinehauls.includes(task);
        return `<button class="incoming-linehaul-option${isSelected ? ' selected' : ''}" type="button" data-incoming-linehaul="${NOL3.escapeHTML(task)}" role="option" aria-selected="${isSelected}">
          <div class="incoming-linehaul-option-main">
            <span class="incoming-linehaul-option-title">${NOL3.escapeHTML(task)}</span>
            ${isSelected ? '<span class="incoming-linehaul-option-check">✓</span>' : ''}
          </div>
          <div class="incoming-linehaul-option-meta">${total.toLocaleString()} orders · ${counts.size.toLocaleString()} towns</div>
        </button>`;
      }).join("");

      menu.innerHTML = `<input class="incoming-linehaul-search" id="incomingLinehaulSearch" type="search" placeholder="Search linehaul..." autocomplete="off" aria-label="Search incoming linehaul">
        <div class="incoming-linehaul-selection-hint">Select one or more linehauls. Click again to unselect.</div>
        <div class="incoming-linehaul-options">
          <button class="incoming-linehaul-option${!selectedIncomingLinehauls.length ? ' selected' : ''}" type="button" data-incoming-linehaul="" role="option" aria-selected="${!selectedIncomingLinehauls.length}">
            <div class="incoming-linehaul-option-main"><span class="incoming-linehaul-option-title">No incoming linehaul</span>${!selectedIncomingLinehauls.length ? '<span class="incoming-linehaul-option-check">✓</span>' : ''}</div>
            <div class="incoming-linehaul-option-meta">Show On-Floor counts only</div>
          </button>
          ${optionRows || '<div class="incoming-linehaul-empty">No incoming linehaul available.</div>'}
        </div>`;
      updateIncomingOrdersButton();
      updateIncomingOrdersNotification();
    };

    const getIncomingTownCounts = () => {
      const taskTownCounts = getIncomingLinehaulTownCounts();
      const result = new Map();
      const arrived = getArrivedIncomingTasks();
      (selectedIncomingLinehauls || []).forEach(task => {
        if (arrived.has(String(task || "").trim())) return;
        const counts = taskTownCounts.get(task);
        if (!counts) return;
        counts.forEach((count, town) => result.set(town, (result.get(town) || 0) + Number(count || 0)));
      });
      return result;
    };

    const updateIncomingOrdersButton = () => {
      // Incoming orders are now controlled directly by the linehaul dropdown.
      showIncomingOrdersOnFloor = Array.isArray(selectedIncomingLinehauls) && selectedIncomingLinehauls.length > 0;
    };

    const getLMStatusMetrics = () => {
      const result = new Map();
      const lm = NOL3.lmInventory;
      if (!lm || !Array.isArray(lm.filteredRows) || !Array.isArray(lm.headers)) return result;
      const normalizeHeader = value => String(value ?? '').replace(/^\uFEFF/, '').trim().toLowerCase();
      const normalizeStatus = value => String(value ?? '').replace(/^\uFEFF/, '').trim().toUpperCase().replace(/[\s_-]+/g, ' ');
      const headers = lm.headers.map(normalizeHeader);
      const exceptionSet = getPlanningExceptionSet();
      const townIndex = headers.indexOf('town name');
      const statusCandidates = ['spx status','status','parcel status','order status'];
      const statusIndex = statusCandidates.map(name => headers.indexOf(name)).find(index => index >= 0) ?? -1;
      if (townIndex < 0 || statusIndex < 0) return result;
      lm.filteredRows.forEach(row => {
        if (rowMatchesPlanningException(row, lm.headers, exceptionSet)) return;
        const town = parseTownValue(row[townIndex]);
        if (!town) return;
        if (!result.has(town)) result.set(town, {received:0, delivering:0, delivered:0, hold:0});
        const metrics = result.get(town);
        const status = normalizeStatus(row[statusIndex]);
        if (status === 'DELIVERED') metrics.delivered += 1;
        else if (status === 'DELIVERING') metrics.delivering += 1;
        else if (status === 'RECEIVED' || status === 'LMHUB RECEIVED') metrics.received += 1;
        else if (status === 'ONHOLD' || status === 'ON HOLD' || status === 'LMHUB ONHOLD' || status === 'LMHUB ON HOLD') metrics.hold += 1;
      });
      return result;
    };

    const formatSuccessRate = metrics => {
      const total = Number(metrics?.received || 0) + Number(metrics?.delivering || 0) + Number(metrics?.delivered || 0) + Number(metrics?.hold || 0);
      const rate = total ? (Number(metrics?.delivered || 0) / total) * 100 : 0;
      return rate % 1 === 0 ? rate.toFixed(0) : rate.toFixed(1);
    };

    const getTownZoneBreakdown = (town) => {
      const result = new Map();
      const lm = NOL3.lmInventory;
      if (!lm || !Array.isArray(lm.filteredRows) || !Array.isArray(lm.headers)) return result;
      const townIndex = findTownColumn(lm.headers);
      const zoneIndex = findZoneIdColumn(lm.headers);
      if (townIndex < 0 || zoneIndex < 0) return result;
      const exceptionSet = getPlanningExceptionSet();
      lm.filteredRows.forEach(row => {
        if (rowMatchesPlanningException(row, lm.headers, exceptionSet)) return;
        if (parseTownValue(row[townIndex]) !== town) return;
        const zone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim() || 'No Zone ID';
        result.set(zone, (result.get(zone) || 0) + 1);
      });
      return result;
    };

    const renderTownZoneBreakdown = (town) => {
      const zones = [...getTownZoneBreakdown(town).entries()].sort((a,b) => a[0].localeCompare(b[0], undefined, {numeric:true}));
      if (!zones.length) return '<div class=\"town-zone-breakdown\"><div class=\"town-zone-row\"><span>No Zone ID data</span><strong>0</strong></div></div>';
      return `<div class=\"town-zone-breakdown\">${zones.map(([zone,count]) => `<div class=\"town-zone-row\"><span>${NOL3.escapeHTML(zone)}</span><strong>${count.toLocaleString()}</strong></div>`).join('')}</div>`;
    };

    // Zone Settings operational towns: each configured Zone-ID area becomes
    // its own draggable "town" in the On-Floor Towns panel. The source CSV
    // town remains unchanged; only the operational display/assignment key is new.
    const makeOperationalTownKey = (town, area) => `__NOL3_ZONE_TOWN__${encodeURIComponent(String(town || ''))}::${encodeURIComponent(String(area || ''))}`;
    const parseOperationalTownKey = (key) => {
      const value = String(key || '');
      const prefix = '__NOL3_ZONE_TOWN__';
      if (!value.startsWith(prefix)) return null;
      const body = value.slice(prefix.length);
      const split = body.split('::');
      if (split.length < 2) return null;
      try {
        return { town: decodeURIComponent(split[0]), area: decodeURIComponent(split.slice(1).join('::')) };
      } catch (_) { return null; }
    };
    const getOperationalTownDefinitions = (town) => {
      const data = getZoneSettingsTownData(town);
      const areas = Array.isArray(data?.areas) ? data.areas : [];
      const assignments = data?.assignments && typeof data.assignments === 'object' ? data.assignments : {};
      const assignedAreas = new Set(Object.values(assignments).map(v => String(v || '')).filter(Boolean));
      return areas.filter(area => assignedAreas.has(String(area))).map(area => ({
        key: makeOperationalTownKey(town, area), town, area: String(area)
      }));
    };
    const getOperationalTownStats = (town, area) => {
      const result = { count: 0, incomingCount: 0, received: 0, delivering: 0, delivered: 0, hold: 0 };
      const lm = NOL3.lmInventory;
      if (!lm?.filteredRows?.length || !Array.isArray(lm.headers)) return result;
      const townIndex = findTownColumn(lm.headers);
      const zoneIndex = findZoneIdColumn(lm.headers);
      if (townIndex < 0 || zoneIndex < 0) return result;
      const statusCandidates = ['spx status','status','parcel status','order status'];
      const normalizedHeaders = lm.headers.map(h => String(h ?? '').replace(/^\uFEFF/, '').trim().toLowerCase());
      const statusIndex = statusCandidates.map(name => normalizedHeaders.indexOf(name)).find(i => i >= 0) ?? -1;
      const businessMetrics = typeof getBusinessDayMetrics === 'function' ? getBusinessDayMetrics() : null;
      const identityIndex = typeof getBusinessIdentityIndex === 'function' ? getBusinessIdentityIndex(lm.headers) : -1;
      const dueIds = businessMetrics?.dueIds instanceof Set ? businessMetrics.dueIds : null;
      const receivedIndex = businessMetrics?.receivedIndex ?? -1;
      const hasBusinessWindow = dueIds && receivedIndex >= 0;
      const exceptionSet = getPlanningExceptionSet();
      const assignedZones = new Set();
      const zoneData = getZoneSettingsTownData(town);
      const assignments = zoneData?.assignments && typeof zoneData.assignments === 'object' ? zoneData.assignments : {};
      Object.keys(assignments).forEach(zone => { if (String(assignments[zone]) === String(area)) assignedZones.add(String(zone).trim()); });
      lm.filteredRows.forEach((row, index) => {
        if (parseTownValue(row[townIndex]) !== town) return;
        if (rowMatchesPlanningException(row, lm.headers, exceptionSet)) return;
        if (hasBusinessWindow) {
          const rawId = identityIndex >= 0 ? row[identityIndex] : '';
          const id = normalizeIncomingKey(rawId) || `__row_${index}`;
          if (!dueIds.has(id)) return;
        }
        const zone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim();
        if (!assignedZones.has(zone)) return;
        result.count += 1;
        const status = statusIndex >= 0 ? String(row[statusIndex] || '').replace(/^\uFEFF/, '').trim().toUpperCase().replace(/[\s_-]+/g, ' ') : '';
        if (status === 'DELIVERED') result.delivered += 1;
        else if (status === 'DELIVERING') result.delivering += 1;
        else if (status === 'RECEIVED' || status === 'LMHUB RECEIVED') result.received += 1;
        else if (status === 'ONHOLD' || status === 'ON HOLD' || status === 'LMHUB ONHOLD' || status === 'LMHUB ON HOLD') result.hold += 1;
      });
      return result;
    };

    const migrateZoneSplitAssignments = () => {
      let changed = false;
      NOL3.deliveryAreas.forEach(area => {
        const groups = ensureAreaGroups(area);
        groups.forEach(group => {
          const next = [];
          group.towns.forEach(townKey => {
            const splitDefs = getOperationalTownDefinitions(townKey);
            if (splitDefs.length) {
              splitDefs.forEach(def => { if (!next.includes(def.key)) next.push(def.key); });
              changed = true;
            } else if (!next.includes(townKey)) next.push(townKey);
          });
          group.towns = next;
        });
        area.towns = groups.flatMap(group => group.towns);
      });
      if (changed) savePlanningLayout();
    };

    const renderOnFloorTowns = () => {
      const summary = document.getElementById("onFloorTownSummary");
      if (!summary) return;

      const lm = NOL3.lmInventory;
      const hub = getSelectedHub();
      const townToggleBadge = document.getElementById("townToggleBadge");
      const setUnassignedCount = (count) => {
        const value = Number(count || 0);
        if (townToggleBadge) {
          townToggleBadge.textContent = value.toLocaleString();
          townToggleBadge.setAttribute("aria-label", `${value.toLocaleString()} unassigned town${value === 1 ? "" : "s"}`);
        }
      };

      if (!lm || !lm.rows || !lm.rows.length) {
        summary.innerHTML = `<div class="town-empty">Upload LM Inventory to see towns.</div>`;
        updateTownToggleVisibility(false);
        const badge = document.getElementById("townTotalBadge");
        if (badge) badge.textContent = "0 towns · 0 orders";
        setUnassignedCount(0);
        return;
      }
      if (!hub) {
        summary.innerHTML = `<div class="town-empty">Select a hub to view filtered towns.</div>`;
        updateTownToggleVisibility(false);
        const badge = document.getElementById("townTotalBadge");
        if (badge) badge.textContent = "0 towns · 0 orders";
        setUnassignedCount(0);
        return;
      }

      const filteredRows = lm.filteredRows || [];
      const headers = lm.headers || [];
      const townIndex = findTownColumn(headers);
      const assignedTowns = getAssignedTownSet();
      if (townIndex < 0) {
        summary.innerHTML = `<div class="town-empty">No town/municipality column was found in the LM Inventory file.</div>`;
        updateTownToggleVisibility(false);
        const badge = document.getElementById("townTotalBadge");
        if (badge) badge.textContent = "0 towns · 0 orders";
        setUnassignedCount(0);
        return;
      }

      const grouped = new Map();
      const rawTownCounts = new Map();
      const exceptionSet = getPlanningExceptionSet();

      // On-Floor Towns and Total Volume use the same current LM snapshot,
      // but every row matching an Exception must be removed first.
      // No CFR1/LH COT/date filtering is introduced here.
      filteredRows.forEach(row => {
        if (rowMatchesPlanningException(row, headers, exceptionSet)) return;
        const town = parseTownValue(row[townIndex]);
        if (!town) return;
        rawTownCounts.set(town, (rawTownCounts.get(town) || 0) + 1);
      });

      rawTownCounts.forEach((rawCount, town) => {
        const splitDefs = getOperationalTownDefinitions(town);
        if (splitDefs.length) {
          splitDefs.forEach(def => {
            if (assignedTowns.has(def.key)) return;
            const stats = getOperationalTownStats(town, def.area);
            if (stats.count > 0) grouped.set(def.key, { town: def.key, displayTown: def.area, baseTown: town, splitArea: def.area, count: stats.count, incomingCount: 0 });
          });
        } else if (!assignedTowns.has(town)) {
          grouped.set(town, { town, displayTown: town, baseTown: town, splitArea: '', count: rawCount, incomingCount: 0 });
        }
      });

      if (showIncomingOrdersOnFloor) {
        const incomingCounts = getIncomingTownCounts();
        incomingCounts.forEach((count, town) => {
          if (getOperationalTownDefinitions(town).length) return;
          if (assignedTowns.has(town)) return;
          const existing = grouped.get(town) || { town, displayTown: town, baseTown: town, splitArea: '', count: 0, incomingCount: 0 };
          existing.incomingCount += count;
          grouped.set(town, existing);
        });
      }

      // Arrived linehauls add their towns to the On-Floor Towns view only.
      // They do NOT change Total Volume; the LM snapshot remains the source
      // of Total Volume. Arrived orders also stop contributing to the Incoming
      // Orders notification above.
      const arrivedCounts = getArrivedIncomingTownCounts();
      arrivedCounts.forEach((count, town) => {
        if (getOperationalTownDefinitions(town).length) return;
        if (assignedTowns.has(town)) return;
        const existing = grouped.get(town) || { town, displayTown: town, baseTown: town, splitArea: '', count: 0, incomingCount: 0 };
        existing.incomingCount += count;
        grouped.set(town, existing);
      });

      if (!grouped.size) {
        summary.innerHTML = `<div class="town-empty">No unassigned towns are available for ${NOL3.escapeHTML(hub)}.</div>`;
        updateTownToggleVisibility(false);
        const badge = document.getElementById("townTotalBadge");
        if (badge) badge.textContent = "0 towns · 0 orders";
        setUnassignedCount(0);
        return;
      }

      const sorted = [...grouped.values()].sort((a, b) => a.displayTown.localeCompare(b.displayTown) || b.count - a.count);
      updateTownToggleVisibility(true);
      const townTotalBadge = document.getElementById("townTotalBadge");
      if (townTotalBadge) {
        const uniqueTownCount = sorted.length;
        const orderTotal = sorted.reduce((total, item) => total + item.count + (item.incomingCount || 0), 0);
        townTotalBadge.textContent = `${uniqueTownCount.toLocaleString()} town${uniqueTownCount === 1 ? "" : "s"} · ${orderTotal.toLocaleString()} orders`;
        setUnassignedCount(uniqueTownCount);
      }

      summary.innerHTML = `
        <div class="town-list-header"><div>Town</div><div style="text-align:right">Orders</div></div>
        ${sorted.map(item => `
          <div class="town-card" draggable="true" data-town="${NOL3.escapeHTML(item.town)}" title="${NOL3.escapeHTML(item.displayTown)}">
            <div class="town-name-wrap">
              <button class="town-zone-toggle" type="button" aria-expanded="false" aria-label="Show Zone IDs for ${NOL3.escapeHTML(item.displayTown)}">▸</button>
              <div class="town-name">${NOL3.escapeHTML(item.displayTown)}</div>
            </div>
            <div class="town-count-stack"><div class="town-count">${(item.count + (item.incomingCount || 0)).toLocaleString()}</div></div>
          </div>`).join("")}
      `;

      summary.querySelectorAll('.town-zone-toggle').forEach(button => {
        button.addEventListener('click', event => {
          event.preventDefault(); event.stopPropagation();
          const card = button.closest('.town-card');
          const wasOpen = card?.classList.contains('zone-open');
          summary.querySelectorAll('.town-card.zone-open').forEach(other => {
            other.classList.remove('zone-open');
            other.querySelector('.town-zone-breakdown')?.remove();
            other.querySelector('.town-zone-toggle')?.setAttribute('aria-expanded','false');
            if (other.querySelector('.town-zone-toggle')) other.querySelector('.town-zone-toggle').textContent = '▸';
          });
          if (!wasOpen && card) {
            card.classList.add('zone-open');
            const parsed = parseOperationalTownKey(card.dataset.town || '');
            card.insertAdjacentHTML('beforeend', parsed ? renderTownZoneBreakdown(parsed.town) : renderTownZoneBreakdown(card.dataset.town || ''));
            button.setAttribute('aria-expanded','true'); button.textContent = '▾';
          }
        });
      });
      if (typeof bindTownDragging === "function") bindTownDragging();
    };

    NOL3.deliveryAreas = Array.isArray(NOL3.deliveryAreas) ? NOL3.deliveryAreas : [];
    NOL3.pendingTownGroupAreaId = null;
    NOL3.pendingTownGroupTown = null;

    const PLANNING_LAYOUT_KEY = 'nol3_planning_layout_v1';

    const getPlanningHubKey = () => {
      const hub = (NOL3.getState && NOL3.getState().selectedHub) || '';
      return String(hub).trim() || '__NO_HUB__';
    };

    const getPlanningSnapshot = () => NOL3.deliveryAreas.map(area => ({
      id: area.id,
      title: area.title,
      collapsed: !!area.collapsed,
      groups: ensureAreaGroups(area).map(group => ({
        id: group.id,
        title: group.title,
        towns: [...group.towns],
        assignedRiders: Array.isArray(group.assignedRiders) ? [...group.assignedRiders] : []
      }))
    }));

    const savePlanningLayout = () => {
      try {
        const raw = NOL3Storage.get(PLANNING_LAYOUT_KEY);
        let store = raw ? JSON.parse(raw) : {};
        if (Array.isArray(store)) {
          // Migrate the older single-layout format to the hub-aware format.
          store = { version: 2, byHub: { __NO_HUB__: store } };
        }
        if (!store || typeof store !== 'object') store = {};
        store.version = 2;
        store.byHub = store.byHub && typeof store.byHub === 'object' ? store.byHub : {};
        store.byHub[getPlanningHubKey()] = getPlanningSnapshot();
        NOL3Storage.set(PLANNING_LAYOUT_KEY, JSON.stringify(store));
        // Town groups / delivery-area arrangements are part of the synced
        // hub settings channel.
        window.dispatchEvent(new CustomEvent("planningchanged", {
          detail: { type: "town-arrangement", source: "local" }
        }));
      } catch (error) {
        console.warn('NOL3: Could not save planning layout.', error);
      }
    };

    const loadPlanningLayout = () => {
      try {
        const raw = NOL3Storage.get(PLANNING_LAYOUT_KEY);
        if (!raw) return false;
        let store = JSON.parse(raw);
        let saved;
        if (Array.isArray(store)) {
          saved = store;
        } else {
          saved = store?.byHub?.[getPlanningHubKey()];
        }
        if (!Array.isArray(saved)) return false;

        const restored = saved.map(savedArea => ({
          id: String(savedArea.id || `area-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`),
          title: String(savedArea.title || 'Delivery Area'),
          collapsed: !!savedArea.collapsed,
          towns: [],
          groups: Array.isArray(savedArea.groups) && savedArea.groups.length
            ? savedArea.groups.map(group => ({
                id: String(group.id || `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`),
                title: String(group.title || 'Town Group'),
                towns: Array.isArray(group.towns) ? [...group.towns] : [],
                assignedRiders: Array.isArray(group.assignedRiders) ? [...group.assignedRiders].map(String) : []
              }))
            : [{
                id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                title: 'Town Group',
                towns: [],
                assignedRiders: []
              }]
        }));

        NOL3.deliveryAreas = restored;
        NOL3.deliveryAreas.forEach(ensureAreaGroups);
        return true;
      } catch (error) {
        console.warn('NOL3: Could not load saved planning layout.', error);
        return false;
      }
    };

    const ensureAreaGroups = (area) => {
      if (!area || typeof area !== 'object') return [];
      if (!Array.isArray(area.groups)) {
        const legacyTowns = Array.isArray(area.towns) ? area.towns : [];
        area.groups = [{
          id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          title: 'Town Group',
          towns: [...legacyTowns],
          assignedRiders: []
        }];
      }

      // Normalize groups in place. Do not replace the group objects on every
      // call: rider-picker event handlers keep a reference to their group,
      // and replacing the objects can make a rider removal write to a stale
      // object. That stale state can then make another group appear to regain
      // the last rider.
      area.groups.forEach(group => {
        if (!group || typeof group !== 'object') return;
        group.id = group.id || `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        group.title = String(group.title || 'Town Group');
        group.towns = Array.isArray(group.towns) ? group.towns : [];
        group.assignedRiders = Array.isArray(group.assignedRiders)
          ? group.assignedRiders.map(String)
          : [];
      });
      area.groups = area.groups.filter(group => group && typeof group === 'object');
      area.towns = area.groups.flatMap(group => group.towns);
      return area.groups;
    };

    NOL3.deliveryAreas.forEach(ensureAreaGroups);

    const getAssignedTownSet = () => {
      const set = new Set();
      NOL3.deliveryAreas.forEach(area => {
        ensureAreaGroups(area).forEach(group => group.towns.forEach(town => set.add(town)));
      });
      return set;
    };

    const getAvailableTowns = () => {
      const lm = NOL3.lmInventory;
      if (!lm || !lm.filteredRows || !lm.headers) return [];
      const headers = lm.headers.map(h => String(h || '').trim().toLowerCase());
      const townIndex = headers.indexOf('town name');
      if (townIndex < 0) return [];
      const set = new Set();
      lm.filteredRows.forEach(row => {
        const town = String(row[townIndex] || '').trim();
        if (town) set.add(town);
      });
      return [...set].sort((a,b)=>a.localeCompare(b));
    };

    const openDeliveryAreaModal = () => {
      const modal = document.getElementById('deliveryAreaModal');
      const input = document.getElementById('deliveryAreaName');
      if (!modal || !input) return;
      input.value = '';
      input.placeholder = 'e.g. North Area';
      modal.classList.add('show');
      setTimeout(() => input.focus(), 30);
    };

    const closeDeliveryAreaModal = () => {
      const modal = document.getElementById('deliveryAreaModal');
      if (modal) modal.classList.remove('show');
    };

    const openTownGroupModal = (areaId, town = null) => {
      const area = NOL3.deliveryAreas.find(item => item.id === areaId);
      if (!area) return;
      NOL3.pendingTownGroupAreaId = areaId;
      NOL3.pendingTownGroupTown = town || null;
      const modal = document.getElementById('townGroupModal');
      const input = document.getElementById('townGroupName');
      if (!modal || !input) return;
      input.value = '';
      input.placeholder = 'e.g. North Towns';
      modal.classList.add('show');
      setTimeout(() => input.focus(), 30);
    };

    const closeTownGroupModal = () => {
      const modal = document.getElementById('townGroupModal');
      if (modal) modal.classList.remove('show');
      NOL3.pendingTownGroupAreaId = null;
      NOL3.pendingTownGroupTown = null;
    };

    const saveDeliveryAreaFromModal = () => {
      const input = document.getElementById('deliveryAreaName');
      if (!input) return;
      const title = input.value.trim();
      if (!title) { input.focus(); return; }
      NOL3.deliveryAreas.push({
        id: `area-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        title,
        towns: [],
        groups: [{
          id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          title: 'Town Group',
          towns: [],
          assignedRiders: []
        }]
      });
      savePlanningLayout();
      renderDeliveryAreas();
      closeDeliveryAreaModal();
    };

    const saveTownGroupFromModal = () => {
      const input = document.getElementById('townGroupName');
      const areaId = NOL3.pendingTownGroupAreaId;
      if (!input || areaId === null || areaId === undefined) return;
      const title = input.value.trim();
      if (!title) { input.focus(); return; }
      const area = NOL3.deliveryAreas.find(item => item.id === areaId);
      if (!area) { closeTownGroupModal(); return; }

      const groups = ensureAreaGroups(area);
      const droppedTown = NOL3.pendingTownGroupTown;
      const newGroup = {
        id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        title,
        towns: droppedTown ? [droppedTown] : []
      };

      if (droppedTown) {
        NOL3.deliveryAreas.forEach(otherArea => {
          ensureAreaGroups(otherArea).forEach(group => {
            group.towns = group.towns.filter(existing => existing !== droppedTown);
          });
          otherArea.towns = ensureAreaGroups(otherArea).flatMap(group => group.towns);
        });
      }

      groups.push(newGroup);
      area.towns = groups.flatMap(group => group.towns);
      savePlanningLayout();
      renderDeliveryAreas();
      renderOnFloorTowns();
      closeTownGroupModal();
    };

    const openRemoveDeliveryAreaModal = (id, title) => {
      NOL3.pendingRemoveDeliveryAreaId = id;
      const modal = document.getElementById('removeDeliveryAreaModal');
      const text = document.getElementById('removeDeliveryAreaText');
      if (text) text.textContent = `This will remove the delivery area header "${title}" and its assigned towns.`;
      if (modal) modal.classList.add('show');
    };

    const closeRemoveDeliveryAreaModal = () => {
      const modal = document.getElementById('removeDeliveryAreaModal');
      if (modal) modal.classList.remove('show');
      NOL3.pendingRemoveDeliveryAreaId = null;
    };

    const confirmRemoveDeliveryArea = () => {
      const id = NOL3.pendingRemoveDeliveryAreaId;
      if (!id) return;
      NOL3.deliveryAreas = NOL3.deliveryAreas.filter(area => area.id !== id);
      savePlanningLayout();
      closeRemoveDeliveryAreaModal();
      renderDeliveryAreas();
      renderOnFloorTowns();
    };

    const createTownGroupFromDrop = (areaId, town) => {
      if (!areaId || !town) return;
      const area = NOL3.deliveryAreas.find(item => item.id === areaId);
      if (!area) return;

      // Remove the town from every existing group first so it can only belong once.
      NOL3.deliveryAreas.forEach(otherArea => {
        ensureAreaGroups(otherArea).forEach(group => {
          group.towns = group.towns.filter(existing => existing !== town);
        });
        otherArea.towns = ensureAreaGroups(otherArea).flatMap(group => group.towns);
      });

      // Fetch the groups array AFTER the removal loop above, since ensureAreaGroups()
      // rebuilds a fresh array/object identity on every call (including the call made
      // on this same area inside the loop). Grabbing it beforehand left us pushing
      // onto a stale, orphaned array that never made it back onto area.groups.
      const groups = ensureAreaGroups(area);

      const newGroup = {
        id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        title: `Town Group ${groups.length + 1}`,
        towns: [town]
      };
      groups.push(newGroup);
      area.towns = groups.flatMap(group => group.towns);
      savePlanningLayout();
      renderDeliveryAreas();
      renderOnFloorTowns();
    };

    const refreshDeliveryAreaAfterTownMove = (town, targetAreaId = null, targetGroupId = null) => {
      // Update only the affected town chips/counts instead of rebuilding every Delivery Area.
      document.querySelectorAll('.town-chip').forEach(chip => {
        if (chip.dataset.town === town) chip.remove();
      });

      document.querySelectorAll('.town-group-dropzone').forEach(zone => {
        const groupId = zone.dataset.groupId;
        const areaId = zone.dataset.areaId;
        const area = NOL3.deliveryAreas.find(item => item.id === areaId);
        const group = area && ensureAreaGroups(area).find(item => item.id === groupId);
        if (!group) return;

        const countEl = zone.closest('.town-group')?.querySelector('.town-group-count');
        if (countEl) countEl.textContent = `${group.towns.length.toLocaleString()} town${group.towns.length === 1 ? '' : 's'}`;

        if (!group.towns.length) {
          zone.innerHTML = '<div class="delivery-area-empty">Drag towns here</div>';
        } else if (!zone.querySelector('.town-chip')) {
          zone.innerHTML = '';
        }
      });

      if (targetAreaId && targetGroupId) {
        const area = NOL3.deliveryAreas.find(item => item.id === targetAreaId);
        const group = area && ensureAreaGroups(area).find(item => item.id === targetGroupId);
        const zone = document.querySelector(`.town-group-dropzone[data-area-id="${CSS.escape(targetAreaId)}"][data-group-id="${CSS.escape(targetGroupId)}"]`);
        if (group && zone) {
          const empty = zone.querySelector('.delivery-area-empty');
          if (empty) empty.remove();
          const lm = NOL3.lmInventory;
          let townCount = 0;
          if (lm && Array.isArray(lm.filteredRows) && Array.isArray(lm.headers)) {
            const ti = findTownColumn(lm.headers);
            if (ti >= 0) townCount = lm.filteredRows.reduce((n, row) => n + (parseTownValue(row[ti]) === town ? 1 : 0), 0);
          }
          const chip = document.createElement('div');
          chip.className = 'town-chip';
          chip.draggable = true;
          chip.dataset.town = town;
          chip.title = town;
          chip.innerHTML = `<span class="town-chip-name">${NOL3.escapeHTML(town)}</span><span class="town-chip-count">${townCount.toLocaleString()}</span>`;
          zone.appendChild(chip);
          bindTownDragging();
        }
      }

      // Refresh only the small area summary counts.
      document.querySelectorAll('.delivery-area-group').forEach(section => {
        const areaId = section.dataset.areaId;
        const area = NOL3.deliveryAreas.find(item => item.id === areaId);
        if (!area) return;
        const groups = ensureAreaGroups(area);
        const total = groups.reduce((sum, group) => sum + group.towns.length, 0);
        const countEl = section.querySelector('.delivery-area-group-count');
        if (countEl) countEl.textContent = `${total.toLocaleString()} town${total === 1 ? '' : 's'} · ${groups.length} group${groups.length === 1 ? '' : 's'}`;
      });
    };

    const deleteTownGroup = (areaId, groupId) => {
      const area = NOL3.deliveryAreas.find(item => item.id === areaId);
      if (!area) return;
      const groups = ensureAreaGroups(area);
      const index = groups.findIndex(group => group.id === groupId);
      if (index < 0) return;

      // Removing a group deliberately leaves its towns unassigned.
      groups.splice(index, 1);
      area.towns = groups.flatMap(group => group.towns);
      savePlanningLayout();
      renderDeliveryAreas();
      renderOnFloorTowns();
    };

    const assignTownToGroup = (town, areaId, groupId) => {
      NOL3.deliveryAreas.forEach(area => {
        const groups = ensureAreaGroups(area);
        groups.forEach(group => {
          group.towns = group.towns.filter(existing => existing !== town);
        });
        area.towns = groups.flatMap(group => group.towns);
      });
      const target = NOL3.deliveryAreas.find(area => area.id === areaId);
      if (target) {
        const groups = ensureAreaGroups(target);
        const group = groups.find(item => item.id === groupId) || groups[0];
        if (group) group.towns.push(town);
        target.towns = groups.flatMap(item => item.towns);
      }
      savePlanningLayout();
      refreshDeliveryAreaAfterTownMove(town, areaId, groupId);
      renderOnFloorTowns();
    };

    const assignTownToArea = (town, areaId) => {
      const target = NOL3.deliveryAreas.find(area => area.id === areaId);
      if (!target) return;
      const groups = ensureAreaGroups(target);
      const firstGroup = groups[0];
      if (firstGroup) assignTownToGroup(town, areaId, firstGroup.id);
    };

    const removeTownFromGroups = (town) => {
      if (!town) return;
      let changed = false;
      NOL3.deliveryAreas.forEach(area => {
        const groups = ensureAreaGroups(area);
        groups.forEach(group => {
          const before = group.towns.length;
          group.towns = group.towns.filter(existing => existing !== town);
          if (group.towns.length !== before) changed = true;
        });
        area.towns = groups.flatMap(group => group.towns);
      });
      if (!changed) return;
      savePlanningLayout();
      refreshDeliveryAreaAfterTownMove(town);
      renderOnFloorTowns();
    };

    const swapTownGroups = (areaId, groupId, targetAreaId, targetGroupId) => {
      if (!areaId || !groupId || !targetAreaId || !targetGroupId) return;
      const sourceArea = NOL3.deliveryAreas.find(area => area.id === areaId);
      const targetArea = NOL3.deliveryAreas.find(area => area.id === targetAreaId);
      if (!sourceArea || !targetArea) return;

      const sourceGroups = ensureAreaGroups(sourceArea);
      const targetGroups = sourceArea === targetArea ? sourceGroups : ensureAreaGroups(targetArea);
      const sourceIndex = sourceGroups.findIndex(group => group.id === groupId);
      const targetIndex = targetGroups.findIndex(group => group.id === targetGroupId);
      if (sourceIndex < 0 || targetIndex < 0) return;

      // Move the dragged group before the target group. The target and the
      // groups after it automatically shift down, rather than swapping.
      const [movedGroup] = sourceGroups.splice(sourceIndex, 1);
      if (!movedGroup) return;

      if (sourceArea === targetArea) {
        const adjustedTargetIndex = sourceIndex < targetIndex ? targetIndex - 1 : targetIndex;
        sourceGroups.splice(adjustedTargetIndex, 0, movedGroup);
        sourceArea.towns = sourceGroups.flatMap(group => group.towns);
      } else {
        targetGroups.splice(targetIndex, 0, movedGroup);
        sourceArea.towns = sourceGroups.flatMap(group => group.towns);
        targetArea.towns = targetGroups.flatMap(group => group.towns);
      }

      savePlanningLayout();
      renderDeliveryAreas();
    };

    const openDeleteTownGroupModal = (areaId, groupId, title) => {
      NOL3.pendingDeleteTownGroup = { areaId, groupId };
      const modal = document.getElementById('deleteTownGroupModal');
      const text = document.getElementById('deleteTownGroupText');
      if (text) text.textContent = `Delete "${title}"? All towns in this group will return to Unassigned Towns.`;
      if (modal) modal.classList.add('show');
    };

    const closeDeleteTownGroupModal = () => {
      const modal = document.getElementById('deleteTownGroupModal');
      if (modal) modal.classList.remove('show');
      NOL3.pendingDeleteTownGroup = null;
    };

    const confirmDeleteTownGroup = () => {
      const pending = NOL3.pendingDeleteTownGroup;
      if (!pending) return;
      const area = NOL3.deliveryAreas.find(item => item.id === pending.areaId);
      if (!area) { closeDeleteTownGroupModal(); return; }
      const groups = ensureAreaGroups(area);
      const index = groups.findIndex(group => group.id === pending.groupId);
      if (index < 0) { closeDeleteTownGroupModal(); return; }

      groups.splice(index, 1);
      area.towns = groups.flatMap(group => group.towns);
      savePlanningLayout();
      closeDeleteTownGroupModal();
      renderDeliveryAreas();
      renderOnFloorTowns();
    };

    const bindTownGroupDragging = () => {
      document.querySelectorAll('.town-group-header').forEach(header => {
        if (header.dataset.groupDragBound === '1') return;
        header.dataset.groupDragBound = '1';
        const group = header.closest('.town-group');
        if (!group) return;
        const areaId = group.closest('.delivery-area-group')?.dataset.areaId || '';
        const groupId = group.dataset.groupId || '';
        header.setAttribute('draggable', 'true');

        header.addEventListener('dragstart', event => {
          if (event.target.closest('.town-group-delete') || event.target.closest('.town-group-rider-picker')) { event.preventDefault(); return; }
          const payload = JSON.stringify({ areaId, groupId });
          NOL3.activeDraggedTownGroup = { areaId, groupId };
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('application/x-nol3-town-group', payload);
          event.dataTransfer.setData('text/plain', payload);
          group.classList.add('dragging-group');
        });
        header.addEventListener('dragend', () => {
          group.classList.remove('dragging-group');
          NOL3.activeDraggedTownGroup = null;
          document.querySelectorAll('.town-group.group-drag-target').forEach(el => el.classList.remove('group-drag-target'));
        });
        header.addEventListener('dragover', event => {
          const active = NOL3.activeDraggedTownGroup;
          if (!active || (active.areaId === areaId && active.groupId === groupId)) return;
          event.preventDefault();
          event.stopPropagation();
          event.dataTransfer.dropEffect = 'move';
          document.querySelectorAll('.town-group.group-drag-target').forEach(el => el.classList.remove('group-drag-target'));
          group.classList.add('group-drag-target');
        });
        header.addEventListener('dragleave', event => {
          if (!header.contains(event.relatedTarget)) group.classList.remove('group-drag-target');
        });
        header.addEventListener('drop', event => {
          event.preventDefault();
          event.stopPropagation();
          group.classList.remove('group-drag-target');
          let payload = NOL3.activeDraggedTownGroup;
          if (!payload) {
            const raw = event.dataTransfer.getData('application/x-nol3-town-group');
            if (raw) { try { payload = JSON.parse(raw); } catch (_) {} }
          }
          NOL3.activeDraggedTownGroup = null;
          if (!payload) return;
          if (payload.areaId === areaId && payload.groupId === groupId) return;
          swapTownGroups(payload.areaId, payload.groupId, areaId, groupId);
        });

        let pointerDrag = null;
        header.addEventListener('pointerdown', event => {
          if (event.pointerType === 'mouse' || event.target.closest('.town-group-delete') || event.target.closest('.town-group-rider-picker')) return;
          pointerDrag = { pointerId: event.pointerId, started: false };
          header.setPointerCapture?.(event.pointerId);
        });
        header.addEventListener('pointermove', event => {
          if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
          if (!pointerDrag.started) {
            const dx = Math.abs(event.movementX || 0);
            const dy = Math.abs(event.movementY || 0);
            if (dx + dy < 3) return;
            pointerDrag.started = true;
          }
          const target = document.elementFromPoint(event.clientX, event.clientY);
          const targetHeader = target?.closest('.town-group-header');
          document.querySelectorAll('.town-group.group-drag-target').forEach(el => el.classList.remove('group-drag-target'));
          if (targetHeader) targetHeader.closest('.town-group')?.classList.add('group-drag-target');
        });

          swapTownGroups(areaId, groupId, targetAreaId, targetGroupId);
        };

        header.addEventListener('pointercancel', () => {

    const bindTownDragging = () => {
      document.querySelectorAll('.town-card[draggable="true"]').forEach(card => {

      document.querySelectorAll('.town-chip[draggable="true"]').forEach(chip => {
        if (chip.dataset.dragBound === '1') return;

          const town = chip.dataset.town || '';
          event.dataTransfer.setData('application/x-nol3-town', town);
          event.dataTransfer.setData('text/plain', town);

      document.querySelectorAll('.town-group-dropzone').forEach(zone => {

      // Fallback for browsers that do not deliver the drop event directly to the tile.
      // We keep the existing HTML5 drag system and only intercept drops whose target is + NEW GROUP.
      if (!NOL3.newGroupDocumentDropBound) {
        NOL3.newGroupDocumentDropBound = true;
        document.addEventListener('dragover', event => {

        document.addEventListener('drop', event => {

          if (!tile) return;
          event.preventDefault();
          event.stopPropagation();
          const town = (event.dataTransfer && (event.dataTransfer.getData('application/x-nol3-town') || event.dataTransfer.getData('text/plain'))) || NOL3.activeDraggedTown || '';
          const areaId = tile.dataset.areaId;

      document.querySelectorAll('.new-town-group-tile').forEach(tile => {
        if (tile.dataset.dropBound === '1') return;
        tile.dataset.dropBound = '1';
        tile.addEventListener('dragover', event => {

          event.stopPropagation();
          tile.classList.add('dragover');
        });
        tile.addEventListener('dragleave', event => {
          event.stopPropagation();
          tile.classList.remove('dragover');

        tile.addEventListener('drop', event => {
          event.preventDefault();
          event.stopPropagation();
          tile.classList.remove('dragover');
          const town = event.dataTransfer.getData('application/x-nol3-town') || event.dataTransfer.getData('text/plain');

        });
      });

      // Touch/pointer fallback for phones/tablets. Keep the existing HTML5 drag path intact.
      let pointerDrag = null;
      let pointerDropTarget = null;

      const clearPointerDropState = () => {
        document.querySelectorAll('.new-town-group-tile.dragover, .town-group-dropzone.dragover')
          .forEach(el => el.classList.remove('dragover'));
        pointerDropTarget = null;
      };

      const updatePointerDropTarget = (event) => {
        const target = document.elementFromPoint(event.clientX, event.clientY);
        const dropTarget = target && target.closest('.new-town-group-tile, .town-group-dropzone');
        clearPointerDropState();
        if (dropTarget) {
          dropTarget.classList.add('dragover');
          pointerDropTarget = dropTarget;
        }
      };

      document.querySelectorAll('.town-card[draggable="true"], .town-chip[draggable="true"]').forEach(card => {
        if (card.dataset.pointerBound === '1') return;
        card.dataset.pointerBound = '1';
        card.style.touchAction = 'pan-y';

        card.addEventListener('pointerdown', event => {
          if (event.pointerType === 'mouse') return;
          const town = card.dataset.town || '';
          if (!town) return;
          pointerDrag = { town, pointerId: event.pointerId, started: false };
          pointerDropTarget = null;
        });

        card.addEventListener('pointermove', event => {
          if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
          pointerDrag.started = true;
          updatePointerDropTarget(event);
        });

        card.addEventListener('pointerup', event => {
          if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
          const drag = pointerDrag;
          const dropTarget = pointerDropTarget || (() => {
            const target = document.elementFromPoint(event.clientX, event.clientY);
            return target && target.closest('.new-town-group-tile, .town-group-dropzone');

          if (!drag.started || !dropTarget) {
            clearPointerDropState();
