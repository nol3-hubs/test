  const RIDER_HUB_STORE_KEY = "nol3_rider_data_by_hub_v1";
  const getRiderHubStore = () => parseObject(NOL3Storage.get(RIDER_HUB_STORE_KEY), {});
  const getCurrentHubName = () => String((NOL3.getState && NOL3.getState().selectedHub) || HUB_NAME || "").trim();
  const saveRiderDataForHub = (result, hub = getCurrentHubName()) => {
    if (!result || !hub) return;
    try {
      const store = getRiderHubStore();
      store[hub] = {
        fileName: result.fileName || "",
        headers: Array.isArray(result.headers) ? result.headers : [],
        rows: Array.isArray(result.rows) ? result.rows : [],
        rawText: typeof result.rawText === "string" ? result.rawText : "",
        loadedAt: result.loadedAt || new Date().toISOString(),
        rowCount: Array.isArray(result.rows) ? result.rows.length : Number(result.rowCount || 0)
      };
      NOL3Storage.set(RIDER_HUB_STORE_KEY, JSON.stringify(store));
    } catch (_) {}
  };
  const loadRiderDataForHub = (hub = getCurrentHubName()) => {
    if (!hub) return null;
    const store = getRiderHubStore();
    const value = store[hub];
    return value && typeof value === "object" ? value : null;
  };
  window.NOL3RiderHubStore = { save: saveRiderDataForHub, load: loadRiderDataForHub };

  NOL3.saveUploadedData = async function (type, files, dataset = null) {
    try {
      const list = Array.isArray(files) ? files : [files];
      const records = [];
      for (const file of list) {
        if (!file) continue;
        const text = typeof file.text === 'function' ? await file.text() : String(file.text || '');
        records.push({ name: file.name, lastModified: file.lastModified || 0, text });
      }
      // LM data is a daily snapshot. Every upload is saved under the actual
      // Philippines calendar date on which the file was uploaded. A later
      // upload on the same date replaces/updates that day's snapshot, while
      // snapshots from previous dates remain untouched.
      let allFiles;
      if (type === "lm") {
        const today = (typeof getNOL3TodayDate === "function")
          ? getNOL3TodayDate()
          : new Date().toISOString().slice(0, 10);

        // Keep the cumulative file list for today's snapshot. The rows in
        // dataset are already the merged/stacked rows.
        let previousTodayFiles = [];
        try {
          const previousToday = await NOL3.getLMHistorySnapshot(today);
          previousTodayFiles = Array.isArray(previousToday?.files)
            ? previousToday.files
            : [];
        } catch (_) {}

        allFiles = [...previousTodayFiles, ...records].filter((item, index, arr) =>
          arr.findIndex(x =>
            x.name === item.name &&
            (x.lastModified || 0) === (item.lastModified || 0)
          ) === index
        );

        if (dataset) {
          const historyDataset = {
            ...dataset,
            fileName: dataset.fileName || allFiles.map(item => item.name).join(', '),
            loadedAt: dataset.loadedAt || new Date().toISOString()
          };
          await NOL3.saveLMHistorySnapshot(today, historyDataset, allFiles);
        }
      } else {
        const previous = await get(type);
        const existingFiles = Array.isArray(previous?.files) ? previous.files : [];
        allFiles = [...existingFiles, ...records].filter((item, index, arr) =>
          arr.findIndex(x => x.name === item.name && (x.lastModified || 0) === (item.lastModified || 0)) === index
        );
      }
      const record = { type, files: allFiles, savedAt: new Date().toISOString() };
      if (dataset) {
        record.dataset = {
          fileName: dataset.fileName || allFiles.map(item => item.name).join(', '),
          headers: Array.isArray(dataset.headers) ? dataset.headers : [],
          rows: Array.isArray(dataset.rows) ? dataset.rows : [],
          rawText: typeof dataset.rawText === "string" ? dataset.rawText : "",
          loadedAt: dataset.loadedAt || new Date().toISOString()
        };
      }
      await put(record);
    } catch (error) {
      console.warn("NOL3: Could not save uploaded file data.", error);
    }
  };

  NOL3.loadLMHistoryForDate = async function (businessDate) {
    const date = String(businessDate || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;

    const saved = await NOL3.getLMHistorySnapshot(date);
    if (saved?.dataset && Array.isArray(saved.dataset.rows)) {
      const d = saved.dataset;
      NOL3.lmInventory = {
        files: Array.isArray(saved.files) ? saved.files.map(item => ({ name: item.name, lastModified: item.lastModified || 0 })) : [],
        fileName: d.fileName || (saved.files || []).map(item => item.name).join(', '),
        headers: Array.isArray(d.headers) ? d.headers : [],
        rows: d.rows,
        filteredRows: [],
        loadedAt: d.loadedAt || saved.savedAt || new Date().toISOString()
      };
      filterLMForHub(NOL3.lmInventory);
      window.dispatchEvent(new CustomEvent("inventoryloaded", {
        detail: { type: "lm", fileName: NOL3.lmInventory.fileName, totalRows: NOL3.lmInventory.rows.length, businessDate: date, historical: true }
      }));
      return NOL3.lmInventory;
    }

    // No upload exists for this date: do not display another day's snapshot.
    NOL3.lmInventory = { files: [], rows: [], filteredRows: [], fileName: "", headers: [], loadedAt: new Date().toISOString() };
    window.dispatchEvent(new CustomEvent("inventoryloaded", {
      detail: { type: "lm", fileName: "", totalRows: 0, businessDate: date, historical: true, empty: true }
    }));
    return NOL3.lmInventory;
  };

  NOL3.restoreSavedUploads = async function () {
    try {
      const savedLM = await get("lm");
      const selectedBusinessDate = typeof NOL3.getBusinessDateValue === "function"
        ? NOL3.getBusinessDateValue()
        : String(NOL3.currentBusinessDate || "").trim();

      // Prefer the date-specific LM snapshot. If this is the first startup after
      // the daily-history change and only the legacy single snapshot exists,
      // migrate that snapshot to today's history key once.
      let historySnapshot = await NOL3.getLMHistorySnapshot(selectedBusinessDate);
      if (!historySnapshot && savedLM && savedLM.dataset && Array.isArray(savedLM.dataset.rows)) {
        const today = (typeof getNOL3TodayDate === "function") ? getNOL3TodayDate() : new Date().toISOString().slice(0, 10);
        if (selectedBusinessDate === today) {
          await NOL3.saveLMHistorySnapshot(today, savedLM.dataset, savedLM.files || []);
          historySnapshot = await NOL3.getLMHistorySnapshot(today);
        }
      }

      if (historySnapshot?.dataset && Array.isArray(historySnapshot.dataset.rows)) {
        const d = historySnapshot.dataset;
        const result = {
          files: Array.isArray(historySnapshot.files) ? historySnapshot.files.map(item => ({ name: item.name, lastModified: item.lastModified || 0 })) : [],
          fileName: d.fileName || (historySnapshot.files || []).map(item => item.name).join(', '),
          headers: Array.isArray(d.headers) ? d.headers : [],
          rows: d.rows,
          filteredRows: [],
          loadedAt: d.loadedAt || historySnapshot.savedAt || new Date().toISOString()
        };
        filterLMForHub(result);
        NOL3.lmInventory = result;
        window.dispatchEvent(new CustomEvent("inventoryloaded", {
          detail: { type: "lm", fileName: result.fileName, totalRows: result.rows.length, headers: result.headers, businessDate: selectedBusinessDate, historical: true }
        }));
      } else {
        NOL3.lmInventory = { files: [], rows: [], filteredRows: [], fileName: "", headers: [], loadedAt: new Date().toISOString() };
        window.dispatchEvent(new CustomEvent("inventoryloaded", {
          detail: { type: "lm", fileName: "", totalRows: 0, headers: [], businessDate: selectedBusinessDate, historical: true, empty: true }
        }));
      }

      // Restore riders for the selected hub first. Fall back to the legacy
      // single-roster store once, then migrate it into the hub-specific store.
      const riderHubData = window.NOL3RiderHubStore?.load?.((NOL3.getState && NOL3.getState().selectedHub) || "");
      if (riderHubData && (Array.isArray(riderHubData.rows) || riderHubData.rawText)) {
        NOL3.riderData = riderHubData;
      } else {
        const savedRiders = await get("riders");
        if (savedRiders && Array.isArray(savedRiders.files) && savedRiders.files[0]) {
          const item = savedRiders.files[0];
          const text = item.text || "";
          const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
          NOL3.riderData = {
            fileName: item.name,
            rowCount: Math.max(0, rows.length - 1),
            rawText: text,
            rows
          };
          window.NOL3RiderHubStore?.save?.(NOL3.riderData);
        }
      }

      const savedUnified = await get("unifiedInventory");
      let restoredUnified = false;
      if (savedUnified && savedUnified.dataset && Array.isArray(savedUnified.dataset.rows)) {
        const d = savedUnified.dataset;
        const resultBase = {
          fileName: d.fileName || savedUnified.files?.[0]?.name || "inventory.csv",
          headers: Array.isArray(d.headers) ? d.headers : [],
          loadedAt: d.loadedAt || savedUnified.savedAt || new Date().toISOString(),
          rawText: typeof d.rawText === "string" ? d.rawText : (savedUnified.files?.[0]?.text || "")
        };

        // A dedicated LM upload is the current LM snapshot. Do not replace it
        // with the older cumulative Unified Inventory snapshot during startup.
        // Unified Inventory still restores Incoming data and remains available
        // when no dedicated LM snapshot exists.
        const hasDedicatedLM = !!(savedLM && Array.isArray(savedLM.dataset?.rows));
        if (!hasDedicatedLM) {
          NOL3.lmInventory = { ...resultBase, rows: Array.isArray(d.lmRows) ? d.lmRows : [], filteredRows: [], rowCount: Array.isArray(d.lmRows) ? d.lmRows.length : 0, files: savedUnified.files || [] };
          filterLMForHub(NOL3.lmInventory);
          window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "lm", data: NOL3.lmInventory } }));
        }
        NOL3.incomingInventory = { ...resultBase, rows: Array.isArray(d.incomingRows) ? d.incomingRows : [], filteredRows: [], rowCount: Array.isArray(d.incomingRows) ? d.incomingRows.length : 0, files: savedUnified.files || [] };
        restoredUnified = true;
        window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "incoming", data: NOL3.incomingInventory } }));
      }

      for (const type of ["incoming", "linehaul"]) {
        if (type === "incoming" && restoredUnified) continue;
        const saved = await get(type);
        if (!saved || !Array.isArray(saved.files) || !saved.files[0]) continue;
        const item = saved.files[0];
        const text = item.text || "";
        const storedDataset = saved.dataset && Array.isArray(saved.dataset.rows) ? saved.dataset : null;
        const parsed = storedDataset ? null : parseStoredCSV(text);
        const headers = storedDataset
          ? (Array.isArray(storedDataset.headers) ? storedDataset.headers : [])
          : (parsed && parsed.length ? parsed[0].map(value => String(value).trim()) : []);
        const rows = storedDataset
          ? storedDataset.rows
          : (parsed && parsed.length ? parsed.slice(1).filter(row => row.some(value => String(value || "").trim() !== "")) : []);
        const result = {
          fileName: storedDataset?.fileName || item.name,
          rowCount: rows.length,
          rawText: text,
          headers,
          rows,
          loadedAt: storedDataset?.loadedAt || saved.savedAt || new Date().toISOString()
        };
        if (type === "incoming") NOL3.incomingInventory = result;
        else NOL3.lineHaulInventory = result;
        window.dispatchEvent(new CustomEvent("inventoryloaded", {
          detail: { type, data: result }
        }));
      }
    } catch (error) {
      console.warn("NOL3: Could not restore saved uploaded files.", error);
    }
  };

  NOL3.updateInventoryUploadSummaries = async function () {
    try {
      const lm = await get("lm");
      const incoming = await get("incoming");
      const linehaul = await get("linehaul");
      const lmSummary = document.getElementById("lmSummary");
      const lmList = document.getElementById("lmList");
      const incomingSummary = document.getElementById("incomingSummary");
      const lineHaulSummary = document.getElementById("lineHaulSummary");
      const memoryUnified = !!(NOL3.lmInventory?.rows?.length || NOL3.incomingInventory?.rows?.length);
      if (lm && Array.isArray(lm.files) && lm.files.length) {
        if (lmSummary) lmSummary.textContent = lm.files.length === 1 ? lm.files[0].name : `${lm.files.length} files saved`;
        if (lmList) lmList.innerHTML = lm.files.map(item => `<li title="${NOL3.escapeHTML(item.name)}">${NOL3.escapeHTML(item.name)}</li>`).join("");
        if (clearLMBtn) clearLMBtn.disabled = false;
      } else {
        // Do not disable the clear button if a freshly uploaded LM dataset is
        // already present in memory but the IndexedDB read returned stale data.
        const hasMemoryLM = !!(NOL3.lmInventory && Array.isArray(NOL3.lmInventory.files) && NOL3.lmInventory.files.length);
        if (lmSummary && !hasMemoryLM) lmSummary.textContent = "No files selected";
        if (lmList && !hasMemoryLM) lmList.innerHTML = "";
        if (clearLMBtn) clearLMBtn.disabled = !hasMemoryLM;
      }
      if (incoming && incoming.files && incoming.files[0] && incomingSummary) incomingSummary.textContent = incoming.files[0].name;
      if (linehaul && linehaul.files && linehaul.files[0] && lineHaulSummary) lineHaulSummary.textContent = linehaul.files[0].name;
      if (memoryUnified) {
        const unifiedName = NOL3.lmInventory?.fileName || NOL3.incomingInventory?.fileName || 'Saved inventory';
        const unifiedSummary = document.getElementById('unifiedInventorySummary');
        const unifiedStatus = document.getElementById('unifiedInventoryStatus');
        if (unifiedSummary) unifiedSummary.textContent = unifiedName;
        if (unifiedStatus && !unifiedStatus.textContent.trim()) unifiedStatus.textContent = `${((NOL3.lmInventory?.rows?.length || 0) + (NOL3.incomingInventory?.rows?.length || 0)).toLocaleString()} records loaded`;
        const clearBtnEl = document.getElementById("clearUnifiedInventoryBtn");
        if (clearBtnEl) clearBtnEl.disabled = false;
      }
    } catch (error) {
      console.warn("NOL3: Could not update saved upload summaries.", error);
    }
  };
})();

(function () {
  NOL3.readCSVFile = function (file, callback) {
    const reader = new FileReader();

    reader.onload = function (event) {
      // Strip NUL (\u0000) characters: they can end up here if a binary file
      // (e.g. a mis-saved .xlsx) gets read as text, and the database layer's
      // jsonb columns reject \u0000 outright ("unsupported Unicode escape
      // sequence"), which breaks cloud sync for the whole snapshot.
      const text = String(event.target.result || "").replace(/\u0000/g, "");
      const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
      callback({
        fileName: file.name,
        rowCount: Math.max(0, rows.length - 1),
        rawText: text,
        rows
      });
    };

    reader.onerror = function () {
      console.error("NOL3: Could not read file:", file.name);
    };

    reader.readAsText(file);
  };

  function parseFlexibleCSV(text) {
    const sample = String(text || "").split(/\r?\n/).filter(line => line.trim()).slice(0, 5).join("\n");
    const candidates = [",", "\t", ";", "|"];
    let delimiter = ",", best = -1;
    candidates.forEach(d => {
      let count = 0, quoted = false;
      for (const ch of sample) {
        if (ch === '"') quoted = !quoted;
        else if (ch === d && !quoted) count++;
      }
      if (count > best) { best = count; delimiter = d; }
    });
    const parsedRows = []; let row = [], value = "", inQuotes = false;
    for (let i = 0; i < String(text || "").length; i++) {
      const char = text[i], next = text[i + 1];
      if (char === '"' && inQuotes && next === '"') { value += '"'; i++; continue; }
      if (char === '"') { inQuotes = !inQuotes; continue; }
      if (char === delimiter && !inQuotes) { row.push(value); value = ""; continue; }
      if ((char === '\n' || char === '\r') && !inQuotes) {
        if (char === '\r' && next === '\n') i++;
        row.push(value); value = ""; parsedRows.push(row); row = []; continue;
      }
      value += char;
    }
    if (value.length || row.length) { row.push(value); parsedRows.push(row); }
    return parsedRows;
  }

  NOL3.readIncomingInventory = function (file) {
    NOL3.readCSVFile(file, function (result) {
      const parsed = parseFlexibleCSV(result.rawText);
      result.headers = parsed.length ? parsed[0].map(value => String(value).trim()) : [];
      result.rows = parsed.length ? parsed.slice(1).filter(row => row.some(value => String(value || "").trim() !== "")) : [];
      result.rowCount = result.rows.length;
      NOL3.incomingInventory = result;
      NOL3.saveUploadedData("incoming", [file], result);
      window.dispatchEvent(new CustomEvent("inventoryloaded", {
        detail: { type: "incoming", data: result }
      }));
      // Push the complete Incoming Orders source data immediately. This avoids
      // relying only on the 5-second polling loop after a large CSV upload.
      try { if (window.NOL3CloudSync?.syncNow) window.NOL3CloudSync.syncNow(); } catch (_) {}
      console.log("Incoming Inventory loaded:", result.fileName, result.rowCount, "data rows");
    });
  };

  NOL3.readLineHaulInventory = function (file) {
    NOL3.readCSVFile(file, function (result) {
      const parsed = parseFlexibleCSV(result.rawText);
      result.headers = parsed.length ? parsed[0].map(v => String(v).replace(/^\uFEFF/, "").trim()) : [];
      result.rows = parsed.length ? parsed.slice(1).filter(row => row.some(v => String(v || "").trim() !== "")) : [];
      result.rowCount = result.rows.length;
      NOL3.lineHaulInventory = result;
      NOL3.saveUploadedData("linehaul", [file], result);
      window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "linehaul", data: result } }));
      // The Incoming Orders screen requires both datasets: Incoming Inventory
      // and the Incoming Inventory From-To/Linehaul list. Push immediately so
      // another device receives the linehaul mapping as well.
      try { if (window.NOL3CloudSync?.syncNow) window.NOL3CloudSync.syncNow(); } catch (_) {}
      console.log("Line Haul Task ID file loaded:", result.fileName, result.rowCount, "data rows");
    });
  };
})();


// HARD Business Date persistence guard. This runs in capture phase so the
// selected date is committed even on mobile browsers where the native date
// picker can rebuild/blur the control before the page's local handler runs.
(function () {
  const valid = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v || "").trim());
  const sync = (rerender = false) => {
    const input = document.getElementById("businessDayDate");
    if (!input || !valid(input.value)) return;
    const value = String(input.value).trim();
    NOL3.currentBusinessDate = value;
    try { NOL3Storage.set("nol3_business_day_date_v1", value); } catch (_) {}
    if (rerender) {
      window.dispatchEvent(new CustomEvent("businessdatechange", { detail: { businessDate: value, source: "picker" } }));
    }
  };

  document.addEventListener("input", event => {
    if (event.target?.id === "businessDayDate") sync(false);
  }, true);
  document.addEventListener("change", event => {
    if (event.target?.id === "businessDayDate") sync(true);
  }, true);
  document.addEventListener("blur", event => {
    if (event.target?.id === "businessDayDate") sync(false);
  }, true);
  document.addEventListener("pointerdown", event => {
    if (event.target?.closest?.(".nav-item")) sync(false);
  }, true);
  document.addEventListener("click", event => {
    if (event.target?.closest?.(".nav-item")) sync(false);
  }, true);
})();

// When the Business Date changes, switch the active LM dataset to the snapshot
// uploaded on that calendar date. This is what keeps yesterday's upload in
// yesterday and today's upload in today.
(function () {
  let switching = false;
  window.addEventListener("businessdatechange", async event => {
    const date = String(event.detail?.businessDate || NOL3.currentBusinessDate || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || switching) return;
    if (typeof NOL3.loadLMHistoryForDate !== "function") return;
    switching = true;
    try {
      // NOW loads the snapshot before dispatching this event. Do not start a
      // second IndexedDB read in that case; doing so created a race where the
      // first click rendered an empty dataset and the second click appeared to
      // fix it. Normal date-picker changes still load here.
      if (!event.detail?.lmAlreadyLoaded) {
        await NOL3.loadLMHistoryForDate(date);
      }

      // loadLMHistoryForDate() already rebuilds filteredRows. Do not repeat
      // the full row filter here; doing it again on large LM files was a major
      // source of date-switch lag.
      if (typeof NOL3.updateInventoryUploadSummaries === "function") {
        try { await NOL3.updateInventoryUploadSummaries(); } catch (_) {}
      }

      // Refresh only the views that depend on the dated LM dataset. Avoid a
      // full renderPage() because rebuilding the entire DOM can be expensive
      // with large uploads and was unnecessary for a date switch.
      const renderAfterDateRestore = () => {
        if (typeof NOL3.renderBusinessDayMetrics === "function") NOL3.renderBusinessDayMetrics();
        if (typeof renderOnFloorTowns === "function") renderOnFloorTowns();
        if (typeof renderDeliveryAreas === "function") renderDeliveryAreas();
        if (typeof renderIncomingOrders === "function") renderIncomingOrders();
        if (typeof updateIncomingOrdersNotification === "function") updateIncomingOrdersNotification();
        if (typeof renderPlanningExceptions === "function") renderPlanningExceptions();
        if (typeof renderUnassignedOrders === "function") renderUnassignedOrders();
        if (typeof renderParcelRecords === "function") renderParcelRecords();
      };
      // Rebuild the active page once after the dated snapshot is fully loaded.
      // The metric elements can be recreated by the page renderer; updating
      // only the old DOM nodes is why the data sometimes appeared only after
      // a manual Refresh. This is still much cheaper than a full app reload.
      try {
        const currentPage = NOL3.state?.currentPage || "planning";
        if (typeof NOL3.renderPage === "function") NOL3.renderPage(currentPage);
      } catch (_) {}

      // renderPage() recreates the Planning DOM, so the closure-scoped
      // Planning renderers must run AFTER that rebuild. Use the exported
      // refresh hook rather than trying to call those local functions from
      // this outer scope.
      const refreshCurrentPlanningDOM = () => {
        try {
          if (typeof NOL3.refreshPlanningViews === "function") {
            NOL3.refreshPlanningViews();
            return;
          }
        } catch (_) {}
        renderAfterDateRestore();
      };
      refreshCurrentPlanningDOM();
      requestAnimationFrame(() => {
        refreshCurrentPlanningDOM();
        requestAnimationFrame(refreshCurrentPlanningDOM);
        setTimeout(refreshCurrentPlanningDOM, 100);
        setTimeout(refreshCurrentPlanningDOM, 500);
      });
    } catch (error) {
      console.warn("NOL3: Could not switch LM snapshot for Business Date.", error);
    } finally {
      switching = false;
    }
  });
})();

// Global LM restore hook. Dashboard must refresh when saved LM data arrives;
// this listener is registered independently of the Planning page.
(function () {
  const refresh = () => {
    if (typeof NOL3.renderBusinessDayMetrics !== "function") return;
    NOL3.renderBusinessDayMetrics();
    requestAnimationFrame(() => NOL3.renderBusinessDayMetrics());
    setTimeout(() => {
      if (typeof NOL3.renderBusinessDayMetrics === "function") NOL3.renderBusinessDayMetrics();
    }, 50);
  };
  window.addEventListener("inventoryloaded", event => {
    if (event.detail?.type === "lm") refresh();
  });
  window.addEventListener("lminventoryfiltered", refresh);
})();

(function () {
  async function startApp() {
    NOL3.initHubModal();

    // IMPORTANT: Business-day metric functions are defined inside the Planning
    // page initializer. Previously, they were not exposed until the user
    // visited Planning, which is why Dashboard showed 0 on a fresh open.
    // Initialize that function scope once using a detached root so no Planning
    // navigation is required. The actual visible page remains Dashboard.
    try {
      if (typeof NOL3.renderBusinessDayMetrics !== "function" &&
          typeof NOL3.pages?.planning === "function") {
        const metricInitRoot = document.createElement("div");
        metricInitRoot.style.display = "none";
        metricInitRoot.setAttribute("aria-hidden", "true");
        document.body.appendChild(metricInitRoot);
        try { NOL3.pages.planning(metricInitRoot); } catch (error) {
          console.warn("NOL3: Planning metric initialization failed.", error);
        }
        metricInitRoot.remove();
      }
    } catch (error) {
      console.warn("NOL3: Could not initialize Dashboard metric functions.", error);
    }

    // Do not calculate metrics yet. Saved LM data is restored below.
    // Calculating before the IndexedDB restore completes can produce 0.

    // Render the shell immediately so the Business Date / CFR1 / LH COT
    // controls are populated on first open. Upload restoration can take a
    // moment because it uses IndexedDB, so it must not block the topbar.
    NOL3.renderSidebar();
    NOL3.renderTopbar();
    NOL3.renderPage(NOL3.getState().currentPage);

    // Global fallback for the NOW button. This listener survives every topbar
    // rebuild caused by navigation and cannot depend on the current menu.
    document.addEventListener("click", function (event) {
      const nowButton = event.target.closest?.("#businessDayNow");
      if (!nowButton) return;
      event.preventDefault();
      event.stopPropagation();
      if (typeof NOL3.setBusinessDateNow === "function") NOL3.setBusinessDateNow();
    }, true);

    window.addEventListener("hubchange", function () {
      NOL3.renderTopbar();
    });

    if (typeof NOL3.restoreSavedUploads === "function") {
      await NOL3.restoreSavedUploads();

      // Rebuild the LM filteredRows from the restored dataset before calculating
      // Business Date metrics. The dashboard uses Current Station = Selected Hub.
      const hub = (NOL3.getState && NOL3.getState().selectedHub) || "";
      const lm = NOL3.lmInventory;
      if (lm && Array.isArray(lm.rows) && Array.isArray(lm.headers)) {
        const headers = lm.headers.map(h => String(h || "").trim().toLowerCase());
        const currentIndex = headers.indexOf("current station");
        if (!hub) {
          lm.filteredRows = lm.rows.slice();
        } else if (currentIndex >= 0) {
          const target = String(hub).trim().toLowerCase();
          lm.filteredRows = lm.rows.filter(row => String(row[currentIndex] || "").trim().toLowerCase() === target);
        } else {
          lm.filteredRows = [];
        }
      }

      // Preserve the Business Date selected by the user.
      // getBusinessDateValue() uses the saved date when one exists and only
      // falls back to today when no Business Date has ever been set.
      // Do NOT overwrite it with today's date on every startup/LM restore.
      const activeBusinessDate = (typeof getBusinessDateValue === "function")
        ? getBusinessDateValue()
        : (window.NOL3InitialBusinessDate || "");
      if (/^\d{4}-\d{2}-\d{2}$/.test(String(activeBusinessDate || ""))) {
        NOL3.currentBusinessDate = activeBusinessDate;
      }

      NOL3.renderTopbar();
      NOL3.renderPage(NOL3.getState().currentPage);

      const refreshStartupDashboard = () => {
        const state = NOL3.getState ? NOL3.getState() : {};
        const lmNow = NOL3.lmInventory;
        if (lmNow && Array.isArray(lmNow.rows) && Array.isArray(lmNow.headers)) {
          const headers = lmNow.headers.map(h => String(h || "").trim().toLowerCase());
          const currentIndex = headers.indexOf("current station");
          const hub = String(state.selectedHub || "").trim().toLowerCase();
          lmNow.filteredRows = currentIndex >= 0 && hub
            ? lmNow.rows.filter(row => String(row[currentIndex] || "").trim().toLowerCase() === hub)
            : (hub ? [] : lmNow.rows.slice());
        }
        if (typeof NOL3.renderBusinessDayMetrics === "function") NOL3.renderBusinessDayMetrics();
      };
      // Keep checking briefly after startup because Android/local browser storage
      // can restore the saved LM dataset after the first Dashboard render.
      // Stop once the dataset is present and the Dashboard has been populated.
      refreshStartupDashboard();
      setTimeout(refreshStartupDashboard, 0);
      setTimeout(refreshStartupDashboard, 100);
      setTimeout(refreshStartupDashboard, 250);
      setTimeout(refreshStartupDashboard, 500);
      setTimeout(refreshStartupDashboard, 1000);
      setTimeout(refreshStartupDashboard, 2000);
      setTimeout(refreshStartupDashboard, 3000);
      setTimeout(refreshStartupDashboard, 5000);
      setTimeout(refreshStartupDashboard, 8000);
      setTimeout(refreshStartupDashboard, 12000);

      // Android content:// pages can defer IndexedDB restoration until after the
      // initial event loop. Poll only while the home page (Planning) is visible
      // so a later navigation elsewhere is never required to populate the cards.
      let startupRefreshAttempts = 0;
      const startupRefreshTimer = setInterval(() => {
        startupRefreshAttempts += 1;
        const state = NOL3.getState ? NOL3.getState() : {};
        const lmNow = NOL3.lmInventory;
        const visibleDashboard = state.currentPage === "planning";
        if (!visibleDashboard || startupRefreshAttempts > 60) {
          clearInterval(startupRefreshTimer);
          return;
        }
        if (lmNow && Array.isArray(lmNow.rows) && lmNow.rows.length &&
            typeof NOL3.renderBusinessDayMetrics === "function") {
          refreshStartupDashboard();
          const todayEl = document.getElementById("todayVolumeValue");
          if (todayEl && todayEl.textContent !== "0") {
            clearInterval(startupRefreshTimer);
          }
        }
      }, 250);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startApp);
  } else {
    startApp();
  }
})();

</script>

<script>
/* NOL3 Cloud Sync — San Nicolas Hub
 * Simple device-to-device synchronization through Supabase.
 * This intentionally uses the Supabase publishable key in the browser.
 * Do not put a secret/service_role key here.
 */
(function () {
  const SUPABASE_URL = "https://uduaxxwzpxwytekejito.supabase.co";
  const HUB_ID = 24;
  const HUB_NAME = "San Nicolas Hub";
  const HUB_CODE = "SAN_NICOLAS";
  const DB_NAME = "NOL3_Planning_Dashboard_DB_SAN_NICOLAS";
  const DB_VERSION = 4;
  const STORE = "uploadedFiles";

  // Three independent sync "channels", all sharing the same hub_data table
  // (distinguished by data_type) but on different cadences/behavior:
  //  - settings: tiny config (business date, hours, zone settings, planning
  //    layout/town groups). Fast cadence. Never auto-cleared.
  //  - roster: the riders file only. Small, persistent reference data. Fast
  //    cadence. Never auto-cleared.
  //  - files: the bulky day-to-day operational uploads (LM/incoming/linehaul
  //    inventory, the unified-inventory snapshot and its undo copy). Large,
  //    ephemeral. Slow cadence, and the ONLY data_type a cleanup job should
  //    ever delete (see the pg_cron script — it targets data_type =
  //    'app_state_files' specifically so it can never touch the other two).
  let applyingRemote = false;
  const META_KEY = "NOL3_CLOUD_LAST_APPLIED_SAN_NICOLAS";

  function makeChannel(config) {
    return {
      ...config,
      lastHash: "",
      lastRemoteUpdatedAt: 0,
      lastLocalMutationAt: 0,
      pushTimer: null,
      syncing: false,
      initialized: false
    };
  }

  const settingsChannel = makeChannel({
    dataType: "app_state",
    metaKey: META_KEY,
    pollMs: 5000,
    debounceMs: 1200,
    async buildSnapshot() {
      return {
        version: 1,
        hubId: HUB_ID,
        hubName: HUB_NAME,
        hubCode: HUB_CODE,
        clientUpdatedAt: settingsChannel.lastLocalMutationAt || Number(localStorage.getItem(META_KEY) || 0),
        localState: getHubState()
      };
    },
    async applyRemote(data) {
      applyHubState(data.localState);
    }
  });

  const rosterChannel = makeChannel({
    dataType: "app_state_roster",
    metaKey: "NOL3_CLOUD_LAST_APPLIED_SAN_NICOLAS_ROSTER",
    pollMs: 5000,
    debounceMs: 1200,
    async buildSnapshot() {
      const rider = window.NOL3?.riderData || null;
      return {
        version: 2,
        hubId: HUB_ID,
        hubName: HUB_NAME,
        hubCode: HUB_CODE,
        clientUpdatedAt: rosterChannel.lastLocalMutationAt || Number(localStorage.getItem(rosterChannel.metaKey) || 0),
        riderData: rider ? {
          fileName: rider.fileName || "",
          headers: Array.isArray(rider.headers) ? rider.headers : [],
          rows: Array.isArray(rider.rows) ? rider.rows : [],
          rawText: typeof rider.rawText === "string" ? rider.rawText : "",
          loadedAt: rider.loadedAt || ""
        } : null
      };
    },
    async applyRemote(data) {
      if (!data || !data.riderData) return;
      NOL3.riderData = data.riderData;
      window.NOL3RiderHubStore?.save?.(data.riderData, (NOL3.getState && NOL3.getState().selectedHub) || HUB_NAME);
      window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "riders", source: "cloud" } }));
      if (NOL3.state?.currentPage === "riders" && typeof NOL3.renderPage === "function") {
        NOL3.renderPage("riders");
      }
    }
  });

  const filesChannel = makeChannel({
    dataType: "app_state_files",
    metaKey: "NOL3_CLOUD_LAST_APPLIED_SAN_NICOLAS_FILES",
    pollMs: 5000,
    debounceMs: 3000,
    async buildSnapshot() {
      const lm = window.NOL3?.lmInventory || null;
      const incoming = window.NOL3?.incomingInventory || null;
      const linehaul = window.NOL3?.lineHaulInventory || null;
      return {
        version: 4,
        hubId: HUB_ID,
        hubName: HUB_NAME,
        hubCode: HUB_CODE,
        clientUpdatedAt: filesChannel.lastLocalMutationAt || Number(localStorage.getItem(filesChannel.metaKey) || 0),
        lmInventory: lm ? {
          fileName: lm.fileName || "",
          files: Array.isArray(lm.files) ? lm.files : [],
          headers: Array.isArray(lm.headers) ? lm.headers : [],
          rows: Array.isArray(lm.rows) ? lm.rows : [],
          filteredRows: Array.isArray(lm.filteredRows) ? lm.filteredRows : [],
          rawText: typeof lm.rawText === "string" ? lm.rawText : "",
          loadedAt: lm.loadedAt || ""
        } : null,
        incomingInventory: incoming ? {
          fileName: incoming.fileName || "",
          files: Array.isArray(incoming.files) ? incoming.files : [],
          headers: Array.isArray(incoming.headers) ? incoming.headers : [],
          rows: Array.isArray(incoming.rows) ? incoming.rows : [],
          rawText: typeof incoming.rawText === "string" ? incoming.rawText : "",
          loadedAt: incoming.loadedAt || ""
        } : null,
        // Incoming Orders are matched by SPX tracking number against the
        // Incoming From-To / Linehaul export. Sync that second dataset too;
        // without it another device has Incoming Inventory but cannot build
        // the Incoming Orders list.
        lineHaulInventory: linehaul ? {
          fileName: linehaul.fileName || "",
          files: Array.isArray(linehaul.files) ? linehaul.files : [],
          headers: Array.isArray(linehaul.headers) ? linehaul.headers : [],
          rows: Array.isArray(linehaul.rows) ? linehaul.rows : [],
          rawText: typeof linehaul.rawText === "string" ? linehaul.rawText : "",
          loadedAt: linehaul.loadedAt || ""
        } : null,
        arrivedIncomingTasks: (() => {
          try {
            const raw = NOL3Storage.get("nol3_incoming_arrived_tasks_v1");
            const parsed = JSON.parse(raw || "[]");
            return Array.isArray(parsed)
              ? parsed.map(v => String(v || "").trim()).filter(Boolean)
              : [];
          } catch (_) { return []; }
        })()
      };
    },
    async applyRemote(data) {
      if (!data) return;
      filesChannel.lastRemoteClearedByUser = data.clearedByUser === true;

      if (data.lmInventory) {
        const lm = data.lmInventory;
        NOL3.lmInventory = {
          fileName: lm.fileName || "",
          files: Array.isArray(lm.files) ? lm.files : [],
          headers: Array.isArray(lm.headers) ? lm.headers : [],
          rows: Array.isArray(lm.rows) ? lm.rows : [],
          filteredRows: Array.isArray(lm.filteredRows) ? lm.filteredRows : [],
          loadedAt: lm.loadedAt || new Date().toISOString(),
          rowCount: Array.isArray(lm.rows) ? lm.rows.length : 0,
          rawText: typeof lm.rawText === "string" ? lm.rawText : ""
        };
        if (typeof filterLMForHub === "function") filterLMForHub(NOL3.lmInventory);
        // Older cloud rows carry filteredRows; new ones don't, so rebuild it.
        NOL3.lmInventory.filteredRows = Array.isArray(lm.filteredRows) ? lm.filteredRows : deriveFilteredRows(NOL3.lmInventory);
      }

      if (data.incomingInventory) {
        const incoming = data.incomingInventory;
        NOL3.incomingInventory = {
          fileName: incoming.fileName || "",
          files: Array.isArray(incoming.files) ? incoming.files : [],
          headers: Array.isArray(incoming.headers) ? incoming.headers : [],
          rows: Array.isArray(incoming.rows) ? incoming.rows : [],
          filteredRows: [],
          loadedAt: incoming.loadedAt || new Date().toISOString(),
          rowCount: Array.isArray(incoming.rows) ? incoming.rows.length : 0,
          rawText: typeof incoming.rawText === "string" ? incoming.rawText : ""
        };
      }

      if (data.lineHaulInventory) {
        const linehaul = data.lineHaulInventory;
        NOL3.lineHaulInventory = {
          fileName: linehaul.fileName || "",
          files: Array.isArray(linehaul.files) ? linehaul.files : [],
          headers: Array.isArray(linehaul.headers) ? linehaul.headers : [],
          rows: Array.isArray(linehaul.rows) ? linehaul.rows : [],
          loadedAt: linehaul.loadedAt || new Date().toISOString(),
          rowCount: Array.isArray(linehaul.rows) ? linehaul.rows.length : 0,
          rawText: typeof linehaul.rawText === "string" ? linehaul.rawText : ""
        };
      }

      // Confirmed Incoming Linehaul arrivals are part of the Planning
      // calculation. Restore them together with inventory so Total Volume and
      // Town counts match across devices.
      if (Array.isArray(data.arrivedIncomingTasks)) {
        try {
          NOL3Storage.set(
            "nol3_incoming_arrived_tasks_v1",
            JSON.stringify(data.arrivedIncomingTasks)
          );
        } catch (_) {}
      }

      window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "lm", source: "cloud" } }));
      window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "incoming", source: "cloud" } }));
      window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "linehaul", source: "cloud" } }));

      try { if (typeof renderBusinessDayMetrics === "function") renderBusinessDayMetrics(); } catch (_) {}
      try { if (typeof renderOnFloorTowns === "function") renderOnFloorTowns(); } catch (_) {}
      try { if (typeof renderDeliveryAreas === "function") renderDeliveryAreas(); } catch (_) {}
      try { if (typeof renderIncomingOrders === "function") renderIncomingOrders(); } catch (_) {}
      try { if (typeof renderUnassignedOrders === "function") renderUnassignedOrders(); } catch (_) {}
      try { if (typeof renderParcelRecords === "function") renderParcelRecords(); } catch (_) {}
    }
  });

  const status = (text, good = null) => {
    let el = document.getElementById("nol3CloudStatus");
    if (!el) {
      el = document.createElement("div");
      el.id = "nol3CloudStatus";
      el.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:99999;padding:8px 12px;border-radius:999px;background:#111827;color:#fff;font:600 12px/1.2 Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:.92;pointer-events:none";
      document.body.appendChild(el);
    }
    el.textContent = `CLOUD • ${text} • ${egressLabel()}`;
    el.style.opacity = good === null ? ".92" : good ? "1" : ".78";
  };

  // Hardcoded so this device (and every future copy of this file) connects
  // automatically with no key-entry prompt. This is a Supabase *publishable*
  // key, which is safe to ship in client-side code by design (unlike a
  // secret/service_role key) — it's the same key that was previously typed
  // into the connect modal, just no longer requested at runtime.
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_mECx0rqIkWPy_QjPqNIVrw_z3Mv9H_R";

  const getSupabaseKey = () => SUPABASE_PUBLISHABLE_KEY;
  const configured = () => SUPABASE_URL.startsWith("https://") && !!getSupabaseKey();

  const api = async (path, options = {}) => {
    const supabaseKey = getSupabaseKey();
    if (!supabaseKey) throw new Error("Supabase publishable key has not been added yet.");
    const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: {
        apikey: supabaseKey,
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });
    const text = await response.text();
    trackEgress(text.length);
    if (!response.ok) throw new Error(`${response.status}: ${text || response.statusText}`);
    return text ? JSON.parse(text) : null;
  };

  function readIndexedDB() {
    return Promise.resolve(window.NOL3FileStore ? NOL3FileStore.getAll() : []);
  }

  function putIndexedDB(record) {
    return Promise.resolve().then(() => {
      if (window.NOL3FileStore && record && record.type) NOL3FileStore.put(record);
    });
  }

  function parseObject(raw, fallback) {
    try {
      const parsed = JSON.parse(raw || "");
      return parsed && typeof parsed === "object" ? parsed : fallback;
    } catch (_) { return fallback; }
  }

  function getHubState() {
    const hub = HUB_NAME;
    const layoutStore = parseObject(NOL3Storage.get("nol3_planning_layout_v1"), {});
    const exceptionStore = parseObject(NOL3Storage.get("nol3_planning_exceptions_v1:" + hub), []);
    const overrideStore = parseObject(NOL3Storage.get("nol3_zone_id_overrides_v1"), {});
    const zoneSettingsStore = parseObject(NOL3Storage.get("nol3_zone_settings_v1"), {});
    const planningByHub = layoutStore?.byHub && typeof layoutStore.byHub === "object"
      ? layoutStore.byHub
      : layoutStore;

    return {
      businessDate: NOL3Storage.get("nol3_business_day_date_v1") || "",
      businessDaySettings: NOL3Storage.get("nol3_business_day_settings_v1") || "",
      planningLayout: planningByHub?.[hub] || null,
      fleetProductivity: NOL3Storage.get("nol3_fleet_productivity_v1:" + hub) || NOL3Storage.get("nol3_fleet_productivity_v1") || "",
      planningExceptions: exceptionStore,
      zoneOverrides: overrideStore[hub] || {},
      zoneSettings: zoneSettingsStore[hub] || {},
      frozenTodayVolume: NOL3Storage.get("nol3_frozen_today_volume_v1") || "",
      weeklyDailySummary: NOL3Storage.get(`NOL3_WEEKLY_DAILY_SUMMARY_${hub}`) || "",
      fleetOverview: parseObject(NOL3Storage.get("nol3_fleet_overview_v1:" + hub), {})
    };
  }

  function applyHubState(state) {
    if (!state || typeof state !== "object") return;
    applyingRemote = true;
    try {
      if (state.businessDate) NOL3Storage.set("nol3_business_day_date_v1", String(state.businessDate));
      if (state.businessDaySettings) NOL3Storage.set("nol3_business_day_settings_v1", String(state.businessDaySettings));
      if (state.fleetOverview && typeof state.fleetOverview === "object") {
        NOL3Storage.set("nol3_fleet_overview_v1:" + HUB_NAME, JSON.stringify(state.fleetOverview));
      }
      if (state.fleetProductivity !== undefined && state.fleetProductivity !== "") {
        NOL3Storage.set("nol3_fleet_productivity_v1:" + HUB_NAME, String(state.fleetProductivity));
      }
      if (Array.isArray(state.planningExceptions)) {
        NOL3Storage.set("nol3_planning_exceptions_v1:" + HUB_NAME, JSON.stringify(state.planningExceptions));
      }
      if (state.planningLayout && typeof state.planningLayout === "object") {
        const store = parseObject(NOL3Storage.get("nol3_planning_layout_v1"), {});
        const byHub = store?.byHub && typeof store.byHub === "object"
          ? store.byHub
          : (Array.isArray(store) ? { __NO_HUB__: store } : store);
        const normalized = {
          version: 2,
          byHub: { ...(byHub || {}) }
        };
        normalized.byHub[HUB_NAME] = state.planningLayout;
        NOL3Storage.set("nol3_planning_layout_v1", JSON.stringify(normalized));
      }
      if (state.zoneOverrides && typeof state.zoneOverrides === "object") {
        const store = parseObject(NOL3Storage.get("nol3_zone_id_overrides_v1"), {});
        store[HUB_NAME] = state.zoneOverrides;
        NOL3Storage.set("nol3_zone_id_overrides_v1", JSON.stringify(store));
      }
      if (state.zoneSettings && typeof state.zoneSettings === "object") {
        const store = parseObject(NOL3Storage.get("nol3_zone_settings_v1"), {});
        store[HUB_NAME] = state.zoneSettings;
        NOL3Storage.set("nol3_zone_settings_v1", JSON.stringify(store));
      }
      if (state.weeklyDailySummary) {
        NOL3Storage.set(`NOL3_WEEKLY_DAILY_SUMMARY_${HUB_NAME}`, String(state.weeklyDailySummary));
      }
      if (state.frozenTodayVolume) {
        NOL3Storage.set("nol3_frozen_today_volume_v1", String(state.frozenTodayVolume));
      }
    } finally {
      applyingRemote = false;
    }
  }

  function stableHash(value) {
    try { return JSON.stringify(value); } catch (_) { return String(Date.now()); }
  }

  // ===== PROVIDER SWITCH =====
  // Hub data lives in Supabase and is mirrored to Firebase Realtime Database.
  // cloud-config.json (next to the hub pages on GitHub) decides who is active:
  //   { "provider": "supabase" | "firebase" | "auto",
  //     "firebaseUrl": "https://<db>.firebasedatabase.app",
  //     "mirror": true,
  //     "hubs": { "BAUKO": "firebase" } }      <- optional per-hub override
  // "auto" = Supabase, but a quota/limit error moves this device to Firebase
  // for 6 hours. With no firebaseUrl set, everything behaves as before.
  const CFG_KEY = "NOL3_CLOUD_CFG";
  const FAILOVER_KEY = `NOL3_CLOUD_FAILOVER_${HUB_CODE}`;
  const FAILOVER_MS = 6 * 3600 * 1000;
  let cloudCfg = (() => { try { return JSON.parse(localStorage.getItem(CFG_KEY) || "null") || {}; } catch (_) { return {}; } })();
  let cfgLoadedAt = 0;
  let lastActive = "";

  function wantedProvider() {
    return String((cloudCfg.hubs && cloudCfg.hubs[HUB_CODE]) || cloudCfg.provider || "supabase").toLowerCase();
  }
  function activeProvider() {
    try {
      const want = wantedProvider();
      if (!cloudCfg.firebaseUrl) return "supabase";
      if (want === "firebase") return "firebase";
      if (want === "auto" && Date.now() < Number(localStorage.getItem(FAILOVER_KEY) || 0)) return "firebase";
    } catch (_) {}
    return "supabase";
  }
  function mirrorName() {
    if (!cloudCfg.firebaseUrl || cloudCfg.mirror === false) return null;
    return activeProvider() === "supabase" ? "firebase" : "supabase";
  }

  const sbRaw = {
    async readStamps() {
      const rows = await api(`hub_data?hub_id=eq.${HUB_ID}&select=data_type,updated_at`);
      const map = {};
      (Array.isArray(rows) ? rows : []).forEach(r => { map[r.data_type] = Date.parse(r.updated_at) || 0; });
      return map;
    },
    async readRow(dataType) {
      const rows = await api(`hub_data?hub_id=eq.${HUB_ID}&data_type=eq.${encodeURIComponent(dataType)}&select=data,updated_at&limit=1`);
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    },
    async writeRow(dataType, data, updatedAt) {
      await api(`hub_data?on_conflict=hub_id,data_type`, {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ hub_id: HUB_ID, data_type: dataType, data, updated_at: updatedAt })
      });
    }
  };

  // Firebase layout: hub_stamps/<hub>/<type> = updated_at (tiny, polled),
  // hub_data/<hub>/<type> = { json: "<stringified data>", updated_at }.
  // Data is stored as a string so Firebase key rules / null / array quirks can't alter it.
  const fbBase = () => String(cloudCfg.firebaseUrl || "").replace(/\/+$/, "");
  async function fbFetch(path, options) {
    const response = await fetch(`${fbBase()}/${path}`, options);
    const text = await response.text();
    trackEgress(text.length);
    if (!response.ok) throw new Error(`${response.status}: ${text || response.statusText}`);
    return text ? JSON.parse(text) : null;
  }
  const fbRaw = {
    async readStamps() {
      const obj = await fbFetch(`hub_stamps/${HUB_ID}.json`);
      const map = {};
      Object.keys(obj || {}).forEach(k => { map[k] = Date.parse(obj[k]) || 0; });
      return map;
    },
    async readRow(dataType) {
      const row = await fbFetch(`hub_data/${HUB_ID}/${encodeURIComponent(dataType)}.json`);
      if (!row || typeof row.json !== "string") return null;
      return { data: JSON.parse(row.json), updated_at: row.updated_at };
    },
    async writeRow(dataType, data, updatedAt) {
      await fbFetch(`.json?print=silent`, {
        method: "PATCH",
        body: JSON.stringify({
          [`hub_data/${HUB_ID}/${dataType}`]: { json: JSON.stringify(data), updated_at: updatedAt },
          [`hub_stamps/${HUB_ID}/${dataType}`]: updatedAt
        })
      });
    }
  };

  function noteBackendError(name, error) {
    if (name !== "supabase" || wantedProvider() !== "auto" || !cloudCfg.firebaseUrl) return;
    if (/^(402|429)\b|quota|restricted|exceed/i.test(String(error && error.message))) {
      try { localStorage.setItem(FAILOVER_KEY, String(Date.now() + FAILOVER_MS)); } catch (_) {}
      invalidateStamps();
    }
  }
  function wrapBackend(name, raw) {
    const out = {};
    ["readStamps", "readRow", "writeRow"].forEach(k => {
      out[k] = async (...args) => {
        try { return await raw[k](...args); } catch (e) { noteBackendError(name, e); throw e; }
      };
    });
    return out;
  }
  const BACKENDS = { supabase: wrapBackend("supabase", sbRaw), firebase: wrapBackend("firebase", fbRaw) };
  const backendFor = name => BACKENDS[name] || BACKENDS.supabase;
  const activeBackend = () => backendFor(activeProvider());

  async function writeRowEverywhere(dataType, data, updatedAt) {
    await activeBackend().writeRow(dataType, data, updatedAt);           // must succeed
    const mirror = mirrorName();
    if (mirror) backendFor(mirror).writeRow(dataType, data, updatedAt).catch(() => {});   // best effort
  }

  // Newest copy wins, in both directions; at most one attempt per device per day.
  async function backfillMirror() {
    const mirror = mirrorName();
    if (!mirror) return;
    const key = `NOL3_CLOUD_BACKFILL_${HUB_CODE}`;
    const token = `${new Date().toISOString().slice(0, 10)}:${activeProvider()}:${fbBase()}`;
    try { if (localStorage.getItem(key) === token) return; localStorage.setItem(key, token); } catch (_) {}
    const act = backendFor(activeProvider()), oth = backendFor(mirror);
    const [a, b] = await Promise.all([act.readStamps(), oth.readStamps()]);
    for (const dt of new Set([...Object.keys(a), ...Object.keys(b)])) {
      const sa = a[dt] || 0, sb = b[dt] || 0;
      if (sa === sb) continue;
      const [from, to] = sa > sb ? [act, oth] : [oth, act];
      const row = await from.readRow(dt);
      if (row && row.data) await to.writeRow(dt, row.data, row.updated_at);
    }
  }

  async function loadCloudConfig() {
    try {
      const r = await fetch(`cloud-config.json?t=${Math.floor(Date.now() / 300000)}`, { cache: "no-store" });
      if (r.ok) {
        const j = await r.json();
        if (j && typeof j === "object") {
          cloudCfg = j;
          try { localStorage.setItem(CFG_KEY, JSON.stringify(j)); } catch (_) {}
        }
      }
    } catch (_) {}
    cfgLoadedAt = Date.now();
    const now = activeProvider();
    if (lastActive && now !== lastActive) { invalidateStamps(); backfillMirror().catch(() => {}); }
    lastActive = now;
  }
  async function refreshCloudConfigIfDue() {
    if (Date.now() - cfgLoadedAt > 300000) await loadCloudConfig();
  }
  // ===== /PROVIDER SWITCH =====

  // ===== EGRESS GUARD =====
  // 1) Polls ask Supabase only for updated_at (bytes); the big `data` column
  //    is downloaded only when updated_at actually changed.
  // 2) One tiny request covers all three channels.
  // 3) No polling while the tab is hidden; slower when nobody is touching it.
  // 4) A device never re-downloads a snapshot it just pushed itself.
  const POLL_ACTIVE_MS = 60000;   // tab visible and recently used
  const POLL_IDLE_MS = 120000;    // tab visible but untouched for 5+ min
  const IDLE_AFTER_MS = 300000;
  let lastActivityAt = Date.now();
  ["pointerdown", "keydown", "touchstart"].forEach(ev =>
    window.addEventListener(ev, () => { lastActivityAt = Date.now(); }, { passive: true, capture: true }));

  const EGRESS_KEY = `NOL3_CLOUD_EGRESS_${HUB_CODE}`;
  function readEgress() {
    const day = new Date().toISOString().slice(0, 10);
    try {
      const raw = JSON.parse(localStorage.getItem(EGRESS_KEY) || "{}");
      return raw.day === day ? raw : { day, bytes: 0, requests: 0 };
    } catch (_) { return { day, bytes: 0, requests: 0 }; }
  }
  function trackEgress(chars) {
    try {
      const u = readEgress();
      u.bytes += chars; u.requests += 1;
      localStorage.setItem(EGRESS_KEY, JSON.stringify(u));
    } catch (_) {}
  }
  function egressLabel() {
    const u = readEgress();
    const tag = activeProvider() === "firebase" ? "FIREBASE • " : "";
    return tag + (u.bytes ? `↓ ${(u.bytes / 1048576).toFixed(u.bytes < 10485760 ? 2 : 1)} MB today` : "↓ 0 MB today");
  }

  let stampsCache = { at: 0, promise: null };
  function invalidateStamps() { stampsCache = { at: 0, promise: null }; }
  function getRemoteStamps(force) {
    const now = Date.now();
    if (!force && stampsCache.promise && now - stampsCache.at < 4000) return stampsCache.promise;
    const p = activeBackend().readStamps();
    stampsCache = { at: now, promise: p };
    p.catch(() => { if (stampsCache.promise === p) invalidateStamps(); });
    return p;
  }

  async function pollCycle() {
    if (document.hidden) return;
    await refreshCloudConfigIfDue();
    await syncSettingsAndRoster();
    await syncFiles();
  }
  function startAdaptivePolling() {
    const loop = () => {
      const idle = Date.now() - lastActivityAt > IDLE_AFTER_MS;
      setTimeout(async () => {
        try { await pollCycle(); } catch (_) {}
        loop();
      }, idle ? POLL_IDLE_MS : POLL_ACTIVE_MS);
    };
    loop();
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) { lastActivityAt = Date.now(); pollCycle().catch(() => {}); }
    });
  }
  // ===== /EGRESS GUARD =====

  // ===== PAYLOAD SLIM =====
  // The files snapshot used to carry the same rows 3x (rows + rawText +
  // filteredRows). Receivers never read rawText after a cloud restore and
  // rebuild filteredRows themselves, so neither is uploaded any more. What is
  // left is gzip-compressed (base64 inside the existing jsonb column).
  // Old uncompressed rows are still read fine.
  function slimFilesSnapshot(s) {
    if (!s || typeof s !== "object") return s;
    const out = { ...s };
    for (const k of ["lmInventory", "incomingInventory", "lineHaulInventory"]) {
      const v = out[k];
      if (!v || typeof v !== "object") continue;
      const c = { ...v };
      delete c.filteredRows;
      c.rawText = "";
      if (Array.isArray(c.files)) c.files = c.files.map(f => (f && typeof f === "object") ? { name: f.name, lastModified: f.lastModified || 0 } : f);
      out[k] = c;
    }
    return out;
  }

  function deriveFilteredRows(inv) {
    const hub = String((NOL3.getState && NOL3.getState().selectedHub) || HUB_NAME).trim().toLowerCase();
    const headers = (inv.headers || []).map(h => String(h || "").trim().toLowerCase());
    const ci = headers.indexOf("current station");
    if (ci < 0) return [];
    return (inv.rows || []).filter(r => String(r?.[ci] ?? "").trim().toLowerCase() === hub);
  }

  async function packSnapshot(obj) {
    const json = JSON.stringify(obj);
    const stream = new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));
    const buf = new Uint8Array(await new Response(stream).arrayBuffer());
    let bin = "";
    for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return { z: 1, clientUpdatedAt: obj.clientUpdatedAt || 0, clearedByUser: obj.clearedByUser === true, gz: btoa(bin) };
  }

  async function unpackSnapshot(data) {
    if (!data || data.z !== 1 || typeof data.gz !== "string") return data;   // legacy plain row
    const bin = atob(data.gz);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(stream).text());
  }

  async function encodeForUpload(channel, data) {
    if (channel === filesChannel) data = slimFilesSnapshot(data);
    if (channel !== settingsChannel && typeof CompressionStream === "function") {
      try { return await packSnapshot(data); } catch (e) { console.warn("NOL3 cloud: compression failed, sending plain", e); }
    }
    return data;
  }
  // ===== /PAYLOAD SLIM =====

  async function readRemoteFor(channel) {
    const row = await activeBackend().readRow(channel.dataType);
    if (row && row.data) row.data = await unpackSnapshot(row.data);
    return row;
  }

  // Postgres/Supabase's jsonb columns reject the \u0000 (NUL) escape sequence
  // outright ("unsupported Unicode escape sequence", code 22P05). If any
  // stored data (e.g. a file read as text before the NUL-stripping fix, or
  // anything else) still contains a literal NUL character, JSON.stringify
  // will emit \u0000 for it and Supabase will reject the whole push. Strip
  // NULs recursively right before sending as a defensive backstop.
  function stripNulCharacters(value) {
    if (typeof value === "string") return value.replace(/\u0000/g, "");
    if (Array.isArray(value)) return value.map(stripNulCharacters);
    if (value && typeof value === "object") {
      const out = {};
      for (const key of Object.keys(value)) out[key] = stripNulCharacters(value[key]);
      return out;
    }
    return value;
  }

  async function pushSnapshotFor(channel, snapshot) {
    const payload = {
      hub_id: HUB_ID,
      data_type: channel.dataType,
      data: await encodeForUpload(channel, stripNulCharacters(snapshot)),
      updated_at: new Date().toISOString()
    };
    await writeRowEverywhere(payload.data_type, payload.data, payload.updated_at);
    try {
      invalidateStamps();
      const stamps = await getRemoteStamps(true);
      channel.lastStamp = stamps[channel.dataType] || 0;
    } catch (_) {}
  }

  async function restoreIndexedDB(records) {
    if (!Array.isArray(records)) return;
    const restoredTypes = new Set();
    for (const record of records) {
      if (record && record.type) {
        await putIndexedDB(record);
        restoredTypes.add(record.type);
      }
    }
    if (restoredTypes.has("riders")) {
      window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "riders", data: NOL3FileStore.get("riders") } }));
    }
    if (restoredTypes.has("unifiedInventory")) {
      const rec = NOL3FileStore.get("unifiedInventory");
      if (rec?.dataset) {
        NOL3.lmInventory = {
          files: rec.files || [],
          fileName: rec.dataset.fileName || "",
          headers: rec.dataset.headers || [],
          rows: rec.dataset.lmRows || [],
          filteredRows: [],
          loadedAt: rec.dataset.loadedAt || "",
          rowCount: Array.isArray(rec.dataset.lmRows) ? rec.dataset.lmRows.length : 0
        };
        NOL3.incomingInventory = {
          files: rec.files || [],
          fileName: rec.dataset.fileName || "",
          headers: rec.dataset.headers || [],
          rows: rec.dataset.incomingRows || [],
          filteredRows: [],
          rawText: rec.dataset.rawText || "",
          loadedAt: rec.dataset.loadedAt || "",
          rowCount: Array.isArray(rec.dataset.incomingRows) ? rec.dataset.incomingRows.length : 0
        };
        try { if (typeof filterLMForHub === "function") filterLMForHub(NOL3.lmInventory); } catch (_) {}
        window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "lm", data: NOL3.lmInventory } }));
        window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "incoming", data: NOL3.incomingInventory } }));
        window.dispatchEvent(new CustomEvent("unifiedinventoryloaded", { detail: { fileName: rec.dataset.fileName || "", rowCount: Array.isArray(rec.dataset.rows) ? rec.dataset.rows.length : 0 } }));
      }
    }
  }

  function snapshotHasData(channel, snapshot) {
    try {
      if (!snapshot) return false;
      if (channel === rosterChannel) {
        const r = snapshot.riderData;
        return !!(r && ((Array.isArray(r.rows) && r.rows.length) || r.fileName || r.rawText));
      }
      if (channel === filesChannel) {
        const has = v => !!(v && ((Array.isArray(v.rows) && v.rows.length) || v.fileName || v.rawText));
        return has(snapshot.lmInventory) || has(snapshot.incomingInventory) || has(snapshot.lineHaulInventory);
      }
      return !!snapshot.localState;
    } catch (_) { return false; }
  }

  function mergeFilesSnapshotPreservingRemote(local, remote) {
    if (!local || !remote) return local;
    const has = v => !!(v && ((Array.isArray(v.rows) && v.rows.length) || v.fileName || v.rawText));
    const merged = { ...local };
    for (const key of ["lmInventory", "incomingInventory", "lineHaulInventory"]) {
      if (!has(local[key]) && has(remote[key])) merged[key] = remote[key];
    }
    if ((!Array.isArray(local.arrivedIncomingTasks) || local.arrivedIncomingTasks.length === 0) &&
        Array.isArray(remote.arrivedIncomingTasks) && remote.arrivedIncomingTasks.length) {
      merged.arrivedIncomingTasks = remote.arrivedIncomingTasks;
    }
    return merged;
  }

  async function initialSyncChannel(channel) {
    const remote = await readRemoteFor(channel);
    channel.lastStamp = remote ? (Date.parse(remote.updated_at) || 0) : 0;
    let local = await channel.buildSnapshot();
    const savedRemoteTime = Number(localStorage.getItem(channel.metaKey) || 0);

    // NEVER create or overwrite a cloud row with an empty startup snapshot.
    // A refresh starts with empty in-memory upload objects; those are not a
    // user action and must wait for the cloud copy to be restored.
    if (!remote || !remote.data) {
      // Startup is read/restore only. Never auto-save local startup state.
      // An explicit upload or SAVE DATA action is required to create cloud data.
      channel.initialized = true;
      channel.lastHash = stableHash(local);
      channel.lastRemoteUpdatedAt = 0;
      channel.lastLocalMutationAt = 0;
      return false;
    }

    const remoteSnapshot = remote.data;
    const remoteTime = Number(remoteSnapshot?.clientUpdatedAt || new Date(remote.updated_at || 0).getTime() || 0);
    const localTime = Math.max(savedRemoteTime, channel.lastLocalMutationAt || 0);

    // A deliberate Clear is an authoritative empty snapshot. Never merge old
    // browser-local uploads back into it.
    if (channel === filesChannel && remoteSnapshot?.clearedByUser === true) {
      await channel.applyRemote(remoteSnapshot);
      channel.lastRemoteUpdatedAt = remoteTime;
      channel.lastLocalMutationAt = remoteTime;
      try { localStorage.setItem(channel.metaKey, String(remoteTime)); } catch (_) {}
      channel.lastHash = stableHash(await channel.buildSnapshot());
      channel.initialized = true;
      return true;
    }
    const localHasData = snapshotHasData(channel, local);
    const remoteHasData = snapshotHasData(channel, remoteSnapshot);

    // Refresh-safe rule: if the browser has no meaningful data, cloud wins
    // regardless of remembered timestamps. This is the key protection against
    // refresh wiping uploaded files or riders.
    if (remoteHasData && !localHasData) {
      await channel.applyRemote(remoteSnapshot);
      channel.lastRemoteUpdatedAt = remoteTime;
      channel.lastLocalMutationAt = remoteTime;
      localStorage.setItem(channel.metaKey, String(remoteTime));
      channel.lastHash = stableHash(await channel.buildSnapshot());
      channel.initialized = true;
      return true;
    }

    // If both sides contain data, prefer a newer cloud version.
    if (remoteHasData && remoteTime > localTime) {
      await channel.applyRemote(remoteSnapshot);
      channel.lastRemoteUpdatedAt = remoteTime;
      channel.lastLocalMutationAt = remoteTime;
      localStorage.setItem(channel.metaKey, String(remoteTime));
      channel.lastHash = stableHash(await channel.buildSnapshot());
      channel.initialized = true;
      return true;
    }

    // If the local files snapshot is only partially populated (for example
    // the user uploaded Incoming but not LM after opening a fresh page),
    // preserve the other cloud datasets instead of replacing them with null.
    if (channel === filesChannel && remoteHasData) {
      local = mergeFilesSnapshotPreservingRemote(local, remoteSnapshot);
    }

    // Local data is authoritative only when it was actually present at
    // startup or the cloud is empty. Never push a completely empty snapshot.
    channel.lastRemoteUpdatedAt = remoteTime;
    channel.lastLocalMutationAt = localTime;
    // Do not auto-push a local difference during startup. The user must click
    // SAVE DATA (or perform an explicit upload) to write local changes to cloud.
    localStorage.setItem(channel.metaKey, String(remoteTime || localTime || 0));
    channel.lastHash = stableHash(await channel.buildSnapshot());
    channel.initialized = true;
    return false;
  }

  async function initialSync() {
    status("CONNECTING…");
    // Each channel is synced independently: if one channel's push/read times
    // out or errors, the other two still get their chance. Previously a
    // single failed channel (e.g. a slow settings row) aborted this whole
    // function, which left every channel's `initialized` flag false — and
    // since the periodic sync loops refuse to run until a channel is
    // initialized, one bad sync used to permanently disable syncing for the
    // rest of the session (all 26 hubs, on any device) until the page was
    // manually reloaded. Each channel is now retried independently instead.
    const results = await Promise.allSettled([
      initialSyncChannel(settingsChannel),
      initialSyncChannel(rosterChannel),
      initialSyncChannel(filesChannel)
    ]);
    const failures = results.filter(r => r.status === "rejected");
    const anyReloaded = results.some(r => r.status === "fulfilled" && r.value === true);
    failures.forEach(r => console.error("NOL3 cloud initial sync failed for a channel:", r.reason));

    if (failures.length === 0) {
      status("CONNECTED • SYNCED", true);
    } else if (failures.length < results.length) {
      status("PARTIALLY SYNCED • RETRYING", false);
    } else {
      const message = String(failures[0].reason?.message || failures[0].reason || "");
      status(/^(400|401|403):/.test(message) ? "KEY REJECTED BY SUPABASE • CHECK KEY" : "ERROR • CHECK SUPABASE", false);
    }
    if (anyReloaded) {
      try {
        if (typeof NOL3.renderPage === "function") NOL3.renderPage(NOL3.state?.currentPage || "planning");
      } catch (_) {}
    }
  }

  async function ensureChannelInitialized(channel) {
    if (channel.initialized) return;
    try {
      await initialSyncChannel(channel);
    } catch (error) {
      console.error("NOL3 cloud sync: retrying channel init failed", channel.dataType, error);
    }
  }

  async function syncChannelOnce(channel, allowPush = false) {
    if (channel.syncing || !configured() || applyingRemote) return false;
    if (!channel.initialized) {
      // Self-heal: a channel that failed its first sync attempt (e.g. a
      // statement timeout) gets retried on every subsequent poll instead of
      // being permanently skipped for the rest of the session.
      await ensureChannelInitialized(channel);
      if (!channel.initialized) return false;
    }
    channel.syncing = true;
    try {
      const local = await channel.buildSnapshot();
      const currentHash = stableHash(local);
      if (
        currentHash !== channel.lastHash &&
        allowPush &&
        (snapshotHasData(channel, local) || channel.allowEmptyPush) &&
        !(channel === filesChannel && channel.lastRemoteClearedByUser && !snapshotHasData(channel, local))
      ) {
        if (channel === filesChannel && snapshotHasData(channel, local)) {
          channel.lastRemoteClearedByUser = false;
        }
        channel.lastLocalMutationAt = Date.now();
        local.clientUpdatedAt = channel.lastLocalMutationAt;
        if (channel === filesChannel) channel.lastRemoteClearedByUser = false;
        await pushSnapshotFor(channel, local);
        channel.lastHash = stableHash(await channel.buildSnapshot());
        channel.lastRemoteUpdatedAt = channel.lastLocalMutationAt;
        localStorage.setItem(channel.metaKey, String(channel.lastLocalMutationAt));
      }

      const stamps = await getRemoteStamps();
      const stamp = stamps[channel.dataType] || 0;
      if (!stamp || stamp === channel.lastStamp) return false;   // unchanged: no download

      const remote = await readRemoteFor(channel);
      const remoteStamp = remote ? (Date.parse(remote.updated_at) || stamp) : stamp;
      if (remote?.data) {
        const remoteTime = Number(remote.data.clientUpdatedAt || new Date(remote.updated_at || 0).getTime() || 0);
        if (remoteTime > channel.lastRemoteUpdatedAt && remoteTime > channel.lastLocalMutationAt) {
          await channel.applyRemote(remote.data);
          channel.lastRemoteUpdatedAt = remoteTime;
          channel.lastLocalMutationAt = remoteTime;
          localStorage.setItem(channel.metaKey, String(remoteTime));
          channel.lastHash = stableHash(await channel.buildSnapshot());
          channel.lastStamp = remoteStamp;
          return true;
        }
      }
      channel.lastStamp = remoteStamp;
      return false;
    } finally {
      channel.syncing = false;
    }
  }

  async function syncSettingsAndRoster(allowPush = false) {
    try {
      const a = await syncChannelOnce(settingsChannel, allowPush);
      const b = await syncChannelOnce(rosterChannel, allowPush);
      status(a || b ? "SYNCED • CLOUD UPDATE" : "CONNECTED • LIVE", true);
      if (a || b) {
        try {
          if (typeof NOL3.renderPage === "function") NOL3.renderPage(NOL3.state?.currentPage || "planning");
        } catch (_) {}
      }
    } catch (error) {
      console.error("NOL3 cloud sync failed:", error);
      status("OFFLINE • RETRYING", false);
    }
  }

  async function syncFiles(allowPush = false) {
    try {
      const reload = await syncChannelOnce(filesChannel, allowPush);
      if (reload) {
        try {
          if (typeof NOL3.renderPage === "function") NOL3.renderPage(NOL3.state?.currentPage || "planning");
        } catch (_) {}
      }
    } catch (error) {
      console.error("NOL3 cloud file sync failed:", error);
    }
  }

  // Kept for any code elsewhere that calls window.NOL3CloudSync.syncNow().
  async function syncOnce() {
    try {
      await syncChannelOnce(settingsChannel, true);
      await syncChannelOnce(rosterChannel, true);
      await syncChannelOnce(filesChannel, true);
      status("SAVED • CLOUD", true);
    } catch (error) {
      console.error("NOL3 manual cloud save failed:", error);
      status("SAVE FAILED", false);
      throw error;
    }
  }

  function schedulePushCheck(channel, runner) {
    clearTimeout(channel.pushTimer);
    channel.pushTimer = setTimeout(() => runner(), channel.debounceMs);
  }

  async function clearUploadedFilesCloud() {
    const emptySnapshot = {
      version: 4,
      hubId: HUB_ID,
      hubName: HUB_NAME,
      hubCode: HUB_CODE,
      clientUpdatedAt: Date.now(),
      clearedAt: Date.now(),
      clearedByUser: true,
      lmInventory: {
        fileName: "", files: [], headers: [], rows: [], filteredRows: [], rawText: "", loadedAt: ""
      },
      incomingInventory: {
        fileName: "", files: [], headers: [], rows: [], filteredRows: [], rawText: "", loadedAt: ""
      },
      lineHaulInventory: {
        fileName: "", files: [], headers: [], rows: [], filteredRows: [], rawText: "", loadedAt: ""
      },
      arrivedIncomingTasks: []
    };

    await pushSnapshotFor(filesChannel, emptySnapshot);
    filesChannel.initialized = true;
    filesChannel.lastHash = stableHash(emptySnapshot);
    filesChannel.lastRemoteUpdatedAt = emptySnapshot.clientUpdatedAt;
    filesChannel.lastLocalMutationAt = emptySnapshot.clientUpdatedAt;
    filesChannel.lastRemoteClearedByUser = true;
    try { localStorage.setItem(filesChannel.metaKey, String(emptySnapshot.clientUpdatedAt)); } catch (_) {}
    return emptySnapshot;
  }

  window.NOL3CloudSync = {
    syncNow: syncOnce,
    clearUploadedFilesCloud,
    usage: readEgress,
    provider: activeProvider,
    hubId: HUB_ID,
    hubName: HUB_NAME,
    hubCode: HUB_CODE
  };

  window.addEventListener("load", function () {
    // This HTML is the San Nicolas Hub copy: lock the visible hub selection to San Nicolas Hub.
    setTimeout(() => {
      // Ask only when no key is saved. If a saved key is rejected by Supabase,
      // initialSync() clears it and asks again.
      try {
        if (NOL3?.state) NOL3.state.selectedHub = HUB_NAME;
        NOL3Storage.set("nol3_selected_hub", HUB_NAME);
        if (typeof NOL3.renderTopbar === "function") NOL3.renderTopbar();
        const label = document.getElementById("hubPickerLabel");
        const picker = document.getElementById("hubPickerBtn");
        if (label) label.textContent = HUB_NAME;
        if (picker) {
          picker.disabled = true;
          picker.setAttribute("aria-disabled", "true");
          picker.style.cursor = "default";
        }
        if (typeof NOL3.renderPage === "function") NOL3.renderPage(NOL3.state.currentPage || "planning");
      } catch (e) { console.warn("NOL3: Could not lock San Nicolas Hub UI", e); }

      // Every fresh page load starts on today's Philippines business date.
      try {
        const today = typeof getNOL3TodayDate === "function" ? getNOL3TodayDate() : new Date().toISOString().slice(0,10);
        NOL3.currentBusinessDate = today;
        NOL3Storage.set("nol3_business_day_date_v1", today);
      } catch (_) {}
      loadCloudConfig().then(() => initialSync()).then(() => { startAdaptivePolling(); backfillMirror().catch(() => {}); });
    }, 1200);
  });

  // Catch changes that use the existing storage adapter. IndexedDB changes are
  // also detected by each channel's own periodic snapshot hash, but scheduling
  // an immediate check here makes edits show up on other devices without
  // waiting for the next poll.
  window.addEventListener("hubchange", () => {
    const hub = (NOL3.getState && NOL3.getState().selectedHub) || HUB_NAME;
    const savedRider = window.NOL3RiderHubStore?.load?.(hub);
    if (savedRider) {
      NOL3.riderData = savedRider;
      window.dispatchEvent(new CustomEvent("inventoryloaded", { detail: { type: "riders", source: "hub-local" } }));
    } else {
      NOL3.riderData = null;
    }
  });
  // Auto-save local changes after the initial cloud restore has completed.
  // Cloud-originated events are ignored so a remote restore cannot immediately
  // echo itself back as a new local version.
  window.addEventListener("planningchanged", (event) => {
    if (applyingRemote || event?.detail?.source === "cloud") return;
    schedulePushCheck(settingsChannel, () => syncSettingsAndRoster(true));
  });

  window.addEventListener("zonesettingschanged", (event) => {
    if (applyingRemote || event?.detail?.source === "cloud") return;
    schedulePushCheck(settingsChannel, () => syncSettingsAndRoster(true));
  });

  window.addEventListener("businessdatechange", (event) => {
    if (applyingRemote || event?.detail?.source === "cloud") return;
    schedulePushCheck(settingsChannel, () => syncSettingsAndRoster(true));
  });

  window.addEventListener("inventoryloaded", (event) => {
    if (applyingRemote || event?.detail?.source === "cloud" || event?.detail?.source === "hub-local") return;
    const type = event?.detail?.type;
    if (type === "riders") {
      schedulePushCheck(rosterChannel, () => syncSettingsAndRoster(true));
    } else if (type === "lm" || type === "incoming" || type === "linehaul") {
      // Historical/date-switch restores are LOCAL views of a saved snapshot.
      // They must NEVER overwrite the shared current operational dataset in
      // Supabase. Only a real upload (or an explicit clear) may push files.
      if (event?.detail?.historical === true || event?.detail?.source === "historical") return;
      // A real upload intentionally supersedes the previous Clear tombstone.
      filesChannel.lastRemoteClearedByUser = false;
      schedulePushCheck(filesChannel, () => syncFiles(true));
    }
  });

  window.addEventListener("inventorycleared", (event) => {
    if (applyingRemote || event?.detail?.source === "cloud") return;
    schedulePushCheck(filesChannel, () => syncFiles(true));
  });
})();
</script>
