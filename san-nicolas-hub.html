<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOL3 Planning Dashboard V19</title>
<style>
:root{
  --bg:#f5f7fb;
  --panel:#fff;
  --text:#172033;
  --muted:#718096;
  --line:#e5e9f2;
  --accent:#2563eb;
  --accent-soft:#eaf1ff;
  --sidebar:#101828;
  --sidebar-text:#cbd5e1;
  --sidebar-hover:#1d2939;
  --shadow:0 10px 30px rgba(16,24,40,.08);
  --radius:16px;
}

*{box-sizing:border-box}

html{zoom:80%;}

html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--text)}

button,input,select{font:inherit}

button{cursor:pointer}

.app-shell{display:flex;min-height:100vh}

.sidebar{
  width:270px;
  flex-shrink:0;
  background:var(--sidebar);
  color:#fff;
  display:flex;
  flex-direction:column;
  transition:width .2s ease;
}

.sidebar.collapsed{width:78px}

.main{min-width:0;flex:1}

.topbar{
  min-height:68px;
  height:auto;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:10px 28px;
  box-sizing:border-box;
}
.topbar-left{min-width:0;flex:0 0 auto}
.topbar-business-controls{display:flex;align-items:flex-end;justify-content:flex-end;gap:10px;flex-wrap:wrap;min-width:0;flex:1}
.topbar-business-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.topbar-business-label{font-size:9px;font-weight:850;letter-spacing:1.4px;color:var(--muted);line-height:1}
.topbar-business-date{width:160px;height:32px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font-size:12px;font-weight:750;padding:0 9px;box-sizing:border-box}
.topbar-business-hour{width:78px;height:32px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font-size:12px;font-weight:750;padding:0 9px;box-sizing:border-box}
.topbar-business-now{height:32px;border:1px solid var(--line);border-radius:6px;background:#f8fafc;color:var(--text);font-size:10px;font-weight:850;padding:0 12px;cursor:pointer}
.topbar-business-now:hover{border-color:#b8cdf8;background:#eef4ff}
.topbar-save-data{height:32px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font-size:10px;font-weight:850;padding:0 12px;cursor:pointer;white-space:nowrap}.topbar-save-data:hover{border-color:#b8cdf8;background:#eef4ff}.topbar-save-data.saved{background:#f0fdf4;border-color:#86efac;color:#166534}
.topbar-business-status{display:none}
@media(max-width:980px){.topbar{align-items:flex-start}.topbar-business-controls{justify-content:flex-start}.topbar-business-date{width:145px}}

.content{padding:28px}

.page{display:none}
.page.active{display:block}

@media(max-width:700px){
  .sidebar{width:78px}
  .sidebar .nav-label,
  .sidebar .brand-text,
  .sidebar .hub-label,
  .sidebar .hub-select,
  .sidebar .collapse-btn span{display:none}
  .sidebar .brand{justify-content:center;padding:0}
  .sidebar .nav-item{justify-content:center}
  .sidebar .hub-box{padding:8px 10px 10px}
  .sidebar .hub-row{justify-content:center}
  .topbar{padding:0 18px}
  .content{padding:18px}
}

@media(max-width:480px){
  .topbar{height:auto;padding:14px 16px}
  .content{padding:14px}
}

.brand{
  height:76px;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:11px;
  background:#2563eb;
  display:grid;
  place-items:center;
  font-weight:800;
  flex-shrink:0;
}

.brand-text{font-weight:800;font-size:18px;white-space:nowrap}

.sidebar.collapsed .brand{
  justify-content:center;
  padding:0;
}
.sidebar.collapsed .brand-text{display:none}

.sidebar.collapsed .hub-label{display:none}
.sidebar.collapsed .hub-picker{display:none}
.sidebar.collapsed .hub-box{padding:8px 10px 10px}
.sidebar.collapsed .hub-row{justify-content:center}
.sidebar.collapsed .add-hub{display:flex;align-items:center;justify-content:center}

.hub-box{
  padding:8px 14px 9px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.hub-label{
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#98a2b3;
  margin:0 0 4px 6px;
}

.hub-row{display:flex;gap:4px;align-items:center}

.hub-select{
  min-width:0;
  flex:1;
  background:#1a2535;
  border:1px solid #334155;
  color:white;
  border-radius:7px;
  padding:5px 8px;
  outline:none;
  height:30px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
  transition:.18s ease;
  font-size:12px;
}

.hub-select:hover{background:#1d2939;border-color:#3f4f65}
.hub-select:focus{border-color:#4b6cb7;box-shadow:0 0 0 2px rgba(37,99,235,.12)}

/* Custom hub dropdown: each hub has its own delete button */
.hub-picker{position:relative;flex:1;min-width:0}
.hub-picker-btn{
  width:100%;height:30px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:#1a2535;border:1px solid #334155;color:#fff;border-radius:7px;padding:5px 8px;
  font-size:12px;cursor:pointer;text-align:left;outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);transition:.18s ease;
}
.hub-picker-btn:hover,.hub-picker.open .hub-picker-btn{background:#1d2939;border-color:#4b6cb7}
.hub-picker-arrow{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #cbd5e1;display:block;flex:0 0 auto;transition:transform .18s ease}
.hub-picker.open .hub-picker-arrow{transform:rotate(180deg)}
.hub-picker-menu{
  position:absolute;left:0;right:0;top:34px;z-index:10000;display:none;
  background:#172235;border:1px solid #3b4758;box-shadow:0 8px 18px rgba(0,0,0,.28);
  max-height:220px;overflow:auto;
}
.hub-picker.open .hub-picker-menu{display:block}
.hub-picker-option{
  display:flex;align-items:center;gap:6px;min-height:36px;padding:0 6px 0 10px;
  color:#fff;font-size:12px;background:#172235;
}
.hub-picker-option:hover{background:#243a5c}
.hub-picker-option.selected{background:#2167c9}
.hub-picker-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:9px 0}
.hub-delete-btn{
  width:26px;height:26px;flex:0 0 26px;border:0;border-radius:5px;
  background:#dc2626;color:#fff;font-size:15px;line-height:1;cursor:pointer;
}
.hub-delete-btn:hover{background:#ef4444}
.hub-picker-empty{padding:10px;color:#98a2b3;font-size:12px}

.add-hub{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border:0;
  border-radius:7px;
  background:#2563eb;
  color:white;
  font-size:16px;
  line-height:1;
  box-shadow:0 1px 2px rgba(0,0,0,.15);
  transition:.18s ease;
}
.add-hub:hover{background:#3478ee;transform:translateY(-1px)}
.remove-hub{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border:0;
  border-radius:7px;
  background:#dc2626;
  color:white;
  font-size:18px;
  line-height:1;
  box-shadow:0 1px 2px rgba(0,0,0,.15);
  transition:.18s ease;
}
.remove-hub:hover{background:#b91c1c;transform:translateY(-1px)}
.remove-hub:disabled{opacity:.45;cursor:not-allowed;transform:none;background:#64748b}

.nav{
  padding:14px 10px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.nav-item{
  display:flex;
  align-items:center;
  gap:13px;
  border:0;
  background:transparent;
  color:var(--sidebar-text);
  padding:12px 13px;
  border-radius:11px;
  width:100%;
  text-align:left;
  font-size:14px;
}

.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:#1f3a67;color:#fff}
.nav-icon{width:24px;text-align:center;font-size:17px;flex-shrink:0}
.nav-label{white-space:nowrap}

.sidebar.collapsed .nav-item{justify-content:center}
.sidebar.collapsed .nav-label{display:none}

.sidebar-bottom{margin-top:auto;padding:12px 10px}

.collapse-btn{
  width:100%;
  border:1px solid rgba(255,255,255,.1);
  background:transparent;
  color:#cbd5e1;
  border-radius:11px;
  padding:11px;
}
.sidebar.collapsed .collapse-btn span{display:none}

.page-title{font-size:21px;font-weight:750}
.subtle{font-size:13px;color:var(--muted);margin-top:3px}

.header-badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent);
  font-size:12px;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}

.metric-label{color:var(--muted);font-size:13px}
.metric{font-size:30px;font-weight:800;margin-top:8px}

.section-title{margin:0 0 16px;font-size:18px}

.table-card{margin-top:22px}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:#667085;font-weight:650}

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent);
  font-size:12px;
  font-weight:700;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:18px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:var(--accent);
  color:#fff;
  font-weight:650;
}

.btn.secondary{background:#eef2f7;color:#344054}

.dropzone{
  border:2px dashed #cbd5e1;
  border-radius:16px;
  padding:50px 24px;
  text-align:center;
  background:#fbfcfe;
  color:#64748b;
}

.dropzone strong{display:block;color:#344054;margin-bottom:8px}

.instruction{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.instruction .card h3{margin-top:0}

.modal-wrap{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.48);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
  padding:20px;
}

.modal-wrap.show{display:flex}

.modal{
  width:min(430px,100%);
  background:#fff;
  border-radius:18px;
  box-shadow:0 24px 70px rgba(0,0,0,.2);
  padding:22px;
}

.modal h2{margin:0 0 14px}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-bottom:16px;
}

.field label{font-size:13px;font-weight:650}

.field input{
  padding:11px;
  border:1px solid #d0d5dd;
  border-radius:10px;
  outline:none;
}

.modal-actions{display:flex;justify-content:flex-end;gap:8px}

.empty-state{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
}

@media(max-width:1000px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:700px){
  .instruction{grid-template-columns:1fr}
}

@media(max-width:480px){
  .grid{grid-template-columns:1fr}
}


/* Inventory upload workspace — app palette */
.inventory-page{
  background:var(--bg);
  padding:0;
  min-height:calc(100vh - 68px);
}
.inventory-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:16px;
}
.inventory-card{
  position:relative;
  min-height:282px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  color:var(--text);
  overflow:hidden;
}
.inventory-card::before,
.inventory-card::after{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  border-color:var(--accent);
  pointer-events:none;
}
.inventory-card::before{
  top:-1px; left:-1px;
  border-top:2px solid var(--accent);
  border-left:2px solid var(--accent);
}
.inventory-card::after{
  right:-1px; bottom:-1px;
  border-right:2px solid var(--accent);
  border-bottom:2px solid var(--accent);
}
.inventory-title{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 10px;
  color:var(--text);
  font-size:15px;
  letter-spacing:.02em;
  font-weight:800;
}
.inventory-title .inventory-icon{
  color:var(--accent);
  font-size:17px;
}
.inventory-help{
  margin:0 0 12px;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}
.upload-zone{
  border:1px dashed #cbd5e1;
  background:#fbfcfe;
  min-height:104px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--muted);
  padding:18px;
  cursor:pointer;
  border-radius:10px;
  transition:.18s ease;
}
.upload-zone:hover,
.upload-zone.dragover{
  border-color:#93b4f5;
  background:var(--accent-soft);
}
.upload-zone .upload-icon{
  font-size:23px;
  margin-bottom:8px;
  color:#94a3b8;
}
.upload-zone strong{
  color:#667085;
  font-size:14px;
  font-weight:500;
}
.file-summary{
  margin-top:9px;
  font-size:12px;
  color:var(--muted);
  min-height:16px;
}
.file-list{
  margin:9px 0 0;
  padding:0;
  list-style:none;
  color:#667085;
  font-size:12px;
  max-height:72px;
  overflow:auto;
}
.file-list li{
  padding:3px 0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.incoming-files{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.incoming-slot .upload-zone{
  min-height:106px;
}
.inventory-clear-btn{
  width:100%;
  margin-top:10px;
  border:1px solid #d0d5dd;
  background:#fff;
  color:#b42318;
  padding:9px 12px;
  font-weight:700;
  font-size:12px;
  border-radius:10px;
  cursor:pointer;
  transition:.18s ease;
}
.inventory-clear-btn:hover:not(:disabled){
  background:#fff5f4;
  border-color:#f0a39c;
}
.inventory-clear-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.inventory-action{
  width:100%;
  margin-top:12px;
  border:0;
  background:var(--accent);
  color:#fff;
  padding:11px 14px;
  font-weight:700;
  font-size:12px;
  letter-spacing:.05em;
  text-transform:uppercase;
  border-radius:10px;
  cursor:pointer;
  transition:.18s ease;
}
.inventory-action:hover:not(:disabled){
  background:#1d4ed8;
  transform:translateY(-1px);
}
.inventory-action:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.inventory-upload-notification{position:fixed;top:82px;right:22px;z-index:9999;display:none;align-items:center;gap:9px;max-width:380px;padding:12px 16px;background:#ecfdf3;border:1px solid #86efac;border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);color:#166534;font-size:13px;font-weight:700}.inventory-upload-notification.show{display:flex}.inventory-upload-notification .check{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#22c55e;color:#fff;font-size:12px;flex:0 0 auto}@media(max-width:600px){.inventory-upload-notification{left:14px;right:14px;top:76px;max-width:none}}
.inventory-status{
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
}
@media(max-width:1100px){
  .inventory-grid{grid-template-columns:1fr}
}
@media(max-width:650px){
  .inventory-page{padding:14px}
  .incoming-files{grid-template-columns:1fr}
}



/* Unassigned Orders — missing Zone ID */
.unassigned-zone-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 12px;flex-wrap:wrap}
.unassigned-zone-summary{font-size:12px;color:var(--muted)}
.unassigned-zone-list{display:flex;flex-direction:column;gap:8px}
.unassigned-zone-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 110px;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.unassigned-zone-town{font-size:13px;font-weight:800;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unassigned-zone-count{font-size:12px;color:var(--muted);text-align:right}
.unassigned-zone-input{width:100%;height:36px;border:1px solid #d0d5dd;border-radius:8px;padding:0 9px;outline:none;font-size:12px}
.unassigned-zone-input:focus{border-color:#93b4f5;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.unassigned-zone-save{height:36px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:0 12px}
.unassigned-zone-save:hover{background:#1d4ed8}
.unassigned-zone-empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:#fbfcfe;font-size:12px}
@media(max-width:650px){.unassigned-zone-row{grid-template-columns:minmax(0,1fr) 72px;gap:8px}.unassigned-zone-input{grid-column:1}.unassigned-zone-save{grid-column:2;grid-row:2}.unassigned-zone-count{grid-column:2;grid-row:1}}
.parcel-records-filters{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;margin:0 0 14px;overflow-x:auto;overflow-y:visible;padding-bottom:2px}
.parcel-filter-dropdown{position:relative;flex:0 0 auto}
.parcel-filter-trigger{height:36px;min-width:150px;max-width:230px;border:1px solid #d0d5dd;border-radius:8px;padding:0 30px 0 10px;background:#fff;color:#344054;font-size:12px;outline:none;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.parcel-filter-trigger:hover{background:#f8fafc}
.parcel-filter-trigger:focus,.parcel-filter-trigger[aria-expanded="true"]{border-color:#93b4f5;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.parcel-filter-chevron{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:#667085;pointer-events:none}
.parcel-filter-menu{position:absolute;z-index:1000;top:calc(100% + 5px);left:0;width:280px;max-height:340px;overflow:auto;border:1px solid #d0d5dd;border-radius:10px;background:#fff;box-shadow:0 12px 28px rgba(16,24,40,.18);padding:6px}
.parcel-filter-menu[hidden]{display:none}
.parcel-filter-menu-search{width:100%;height:34px;border:1px solid #d0d5dd;border-radius:7px;padding:0 9px;margin-bottom:5px;outline:none;font-size:12px;box-sizing:border-box}
.parcel-filter-menu-search:focus{border-color:#93b4f5;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.parcel-filter-option{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:34px;border:0;border-radius:7px;background:#fff;color:#344054;padding:7px 9px;text-align:left;font-size:12px;cursor:pointer;box-sizing:border-box}
.parcel-filter-option:hover{background:#f2f4f7}
.parcel-filter-option.active{background:#eef4ff;font-weight:700}
.parcel-filter-option-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parcel-filter-option-count{flex:0 0 auto;color:#667085;font-variant-numeric:tabular-nums}
.parcel-filter-no-results{padding:12px 9px;color:#98a2b3;font-size:12px;text-align:center}
.parcel-filter-clear{height:36px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:#344054;font-size:12px;font-weight:700;padding:0 12px;cursor:pointer;flex:0 0 auto}
.parcel-filter-clear:hover{background:#f8fafc}
/* V34: portal custom dropdowns above the horizontal-scroll container */
.parcel-filter-menu-portal{position:fixed !important;z-index:99999 !important;width:280px;max-width:calc(100vw - 16px);max-height:min(340px,55vh);overflow:auto;}
@media(max-width:650px){.parcel-filter-trigger{min-width:145px}.parcel-filter-menu-portal{width:min(320px,calc(100vw - 16px));max-height:55vh}}

/* V35: polished custom filter dropdowns */
.parcel-records-filters{position:relative;z-index:20;scrollbar-width:none}
.parcel-records-filters::-webkit-scrollbar{display:none}
.parcel-filter-dropdown{position:relative;z-index:21}
.parcel-filter-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:160px;max-width:240px;padding:0 10px 0 11px;font-weight:650;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:border-color .15s,box-shadow .15s,background .15s}
.parcel-filter-trigger-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parcel-filter-chevron{position:static;transform:none;flex:0 0 auto;font-size:11px;transition:transform .15s ease;color:#667085}
.parcel-filter-trigger[aria-expanded="true"] .parcel-filter-chevron{transform:rotate(180deg)}
.parcel-filter-trigger.has-value{border-color:#93b4f5;background:#f8fbff;color:#175cd3}
.parcel-filter-menu-portal{padding:7px!important;border-radius:12px!important;box-shadow:0 16px 40px rgba(16,24,40,.22)!important;overscroll-behavior:contain}
.parcel-filter-menu-search-wrap{position:sticky;top:0;background:#fff;padding:0 0 6px;z-index:2}
.parcel-filter-menu-search{height:36px!important;border-radius:8px!important;padding-left:11px!important}
.parcel-filter-option{min-height:36px;padding:8px 10px;border-radius:8px}
.parcel-filter-option.active{background:#eef4ff;color:#175cd3}
.parcel-filter-option.active::before{content:none}
.parcel-filter-option-label{flex:1}
.parcel-filter-option-count{min-width:34px;text-align:right}
.parcel-filter-no-results{padding:18px 10px}
@media(max-width:650px){

}

/* Parcel Records */
.parcel-records-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 12px;flex-wrap:wrap}
.parcel-records-summary{font-size:12px;color:var(--muted)}

.parcel-records-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.parcel-records-table{width:100%;border-collapse:collapse;min-width:900px;font-size:11px}
.parcel-records-table th{position:sticky;top:0;background:#f8fafc;color:#667085;font-size:10px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.parcel-records-table td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
.parcel-records-table tr:last-child td{border-bottom:0}
.parcel-status{font-weight:800}
.parcel-records-empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:#fbfcfe;font-size:12px}

/* Planning workspace */
.planning-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:0 0 18px;
}
.planning-tab{
  border:1px solid var(--line);
  background:#fff;
  color:#344054;
  border-radius:9px;
  padding:11px 16px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.05em;
  text-transform:uppercase;
  transition:.18s ease;
}
.planning-tab:hover{
  border-color:#b8cdf8;
  background:var(--accent-soft);
  color:var(--accent);
}
.planning-tab.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  box-shadow:0 4px 12px rgba(37,99,235,.18);
}
.planning-tab-count{
  margin-left:5px;
  opacity:.8;
}
.planning-panel{
  display:none;
}
.planning-panel.active{
  display:block;
}
.planning-panel .card{
  margin-top:0;
}

/* Planning summary */
.planning-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 18px}
.planning-summary-item{min-width:0;display:flex;flex-direction:column;gap:10px}

.planning-summary-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.planning-summary-value{font-size:26px;font-weight:850;color:var(--text);line-height:1.15;margin-top:6px}
.planning-summary-subtle{font-size:10px;color:var(--muted);margin-top:4px}
.planning-fp-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.planning-fp-input{width:100px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:16px;font-weight:800;color:var(--text);outline:none;background:#fff}
.planning-fp-input:focus{border-color:#93b4f5;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.planning-fp-unit{font-size:12px;color:var(--muted);font-weight:700}
.planning-exception-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.planning-exception-count{font-size:22px;font-weight:850;color:var(--text)}
.planning-exception-entry{display:flex;gap:8px;margin-top:10px}
.planning-exception-input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:12px;outline:none}
.planning-exception-input:focus{border-color:#93b4f5;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.planning-exception-add{height:34px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:0 14px}
.planning-exception-list{display:flex;flex-direction:column;gap:0;margin-top:9px;border:1px solid var(--line);border-radius:9px;overflow:hidden;max-height:110px;overflow-y:auto}
.planning-exception-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700}
.planning-exception-item:last-child{border-bottom:0}
.planning-exception-remove{border:0;background:transparent;color:#ef4444;font-size:16px;line-height:1;padding:0;cursor:pointer}
.planning-exception-clear{margin-top:8px;display:flex;justify-content:flex-end}
.planning-exception-clear button{height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#344054;font-size:10px;font-weight:750;padding:0 10px}
@media(max-width:900px){.planning-summary{grid-template-columns:1fr}}



.incoming-linehaul-list{display:flex;flex-direction:column;gap:10px}
.incoming-linehaul-card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.incoming-linehaul-header{width:100%;border:0;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;cursor:pointer;text-align:left}
.incoming-linehaul-header:hover{background:#f8fafc}
.incoming-linehaul-title{font-weight:800;color:#1f2937;font-size:13px}
.incoming-linehaul-meta{display:flex;align-items:center;gap:8px;color:#667085;font-size:12px;font-weight:700}
.incoming-linehaul-chevron{font-size:16px;transition:transform .15s ease}
.incoming-linehaul-card.open .incoming-linehaul-chevron{transform:rotate(90deg)}
.incoming-linehaul-body{display:none;border-top:1px solid var(--line);padding:10px 15px 14px}

.incoming-town-counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 10px}

.incoming-town-count-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.incoming-town-count-value{font-weight:800;color:#344054}
.incoming-empty{padding:22px;text-align:center;color:#667085;font-size:13px}
@media(max-width:700px){.incoming-town-counts{grid-template-columns:1fr}}
.incoming-arrived-wrap{display:inline-flex;align-items:center;gap:6px;margin-left:8px;white-space:nowrap;font-size:11px;font-weight:800;color:#344054;cursor:pointer}
.incoming-arrived-checkbox{width:16px;height:16px;accent-color:#16a34a;cursor:pointer}

.incoming-arrived-label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.3px;color:#15803d}

<script>
/*
 * NOL3 shared-storage foundation — Step 1
 *
 * All application key/value persistence now has one entry point.
 * This preserves the current browser persistence behavior while giving
 * the dashboard a single integration point for a real shared backend.
 *
 * IMPORTANT:
 * No unverified window.storage API is assumed here. If the host later
 * provides a documented shared-storage contract, only this adapter needs
 * to be changed; the dashboard logic can remain intact.
 */
window.NOL3Storage = (() => {
  const memory = new Map();

  const localGet = (key) => {
    try { return localStorage.getItem(key); }
    catch (_) { return memory.has(key) ? memory.get(key) : null; }
  };
  const localSet = (key, value) => {
    try { localStorage.setItem(key, value); }
    catch (_) { memory.set(key, String(value)); }
  };
  const localRemove = (key) => {
    try { localStorage.removeItem(key); }
    catch (_) { memory.delete(key); }
  };

  return {
    get(key) { return localGet(key); },
    set(key, value) { localSet(key, value); },
    remove(key) { localRemove(key); },
    hasSharedHost() { return !!(window && window.storage); },
    backendName() { return this.hasSharedHost() ? "shared-host-detected" : "browser-local"; }
  };
})();
</script>

<script>
// Always resolve the upload calendar date in Philippine time, regardless of
// the browser/device timezone. This date is the key used for daily LM history.
function getNOL3TodayDate() {
  try {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Manila",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    const values = {};
    for (const part of parts) {
      if (part.type !== "literal") values[part.type] = part.value;
    }
    if (values.year && values.month && values.day) {
      return `${values.year}-${values.month}-${values.day}`;
    }
  } catch (_) {}
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
window.getNOL3TodayDate = getNOL3TodayDate;

window.NOL3InitialBusinessDate = (() => {
  try {
    const saved = String(localStorage.getItem("nol3_business_day_date_v1") || "").trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(saved)) return saved;
  } catch (_) {}
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
})();

window.NOL3StorageStatus = () => ({
  backend: window.NOL3Storage?.backendName?.() || "unknown",
  sharedHostDetected: !!window.NOL3Storage?.hasSharedHost?.()
});
</script>


<script>
window.addEventListener("error", function(event) { console.error("NOL3 runtime error:", event.error || event.message); });
window.NOL3 = window.NOL3 || {};
window.NOL3.activeDraggedTownGroup = null;
window.NOL3.pendingDeleteTownGroup = null;
window.NOL3.escapeHTML = function(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
};


// This copy of the dashboard is permanently locked to one hub. Seeding
// selectedHub/hubs from this hardcoded constant — instead of from
// localStorage — closes a real cross-hub data leak: all 26 hub files are
// hosted on the same origin and therefore share the same localStorage, so
// reading "last selected hub" from storage here could return whichever hub
// was last opened in ANY of the 26 files on this browser, not necessarily
// this one. Every hub-scoped read (Planning layout, zone settings, business
// day settings, etc.) depends on this value being correct from the very
// first line of script execution, not after some later async correction.
const NOL3_FIXED_HUB_NAME = "San Nicolas Hub";

(function () {
  const HUBS_KEY = "nol3_hubs";
  const SELECTED_HUB_KEY = "nol3_selected_hub";

  let hubs = [NOL3_FIXED_HUB_NAME];
  NOL3Storage.set(HUBS_KEY, JSON.stringify(hubs));

  let selectedHub = NOL3_FIXED_HUB_NAME;
  NOL3Storage.set(SELECTED_HUB_KEY, selectedHub);

  NOL3.state = {
    hubs,
    selectedHub,
    currentPage: "planning"
  };

  NOL3.getState = function () {
    return NOL3.state;
  };

  NOL3.setSelectedHub = function (hub) {
    NOL3.state.selectedHub = hub || "";

    if (NOL3.state.selectedHub) {
      NOL3Storage.set(SELECTED_HUB_KEY, NOL3.state.selectedHub);
    } else {
      NOL3Storage.remove(SELECTED_HUB_KEY);
    }

    window.dispatchEvent(new CustomEvent("hubchange", {
      detail: { hub: NOL3.state.selectedHub }
    }));
  };

  NOL3.addHub = function (name) {
    const cleanName = String(name ?? "").trim();
    if (!cleanName || NOL3.state.hubs.includes(cleanName)) return false;

    // Hub names are operational keys. When LM Inventory is already loaded,
    // require the entered name to match a Current Station value exactly
    // (apart from surrounding whitespace) so the hub filter cannot silently
    // point at the wrong station.
    const lm = NOL3.lmInventory;
    if (lm && Array.isArray(lm.headers) && Array.isArray(lm.rows) && lm.rows.length) {
      const stationIndex = lm.headers.findIndex(h => String(h || "").trim() === "Current Station");
      if (stationIndex >= 0) {
        const exactStations = new Set(lm.rows.map(row => String(row[stationIndex] ?? "").trim()).filter(Boolean));
        if (!exactStations.has(cleanName)) return false;
      }
    }

    NOL3.state.hubs.push(cleanName);
    NOL3Storage.set(HUBS_KEY, JSON.stringify(NOL3.state.hubs));
    return true;
  };

  NOL3.removeHub = function (name) {
    const cleanName = String(name ?? "").trim();
    if (!cleanName || !NOL3.state.hubs.includes(cleanName)) return false;

    NOL3.state.hubs = NOL3.state.hubs.filter(hub => hub !== cleanName);
    NOL3Storage.set(HUBS_KEY, JSON.stringify(NOL3.state.hubs));

    // Remove hub-specific saved settings/data so a deleted hub does not
    // reappear with old planning, zone, exception, or business-day settings.
    try {
      const planningKeys = [
        "nol3_planning_layout_v1",
        "nol3_fleet_productivity_v1",
        "nol3_planning_exceptions_v1",
        "nol3_fleet_overview_v1"
      ];
      planningKeys.forEach(base => NOL3Storage.remove(`${base}:${cleanName || "__NO_HUB__"}`));

      const zoneKey = "nol3_zone_settings_v1";
      const zoneStore = JSON.parse(NOL3Storage.get(zoneKey) || "{}");
      if (zoneStore && typeof zoneStore === "object") {
        delete zoneStore[cleanName];
        NOL3Storage.set(zoneKey, JSON.stringify(zoneStore));
      }

      const businessKey = "nol3_business_day_settings_v1";
      const businessStore = JSON.parse(NOL3Storage.get(businessKey) || "{}");
      if (businessStore && typeof businessStore === "object") {
        delete businessStore[cleanName];
        NOL3Storage.set(businessKey, JSON.stringify(businessStore));
      }
    } catch (_) {}

    const remaining = NOL3.state.hubs;
    if (NOL3.state.selectedHub === cleanName) {
      NOL3.state.selectedHub = remaining[0] || "";
      if (NOL3.state.selectedHub) {
        NOL3Storage.set(SELECTED_HUB_KEY, NOL3.state.selectedHub);
      } else {
        NOL3Storage.remove(SELECTED_HUB_KEY);
      }
    }

    window.dispatchEvent(new CustomEvent("hubchange", {
      detail: { hub: NOL3.state.selectedHub }
    }));
    return true;
  };

  NOL3.setCurrentPage = function (page) {
    NOL3.state.currentPage = page;
  };
})();
