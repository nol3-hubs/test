          if (dropTarget.classList.contains('new-town-group-tile')) {
            createTownGroupFromDrop(dropTarget.dataset.areaId, drag.town);
          } else if (dropTarget.classList.contains('town-group-dropzone')) {
            assignTownToGroup(drag.town, dropTarget.dataset.areaId, dropTarget.dataset.groupId);
          }
          clearPointerDropState();
        });

        card.addEventListener('pointercancel', () => {
          pointerDrag = null;
          clearPointerDropState();
        });
      });
      bindTownGroupDragging();
    };

    const getActiveRidersForPlanning = () => {
      const result = [];
      const data = NOL3.riderData;
      if (!data || !data.rawText) return result;
      const rows = [];
      let row = [], value = '', inQuotes = false;
      const text = String(data.rawText || '');
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"') {
            if (text[i + 1] === '"') { value += '"'; i++; }
            else inQuotes = false;
          } else value += ch;
        } else if (ch === '"') inQuotes = true;
        else if (ch === ',') { row.push(value.trim()); value = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(value.trim()); value = '';
          if (row.some(cell => cell !== '')) rows.push(row);
          row = [];
        } else value += ch;
      }
      if (value !== '' || row.length) { row.push(value.trim()); if (row.some(cell => cell !== '')) rows.push(row); }
      if (rows.length < 2) return result;
      const headers = rows[0].map(h => String(h || '').trim().toLowerCase());
      const nameIndex = headers.indexOf('driver name');
      const idIndex = headers.indexOf('driver id');
      const statusIndex = headers.indexOf('spx status');
      const vehicleTypeIndex = headers.indexOf('vehicle type');
      const seen = new Set();
      rows.slice(1).forEach(cells => {
        const status = statusIndex >= 0 ? String(cells[statusIndex] || '').trim().toLowerCase() : '';
        if (status.includes('suspend')) return;
        const name = nameIndex >= 0 ? String(cells[nameIndex] || '').trim() : '';
        const id = idIndex >= 0 ? String(cells[idIndex] || '').trim() : '';
        const key = id || name;
        if (!key || seen.has(key)) return;
        seen.add(key);
        const vehicleType = vehicleTypeIndex >= 0 ? String(cells[vehicleTypeIndex] || '').trim() : '';
        result.push({ id: key, name: name || id, vehicleType: vehicleType || 'Vehicle' });
      });
      return result.sort((a,b) => a.name.localeCompare(b.name));
    };

    const closeTownGroupRiderMenus = (except = null) => {
      document.querySelectorAll('.town-group-rider-picker.open').forEach(picker => {
        if (picker !== except) picker.classList.remove('open');
      });
    };

    if (!NOL3.townGroupRiderMenuCloseBound) {
      NOL3.townGroupRiderMenuCloseBound = true;
      document.addEventListener('click', () => closeTownGroupRiderMenus());
    }

    const PLANNING_FP_KEY = 'nol3_fleet_productivity_v1';
    const PLANNING_EXCEPTION_KEY = 'nol3_planning_exceptions_v1';
    const getPlanningHubStorageKey = base => {
      const hub = (NOL3.getState && NOL3.getState().selectedHub) || '';
      return `${base}:${String(hub).trim() || '__NO_HUB__'}`;
    };
    const getFleetProductivityStorageKey = () => {
      const hub = (NOL3.getState && NOL3.getState().selectedHub) || '';
      return `${PLANNING_FP_KEY}:${String(hub).trim() || '__NO_HUB__'}`;
    };
    const getFleetProductivityTarget = () => {
      try {
        const hubKey = getFleetProductivityStorageKey();
        const scoped = NOL3Storage.get(hubKey);
        const value = Number(scoped);
        if (Number.isFinite(value) && value > 0) return value;
        // Preserve the existing target once, then future saves are hub-scoped.
        const legacy = Number(NOL3Storage.get(PLANNING_FP_KEY));
        return Number.isFinite(legacy) && legacy > 0 ? legacy : 50;
      } catch (error) { return 50; }
    };
    const saveFleetProductivityTarget = value => {
      const numeric = Number(value); if (!Number.isFinite(numeric) || numeric <= 0) return;
      try { NOL3Storage.set(getFleetProductivityStorageKey(), String(numeric)); } catch (error) {}
    };
    const loadPlanningExceptions = () => {
      try { const raw = NOL3Storage.get(getPlanningHubStorageKey(PLANNING_EXCEPTION_KEY)); const parsed = raw ? JSON.parse(raw) : []; return Array.isArray(parsed) ? parsed.map(String).map(v => v.trim()).filter(Boolean) : []; } catch (error) { return []; }
    };
    const savePlanningExceptions = list => { try { NOL3Storage.set(getPlanningHubStorageKey(PLANNING_EXCEPTION_KEY), JSON.stringify(list)); } catch (error) {} };
    const normalizePlanningExceptionKey = value =>
      normalizeIncomingKey(String(value ?? '').replace(/^\uFEFF/, ''));

    const getPlanningExceptionSet = () => new Set(
      loadPlanningExceptions()
        .map(normalizePlanningExceptionKey)
        .filter(Boolean)
    );

    // A single global exclusion test used by EVERY Planning count.
    // The value entered in Exception is treated as a tracking/order search
    // term, not as a column-specific value.
    const planningExceptionValueMatches = (cellValue, exceptionSet) => {
      if (!exceptionSet?.size) return false;

      const value = normalizePlanningExceptionKey(cellValue);
      if (!value) return false;

      for (const exception of exceptionSet) {
        const key = normalizePlanningExceptionKey(exception);
        if (!key) continue;

        // Exact match is the normal case.
        if (value === key) return true;

        // Also handle common export formatting where the tracking number is
        // embedded in a larger cell (quotes, prefixes, suffixes, etc.).
        // Only allow substring matching for realistic tracking identifiers.
        if (key.length >= 8 && value.includes(key)) return true;
      }

      return false;
    };

    const rowMatchesPlanningException = (row, headers, exceptionSet) => {
      if (!row || !exceptionSet?.size || !Array.isArray(headers)) return false;

      // Exceptions are tracking/order identifiers. Do NOT search every cell in
      // the row: operational fields such as Delivery Attempts, Total of On Hold
      // Times, Reschedule Date, etc. can legitimately contain values like "1".
      // Searching every cell would therefore exclude unrelated orders when an
      // operator enters a short tracking value such as 1.
      const normalizedHeaders = headers.map(h => String(h || '').trim().toLowerCase());
      const identityNames = [
        'order id', 'orderid', 'order no', 'order number',
        'sls tracking number', 'sls tn', 'tracking number', 'tracking no',
        'tracking id', 'spx tracking number', 'spx tn', 'spx tracking no',
        'shopee order sn'
      ];
      const identityIndexes = [];
      normalizedHeaders.forEach((header, index) => {
        if (identityNames.includes(header)) identityIndexes.push(index);
      });

      // If a source has no recognized identifier column, do not fall back to
      // all cells. That is safer than silently excluding orders because a
      // numeric operational field happens to equal an exception value.
      for (const index of identityIndexes) {
        if (planningExceptionValueMatches(row[index], exceptionSet)) return true;
      }
      return false;
    };
    const renderPlanningExceptions = () => {
      const listEl = document.getElementById('planningExceptionList'); const countEl = document.getElementById('planningExceptionCount'); if (!listEl || !countEl) return;
      const list = loadPlanningExceptions(); countEl.textContent = list.length.toLocaleString();
      listEl.innerHTML = list.map((tracking,index) => `<div class="planning-exception-item"><span>${NOL3.escapeHTML(tracking)}</span><button class="planning-exception-remove" type="button" data-exception-index="${index}" aria-label="Remove exception">×</button></div>`).join('');
      listEl.querySelectorAll('.planning-exception-remove').forEach(button => button.addEventListener('click', () => { const current=loadPlanningExceptions(); const index=Number(button.dataset.exceptionIndex); if(index>=0&&index<current.length){current.splice(index,1);savePlanningExceptions(current); if(typeof refreshAllExceptionAffectedViews === 'function') refreshAllExceptionAffectedViews(); else { renderPlanningExceptions(); renderDeliveryAreas(); } } }));
    };
    // Parcel Records filter state is mirrored here so Planning > On-Floor
    // can show the filtered parcel volume when the user applies a Parcel Records filter.
    NOL3.parcelRecordsFilteredCount = null;
    NOL3.parcelRecordsFilterActive = false;

    const updatePlanningSummary = (townCounts = null) => {
      const totalEl=document.getElementById('planningTotalVolume'); const fpInput=document.getElementById('planningFleetProductivity');
      if(totalEl){
        const hasParcelFilter = !!NOL3.parcelRecordsFilterActive;
        const parcelCount = Number(NOL3.parcelRecordsFilteredCount);
        if (hasParcelFilter && Number.isFinite(parcelCount)) {
          totalEl.textContent = parcelCount.toLocaleString();
        } else {
          const counts=townCounts||new Map();
          const lmTotal = [...counts.values()].reduce((sum,count)=>sum+Number(count||0),0);

          // A confirmed-arrived Incoming Linehaul is now physically on-floor,
          // so its matched orders must be added to Total Volume. Keep this
          // separate from the LM snapshot so the existing LM calculation is
          // not altered.
          let arrivedTotal = 0;
          try {
            if (typeof getArrivedIncomingTownCounts === 'function') {
              const arrivedCounts = getArrivedIncomingTownCounts();
              arrivedTotal = [...arrivedCounts.values()].reduce((sum,count)=>sum+Number(count||0),0);
            }
          } catch (_) { arrivedTotal = 0; }

          totalEl.textContent=(lmTotal + arrivedTotal).toLocaleString();
        }
      }
      if(fpInput&&document.activeElement!==fpInput) fpInput.value=String(getFleetProductivityTarget());
      renderPlanningExceptions();
    };

    const renderDeliveryAreas = () => {
      const groupsRoot = document.getElementById('deliveryAreaGroups');
      if (!groupsRoot) return;
      groupsRoot.innerHTML = '';

      const townCounts = new Map();
      const lm = NOL3.lmInventory;
      if (lm && Array.isArray(lm.filteredRows) && Array.isArray(lm.headers)) {
        const headers = lm.headers.map(h => String(h || '').trim().toLowerCase());
        const townIndex = headers.indexOf('town name');
        if (townIndex >= 0) {
          const exceptionSet = getPlanningExceptionSet();
          const businessMetrics = typeof getBusinessDayMetrics === 'function' ? getBusinessDayMetrics() : null;
          const receivedIndex = businessMetrics?.receivedIndex ?? -1;
          const identityIndex = typeof getBusinessIdentityIndex === 'function' ? getBusinessIdentityIndex(lm.headers) : -1;
          const dueIds = businessMetrics?.dueIds instanceof Set ? businessMetrics.dueIds : null;
          const hasBusinessWindow = dueIds && receivedIndex >= 0;
          lm.filteredRows.forEach((row, index) => {
            if (rowMatchesPlanningException(row, lm.headers, exceptionSet)) return;
            if (hasBusinessWindow) {
              const rawId = identityIndex >= 0 ? row[identityIndex] : '';
              const id = normalizeIncomingKey(rawId) || `__row_${index}`;
              if (!dueIds.has(id)) return;
            }
            const town = parseTownValue(row[townIndex]);
            if (town) townCounts.set(town, (townCounts.get(town) || 0) + 1);
          });
        }
      }

      // When an incoming linehaul is selected, add its incoming town counts
      // to the existing On-Floor town counts, including towns already assigned
      // to Delivery Areas/Town Groups.
      if (showIncomingOrdersOnFloor && Array.isArray(selectedIncomingLinehauls) && selectedIncomingLinehauls.length > 0) {
        const incomingCounts = getIncomingTownCounts();
        incomingCounts.forEach((count, town) => {
          const normalizedTown = parseTownValue(town);
          if (!normalizedTown) return;
          townCounts.set(normalizedTown, (townCounts.get(normalizedTown) || 0) + Number(count || 0));
        });
      }

      // Add operational Zone Settings towns to the same maps used by Delivery Area totals.
      if (lm?.filteredRows?.length && Array.isArray(lm.headers)) {
        const baseTowns = new Set();
        const ti = findTownColumn(lm.headers);
        if (ti >= 0) lm.filteredRows.forEach(row => { const t = parseTownValue(row[ti]); if (t) baseTowns.add(t); });
        baseTowns.forEach(baseTown => {
          getOperationalTownDefinitions(baseTown).forEach(def => {
            const stats = getOperationalTownStats(baseTown, def.area);
            townCounts.set(def.key, stats.count);
          });
        });
      }
      updatePlanningSummary(townCounts);
      const townStatusMetrics = getLMStatusMetrics();
      // Synthetic status metrics for operational towns.
      if (lm?.filteredRows?.length && Array.isArray(lm.headers)) {
        const ti = findTownColumn(lm.headers);
        if (ti >= 0) new Set(lm.filteredRows.map(row => parseTownValue(row[ti])).filter(Boolean)).forEach(baseTown => {
          getOperationalTownDefinitions(baseTown).forEach(def => { townStatusMetrics.set(def.key, getOperationalTownStats(baseTown, def.area)); });
        });
      }

      // Zone Settings integration: when a town has been split into operational
      // delivery areas, render those areas as separate rows inside the town group.
      // The source Town and Zone ID values remain unchanged.
      const getZoneOperationalSplits = (town) => {
        try {
          const data = getZoneSettingsTownData(town);
          const areas = Array.isArray(data?.areas) ? data.areas : [];
          const assignments = data?.assignments && typeof data.assignments === 'object' ? data.assignments : {};
          if (!areas.length) return null;
          const lmData = NOL3.lmInventory;
          if (!lmData?.filteredRows?.length || !Array.isArray(lmData.headers)) return null;
          const headers = lmData.headers;
          const townIndex = findTownColumn(headers);
          const zoneIndex = findZoneIdColumn(headers);
          if (townIndex < 0 || zoneIndex < 0) return null;
          const statusIndex = headers.findIndex(h => String(h || '').trim().toLowerCase() === 'status');
          const exceptionSet = getPlanningExceptionSet();
          const businessMetrics = typeof getBusinessDayMetrics === 'function' ? getBusinessDayMetrics() : null;
          const identityIndex = typeof getBusinessIdentityIndex === 'function' ? getBusinessIdentityIndex(headers) : -1;
          const dueIds = businessMetrics?.dueIds instanceof Set ? businessMetrics.dueIds : null;
          const receivedIndex = businessMetrics?.receivedIndex ?? -1;
          const hasBusinessWindow = dueIds && receivedIndex >= 0;
          const stats = new Map(areas.map(area => [String(area), {count:0, received:0, delivering:0, delivered:0, hold:0}]));
          lmData.filteredRows.forEach((row, index) => {
            if (parseTownValue(row[townIndex]) !== town) return;
            if (rowMatchesPlanningException(row, headers, exceptionSet)) return;
            if (hasBusinessWindow) {
              const rawId = identityIndex >= 0 ? row[identityIndex] : '';
              const id = normalizeIncomingKey(rawId) || `__row_${index}`;
              if (!dueIds.has(id)) return;
            }
            const zone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim();
            const areaName = String(assignments[zone] || '');
            if (!areaName || !stats.has(areaName)) return;
            const item = stats.get(areaName);
            item.count += 1;
            const status = statusIndex >= 0 ? String(row[statusIndex] || '').trim().toLowerCase() : '';
            if (status.includes('deliver')) item.delivering += 1;
            else if (status.includes('received')) item.received += 1;
            if (status.includes('delivered')) { item.delivered += 1; item.delivering = Math.max(0, item.delivering - 1); }
            if (status.includes('hold')) item.hold += 1;
          });
          return stats;
        } catch (_) { return null; }
      };

      NOL3.deliveryAreas.forEach(area => {
        const groups = ensureAreaGroups(area);
        const totalTowns = groups.reduce((sum, group) => sum + group.towns.length, 0);
        // Total parcel count for every town assigned to this Delivery Area.
        // This uses the same townCounts map that drives the individual town/group totals,
        // so the Delivery Area total follows the existing Planning calculations.
        const totalAreaVolume = groups.reduce((sum, group) =>
          sum + group.towns.reduce((townSum, town) => townSum + Number(townCounts.get(town) || 0), 0), 0);
        const section = document.createElement('div');
        section.className = 'delivery-area-group';
        section.dataset.areaId = area.id;
        section.innerHTML = `
          <div class="delivery-area-group-header" role="button" tabindex="0" aria-expanded="true">
            <div>
              <div class="delivery-area-group-title">${NOL3.escapeHTML(area.title)}</div>
              <div class="delivery-area-group-count">${totalTowns.toLocaleString()} town${totalTowns === 1 ? '' : 's'} · ${groups.length} group${groups.length === 1 ? '' : 's'} · ${totalAreaVolume.toLocaleString()} orders</div>
            </div>
            <button class="delivery-area-remove" type="button" title="Remove delivery area" aria-label="Remove delivery area">×</button>
          </div>
          <div class="town-groups">
            ${groups.map(group => `
              <div class="town-group" data-group-id="${group.id}">
                <div class="town-group-header">
                  <div class="town-group-rider-picker" data-area-id="${area.id}" data-group-id="${group.id}">
                    <button class="town-group-rider-button" type="button" aria-haspopup="true" aria-expanded="false">Assign Riders</button>
                    <div class="town-group-rider-menu" role="menu"></div>
                  </div>

      const activeRiders = getActiveRidersForPlanning();

      // Keep rider assignment unique across all Town Groups. If older saved

      const normalizeRiderAssignments = () => {
        const seen = new Set();
        NOL3.deliveryAreas.forEach(areaItem => {
          ensureAreaGroups(areaItem).forEach(groupItem => {
            const ids = Array.isArray(groupItem.assignedRiders) ? groupItem.assignedRiders.map(String) : [];
            groupItem.assignedRiders = ids.filter(id => {

      const getAssignedElsewhere = (areaId, groupId) => {

  const fpEl = picker?.parentElement?.querySelector('.town-group-fp');

      const renderRiderPicker = (picker, searchValue = '') => {

        const assignedToOtherGroups = getAssignedElsewhere(areaId, groupId);
        const availableRiders = activeRiders.filter(rider => {
          const riderId = String(rider.id);
          return group.assignedRiders.includes(riderId) || !assignedToOtherGroups.has(riderId);

              return `<label class="town-group-rider-option"><input type="checkbox" value="${NOL3.escapeHTML(rider.id)}" ${checked ? 'checked' : ''}><span>${NOL3.escapeHTML(label)}</span></label>`;
            }).join('') : '<div class="town-group-rider-empty">No active riders available</div>'}
          </div>

        const search = menu.querySelector('.town-group-rider-search');

        search?.addEventListener('click', event => event.stopPropagation());

          input.addEventListener('change', () => {

            if (input.checked) {
              // A rider can belong to only one Town Group. Remove only this
              // newly selected rider from every other group.
              NOL3.deliveryAreas.forEach(areaItem => {
                ensureAreaGroups(areaItem).forEach(groupItem => {
                  if (areaItem.id === areaId && groupItem.id === groupId) return;
                  groupItem.assignedRiders = (Array.isArray(groupItem.assignedRiders) ? groupItem.assignedRiders : [])
                    .map(String).filter(id => id !== riderId);
                });
              });
              if (!group.assignedRiders.includes(riderId)) group.assignedRiders.push(riderId);
            } else {

      if (!search || !root.contains(search)) return;
      const query = String(search.value || "").trim().toLowerCase();
      root.querySelectorAll(".incoming-linehaul-option[data-incoming-linehaul]").forEach(option => {
        const text = option.textContent.toLowerCase();
        option.style.display = !query || text.includes(query) ? "block" : "none";
      });
    });

    if (!NOL3.incomingLinehaulPickerCloseBound) {
      NOL3.incomingLinehaulPickerCloseBound = true;
      document.addEventListener("click", (event) => {
        const picker = document.getElementById("incomingLinehaulPicker");
        if (!picker || picker.contains(event.target) || event.target.closest?.("#incomingLinehaulTrigger") || event.target.closest?.("[data-incoming-linehaul]")) return;
        picker.classList.remove("open");
        document.getElementById("incomingLinehaulTrigger")?.setAttribute("aria-expanded", "false");
      });
    }

    renderIncomingLinehaulSelector();
    updateIncomingOrdersButton();

    window.addEventListener("inventoryloaded", (event) => {
      if (event.detail?.type === "incoming" || event.detail?.type === "linehaul") {
        renderIncomingLinehaulSelector();
        renderDeliveryAreas();
        renderOnFloorTowns();
      }
    });
    window.addEventListener("inventorycleared", (event) => {
      if (event.detail?.type === "incoming" || event.detail?.type === "linehaul") {
        renderIncomingLinehaulSelector();
        renderDeliveryAreas();
        renderOnFloorTowns();
      }
    });

    const ZONE_OVERRIDE_KEY = "nol3_zone_id_overrides_v1";

    const getZoneOverrideStore = () => {
      try {
        const raw = NOL3Storage.get(ZONE_OVERRIDE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (_) { return {}; }
    };

    const getZoneOverridesForHub = () => {
      const store = getZoneOverrideStore();
      const hub = String(getSelectedHub() || "").trim() || "__NO_HUB__";
      return store[hub] && typeof store[hub] === "object" ? store[hub] : {};
    };

    const saveZoneOverride = (town, zoneId) => {
      const cleanTown = String(town || "").trim();
      const cleanZone = String(zoneId || "").trim();
      if (!cleanTown || !cleanZone) return false;
      try {
        const store = getZoneOverrideStore();
        const hub = String(getSelectedHub() || "").trim() || "__NO_HUB__";
        store[hub] = store[hub] && typeof store[hub] === "object" ? store[hub] : {};
        store[hub][cleanTown] = cleanZone;
        NOL3Storage.set(ZONE_OVERRIDE_KEY, JSON.stringify(store));
        return true;
      } catch (_) { return false; }
    };

    const findZoneIdColumn = (headers) => {
      const normalized = (headers || []).map(h => String(h || "").replace(/^\uFEFF/, "").trim().toLowerCase());
      return normalized.findIndex(h => h === "zone id" || h === "zoneid" || h === "zone_id");
    };

    const updateUnassignedZoneNotification = (count) => {
      const badge = document.getElementById("unassignedZoneNotif");
      if (!badge) return;
      const n = Number(count) || 0;
      badge.textContent = n > 99 ? "99+" : String(n);
      badge.classList.toggle("show", n > 0);
      badge.setAttribute("aria-label", n > 0 ? `${n} town${n === 1 ? "" : "s"} without a Zone ID` : "No towns without a Zone ID");
    };

    const renderUnassignedOrders = () => {
      const list = document.getElementById("unassignedZoneList");
      const summary = document.getElementById("unassignedZoneSummary");
      if (!list) return;
      const lm = NOL3.lmInventory;
      const hub = getSelectedHub();
      if (!lm?.filteredRows?.length || !Array.isArray(lm.headers)) {
        list.innerHTML = `<div class="unassigned-zone-empty">Upload LM Inventory to find towns without a Zone ID.</div>`;
        if (summary) summary.textContent = "0 towns without a Zone ID";
        updateUnassignedZoneNotification(0);
        return;
      }
      const townIndex = findTownColumn(lm.headers);
      const zoneIndex = findZoneIdColumn(lm.headers);
      if (townIndex < 0 || zoneIndex < 0) {
        list.innerHTML = `<div class="unassigned-zone-empty">The LM Inventory file must contain Town Name and Zone ID columns.</div>`;
        if (summary) summary.textContent = "Zone ID column not found";
        updateUnassignedZoneNotification(0);
        return;
      }
      const overrides = getZoneOverridesForHub();
      const towns = new Map();
      lm.filteredRows.forEach(row => {
        const town = parseTownValue(row[townIndex]);
        if (!town || town === "Unknown") return;
        const zone = String(row[zoneIndex] ?? "").replace(/^\uFEFF/, "").trim();
        if (zone || overrides[town]) return;
        towns.set(town, (towns.get(town) || 0) + 1);
      });
      const sorted = [...towns.entries()].sort((a,b) => a[0].localeCompare(b[0]));
      if (summary) summary.textContent = `${sorted.length.toLocaleString()} town${sorted.length === 1 ? "" : "s"} without a Zone ID · ${sorted.reduce((n,[,c]) => n+c,0).toLocaleString()} orders`;
      updateUnassignedZoneNotification(sorted.length);
      if (!sorted.length) {
        list.innerHTML = `<div class="unassigned-zone-empty">All towns have a Zone ID for ${NOL3.escapeHTML(hub)}.</div>`;
        return;
      }
      list.innerHTML = sorted.map(([town,count]) => `
        <div class="unassigned-zone-row" data-unassigned-town="${NOL3.escapeHTML(town)}">
          <div class="unassigned-zone-town" title="${NOL3.escapeHTML(town)}">${NOL3.escapeHTML(town)}</div>
          <div class="unassigned-zone-count">${count.toLocaleString()} orders</div>
          <input class="unassigned-zone-input" type="text" inputmode="text" autocomplete="off" placeholder="Zone ID" aria-label="Zone ID for ${NOL3.escapeHTML(town)}">
          <button class="unassigned-zone-save" type="button">Save</button>
        </div>`).join("");
    };

    let parcelRecordsPage = 1;
    const PARCEL_RECORDS_PAGE_SIZE = 25;

    const renderParcelRecords = () => {
      const container = document.getElementById("parcelRecordsContainer");
      const summary = document.getElementById("parcelRecordsSummary");
      const search = document.getElementById("parcelRecordsSearch");
      if (!container) return;

      const hub = String(getSelectedHub() || "").trim();
      const { start: dayStart, end: dayEnd, businessDate } = typeof getBusinessWindow === 'function'
        ? getBusinessWindow(new Date(), getHubBusinessDaySettings())
        : { start:null, end:null, businessDate:getBusinessDateValue?.() || "" };
      const query = String(search?.value || '').trim().toLowerCase();
      const filterIds = ['parcelFilterTown','parcelFilterZone','parcelFilterStatus','parcelFilterCurrent','parcelFilterDestination'];
      // Filter selections are stored as JSON arrays in hidden inputs. Always parse
      // them before using them for cross-filter counts; otherwise a selection such
      // as ["Badoc Hub"] is treated as one literal string and makes every other
      // filter show 0.
      const parseParcelFilterValue = (id) => {
        const raw = String(document.getElementById(id)?.value || '');
        if (!raw) return [];
        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed.map(v => String(v)) : [String(parsed)];
        } catch (_) {
          return [raw];
        }
      };
      const filterValues = Object.fromEntries(filterIds.map(id => [id, parseParcelFilterValue(id)]));
      const exceptionSet = getPlanningExceptionSet();
      const recordsById = new Map();

      const addDataset = (dataset, sourceName) => {
        if (!dataset || !Array.isArray(dataset.rows) || !Array.isArray(dataset.headers)) return;
        const headers = dataset.headers;
        const normalized = headers.map(h => String(h ?? '').replace(/^\uFEFF/, '').trim().toLowerCase());
        const idx = name => normalized.indexOf(name);
        const orderIndex = findIncomingHeaderIndex(headers, ["Order ID","Order Id","OrderID","SPX TN","SPX Tracking Number","SLS TN","SLS Tracking Number","Tracking Number","Tracking No","Tracking ID"]);
        const statusIndex = findIncomingHeaderIndex(headers, ["SPX Status","Status","Parcel Status","Order Status"]);
        const townIndex = findTownColumn(headers);
        const zoneIndex = findIncomingHeaderIndex(headers, ["Zone ID","Zone Id","ZoneID","Zone"]);
        const currentIndex = findIncomingHeaderIndex(headers, ["Current Station"]);
        const destinationIndex = findIncomingHeaderIndex(headers, ["Destination Station"]);
        const currentStationReceivedIndex = findIncomingHeaderIndex(headers, ["Current Station Received Time"]);
        const receivedIndex = currentStationReceivedIndex >= 0
          ? currentStationReceivedIndex
          : findBusinessTimestampIndex(headers, businessTimestampCandidates.received);
        const pickedIndex = findBusinessTimestampIndex(headers, businessTimestampCandidates.pickedUp);
        const identityIndex = getBusinessIdentityIndex(headers);
        if (orderIndex < 0) return;

        dataset.rows.forEach((row, i) => {
          if (rowMatchesPlanningException(row, headers, exceptionSet)) return;
          const idRaw = row[orderIndex] ?? (identityIndex >= 0 ? row[identityIndex] : '');
          const id = normalizeIncomingKey(idRaw);
          if (!id) return;

          const current = currentIndex >= 0 ? String(row[currentIndex] ?? '').trim() : '';
          const destination = destinationIndex >= 0 ? String(row[destinationIndex] ?? '').trim() : '';

          // LM uses the already hub-filtered rows. Incoming Inventory is inbound to
          // the selected hub, so its Destination Station is the hub filter.
          if (sourceName === 'incoming' && hub && destination.toLowerCase() !== hub.toLowerCase()) return;
          if (sourceName === 'lm' && hub && current.toLowerCase() !== hub.toLowerCase()) return;

          const receivedAt = receivedIndex >= 0 ? parseBusinessTimestamp(row[receivedIndex]) : null;
          const pickedAt = pickedIndex >= 0 ? parseBusinessTimestamp(row[pickedIndex]) : null;

          // Business Date controls Parcel Records. Keep records whose operational
          // received timestamp falls in the selected business-day window. For LM,
          // also retain carried-over parcels that were not picked up before the day.
          if (dayStart && dayEnd && receivedAt) {
            const inWindow = receivedAt.getTime() >= dayStart.getTime() && receivedAt.getTime() < dayEnd.getTime();
            const carriedOver = receivedAt.getTime() < dayStart.getTime() && (!pickedAt || pickedAt.getTime() < dayStart.getTime());
            if (!inWindow && !carriedOver) return;
          } else if (dayStart && dayEnd && !receivedAt) {
            return;
          }

          const status = statusIndex >= 0 ? String(row[statusIndex] ?? '').trim() : '';
          const town = townIndex >= 0 ? String(row[townIndex] ?? '').trim() : '';
          const zone = zoneIndex >= 0 ? String(row[zoneIndex] ?? '').trim() : '';
          const currentStationReceivedTime = currentStationReceivedIndex >= 0
            ? String(row[currentStationReceivedIndex] ?? '').trim()
            : (receivedIndex >= 0 ? String(row[receivedIndex] ?? '').trim() : '');
          const timestamp = Math.max(receivedAt?.getTime() || 0, pickedAt?.getTime() || 0);
          const values = [
            idRaw,
            town,
            zone,
            status,
            currentStationReceivedTime,
            current,
            destination
          ].map(v => String(v ?? '').trim());

          const existing = recordsById.get(id);
          if (!existing || timestamp >= existing.timestamp) recordsById.set(id, { values, timestamp });
        });
      };

      // Read both parcel sources. LM is already filtered by the selected hub;
      // Incoming Inventory is filtered here by its Destination Station.
      addDataset(NOL3.lmInventory, 'lm');
      addDataset(NOL3.incomingInventory, 'incoming');

      const escFilter = value => String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');
      const allRecords = [...recordsById.values()].map(x => x.values);
      const optionSets = [
        ['parcelFilterTown', 1, 'All Towns'],
        ['parcelFilterZone', 2, 'All Zone IDs'],
        ['parcelFilterStatus', 3, 'All Statuses'],
        ['parcelFilterCurrent', 5, 'All Current Stations'],
        ['parcelFilterDestination', 6, 'All Destination Stations']
      ];
      // Multi-select custom dropdowns. Keep selections in the hidden inputs as JSON arrays.
      optionSets.forEach(([id, col, label]) => {
        const valueInput = document.getElementById(id);
        const trigger = document.getElementById(id + 'Trigger');
        const menu = document.getElementById(id + 'Menu');
        if (!valueInput || !trigger || !menu) return;

        // V73 filter fix: bind directly to each trigger so the dropdowns
        // remain clickable regardless of document-level event delegation.
        trigger.onclick = (event) => {
          event.preventDefault();
          event.stopPropagation();
          document.querySelectorAll('.parcel-filter-menu').forEach(m => {
            if (m !== menu) m.hidden = true;
          });
          root.querySelectorAll('.parcel-filter-trigger').forEach(t => {
            if (t !== trigger) t.setAttribute('aria-expanded', 'false');
          });
          if (menu.parentElement !== document.body) document.body.appendChild(menu);
          menu.classList.add('parcel-filter-menu-portal');
          menu.hidden = !menu.hidden;
          trigger.setAttribute('aria-expanded', menu.hidden ? 'false' : 'true');
          if (!menu.hidden) {
            const rect = trigger.getBoundingClientRect();
            const zoomRaw = parseFloat(getComputedStyle(document.documentElement).zoom);
            const zoom = Number.isFinite(zoomRaw) && zoomRaw > 0 ? zoomRaw : 1;
            const margin = 8;
            const viewportWidth = window.innerWidth / zoom;
            const viewportHeight = window.innerHeight / zoom;
            const menuWidth = Math.min(rect.width / zoom, viewportWidth - margin * 2);
            const left = Math.max(margin, Math.min(rect.left / zoom, viewportWidth - menuWidth - margin));
            const top = Math.max(margin, Math.min(rect.bottom / zoom + 4, viewportHeight - 340 - margin));
            menu.style.width = menuWidth + 'px';
            menu.style.minWidth = menuWidth + 'px';
            menu.style.maxWidth = menuWidth + 'px';
            menu.style.left = left + 'px';
            menu.style.top = top + 'px';
            requestAnimationFrame(() => menu.querySelector('.parcel-filter-menu-search')?.focus());
          }
        };

        let selected = [];
        try {
          const parsed = JSON.parse(String(valueInput.value || ''));
          if (Array.isArray(parsed)) selected = parsed.map(String);
          else if (valueInput.value) selected = [String(valueInput.value)];
        } catch (_) {
          if (valueInput.value) selected = [String(valueInput.value)];
        }

        const otherFilters = {
          3: filterValues.parcelFilterStatus,
          1: filterValues.parcelFilterTown,
          2: filterValues.parcelFilterZone,
          5: filterValues.parcelFilterCurrent,
          6: filterValues.parcelFilterDestination
        };
        const contextRecords = allRecords.filter(row => Object.entries(otherFilters).every(([otherCol, raw]) => {
          if (Number(otherCol) === col) return true;
          const vals = Array.isArray(raw) ? raw : (raw ? [String(raw)] : []);
          return !vals.length || vals.includes(String(row[Number(otherCol)] ?? ''));
        }));
        const counts = new Map();
        contextRecords.forEach(row => {
          const value = String(row[col] ?? '').trim();
          if (value) counts.set(value, (counts.get(value) || 0) + 1);
        });
        // Keep every selected value even when another filter temporarily makes
        // its count zero. This is important for true multi-filter operation:
        // selecting Current Station must not wipe out Town/Zone/Status selections,
        // and selected options must remain available so they can be unchecked.
        const contextValues = [...counts.keys()];
        const values = [...new Set([...contextValues, ...selected.filter(Boolean)])]
          .sort((a,b) => a.localeCompare(b));
        valueInput.value = selected.length ? JSON.stringify(selected) : '';
        filterValues[id] = selected.slice();

        const triggerText = !selected.length
          ? `${label} (${contextRecords.length.toLocaleString()})`
          : selected.length === 1
            ? `${selected[0]} (${(counts.get(selected[0]) || 0).toLocaleString()})`
            : `${selected.length} selected`;
        trigger.innerHTML = `<span class="parcel-filter-trigger-label">${escFilter(triggerText)}</span><span class="parcel-filter-chevron" aria-hidden="true">▾</span>`;
        trigger.classList.toggle('has-value', selected.length > 0);

        menu.innerHTML = `<div class="parcel-filter-menu-search-wrap"><input class="parcel-filter-menu-search" type="search" placeholder="Search ${escFilter(label.replace(/^All /, '').replace(/s$/, ''))}..." autocomplete="off" aria-label="Search ${escFilter(label)}"></div>` +
          `<button type="button" class="parcel-filter-option ${!selected.length ? 'active' : ''}" data-filter-option="" data-filter-id="${id}"><span class="parcel-filter-option-label"><span class="parcel-filter-check">${!selected.length ? '✓' : ''}</span>${escFilter(label)}</span><span class="parcel-filter-option-count">${contextRecords.length.toLocaleString()}</span></button>` +
          values.map(v => {
            const active = selected.includes(v);
            return `<button type="button" class="parcel-filter-option ${active ? 'active' : ''}" data-filter-option="${escFilter(v)}" data-filter-id="${id}"><span class="parcel-filter-option-label"><span class="parcel-filter-check">${active ? '✓' : ''}</span>${escFilter(v)}</span><span class="parcel-filter-option-count">${(counts.get(v) || 0).toLocaleString()}</span></button>`;
          }).join('');

        // Bind directly to this menu so Android taps reliably reach the option.
        menu.onclick = (event) => {
          const option = event.target.closest?.('.parcel-filter-option');
          if (!option || option.dataset.filterId !== id) return;
          event.preventDefault();
          event.stopPropagation();
          let current = [];
          try { current = JSON.parse(String(valueInput.value || '')); } catch (_) { current = []; }
          if (!Array.isArray(current)) current = valueInput.value ? [String(valueInput.value)] : [];
          const value = option.dataset.filterOption || '';
          if (!value) {
            current = [];
          } else if (current.includes(value)) {
            current = current.filter(v => v !== value);
          } else {
            current.push(value);
          }
          valueInput.value = current.length ? JSON.stringify(current) : '';
          parcelRecordsPage = 1;
          const searchTerm = menu.querySelector('.parcel-filter-menu-search')?.value || '';
          renderParcelRecords();
          const newMenu = document.getElementById(id + 'Menu');
          const newTrigger = document.getElementById(id + 'Trigger');
          if (newMenu && newTrigger) {
            newMenu.hidden = false;
            newTrigger.setAttribute('aria-expanded', 'true');
            const newSearch = newMenu.querySelector('.parcel-filter-menu-search');
            if (newSearch) newSearch.value = searchTerm;
            positionParcelFilterMenu(newTrigger, newMenu);
            newSearch?.focus();
          }
        };
      });

      const activeFilters = {
        3: filterValues.parcelFilterStatus,
        1: filterValues.parcelFilterTown,
        2: filterValues.parcelFilterZone,
        5: filterValues.parcelFilterCurrent,
        6: filterValues.parcelFilterDestination
      };
      const exceptionSetForParcelRecords = getPlanningExceptionSet();
      let records = allRecords.filter(values => {
        // The same global Exception list is applied before ANY Parcel Records
        // count is calculated.
        if (rowMatchesPlanningException(values, null, exceptionSetForParcelRecords)) return false;

        return Object.entries(activeFilters).every(([col, raw]) => {
          const list = Array.isArray(raw) ? raw : (raw ? [String(raw)] : []);
          return !list.length || list.includes(String(values[Number(col)] ?? ''));
        });
      });
      if (query) records = records.filter(values => values.join(' ').toLowerCase().includes(query));
      records.sort((a,b) => String(a[0]).localeCompare(String(b[0])));

      // Feed the filtered Parcel Records count back to Planning > Total Volume.
      // A search term also counts as a Parcel Records filter for this purpose.
      const hasActiveParcelFilters = query.length > 0 || Object.values(activeFilters).some(raw => {
        const list = Array.isArray(raw) ? raw : (raw ? [String(raw)] : []);
        return list.length > 0;
      });
      NOL3.parcelRecordsFilteredCount = records.length;
      NOL3.parcelRecordsFilterActive = hasActiveParcelFilters;
      // Only use the filtered Parcel Records count while a filter/search is active.
      // When cleared, rebuild the normal Planning summary so Total Volume does not
      // fall to 0 from calling updatePlanningSummary() without its town-count map.
      if (hasActiveParcelFilters) {
        const totalEl = document.getElementById('planningTotalVolume');
        if (totalEl) totalEl.textContent = records.length.toLocaleString();
      } else if (typeof renderDeliveryAreas === 'function') {
        renderDeliveryAreas();
      }

      if (summary) {
        const hubLabel = hub || 'All Hubs';
        const dateLabel = businessDate || getBusinessDateValue?.() || '';
        summary.textContent = `${records.length.toLocaleString()} parcel records · ${NOL3.escapeHTML(hubLabel)} · Business Date ${NOL3.escapeHTML(dateLabel)}`;
      }
      if (!records.length) {
        parcelRecordsPage = 1;
        container.innerHTML = `<div class="parcel-records-empty">No parcel records match the selected Business Date, hub, and search.</div>`;
        return;
      }
      const esc = NOL3.escapeHTML;
      const totalPages = Math.max(1, Math.ceil(records.length / PARCEL_RECORDS_PAGE_SIZE));
      parcelRecordsPage = Math.min(Math.max(1, parcelRecordsPage), totalPages);
      const start = (parcelRecordsPage - 1) * PARCEL_RECORDS_PAGE_SIZE;
      const pageRecords = records.slice(start, start + PARCEL_RECORDS_PAGE_SIZE);
      const from = start + 1;
      const to = Math.min(start + PARCEL_RECORDS_PAGE_SIZE, records.length);
      const rows = pageRecords.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="parcel-status">${esc(r[3])}</td><td>${esc(r[4])}</td><td>${esc(r[5])}</td><td>${esc(r[6])}</td></tr>`).join('');
      container.innerHTML = `<div class="parcel-records-wrap"><table class="parcel-records-table"><thead><tr><th>Order ID</th><th>Town</th><th>Zone ID</th><th>Status</th><th>Current Station Received Time</th><th>Current Station</th><th>Destination Station</th></tr></thead><tbody>${rows}</tbody></table></div><div class="parcel-pagination"><span class="parcel-pagination-info">Showing ${from.toLocaleString()}–${to.toLocaleString()} of ${records.length.toLocaleString()}</span><div class="parcel-pagination-buttons"><button type="button" class="parcel-page-btn" data-parcel-page="prev" ${parcelRecordsPage <= 1 ? 'disabled' : ''}>Previous</button><span class="parcel-page-number">Page ${parcelRecordsPage} of ${totalPages}</span><button type="button" class="parcel-page-btn" data-parcel-page="next" ${parcelRecordsPage >= totalPages ? 'disabled' : ''}>Next</button></div></div>`;
    };

    root.addEventListener("click", event => {
      const pageButton = event.target.closest?.(".parcel-page-btn");
      if (pageButton && root.contains(pageButton)) {
        if (pageButton.dataset.parcelPage === "prev" && parcelRecordsPage > 1) parcelRecordsPage--;
        if (pageButton.dataset.parcelPage === "next") parcelRecordsPage++;
        renderParcelRecords();
        return;
      }
      const button = event.target.closest?.(".unassigned-zone-save");
      if (!button || !root.contains(button)) return;
      const row = button.closest(".unassigned-zone-row");
      const input = row?.querySelector(".unassigned-zone-input");
      const town = row?.dataset.unassignedTown || "";
      const zone = input?.value?.trim() || "";
      if (!zone) { input?.focus(); return; }
      if (saveZoneOverride(town, zone)) renderUnassignedOrders();
    });

    root.addEventListener("keydown", event => {
      if (event.key !== "Enter") return;
      const input = event.target.closest?.(".unassigned-zone-input");
      if (!input) return;
      event.preventDefault();
      input.closest(".unassigned-zone-row")?.querySelector(".unassigned-zone-save")?.click();
    });

    document.getElementById("parcelRecordsSearch")?.addEventListener("input", () => { parcelRecordsPage = 1; renderParcelRecords(); });
    const parcelFilterIds = ["parcelFilterTown","parcelFilterZone","parcelFilterStatus","parcelFilterCurrent","parcelFilterDestination"];

    const closeParcelFilterMenus = () => {
      document.querySelectorAll(".parcel-filter-menu").forEach(m => m.hidden = true);
      root.querySelectorAll(".parcel-filter-trigger").forEach(t => t.setAttribute("aria-expanded", "false"));
    };

    const positionParcelFilterMenu = (trigger, menu) => {
      if (!trigger || !menu) return;
      const rect = trigger.getBoundingClientRect();
      const gap = 4;
      const margin = 8;

      // The dashboard intentionally uses html{zoom:80%}. A fixed, body-portaled
      // dropdown must convert the zoomed getBoundingClientRect() coordinates
      // back into CSS coordinates or Chrome/Android will place it too far left.
      const zoomRaw = parseFloat(getComputedStyle(document.documentElement).zoom);
      const zoom = Number.isFinite(zoomRaw) && zoomRaw > 0 ? zoomRaw : 1;
      const viewportWidth = window.innerWidth / zoom;
      const viewportHeight = window.innerHeight / zoom;
      const triggerLeft = rect.left / zoom;
      const triggerTop = rect.top / zoom;
      const triggerBottom = rect.bottom / zoom;
      const triggerWidth = rect.width / zoom;

      const menuWidth = Math.min(triggerWidth, viewportWidth - margin * 2);
      const left = Math.max(margin, Math.min(triggerLeft, viewportWidth - menuWidth - margin));
      menu.style.width = `${menuWidth}px`;
      menu.style.minWidth = `${menuWidth}px`;
      menu.style.maxWidth = `${menuWidth}px`;
      menu.style.left = `${left}px`;

      const menuHeight = Math.min(menu.scrollHeight || 340, Math.floor(viewportHeight * .55));
      const below = viewportHeight - triggerBottom - gap - margin;
      const above = triggerTop - gap - margin;
      const top = below >= Math.min(260, menuHeight) || below >= above
        ? triggerBottom + gap
        : Math.max(margin, triggerTop - menuHeight - gap);
      menu.style.top = `${Math.max(margin, Math.min(top, viewportHeight - menuHeight - margin))}px`;
    };

    document.addEventListener("click", event => {
      const trigger = event.target.closest?.(".parcel-filter-trigger");

      const current = options.indexOf(menu.querySelector(".parcel-filter-option.keyboard-focus"));
      let next = current;
      if (event.key === "ArrowDown") next = Math.min(options.length - 1, current < 0 ? 0 : current + 1);

    const recoverZoneSplitTownAssignments = () => {
      const recoveryKey = 'nol3_zone_split_town_recovery_v52';

              if (operational) { changed = true; return; }

          area.towns = ensureAreaGroups(area).flatMap(group => group.towns);

    const getZoneSettingsRows = (town) => {

      lm.filteredRows.forEach(row => {

        const zone = String(row[zoneIndex] ?? '').replace(/^\uFEFF/, '').trim() || 'No Zone ID';
        counts.set(zone, (counts.get(zone) || 0) + 1);

      data[town].assignments = data[town].assignments && typeof data[town].assignments === 'object' ? data[town].assignments : {};

      Object.keys(data[town].assignments).forEach(zone => { if (String(data[town].assignments[zone]) === String(area)) delete data[town].assignments[zone]; });
      store[hub] = data;
      if (saveZoneSettingsStore(store)) { renderZoneSettings(); notifyZoneSettingsChanged(); }
    });
    root.addEventListener('change', event => {
      const select = event.target.closest?.('.zone-settings-assignment');
      if (!select) return;
      const town = document.getElementById('zoneSettingsTown')?.value || '';
      saveZoneSettingAssignment(town, select.dataset.zoneId || '', select.value || '');
      renderZoneSettings();
    });
    // Expose the Planning page's closure-scoped renderers so external
    // Business Date / cloud-restore handlers can refresh the CURRENT DOM.
    // These functions are intentionally inside the Planning page scope;
    // calling renderDeliveryAreas() from outside this scope does nothing.
    NOL3.refreshPlanningViews = function () {
      try { renderOnFloorTowns(); } catch (_) {}
      try { renderDeliveryAreas(); } catch (_) {}
      try { renderIncomingOrders(); } catch (_) {}
      try { updateIncomingOrdersNotification(); } catch (_) {}
      try { renderPlanningExceptions(); } catch (_) {}
      try { renderUnassignedOrders(); } catch (_) {}
      try { renderParcelRecords(); } catch (_) {}
      try { renderZoneSettings(); } catch (_) {}
      try { renderBusinessDayMetrics(); } catch (_) {}
    };

    window.addEventListener('inventoryloaded', event => { if (event.detail?.type === 'lm') { renderZoneSettings(); renderOnFloorTowns(); renderDeliveryAreas(); } });
    window.addEventListener('inventorycleared', event => { if (event.detail?.type === 'lm') { renderZoneSettings(); renderOnFloorTowns(); renderDeliveryAreas(); } });
    window.addEventListener('hubchange', () => { renderZoneSettings(); renderOnFloorTowns(); renderDeliveryAreas(); });
    window.addEventListener('zonesettingschanged', () => {
      // Rebuild the available/assigned town lists immediately after a Zone Settings change.
      // No manual refresh or menu switch is required.
      renderOnFloorTowns();
      renderDeliveryAreas();
      renderZoneSettings();
    });

    // Zone Settings is now fully initialized before any Planning render runs.
    recoverZoneSplitTownAssignments();
    renderOnFloorTowns();
    renderDeliveryAreas();
    renderIncomingOrders();
    renderUnassignedOrders();
    renderParcelRecords();
    renderZoneSettings();

    const tabs = root.querySelectorAll("[data-planning-tab]");

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const target = tab.dataset.planningTab;

        tabs.forEach((item) => {

          item.classList.toggle("active", active);
          item.setAttribute("aria-selected", active ? "true" : "false");

        root.querySelectorAll(".planning-panel").forEach((panel) => {
          panel.classList.toggle(

        if (target === "incoming") renderIncomingOrders();
        if (target === "unassigned") renderUnassignedOrders();
        if (target === "parcels") renderParcelRecords();
        if (target === "zonesettings") renderZoneSettings();
      });
    });

    renderBusinessDaySettings();
    // These cards used to live on the separate Dashboard page; they're now
    // part of Planning's own render so they populate as soon as Planning
    // loads, the same way Dashboard used to on its own load.
    if (typeof renderBusinessDayMetrics === "function") {
      renderBusinessDayMetrics();
      setTimeout(() => renderBusinessDayMetrics(), 0);
      setTimeout(() => renderBusinessDayMetrics(), 100);
      setTimeout(() => renderBusinessDayMetrics(), 500);

    window.addEventListener("inventoryloaded", (event) => {

    window.addEventListener("inventorycleared", (event) => {

    window.addEventListener("hubchange", () => { renderUnassignedOrders(); renderParcelRecords(); renderBusinessDaySettings(); });
    window.addEventListener("businessdatechange", () => { setTimeout(() => renderParcelRecords(), 0); });
    window.addEventListener("inventoryloaded", (event) => { if (event.detail?.type === "lm") renderParcelRecords(); });
    window.addEventListener("inventorycleared", (event) => { if (event.detail?.type === "lm") renderParcelRecords(); });
    window.addEventListener("inventoryloaded", (event) => { if (event.detail?.type === "lm") renderBusinessDayMetrics(); });

    hideSuspendedInput.addEventListener("change", () => {

    function renderRiderData(result) {
      const rows = parseCSV(result.rawText);
      if (!rows.length) return;

      const headers = rows[0];
      const allRows = rows.slice(1).filter(row => row.some(value => value.trim() !== ""));

      const statusIndex = headers.indexOf("SPX Status");
      const searchableIndexes = [
        headers.indexOf("Driver ID"),
        headers.indexOf("Driver Name"),
        headers.indexOf("Plate Number"),
        headers.indexOf("Delivery Station ID"),
        headers.indexOf("Pickup Station ID"),
        headers.indexOf("Agency"),
        headers.indexOf("Driver Group"),
        headers.indexOf("Zone")
      ].filter(index => index >= 0);

      const query = (searchInput.value || "").trim().toLowerCase();
      const hideSuspended = hideSuspendedInput.checked;

      const dataRows = allRows.filter(row => {
        const status = statusIndex >= 0 ? String(row[statusIndex] || "").trim().toLowerCase() : "";
        const suspended = status.includes("suspend");

        if (hideSuspended && suspended) return false;

        if (!query) return true;

        return searchableIndexes.some(index =>
          String(row[index] || "").toLowerCase().includes(query)
        );
      });

      const headerEl = document.getElementById("ridersHead");
      const bodyEl = document.getElementById("ridersBody");
      const tableEl = document.getElementById("ridersTable");
      const emptyEl = document.getElementById("ridersEmpty");
      const statusEl = document.getElementById("ridersStatus");

      headerEl.innerHTML = headers.map(h => `<th>${escapeHTML(h)}</th>`).join("");

      bodyEl.innerHTML = dataRows.map(row => {
        const cells = headers.map((_, index) => row[index] ?? "");
        return `<tr>${cells.map(cell => `<td>${escapeHTML(cell)}</td>`).join("")}</tr>`;
      }).join("");

      emptyEl.style.display = "none";
      tableEl.style.display = "table";
      const totalText = allRows.length.toLocaleString();
      const visibleText = dataRows.length.toLocaleString();
      statusEl.textContent = `${visibleText} of ${totalText} rider records shown from ${result.fileName}.`;

      document.getElementById("riderTotal").textContent = dataRows.length.toLocaleString();

      const vehicleIndex = headers.findIndex(h => String(h || "").trim().toLowerCase() === "vehicle type");

      // Rider type is read from the Vehicle Type column in the exported Driver Profile.
      // Flexi riders are marked as "Flexi" there; Agency is not the rider-type field.
      const regularCount = vehicleIndex >= 0
        ? dataRows.filter(row => /^(2wh|3wc|4wh)$/i.test(String(row[vehicleIndex] || "").trim())).length
        : 0;

      const flexiCount = vehicleIndex >= 0
        ? dataRows.filter(row => /flexi/i.test(String(row[vehicleIndex] || "").trim())).length
        : 0;

      document.getElementById("riderRegulars").textContent = regularCount.toLocaleString();
      document.getElementById("riderFlexi").textContent = flexiCount.toLocaleString();
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && inQuotes && next === '"') {
          value += '"';
          i++;
          continue;
        }

        if (char === '"') {
          inQuotes = !inQuotes;
          continue;
        }

        if (char === "," && !inQuotes) {
          row.push(value);
          value = "";
          continue;
        }

        if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i++;
          row.push(value);
          value = "";
          rows.push(row);
          row = [];
          continue;
        }

        value += char;
      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows;
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  };
})();

  NOL3.closeHubModal = function () {

  };

  NOL3.pendingDeleteHub = null;

  NOL3.openDeleteHubModal = function (hub) {
    const modal = document.getElementById("deleteHubModal");
    const text = document.getElementById("deleteHubText");
    if (!modal || !hub) return;
    NOL3.pendingDeleteHub = hub;
    if (text) text.textContent = `Delete "${hub}"? This will also remove its saved planning, zone, exception, and business-day settings.`;
    modal.classList.add("show");
  };

  NOL3.closeDeleteHubModal = function () {
    const modal = document.getElementById("deleteHubModal");
    if (modal) modal.classList.remove("show");
    NOL3.pendingDeleteHub = null;
  };

  NOL3.confirmDeleteHub = function () {
    const hub = NOL3.pendingDeleteHub;
    if (!hub) return;
    NOL3.removeHub(hub);
    NOL3.closeDeleteHubModal();
    NOL3.renderSidebar();
    NOL3.renderTopbar();
    NOL3.renderPage(NOL3.getState().currentPage);
  };

  NOL3.initHubModal = function () {
    const modal = document.getElementById("hubModal");
    const input = document.getElementById("hubName");
    const cancelButton = document.getElementById("cancelHub");
    const saveButton = document.getElementById("saveHub");

    if (!modal || !input || !cancelButton || !saveButton) {
      console.error("NOL3: Hub modal controls are missing.", {
        modal: !!modal,
        input: !!input,
        cancelButton: !!cancelButton,
        saveButton: !!saveButton
      });
      return;
    }

    cancelButton.addEventListener("click", NOL3.closeHubModal);
    saveButton.addEventListener("click", save);

    const deleteHubModal = document.getElementById("deleteHubModal");
    const cancelDeleteHub = document.getElementById("cancelDeleteHub");
    const confirmDeleteHub = document.getElementById("confirmDeleteHub");
    cancelDeleteHub?.addEventListener("click", NOL3.closeDeleteHubModal);
    confirmDeleteHub?.addEventListener("click", NOL3.confirmDeleteHub);
    deleteHubModal?.addEventListener("click", function (event) {
      if (event.target === deleteHubModal) NOL3.closeDeleteHubModal();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && deleteHubModal?.classList.contains("show")) NOL3.closeDeleteHubModal();
    });

    modal.addEventListener("click", function (event) {
      if (event.target === modal) NOL3.closeHubModal();
    });

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") save();
      if (event.key === "Escape") NOL3.closeHubModal();
    });

    function save() {
      const name = input.value.trim();
      if (!name || name === "Main Hub") return;
      if (!NOL3.addHub(name)) return;

      NOL3.setSelectedHub(name);
      NOL3.renderSidebar();
      NOL3.renderTopbar();
      NOL3.closeHubModal();
    }
  };
})();



/* NOL3 File Store fallback
 * Android content:// / downloaded HTML files can expose IndexedDB.open() but
 * fail internally when opening the backing store. The dashboard therefore
 * uses a memory-backed file store for operational uploads. Supabase remains
 * the durable cross-device store through NOL3CloudSync.
 */
(function () {
  const records = new Map();
  const histories = new Map();

  function clone(value) {
    if (value == null) return value;
    try { return JSON.parse(JSON.stringify(value)); }
    catch (_) { return value; }
  }

  window.NOL3FileStore = {
    getAll() {
      return Array.from(records.values()).map(clone);
    },
    get(type) {
      return clone(records.get(String(type)) || null);
    },
    put(record) {
      if (record && record.type) records.set(String(record.type), clone(record));
    },
    remove(type) {
      records.delete(String(type));
    },
    putHistory(record) {
      if (record && record.businessDate) histories.set(String(record.businessDate), clone(record));
    },
    getHistory(date) {
      return clone(histories.get(String(date || '').trim()) || null);
    },
    removeHistory(date) {
      histories.delete(String(date || '').trim());
    },
    getHistories() {
      return Array.from(histories.values()).map(clone);
    },
    clearOperational() {
      records.delete("lm");
      records.delete("incoming");
      records.delete("linehaul");
      records.delete("unifiedInventory");
      records.delete("unifiedInventoryUndo");
      histories.clear();
    }
  };
})();


(function () {
  // NOL3 Save Data: export a portable backup of the current browser-local data.
  // Includes localStorage plus all records in the uploaded-file IndexedDB store.
  // This is intentionally local-only until the cloud backend is connected.
  const DB_NAME = "NOL3_Planning_Dashboard_DB_SAN_NICOLAS";
  const DB_VERSION = 4;
  const STORE = "uploadedFiles";
  const LM_HISTORY_STORE = "lmHistory";

  function readLocalStorage() {
    const data = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key !== null) data[key] = localStorage.getItem(key);
      }
    } catch (error) {
      console.warn("NOL3: Could not read localStorage for backup.", error);
    }
    return data;
  }

  function readIndexedDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { resolve({}); return; }
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onerror = () => reject(request.error || new Error("Could not open saved-data database."));
      request.onsuccess = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(STORE)) { db.close(); resolve({}); return; }
        const tx = db.transaction(STORE, "readonly");
        const getAllRequest = tx.objectStore(STORE).getAll();
        getAllRequest.onsuccess = () => {
          const records = Array.isArray(getAllRequest.result) ? getAllRequest.result : [];
          db.close();
          const byType = {};
          records.forEach(record => {
            if (record && record.type) byType[String(record.type)] = record;
          });
          resolve(byType);
        };
        getAllRequest.onerror = () => {
          db.close();
          reject(getAllRequest.error || new Error("Could not read uploaded data."));
        };
      };
    });

    const anchor = document.createElement("a");
    anchor.href = url;

      try { if (typeof renderUnassignedOrders === "function") renderUnassignedOrders(); } catch (_) {}

      const previousWeekEnd = new Date(currentWeekStart);

        ["NOL3 WEEKLY DAILY SUMMARY"],
        ["Week Start", weekStart],
        ["Week End", weekEnd],
        ["Hub", hub],
        [],
        ["DATE", "TODAY'S VOLUME", "TOTAL DISPATCHED", "TOTAL BACKLOGS", "PLANNING VOLUME", "FLEET PRODUCTIVITY TARGET", "PLANNING EXCEPTIONS", "TOWNS / ORDERS", "PARCEL RECORDS", "RIDER TOTAL", "LAST UPDATED"]

(function () {
  const DB_NAME = "NOL3_Planning_Dashboard_DB_SAN_NICOLAS";
  const DB_VERSION = 4;
  const STORE = "uploadedFiles";
  const LM_HISTORY_STORE = "lmHistory";
  const TYPES = ["lm", "incoming", "linehaul"];

  // IndexedDB is intentionally not used here. The app is frequently opened
  // directly from Android's content://downloads origin, where IndexedDB can
  // fail with "Internal error opening backing store". The cloud layer provides
  // durable persistence across devices.
  const put = async (record) => {
    if (window.NOL3FileStore) NOL3FileStore.put(record);
  };
  const get = async (type) => window.NOL3FileStore ? NOL3FileStore.get(type) : null;

  NOL3._storagePut = put;
  NOL3._storageGet = get;

  const LM_HISTORY_PREFIX = "lmHistory::";
  const getLMHistoryKey = (date) => `${LM_HISTORY_PREFIX}${String(date || "").trim()}`;
  NOL3.getLMHistoryKey = getLMHistoryKey;

  async function putLMHistory(record) {
    if (window.NOL3FileStore) NOL3FileStore.putHistory(record);
  }
  async function getLMHistoryRecord(businessDate) {
    return window.NOL3FileStore ? NOL3FileStore.getHistory(businessDate) : null;
  }
  async function removeLMHistory(businessDate) {
    if (window.NOL3FileStore) NOL3FileStore.removeHistory(businessDate);
  }

  NOL3.saveLMHistorySnapshot = async function (businessDate, dataset, files) {
    const date = String(businessDate || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !dataset) return;
    const list = Array.isArray(files) ? files : [];
    await putLMHistory({
      businessDate: date,
      files: list.map(item => ({
        name: item?.name || "inventory.csv",
        lastModified: item?.lastModified || 0,
        text: typeof item?.text === "string" ? item.text : ""
      })),
      dataset: {
        fileName: dataset.fileName || list.map(item => item?.name || "").filter(Boolean).join(", "),
        headers: Array.isArray(dataset.headers) ? dataset.headers : [],
        rows: Array.isArray(dataset.rows) ? dataset.rows : [],
        rawText: typeof dataset.rawText === "string" ? dataset.rawText : "",
        loadedAt: dataset.loadedAt || new Date().toISOString()
      },
      uploadDate: date,
      savedAt: new Date().toISOString()
    });
  };

  NOL3.getLMHistorySnapshot = async function (businessDate) {
    const date = String(businessDate || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
    return getLMHistoryRecord(date);
  };

  function remove(type) {
    return Promise.resolve().then(() => {
      if (window.NOL3FileStore) NOL3FileStore.remove(type);
    });
  }

  NOL3.clearUploadedData = async function (type) {
    if (!TYPES.includes(type)) return;
    if (type === "lm") {
      try {
        const selectedDate = typeof NOL3.getBusinessDateValue === "function"
          ? NOL3.getBusinessDateValue()
          : String(NOL3.currentBusinessDate || "").trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(selectedDate)) await removeLMHistory(selectedDate);
      } catch (error) {
        console.warn("NOL3: Could not clear date-specific LM history.", error);
      }
      await remove(type);
    } else {
      await remove(type);
    }
    if (type === "lm") {
      NOL3.lmInventory = { files: [], rows: [], filteredRows: [] };
      const lmStatus = document.getElementById("lmFilterStatus");
      if (lmStatus) lmStatus.innerHTML = `Selected Hub filter: <strong>Not selected</strong>`;
      window.dispatchEvent(new CustomEvent("lminventoryfiltered", { detail: { hub: "", totalRows: 0, filteredRows: [] } }));
    }
    if (type === "incoming") NOL3.incomingInventory = null;
    if (type === "linehaul") NOL3.lineHaulInventory = null;
    window.dispatchEvent(new CustomEvent("inventorycleared", { detail: { type } }));
  };

  function parseStoredCSV(text) {
    const parsed = [];
    let row = [], value = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const char = text[i], next = text[i + 1];
      if (char === '"' && inQuotes && next === '"') { value += '"'; i++; continue; }
      if (char === '"') { inQuotes = !inQuotes; continue; }
      if (char === ',' && !inQuotes) { row.push(value); value = ""; continue; }
      if ((char === '\n' || char === '\r') && !inQuotes) {
        if (char === '\r' && next === '\n') i++;
        row.push(value); value = ""; parsed.push(row); row = []; continue;
      }
      value += char;
    }
    if (value.length || row.length) { row.push(value); parsed.push(row); }
    return parsed;
  }

  function buildLMResult(files) {
    let mergedHeaders = null;
    const merged = [];
    files.forEach(item => {
      const parsed = parseStoredCSV(item.text || "");
      if (parsed.length) {
        const headers = parsed[0].map(value => String(value).trim());
        if (!mergedHeaders) mergedHeaders = headers;
        merged.push(...parsed.slice(1).filter(row => row.some(value => String(value || "").trim() !== "")));
      }
    });
    const fileNames = files.map(item => item.name).join(", ");
    return {
      files: files.map(item => ({ name: item.name, lastModified: item.lastModified || 0 })),
      fileName: fileNames,
      headers: mergedHeaders || [],
      rows: merged,
      filteredRows: [],
      loadedAt: new Date().toISOString()
    };
  }

  function filterLMForHub(result) {
    const hub = (NOL3.getState && NOL3.getState().selectedHub) || "";
    if (!hub) { result.filteredRows = result.rows || []; return; }
    const headers = (result.headers || []).map(h => String(h || '').trim().toLowerCase());
    const currentIndex = headers.indexOf('current station');
    if (currentIndex < 0) { result.filteredRows = []; return; }
    const target = String(hub).trim().toLowerCase();
    result.filteredRows = (result.rows || []).filter(row => {
      const current = String(row[currentIndex] || '').trim().toLowerCase();
      return current === target;
    });
  }

  // Persist the single unified inventory snapshot separately. LM and Incoming

  NOL3.saveUnifiedInventory = async function (file, headers, rows, lmRows, incomingRows) {

      await put({

        dataset: {

          rows: Array.isArray(rows) ? rows : [],
          rawText: text,
